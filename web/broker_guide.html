<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ t('guide.page_title', lang) }}</title>
<meta name="description" content="{{ t('guide.page_description', lang) }}">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/design.css?v=20260909">
<link rel="stylesheet" href="/assets/tokens.css?v=1">
<script src="/assets/i18n.js?v=2" defer></script>
<script src="/assets/sbf-symbols.js?v=2" defer></script>
<script src="/assets/sbf-auth.js?v=1" defer></script>
<script src="/assets/sbf-header.js?v=23" defer></script>
<style>
/* Базовая типографика объявлена здесь: до 14.08.2026 шрифты подключались
   только в index.html, и страница рендерилась Times New Roman на белом. */
html,body{margin:0;padding:0}
body{
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--cream,#FBF6EF);color:var(--ink,#2B2B33);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.55;
}
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:820px;margin:0 auto;padding:24px 20px 60px}
.guide-back{font-size:13px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:14px}
.guide-back:hover{color:var(--gold)}

.guide-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.guide-head img{height:32px;width:auto;max-width:150px;object-fit:contain}
.guide-h1{font-size:24px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin-bottom:4px}
.guide-account{font-size:13px;color:var(--muted)}
.guide-lead{font-size:15px;line-height:1.6;color:var(--ink);margin-bottom:22px}
.guide-meta{font-size:13px;color:var(--muted);margin-bottom:16px}
.guide-intro{font-size:14px;line-height:1.6;color:var(--ink);margin-bottom:16px}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;vertical-align:middle}
.tag.real{background:#e7f4ec;color:#2d7a4f}
.tag.demo{background:#fdf3e3;color:#b8860b}

.guide-h2{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin:40px 0 6px;display:flex;align-items:center;gap:8px}
.guide-h2-n{color:var(--gold);font-variant-numeric:tabular-nums}

.callout{margin:16px 0;padding:14px 18px;border-radius:8px;border-left:3px solid var(--line);background:var(--paper)}
.callout p{margin:6px 0;font-size:13.5px;line-height:1.6;color:var(--ink)}
.callout p:first-child{margin-top:0}
.callout p:last-child{margin-bottom:0}
.callout-title{font-weight:700;margin-bottom:6px;color:var(--ink)}
.callout.fact{border-left-color:var(--gold);background:#fffdf5}
.callout.gap{border-left-color:var(--down);background:#fdf3f2}
.callout.note{border-left-color:var(--muted);background:var(--cream,#f6f6f7)}
.callout img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}

.guide-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
.guide-table th,.guide-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.guide-table th{font-weight:700;background:var(--cream,#f3f2ef)}
.guide-table-caption{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:16px}

/* 🔴 ТАБЛИЦА НА ТЕЛЕФОНЕ РАЗВОРАЧИВАЕТСЯ В КАРТОЧКИ, А НЕ УЕЗЖАЕТ ЗА КРАЙ.
   Замер 14.09.2026: на /brokers/xm таблица выходила за экран на 16 px, на
   /brokers/avatrade на 25. Виноваты не колонки как таковые, а длинные
   значения в одной ячейке — «5 USD в месяц после 90 дней без сделок»
   и «CFD — MT5 (выбирается на шаге 2 регистрации…)»: три колонки при
   360 px дают каждой около сотни пикселей, и такая строка растягивает
   таблицу шире экрана независимо от вёрстки.

   Горизонтальную прокрутку здесь брать нельзя: у таблицы «Параметр ·
   Значение · Источник» именно последняя колонка и уезжает из виду, то
   есть прячется ровно то, ради чего страница существует — откуда взята
   цифра. Поэтому строка становится карточкой: название параметра
   заголовком, значение под ним, источник — мелкой подписью снизу.
   Подпись колонки берётся из data-col, который guide.js кладёт в каждую
   ячейку: шапка скрыта, и без неё «100 USD» повисает без объяснения. */
@media (max-width: 768px){
  .guide-table, .guide-table tbody, .guide-table tr, .guide-table td{display:block;width:auto}
  /* 🔴 display:none, а не «визуально скрыть» через clip. Обычно шапку прячут
     off-screen, чтобы её дочитал скринридер, — но здесь подпись колонки уже
     стоит внутри каждой ячейки, и off-screen шапка озвучивала бы названия
     колонок дважды. Плюс она остаётся в раскладке: ячейки сохраняют полную
     ширину, и замер честно рапортовал «th вылезает на 217 px» там, где
     страница за край не выходит. */
  .guide-table thead{display:none}
  .guide-table{border-collapse:separate;margin:14px 0}
  .guide-table tr{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--paper)}
  .guide-table td{border-bottom:0;padding:3px 0;font-size:14px;line-height:1.5;word-break:break-word}
  .guide-table td:first-child{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);padding-bottom:5px}
  /* Подпись колонки — только со второй ячейки: у первой роль подписи
     играет она сама, дублировать «Параметр» над «Плечо» незачем.
     🔴 И не в таблице из двух колонок. Первый вариант ставил подпись
     всюду, и на скриншоте вышло «ПЛЕЧО · ЗНАЧЕНИЕ · 1:1000» — лишняя
     строка, которая не сообщает ничего: когда колонки две, «значение»
     это единственное, чем вторая ячейка вообще может быть. В таблице из
     трёх колонок подпись, наоборот, нужна — она отделяет цифру от того,
     откуда цифра взята. Условие структурное (число колонок), а не по
     слову «Значение»: проверка по тексту развалилась бы на ro/en. */
  .guide-table:not([data-cols="2"]) td:not(:first-child)::before{content:attr(data-col);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:1px}
  .guide-table td:last-child:not(:nth-child(2)){font-size:12.5px;color:var(--muted);margin-top:4px}
}

.guide-needed{margin:0 0 26px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.guide-needed div{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:8px}
.guide-needed ul{margin:0;padding-left:18px;font-size:14px;line-height:1.7;color:var(--ink)}

.guide-step{margin-bottom:28px}
.guide-step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;margin-right:8px}
.guide-step img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.guide-step-cap{font-size:14px;line-height:1.6;color:var(--ink)}
.guide-step-note{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.guide-step-nomedia{padding:14px 16px;background:var(--cream,#faf8f3);border-radius:8px;margin-top:10px;font-size:13px;color:var(--muted);line-height:1.6}

.guide-step-cap a, .callout a, .guide-intro a, .guide-table-caption a{color:var(--ink);border-bottom:1px solid var(--gold);text-decoration:none}
.guide-step-cap a:hover, .callout a:hover, .guide-intro a:hover, .guide-table-caption a:hover{color:var(--gold)}

.entity-box{margin:20px 0 32px;padding:18px 20px;background:var(--paper);border:2px solid var(--ink);border-radius:10px}
.entity-unresolved{border-color:var(--down)}
.entity-box-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:10px}
.entity-box img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.entity-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.entity-row span:first-child{color:var(--muted)}
.entity-row span:last-child{text-align:right;max-width:60%}
.entity-quote{font-size:13px;font-style:italic;color:var(--muted);margin:14px 0;line-height:1.6;padding-left:12px;border-left:2px solid var(--line)}
.entity-confirm{font-size:12.5px;line-height:1.6;color:var(--ink);margin:10px 0}
.entity-confirm.unconfirmed{color:var(--down)}
.entity-missing{margin-top:14px}
.entity-missing div{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--down);margin-bottom:8px}
.entity-missing ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--ink)}
.entity-no-register{color:var(--down);font-style:italic}

.guide-cta{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}
.guide-cta a{display:inline-block;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none}
.guide-cta .primary{background:var(--gold);color:#1a1a1a}
.guide-cta .secondary{background:var(--paper);color:var(--ink);border:1px solid var(--line)}

.rwarn{margin-top:28px;padding:14px 18px;background:#FFF9F0;border:1px solid rgba(201,162,39,.35);border-radius:6px}
.rwarn p{margin:0;font-size:13px;line-height:1.6;color:var(--ink)}
.rwarn strong{color:var(--down)}

.guide-error{padding:30px;text-align:center;color:var(--down)}
</style>
</head>
<body>

<div class="wrap" id="guideRoot">
  <a class="guide-back" href="{{ ('/' + lang + '/brokers') if lang != 'ru' else '/brokers' }}">{{ t('guide.back_to_table', lang) }}</a>
  <div id="guideContent"></div>
</div>

<script src="/assets/guide.js?v=3" defer></script>
</body>
</html>
