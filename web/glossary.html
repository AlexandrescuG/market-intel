<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ t('glossary.page_title', lang) }}</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="SBF Intelligence">
<meta property="og:image" content="https://lp.sbfconsult.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://lp.sbfconsult.com/assets/og-image.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/design.css?v=20260909">
<style>
:root{--cream:#FBF6EF;--paper:#FFFFFF;--line:#E7DFCF;--ink:#2B2B33;--muted:#716A5A;--gold:#C9A227;--up:#2C784E;--down:#c0392b;--nav:62px}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Montserrat,sans-serif;font-size:14px;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
.gl-page{max-width:640px;margin:0 auto;padding:16px 12px 24px}
.gl-hero{padding:16px 0 8px}
.gl-hero h1{font-size:20px;font-weight:700;margin:0 0 4px}
.gl-hero p{font-size:13px;color:var(--muted);margin:0}

/* Заголовок карточки термина — основная кнопка страницы, была 42px. */
@media(max-width:900px){
  .gl-card-hd{min-height:44px}
  .gl-list a,.gl-idx a{min-height:44px;display:flex;align-items:center}
}
</style>
</head>
<body>
<script src="/assets/i18n.js?v=2" defer></script>
<script src="/assets/sbf-symbols.js?v=2"></script>
<script src="/assets/sbf-header.js?v=23" defer></script>
<div class="gl-page">
  <div class="gl-hero">
    <h1>{{ t('glossary.h1', lang) }}</h1>
    <p>{{ t('glossary.subtitle', lang) }} · <a href="/" style="color:var(--gold-text,#866A19)">{{ t('glossary.back_home', lang) }}</a></p>
  </div>
  <div id="glContainer"></div>
</div>
<script src="/assets/sbf-glossary.js?v=2"></script>
<script>
(function () {
  var slug = (location.hash || '').replace('#', '').replace('gl-', '');
  var container = document.getElementById('glContainer');
  if (container && window.SBFGlossary) {
    SBFGlossary.renderPage(container, slug || null);
  }
  // Re-render on hash change
  window.addEventListener('hashchange', function () {
    var s = (location.hash || '').replace('#', '').replace('gl-', '');
    SBFGlossary.renderPage(container, s || null);
  });
}());
</script>
</body>
</html>
