<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ t('brokers.page_title', lang) }}</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="SBF Intelligence">
<meta property="og:image" content="https://lp.sbfconsult.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://lp.sbfconsult.com/assets/og-image.png">
<meta name="description" content="{{ t('brokers.page_description', lang) }}">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/design.css?v=20260909">
<link rel="stylesheet" href="/assets/tokens.css?v=1">
<script src="/assets/i18n.js?v=2" defer></script>
<script src="/assets/sbf-symbols.js?v=2" defer></script>
<script src="/assets/sbf-auth.js?v=1" defer></script>
<script src="/assets/sbf-header.js?v=23" defer></script>
<style>
body{
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--cream,#FBF6EF);
  color:var(--ink,#2B2B33);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  line-height:1.55;
}

*{box-sizing:border-box}

a{color:inherit}

:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 40px}
</style>
<link rel="stylesheet" href="/assets/brokers.css?v=1">
</head>
<body>

<div class="wrap" id="brokersPageRoot">
  <header class="brokers-hero">
    <h1 class="brokers-h1">{{ t('brokers.h1', lang) }}</h1>
    <!-- Подзаголовок и три «чипа доверия» удалены 14.08.2026 по решению
         владельца: они пересказывали словами то, что видно по самой таблице. -->
  </header>

  <div id="brokersTableRoot"></div>

  <aside class="disclosure" role="note">
    <b>{{ t('brokers.disclosure_mark', lang) }}</b> {{ t('brokers.disclosure_revshare', lang) }}
  </aside>

  <section class="help-block" id="brokersHelp" hidden></section>

  <aside class="rwarn" role="note">
    <p>{{ t('brokers.risk_warning_full', lang) }}</p>
  </aside>
</div>

<!-- Одно модальное окно на страницу, содержимое подставляет brokers.js -->
<div class="bm" id="brokerModal" role="dialog" aria-modal="true" aria-labelledby="bmTitle" hidden>
  <div class="bm-backdrop"></div>
  <div class="bm-panel">
    <div class="bm-head">
      <h2 class="bm-title" id="bmTitle"></h2>
      <button type="button" class="bm-close" aria-label="{{ t('brokers.m_close', lang) }}">&times;</button>
    </div>
    <div class="bm-body"></div>
  </div>
</div>

<script src="/assets/brokers.js?v=16" defer></script>
</body>
</html>
