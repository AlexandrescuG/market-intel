<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ t('brokers.page_title', lang) }}</title>
<meta name="description" content="{{ t('brokers.page_description', lang) }}">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/design.css">
<link rel="stylesheet" href="/assets/tokens.css?v=1">
<script src="/assets/i18n.js?v=2" defer></script>
<script src="/assets/sbf-symbols.js?v=2" defer></script>
<script src="/assets/sbf-auth.js?v=1" defer></script>
<script src="/assets/sbf-header.js?v=16" defer></script>
<style>
/* ===========================================================================
   /brokers — редизайн 2026-08-14.
   Задача страницы: помочь выбрать и довести до открытия счёта, не теряя
   честность данных. Карточки — единственная поверхность (одинаковые на
   desktop и mobile), у каждого брокера явная кнопка. Раздел «Таблица»
   (переключатель Карточки/Таблица) убран позже тем же днём по решению
   владельца — сравнение теперь только через модалку «Сравнить брокеров».
   Базовая типографика объявлена ЗДЕСЬ, а не в design.css: до 14.08 шрифты
   подключались только в index.html, и вся страница рендерилась Times New Roman.
   =========================================================================== */
html,body{margin:0;padding:0}
body{
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--cream,#FBF6EF);
  color:var(--ink,#2B2B33);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  line-height:1.55;
}
*{box-sizing:border-box}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 40px}

/* ── Шапка страницы ─────────────────────────────────────────────────────── */
.brokers-hero{margin-bottom:22px}
.brokers-h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 10px}
.brokers-sub{font-size:16px;color:var(--ink-2,#6E6A63);line-height:1.6;margin:0 0 16px;max-width:720px}
.trust-row{display:flex;flex-wrap:wrap;gap:8px}
.trust-chip{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13px;font-weight:500;color:var(--ink-2,#6E6A63);
  background:var(--paper,#fff);border:1px solid var(--line,#E7DFCF);
  border-radius:999px;padding:7px 14px;
}
.trust-chip b{color:var(--gold);font-weight:700}

/* ── Тулбар ─────────────────────────────────────────────────────────────── */
.brokers-toolbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;
  margin:0 0 18px;padding:14px 16px;
  background:var(--paper,#fff);border:1px solid var(--line,#E7DFCF);border-radius:12px;
}
.country-picker{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;flex:1 1 260px}
.country-picker select{
  flex:1;min-height:44px;padding:10px 12px;font-size:15px;font-family:inherit;font-weight:500;
  border:1px solid var(--line,#E7DFCF);border-radius:9px;background:var(--cream,#FBF6EF);
  color:var(--ink);cursor:pointer;
}
.country-hint{flex-basis:100%;font-size:13px;color:var(--ink-2,#6E6A63);margin:0}
.btn-compare{
  min-height:44px;padding:0 18px;border-radius:9px;
  border:1px solid var(--gold,#C9A227);background:var(--paper,#fff);color:var(--ink);
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s ease;
}
.btn-compare:hover:not(:disabled){background:#FFF9F0}
.btn-compare:disabled{opacity:.45;cursor:default;border-color:var(--line,#E7DFCF)}
.sort-note{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2,#6E6A63);flex-basis:100%}
.sort-note button{
  min-height:36px;padding:0 12px;font-size:13px;font-family:inherit;
  border:1px solid var(--line,#E7DFCF);border-radius:7px;background:var(--paper,#fff);cursor:pointer;
}

/* ── Сетка карточек — основная поверхность ──────────────────────────────── */
.brokers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.bcard{
  display:flex;flex-direction:column;
  background:var(--paper,#fff);border:1px solid var(--line,#E7DFCF);border-radius:14px;
  padding:18px 18px 16px;transition:box-shadow .18s ease,border-color .18s ease;
}
.bcard:hover{box-shadow:0 6px 22px rgba(43,43,51,.08);border-color:rgba(201,162,39,.45)}

.bcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.bcard-logo{display:block;height:30px;width:auto;max-width:140px;object-fit:contain;object-position:left}
.bcard-name{font-size:19px;font-weight:800;letter-spacing:-.01em}
.bcard-group{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);text-align:right;max-width:110px;line-height:1.3}

/* Лицензия под логотипом + плашки лицензий в списке */
.bcard-lead{margin:10px 0 14px}
.lic-chip{
  display:inline-flex;align-items:center;gap:8px;min-height:36px;
  padding:6px 12px;border:1px solid var(--line,#E7DFCF);border-radius:9px;
  background:var(--cream,#FBF6EF);font-family:inherit;font-size:14px;cursor:pointer;
  color:var(--ink);text-align:left;transition:border-color .15s ease,background .15s ease;
}
.lic-chip:hover{border-color:var(--gold);background:#FFF9F0}
.lic-chip-lead{min-height:42px;font-size:15px}
.lic-chip-reg{font-weight:700}
.lic-chip-no{font-family:'JetBrains Mono',monospace;font-weight:600}
.lic-chip-more{
  display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:50%;background:var(--gold);color:#1E1B12;font-size:12px;font-weight:700;font-style:italic;flex:0 0 auto;
}
.lic-chip-entity{font-size:13px;color:var(--ink-2,#6E6A63);margin-top:4px;line-height:1.4}
.lic-row+.lic-row{margin-top:10px}

/* Ключевые цифры — то, ради чего человек пришёл */
.bcard-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line,#E7DFCF);border:1px solid var(--line,#E7DFCF);border-radius:10px;overflow:hidden;margin-bottom:14px}
.bstat{background:var(--paper,#fff);padding:10px 12px;min-height:66px}
.bstat-k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2,#6E6A63);margin-bottom:3px}
.bstat-v{font-size:16px;font-weight:700;line-height:1.3;font-family:'JetBrains Mono',monospace}
.bstat-v.text{font-family:inherit;font-size:14px;font-weight:600}
.bstat-v .no-data{color:var(--ink-3,#A8A29A);font-style:italic;font-weight:500;font-family:inherit;font-size:14px}
.bstat-note{font-size:12px;color:var(--ink-2,#6E6A63);margin-top:3px;line-height:1.35}
.bstat.loss .bstat-v{color:var(--down,#c0392b)}
.bstat.loss .loss-np{font-size:14px;font-weight:600;font-family:inherit;color:var(--ink-2,#6E6A63);font-style:italic}

/* Подробности — свёрнуты, чтобы не превращать карточку в справочник */
.bcard-more{margin-bottom:14px;border-top:1px solid var(--line,#E7DFCF);padding-top:10px}
.bcard-more>summary{
  list-style:none;cursor:pointer;min-height:40px;display:flex;align-items:center;gap:6px;
  font-size:14px;font-weight:600;color:var(--ink-2,#6E6A63);
}
.bcard-more>summary::-webkit-details-marker{display:none}
.bcard-more>summary::after{content:'▾';font-size:12px;transition:transform .15s ease}
.bcard-more[open]>summary::after{transform:rotate(180deg)}
.bcard-more>summary:hover{color:var(--gold)}
.more-row{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-top:1px solid var(--rule-soft,rgba(43,43,51,.07));font-size:14px}
.more-row>.mr-k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2,#6E6A63)}
.entity-item{padding:7px 0}
.entity-item+.entity-item{border-top:1px dashed var(--line,#E7DFCF);margin-top:5px}
.entity-item.entity-active{padding-left:9px;border-left:2px solid var(--gold)}
.entity-badge{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--gold);margin-bottom:2px}
.entity-sub{font-size:13px;color:var(--ink-2,#6E6A63);margin-top:2px}
.src-link,.guide-link{color:var(--ink-2,#6E6A63)}
.src-link{font-size:13px;text-decoration:underline;display:inline-block;padding:4px 0}
.licence-note,.spread-src{font-size:12px;color:var(--ink-2,#6E6A63);margin-top:2px;line-height:1.4}
/* Лицензии: все юрлица бренда, а не только резолвленное (14.08.2026) */
.lic-item{padding:7px 0;font-size:14px}
.lic-item+.lic-item{border-top:1px dashed var(--line,#E7DFCF);margin-top:5px}
.lic-item.lic-active{padding-left:9px;border-left:2px solid var(--gold)}
.lic-reg{color:var(--ink-2,#6E6A63)}
.lic-no{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink)}
.licence-unverified{color:var(--down,#c0392b)}
.leverage-hint{font-size:12px;color:var(--ink-2,#6E6A63);margin-top:4px;line-height:1.4}
.mifid-tag{color:var(--gold);font-weight:600}
.spread-other{color:var(--down,#c0392b)}
.bstat-more{
  display:inline-block;margin-top:6px;padding:4px 0;min-height:28px;
  border:0;background:none;font-family:inherit;font-size:13px;font-weight:600;
  color:var(--gold);text-decoration:underline;cursor:pointer;
}
.bstat-more:hover{color:var(--ink)}

/* ── Модальное окно ─────────────────────────────────────────────────────── */
.bm{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px}
.bm[hidden]{display:none}
.bm-backdrop{position:absolute;inset:0;background:rgba(43,43,51,.55)}
.bm-panel{
  position:relative;z-index:1;width:100%;max-width:560px;max-height:82vh;overflow-y:auto;
  background:var(--paper,#fff);border-radius:14px;box-shadow:0 18px 60px rgba(43,43,51,.30);
}
.bm-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:18px 20px 12px;border-bottom:1px solid var(--line,#E7DFCF);
  position:sticky;top:0;background:var(--paper,#fff);border-radius:14px 14px 0 0;
}
.bm-title{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.3}
.bm-close{
  flex:0 0 auto;width:40px;height:40px;border:1px solid var(--line,#E7DFCF);border-radius:9px;
  background:var(--cream,#FBF6EF);font-size:22px;line-height:1;cursor:pointer;color:var(--ink);
}
.bm-close:hover{border-color:var(--gold);color:var(--gold)}
.bm-body{padding:8px 20px 20px}
.bm-row{display:flex;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule-soft,rgba(43,43,51,.07));font-size:14px;line-height:1.5}
.bm-row:last-child{border-bottom:0}
.bm-k{flex:0 0 40%;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2,#6E6A63)}
.bm-v{flex:1;word-break:break-word}
.bm-v a{color:var(--gold)}
.bm-warn{margin-top:14px;padding:12px 14px;border-radius:9px;background:#FDF3F1;border:1px solid rgba(192,57,43,.28);font-size:13px;line-height:1.55;color:var(--ink)}
.bm-contract{margin-top:12px;padding:12px 14px;border-radius:9px;background:#FFF9F0;border:1px solid rgba(201,162,39,.35);font-size:13px;line-height:1.55}
/* ── Сравнение двух брокеров ────────────────────────────────────────────── */
.bm-panel.bm-wide{max-width:860px}
.cmp-head{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 0 16px;
  border-bottom:2px solid var(--line,#E7DFCF);position:sticky;top:0;background:var(--paper,#fff);z-index:2;
}
.cmp-col{display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}
.cmp-col .bcard-logo{height:26px}
.cmp-pick{
  width:100%;min-height:44px;padding:9px 10px;font-family:inherit;font-size:14px;font-weight:600;
  border:1px solid var(--line,#E7DFCF);border-radius:9px;background:var(--cream,#FBF6EF);color:var(--ink);cursor:pointer;
}
.cmp-block{padding:12px 0;border-bottom:1px solid var(--rule-soft,rgba(43,43,51,.07))}
.cmp-k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2,#6E6A63);margin-bottom:7px}
.cmp-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp-v{font-size:14px;line-height:1.5;min-width:0;word-break:break-word}
.cmp-lic{padding:3px 0;font-size:13px;color:var(--ink-2,#6E6A63)}
.cmp-lic b{color:var(--ink);font-family:'JetBrains Mono',monospace}
.cmp-foot{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:16px;
  position:sticky;bottom:0;background:var(--paper,#fff);padding-bottom:4px;
}
.cmp-cta{font-size:14px;min-height:48px;padding:0 12px;text-align:center}

@media (max-width:760px){
  .bm{padding:0;align-items:flex-end}
  .bm-panel{max-width:none;max-height:88vh;border-radius:14px 14px 0 0}
  .bm-k{flex-basis:44%}
  .cmp-cta{font-size:13px;padding:0 8px}
  .cmp-v{font-size:13px}
  .cmp-head{gap:10px}
  .cmp-pair,.cmp-foot{gap:10px}
}
.date-badge{font-size:12px;color:var(--ink-2,#6E6A63);font-family:'JetBrains Mono',monospace}
.date-badge.stale{color:var(--down,#c0392b)}
.loss-disclose{font-size:13px;color:var(--ink-2,#6E6A63);margin-top:5px;line-height:1.5}
.no-data{color:var(--ink-3,#A8A29A);font-style:italic}

/* Конверсия */
.bcard-cta{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.btn-open{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;padding:0 18px;border-radius:10px;
  background:var(--gold,#C9A227);color:#1E1B12;
  font-size:16px;font-weight:700;font-family:inherit;text-decoration:none;
  transition:background .15s ease,transform .05s ease;
}
.btn-open:hover{background:var(--glow,#E6C257)}
.btn-open:active{transform:translateY(1px)}
.guide-link{
  display:flex;align-items:center;justify-content:center;
  min-height:44px;border-radius:10px;border:1px solid var(--line,#E7DFCF);
  font-size:14px;font-weight:600;text-decoration:none;background:var(--cream,#FBF6EF);
}
.guide-link:hover{color:var(--gold);border-color:rgba(201,162,39,.5)}
.aff-note{font-size:12px;color:var(--ink-3,#A8A29A);text-align:center;margin:2px 0 0}

.empty-row{text-align:center;padding:34px;color:var(--ink-2,#6E6A63);font-size:14px}
.brokers-error{padding:30px;text-align:center;color:var(--down,#c0392b)}

/* ── Раскрытие вознаграждения ───────────────────────────────────────────── */
.disclosure{
  margin-top:24px;padding:14px 18px;background:var(--paper,#fff);
  border:1px solid var(--line,#E7DFCF);border-radius:10px;
  font-size:13px;line-height:1.6;color:var(--ink-2,#6E6A63);
}
.disclosure b{color:var(--ink)}

/* ── Блок помощи — вторая конверсия для тех, кто не готов выбрать ───────── */
.help-block{
  margin-top:20px;padding:22px 24px;border-radius:14px;
  background:linear-gradient(135deg,#2B2B33 0%,#3A3730 100%);color:#F5EEE3;
  display:flex;flex-wrap:wrap;align-items:center;gap:18px;
}
.help-text{flex:1 1 320px}
.help-text h2{font-size:20px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.help-text p{margin:0;font-size:14px;line-height:1.6;color:rgba(245,238,227,.75)}
.help-actions{display:flex;flex-wrap:wrap;gap:10px}
.help-actions a{
  display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;
  border-radius:10px;font-size:15px;font-weight:700;text-decoration:none;
}
.help-primary{background:var(--gold,#C9A227);color:#1E1B12}
.help-primary:hover{background:var(--glow,#E6C257)}
.help-secondary{border:1px solid rgba(245,238,227,.3);color:#F5EEE3}
.help-secondary:hover{border-color:var(--gold);color:var(--gold)}

/* ── Риск-предупреждение ────────────────────────────────────────────────── */
.rwarn{margin-top:20px;padding:16px 18px;background:#FFF9F0;border:1px solid rgba(201,162,39,.35);border-radius:10px}
.rwarn p{margin:0;font-size:13px;line-height:1.65;color:var(--ink)}
.rwarn strong{color:var(--down,#c0392b)}

/* ── Мобильное ──────────────────────────────────────────────────────────── */
@media (max-width:760px){
  .wrap{padding:20px 16px 32px}
  .brokers-h1{font-size:26px}
  .brokers-sub{font-size:15px}
  .brokers-grid{grid-template-columns:1fr;gap:14px}
  .help-block{padding:20px;flex-direction:column;align-items:stretch}
  .help-actions a{width:100%}
}
@media (max-width:400px){
  .bcard-stats{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="wrap" id="brokersPageRoot">
  <header class="brokers-hero">
    <h1 class="brokers-h1">{{ t('brokers.h1', lang) }}</h1>
    <!-- Подзаголовок и три «чипа доверия» удалены 14.08.2026 по решению
         владельца: они пересказывали словами то, что видно по самой таблице. -->
  </header>

  <div id="brokersTableRoot"></div>

  <aside class="disclosure" role="note">
    <b>{{ t('brokers.disclosure_mark', lang) }}</b> {{ t('brokers.disclosure_revshare', lang) }}
  </aside>

  <section class="help-block" id="brokersHelp" hidden></section>

  <aside class="rwarn" role="note">
    <p>{{ t('brokers.risk_warning_full', lang) }}</p>
  </aside>
</div>

<!-- Одно модальное окно на страницу, содержимое подставляет brokers.js -->
<div class="bm" id="brokerModal" role="dialog" aria-modal="true" aria-labelledby="bmTitle" hidden>
  <div class="bm-backdrop"></div>
  <div class="bm-panel">
    <div class="bm-head">
      <h2 class="bm-title" id="bmTitle"></h2>
      <button type="button" class="bm-close" aria-label="{{ t('brokers.m_close', lang) }}">&times;</button>
    </div>
    <div class="bm-body"></div>
  </div>
</div>

<script src="/assets/brokers.js?v=15" defer></script>
</body>
</html>
