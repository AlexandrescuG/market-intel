<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="calendar.page_title">SBF · Экономический календарь</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="alternate icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/design.css">
<script src="/assets/i18n.js?v=2" defer></script>
<script src="/assets/sbf-symbols.js?v=2"></script>
<script src="/assets/sbf-header.js?v=17" defer></script>
<script src="/edu/assets/grafik-engine.js"></script>
<script src="/edu/assets/calendar-terms.js"></script>
<style>
:root{--cream:#FBF6EF;--paper:#FFFFFF;--line:#E7DFCF;--ink:#2B2B33;--muted:#7C7563;
  --faint:#C5BAA8;--gold:#C9A227;--glow:#E6C257;--up:#2E8B6F;--down:#C0504D;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:Montserrat,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── Layout ───────────────────────────────────────────────────── */
.cal-page{display:grid;grid-template-columns:220px 1fr;max-width:1200px;
  margin:0 auto;padding:20px 16px 60px;gap:20px;min-height:60vh}

/* ── Sidebar ──────────────────────────────────────────────────── */
.cal-sidebar{align-self:start;position:sticky;top:140px}
.fil-group{background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:10px}
.fil-title{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.fil-opt{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;
  padding:3px 0;color:var(--ink)}
.fil-opt input{accent-color:var(--gold);width:13px;height:13px;cursor:pointer}
.fil-select{width:100%;font-family:'JetBrains Mono',monospace;font-size:12px;
  padding:6px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--cream);color:var(--ink);outline:none;cursor:pointer}
.fil-select:focus{border-color:var(--gold)}

/* ── Date range picker ────────────────────────────────────────── */
.date-rng{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.drng-presets{display:flex;gap:4px;flex-wrap:wrap}
/* ── Calendar popup ───────────────────────────────────────────── */
.drng-cal-wrap{position:relative;margin-left:auto}
.drng-cal-toggle{font-family:'JetBrains Mono',monospace;font-size:12px;
  padding:6px 12px;border:1px solid var(--line);border-radius:8px;
  cursor:pointer;background:var(--paper);color:var(--ink);
  white-space:nowrap;transition:.12s;display:flex;align-items:center;gap:5px}
.drng-cal-toggle:hover,.drng-cal-toggle.open{border-color:var(--gold)}
.drng-cal-panel{display:none;position:absolute;right:0;top:calc(100% + 6px);
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:14px;z-index:500;box-shadow:0 4px 24px rgba(43,43,51,.14);min-width:242px}
.drng-cal-panel.open{display:block}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav-btn{border:none;background:none;cursor:pointer;color:var(--muted);
  font-size:17px;padding:2px 8px;border-radius:5px;line-height:1.3}
.cal-nav-btn:hover{background:var(--cream);color:var(--ink)}
.cal-nav-label{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-dh{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);
  text-align:center;padding:4px 0;letter-spacing:.4px}
.cal-d{font-family:'JetBrains Mono',monospace;font-size:12px;text-align:center;
  padding:5px 2px;border-radius:4px;cursor:pointer;color:var(--ink);user-select:none;transition:.08s}
.cal-d:hover:not(.cal-empty){background:rgba(201,162,39,.18)}
.cal-empty{cursor:default;pointer-events:none}
.cal-d.today{font-weight:700;color:var(--gold)}
.cal-d.sel-start,.cal-d.sel-end{background:var(--ink)!important;color:#fff!important;font-weight:700}
.cal-d.in-range{background:rgba(201,162,39,.2);border-radius:0}
.cal-d.in-range.sel-start{border-radius:4px 0 0 4px}
.cal-d.in-range.sel-end{border-radius:0 4px 4px 0}
.cal-hint{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);
  text-align:center;margin-top:8px;letter-spacing:.3px;min-height:14px}

/* ── Event table ──────────────────────────────────────────────── */
.ev-hdr{display:grid;grid-template-columns:60px 60px 1fr 80px 72px 72px 72px 24px;
  gap:6px;padding:6px 14px;font-family:'JetBrains Mono',monospace;
  font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);background:var(--cream);
  border-radius:8px 8px 0 0;margin-bottom:0}

.ev-list{border:1px solid var(--line);border-radius:8px;overflow:hidden}

/* now line */
.now-line{display:flex;align-items:center;gap:8px;padding:0 14px;
  height:22px;background:rgba(201,162,39,.07)}
.now-line span{font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.8px;text-transform:uppercase;color:var(--gold);font-weight:700}
.now-line::before,.now-line::after{content:'';flex:1;height:1px;background:var(--gold);opacity:.35}
.now-line::before{flex:0 0 8px}

/* event row */
.ev-row{border-bottom:1px solid var(--line)}
.ev-row:last-child{border-bottom:none}
.ev-cells{display:grid;grid-template-columns:60px 60px 1fr 80px 72px 72px 72px 24px;
  gap:6px;align-items:center;padding:9px 14px;cursor:pointer;
  transition:background .1s;background:var(--paper)}
.ev-cells:hover{background:rgba(201,162,39,.04)}
.ev-row.past .ev-cells{opacity:.55}

.ev-time{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.ev-flag{font-size:12px;display:flex;align-items:center;gap:4px;
  font-family:'JetBrains Mono',monospace;font-weight:700}
.ev-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-imp{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  letter-spacing:.5px;padding:2px 7px;border-radius:5px;text-align:center}
.ev-imp.h{background:var(--gold);color:#fff}
.ev-imp.m{border:1px solid var(--muted);color:var(--muted)}
.ev-imp.l{color:var(--faint);font-size:11px}
.ev-num{font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right}
.ev-num.surp-up{color:var(--up);font-weight:700}
.ev-num.surp-dn{color:var(--down);font-weight:700}
.ev-chev{font-size:14px;color:var(--muted);transition:transform .2s;text-align:center;
  justify-self:center}
.ev-row.open .ev-chev{transform:rotate(180deg)}

/* accordion detail */
.ev-detail{display:none;background:var(--cream);border-top:1px solid var(--line)}
.ev-row.open .ev-detail{display:block}
.ev-detail-inner{padding:16px 18px}

.ev-desc{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:14px}
.ev-desc a{color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:11px}
.ev-gloss-short{margin-top:8px;padding:10px 14px;background:rgba(201,162,39,.06);
  border-left:3px solid var(--gold);border-radius:0 6px 6px 0;
  font-size:13px;line-height:1.6;color:var(--ink)}
.ev-gloss-btn{margin-top:6px}

/* segment control */
.seg-ctrl{display:flex;gap:0;border:.5px solid var(--line);border-radius:var(--r-pill);
  overflow:hidden;margin-bottom:14px;background:var(--paper)}
.seg-ctrl .seg-btn{flex:1;border-radius:0;border:none;border-right:.5px solid var(--line)}
.seg-ctrl .seg-btn:last-child{border-right:none}

/* tab panes */
.tab-pane{display:none}
.tab-pane.on{display:block}
.chart-wrap{border-radius:8px;overflow:hidden;background:var(--paper);
  border:1px solid var(--line);padding:12px}
.sym-sel{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.sym-sel label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  letter-spacing:.5px;text-transform:uppercase}
.sym-sel select{font-family:'JetBrains Mono',monospace;font-size:12px;
  padding:4px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--cream);color:var(--ink);outline:none;cursor:pointer}
.sym-sel select:focus{border-color:var(--gold)}
.hist-list{margin-top:10px;display:flex;flex-direction:column;gap:2px;max-height:120px;overflow-y:auto}
.hist-row{display:flex;justify-content:space-between;align-items:center;
  padding:3px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px}
.hist-row:nth-child(odd){background:rgba(201,162,39,.04)}
.hist-row .hd{color:var(--muted)}
.hist-row .hv{font-weight:700}

.soon-box{padding:30px 20px;text-align:center;border:1px dashed var(--line);
  border-radius:8px;color:var(--muted)}
.soon-box b{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.soon-box p{font-size:12px;line-height:1.6}

.chart-loading{padding:24px;text-align:center;color:var(--muted);
  font-family:'JetBrains Mono',monospace;font-size:12px}

/* ── Empty / states ───────────────────────────────────────────── */
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);
  font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.8}

/* ── Glossary modal ───────────────────────────────────────────── */
.gloss-modal{display:none;position:fixed;inset:0;background:rgba(43,43,51,.5);
  z-index:8000;align-items:center;justify-content:center;padding:20px}
.gloss-modal.open{display:flex}
.gloss-modal-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  max-width:520px;width:100%;padding:28px 28px 24px;position:relative;
  box-shadow:0 8px 40px rgba(43,43,51,.18)}
.gloss-modal-close{position:absolute;top:12px;right:14px;border:none;background:none;
  font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}
.gloss-modal-close:hover{color:var(--ink)}
.gloss-modal-tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;
  text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.gloss-modal-term{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:10px;line-height:1.2}
.gloss-modal-short{font-size:13.5px;color:var(--ink);line-height:1.65;margin-bottom:12px;
  padding:10px 14px;background:rgba(201,162,39,.06);border-left:3px solid var(--gold);border-radius:0 6px 6px 0}
.gloss-modal-full{font-size:13px;color:var(--muted);line-height:1.7}

/* ── Mobile ───────────────────────────────────────────────────── */
@media(max-width:800px){
  .cal-page{grid-template-columns:1fr;padding:12px 8px 70px}
  .cal-sidebar{display:none}
  .ev-hdr{display:none}
  .ev-cells{grid-template-columns:50px 44px 1fr 60px 60px 20px}
  .ev-fore,.ev-prev{display:none}
  .seg-btn{font-size:11px;padding:7px 2px}
  .drng-cal-wrap{margin-left:0}
  .drng-cal-panel{right:auto;left:0}
  .date-rng{gap:8px}
}
</style>
</head>
<body>


<div class="cal-page">
  <!-- Sidebar / Filters -->
  <aside class="cal-sidebar">
    <div class="fil-group" id="fg-mine" style="display:none">
      <label class="fil-opt"><input type="checkbox" id="f-mine" checked onchange="onMineToggle()"> <span data-i18n="calendar.filter_mine">Мои инструменты</span></label>
    </div>
    <div class="fil-group">
      <div class="fil-title" data-i18n="calendar.filter_importance">Важность</div>
      <label class="fil-opt"><input type="checkbox" id="f-high" checked onchange="applyFilters()"> <span data-i18n="calendar.imp_high">Высокая</span></label>
      <label class="fil-opt"><input type="checkbox" id="f-med" checked onchange="applyFilters()"> <span data-i18n="calendar.imp_med">Средняя</span></label>
      <label class="fil-opt"><input type="checkbox" id="f-low" onchange="applyFilters()"> <span data-i18n="calendar.imp_low">Низкая</span></label>
    </div>
    <div class="fil-group">
      <div class="fil-title" data-i18n="calendar.filter_country">Страна</div>
      <select class="fil-select" id="f-country" onchange="loadEvents()">
        <option value="" data-i18n="calendar.country_all">Все страны</option>
        <option value="US" data-i18n="calendar.country_us">🇺🇸 США</option>
        <option value="EU" data-i18n="calendar.country_eu">🇪🇺 Еврозона</option>
        <option value="GB" data-i18n="calendar.country_gb">🇬🇧 Великобритания</option>
        <option value="JP" data-i18n="calendar.country_jp">🇯🇵 Япония</option>
        <option value="CN" data-i18n="calendar.country_cn">🇨🇳 Китай</option>
        <option value="DE" data-i18n="calendar.country_de">🇩🇪 Германия</option>
        <option value="CA" data-i18n="calendar.country_ca">🇨🇦 Канада</option>
        <option value="AU" data-i18n="calendar.country_au">🇦🇺 Австралия</option>
      </select>
    </div>
  </aside>

  <!-- Main -->
  <main class="cal-main">
    <!-- Date range picker -->
    <div class="date-rng" id="date-rng">
      <div class="drng-presets">
        <button class="drng-btn on" id="preset-today"    onclick="setPreset('today',this)" data-i18n="calendar.preset_today">Сегодня</button>
        <button class="drng-btn"    id="preset-tomorrow" onclick="setPreset('tomorrow',this)" data-i18n="calendar.preset_tomorrow">Завтра</button>
        <button class="drng-btn"    id="preset-week"     onclick="setPreset('week',this)" data-i18n="calendar.preset_week">Неделя</button>
        <button class="drng-btn"    id="preset-month"    onclick="setPreset('month',this)" data-i18n="calendar.preset_month">Месяц</button>
      </div>
      <div class="drng-cal-wrap" id="calWrap">
        <button class="drng-cal-toggle" id="calToggle" onclick="toggleCalendar(event)">
          <span id="calLabel">—</span><span style="font-size:10px;color:var(--muted)">▾</span>
        </button>
        <div class="drng-cal-panel" id="calPanel">
          <div class="cal-nav">
            <button class="cal-nav-btn" onclick="calPrevMonth()">‹</button>
            <span class="cal-nav-label" id="calMonthLabel"></span>
            <button class="cal-nav-btn" onclick="calNextMonth()">›</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-hint" id="calHint" data-i18n="calendar.hint_pick_start">Выберите начало периода</div>
        </div>
      </div>
    </div>

    <!-- Table header (desktop) -->
    <div class="ev-hdr">
      <span data-i18n="calendar.th_time">Время</span><span data-i18n="calendar.filter_country">Страна</span><span data-i18n="calendar.th_event">Событие</span>
      <span data-i18n="calendar.filter_importance">Важность</span><span data-i18n="calendar.th_actual">Факт</span><span data-i18n="calendar.th_forecast">Прогноз</span><span data-i18n="calendar.th_previous">Предыдущ.</span><span></span>
    </div>

    <!-- Event list -->
    <div class="ev-list" id="ev-list">
      <div class="empty-state" data-i18n="calendar.loading">Загрузка…</div>
    </div>
  </main>
</div>

<!-- Glossary modal (§3) -->
<div id="gloss-modal" class="gloss-modal" onclick="closeGlossModal(event)">
  <div class="gloss-modal-box">
    <button class="gloss-modal-close" onclick="closeGlossModal()">×</button>
    <div class="gloss-modal-tag" data-i18n="calendar.gloss_tag">Экономические данные</div>
    <div class="gloss-modal-term" id="gm-term"></div>
    <div class="gloss-modal-short" id="gm-short"></div>
    <div class="gloss-modal-full" id="gm-full"></div>
  </div>
</div>

<script>
/* ── i18n ───
   ВАЖНО: этот <script> исполняется синхронно во время парсинга HTML, т.е.
   ДО i18n.js/sbf-header.js (оба defer в <head>). Поэтому t() НЕ кэширует
   window.sbfI18n в замыкании — он смотрит на window.sbfI18n каждый раз при
   вызове. Реальные вызовы происходят только внутри рендер-функций и
   колбэков (клики, fetch), которые выполняются позже — к этому времени
   defer-скрипты уже отработали и window.sbfI18n существует.
   См. web/journal.html для идентичного паттерна на этой же кодовой базе. */
function t(key, fallback) {
  return (window.sbfI18n && window.sbfI18n.t) ? window.sbfI18n.t(key, fallback) : (fallback || key);
}

function _patchI18n(root) {
  if ((window.sbfI18n && window.sbfI18n.lang) === 'ru') return;
  var tt = window.sbfI18n ? window.sbfI18n.t : function (k, fb) { return fb || k; };
  (root || document).querySelectorAll('[data-i18n]').forEach(function (el) {
    el.textContent = tt(el.getAttribute('data-i18n'), el.textContent);
  });
  (root || document).querySelectorAll('[data-i18n-html]').forEach(function (el) {
    el.innerHTML = tt(el.getAttribute('data-i18n-html'), el.innerHTML);
  });
  (root || document).querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
    el.setAttribute('placeholder', tt(el.getAttribute('data-i18n-placeholder'), el.getAttribute('placeholder') || ''));
  });
  (root || document).querySelectorAll('[data-i18n-title]').forEach(function (el) {
    el.setAttribute('title', tt(el.getAttribute('data-i18n-title'), el.getAttribute('title') || ''));
  });
}
window.sbfI18n
  ? window.sbfI18n.ready.then(function () { _patchI18n(document); })
  : document.addEventListener('DOMContentLoaded', function () {
      if (window.sbfI18n) window.sbfI18n.ready.then(function () { _patchI18n(document); });
    });

// Строки событий (._imp-бейджи, названия индикаторов) рендерятся динамически
// через renderRows() сразу после fetch('/api/calendar/events') -- если это
// произойдёт РАНЬШЕ, чем прогрузится словарь sbfI18n (сетевой запрос,
// не гарантирован по времени относительно другого fetch), impLabel()/t()
// молча используют русский fallback навсегда -- data-i18n тут не помогает,
// это не статичная разметка, а сгенерированный innerHTML. Один раз
// перерисовываем уже загруженные строки, когда словарь готов.
// ВАЖНО: assets/i18n.js подключён через defer -- он ещё не выполнился на
// этом месте кода (он выполняется позже, но до DOMContentLoaded), так что
// window.sbfI18n тут гарантированно undefined; naïve `window.sbfI18n ||
// {ready: Promise.resolve()}` резолвился бы сразу микротаском мимо
// настоящего словаря. Ждём DOMContentLoaded, как и существующий блок выше.
function _rerenderEventsWhenI18nReady() {
  if (window.sbfI18n) {
    window.sbfI18n.ready.then(function () {
      if (_lastEvents && _lastEvents.length) renderRows(_lastEvents);
    });
  }
}
if (window.sbfI18n) _rerenderEventsWhenI18nReady();
else document.addEventListener('DOMContentLoaded', _rerenderEventsWhenI18nReady);

// ── Константы ──────────────────────────────────────────────────────────────
// Живой баг (06.08.2026): было 17 стран, остальные показывали 🌐. Расширено
// до полного набора валют/стран, которые calendar_pull.py вообще умеет
// нормализовать (_CUR в calendar_pull.py) + разово встречающиеся из TradingView
// (напр. AL), чтобы новая редкая страна не превращалась в глобус молча.
var FLAGS = {
  'US':'🇺🇸','EU':'🇪🇺','EA':'🇪🇺','GB':'🇬🇧','JP':'🇯🇵',
  'CN':'🇨🇳','DE':'🇩🇪','FR':'🇫🇷','IT':'🇮🇹','CA':'🇨🇦',
  'AU':'🇦🇺','CH':'🇨🇭','NZ':'🇳🇿','RU':'🇷🇺','ZA':'🇿🇦',
  'AE':'🇦🇪','KZ':'🇰🇿','SE':'🇸🇪','NO':'🇳🇴','SG':'🇸🇬',
  'KR':'🇰🇷','MX':'🇲🇽','BR':'🇧🇷','TR':'🇹🇷','AL':'🇦🇱',
  'IE':'🇮🇪','HU':'🇭🇺','CZ':'🇨🇿','ES':'🇪🇸','PT':'🇵🇹',
  'NL':'🇳🇱','BE':'🇧🇪','AT':'🇦🇹','PL':'🇵🇱','GR':'🇬🇷',
  'IN':'🇮🇳','ID':'🇮🇩','TH':'🇹🇭','MY':'🇲🇾','PH':'🇵🇭',

function fmtTime(ts_utc){
  if(!ts_utc) return '—';
  var d = new Date(ts_utc);
  try {
    return d.toLocaleTimeString(_dtLocale(), {hour:'2-digit',minute:'2-digit',timeZone:_TZ});
  } catch(e) {
    return d.toLocaleTimeString(_dtLocale(),{hour:'2-digit',minute:'2-digit',timeZone:'UTC'});
  }
}

function fmtDate(ts_utc){
  if(!ts_utc) return '';
  var d = new Date(ts_utc);
  return d.toLocaleDateString(_dtLocale(),{day:'numeric',month:'long',weekday:'short',timeZone:'UTC'});
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function addDays(dateStr, n){
  var d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}

function eventKey(ev){
  var t = (ev.country+'_'+ev.title).toLowerCase()
    .replace(/\s*\(.*?\)/g,'')
    .replace(/[^a-zа-яё0-9]+/g,'_')
    .replace(/_{2,}/g,'_')
    .replace(/^_|_$/g,'');
  return t.slice(0,60);
}

function impCls(imp){
  if(!imp) return 'l';
  var i = imp.toLowerCase();
  return i==='high'?'h':i==='medium'||i==='mid'?'m':'l';
}
function impLabel(imp){
  var c = impCls(imp);
  return c==='h' ? t('calendar.imp_high_badge','ВЫСОКИЙ')
       : c==='m' ? t('calendar.imp_med_badge','СРЕДНИЙ')
       : t('calendar.imp_low_badge','низкий');
}

function getGlossEntry(title){
  var t = (title||'').toLowerCase();
  for(var i=0;i<ECON_GLOSSARY.length;i++){
    var e = ECON_GLOSSARY[i];
    for(var j=0;j<e.keys.length;j++){
      if(t.includes(e.keys[j])) return e;
    }
  }
  return null;
}

function showGlossModal(title){
  var e = getGlossEntry(title);
  if(!e) return;
  document.getElementById('gm-term').textContent  = t(e.termKey, e.term);
  document.getElementById('gm-short').textContent = t(e.shortKey, e.short);
  document.getElementById('gm-full').textContent  = t(e.fullKey, e.full);
  document.getElementById('gloss-modal').classList.add('open');
}

function openGlossForEvent(idx){
  var ev = _lastEvents[idx];
  if(ev) showGlossModal(ev.title);
}

function closeGlossModal(ev){
  if(ev && ev.target !== document.getElementById('gloss-modal')) return;
  document.getElementById('gloss-modal').classList.remove('open');
}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape') document.getElementById('gloss-modal').classList.remove('open');
});

// ── §4 Фильтрация (без прошедших — всегда показываем dimmed) ──────────────
// SBF_Charts_Layer4_Spec, Фаза 1.2.2: тумблер «Мои инструменты» — виден только
// залогиненным с непустым ватчлистом, default ON, состояние переживает
// релогин (сохранено в user_prefs.chart_layers.cal_mine, тот же per-user
// JSON-блок, что тогглы слоёв графика — см. journal_auth.update_chart_prefs).
function onMineToggle(){
  if (window.sbfAuth && window.sbfAuth.isLoggedIn()) {
    window.sbfAuth.fetch('/api/user/chart-prefs', {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({layers: {cal_mine: document.getElementById('f-mine').checked}}),
    }).catch(function(){});
  }
  loadEvents();
}
document.addEventListener('sbf:user-ready', function(ev){
  var fg = document.getElementById('fg-mine');
  var box = document.getElementById('f-mine');
  if (!fg || !box) return;
  var wl = (ev.detail && ev.detail.watchlist) || [];
  if (!ev.detail || !wl.length) { fg.style.display = 'none'; return; }
  fg.style.display = '';
  var saved = null;
  try {
    var layers = ev.detail.prefs && JSON.parse(ev.detail.prefs.chart_layers || '{}');
    if (layers && typeof layers.cal_mine === 'boolean') saved = layers.cal_mine;
  } catch (e) {}
  box.checked = saved !== null ? saved : true; // default ON для залогиненных
  loadEvents();
});

function applyFilters(){
  var showH = document.getElementById('f-high').checked;
  var showM = document.getElementById('f-med').checked;
  var showL = document.getElementById('f-low').checked;
  document.querySelectorAll('.ev-row[data-imp]').forEach(function(row){
    var imp = row.dataset.imp;
    var c = impCls(imp);
    var visible = (c==='h'&&showH)||(c==='m'&&showM)||(c==='l'&&showL);
    row.style.display = visible ? '' : 'none';
  });
}

// ── §5 Диапазон дат ────────────────────────────────────────────────────────
function setPreset(preset, btn){
  var today = todayStr();
  if(preset==='today'){
    _rangeStart = today; _rangeEnd = today;
  } else if(preset==='tomorrow'){
    _rangeStart = addDays(today,1); _rangeEnd = addDays(today,1);
  } else if(preset==='week'){
    _rangeStart = today; _rangeEnd = addDays(today, 6);
  } else if(preset==='month'){
    _rangeStart = today; _rangeEnd = addDays(today, 29);
  }
  _pickStep = 0;
  document.querySelectorAll('.drng-btn').forEach(function(b){b.classList.remove('on');});
  if(btn) btn.classList.add('on');
  updateCalLabel();
  closeCalendar();
  loadEvents();
}

// ── Calendar popup ─────────────────────────────────────────────────────────
function toggleCalendar(e){
  if(e) e.stopPropagation();
  var panel = document.getElementById('calPanel');
  var toggle = document.getElementById('calToggle');
  var isOpen = panel.classList.contains('open');
  if(isOpen){ closeCalendar(); return; }
  var now = _rangeStart ? new Date(_rangeStart+'T12:00:00Z') : new Date();
  _calYear  = now.getUTCFullYear();
  _calMonth = now.getUTCMonth();
  renderCalGrid();
  panel.classList.add('open');
  toggle.classList.add('open');
}

function closeCalendar(){
  document.getElementById('calPanel').classList.remove('open');
  document.getElementById('calToggle').classList.remove('open');
}

document.addEventListener('click', function(e){
  var wrap = document.getElementById('calWrap');
  if(wrap && !wrap.contains(e.target)) closeCalendar();
});

function calPrevMonth(){
  _calMonth--;
  if(_calMonth < 0){ _calMonth = 11; _calYear--; }
  renderCalGrid();
}
function calNextMonth(){
  _calMonth++;
  if(_calMonth > 11){ _calMonth = 0; _calYear++; }
  renderCalGrid();
}

function _isoDate(y, m, d){
  return y+'-'+(m<9?'0':'')+(m+1)+'-'+(d<10?'0':'')+d;
}

function renderCalGrid(){
  var ml = document.getElementById('calMonthLabel');
  if(ml) ml.textContent = _monthsFull()[_calMonth]+' '+_calYear;
  var grid = document.getElementById('calGrid');
  if(!grid) return;

  var firstDow = new Date(_calYear, _calMonth, 1).getDay(); // 0=Sun
  firstDow = (firstDow + 6) % 7; // Mon=0
  var daysInMonth = new Date(_calYear, _calMonth+1, 0).getDate();
  var today = todayStr();

  var html = _daysShort().map(function(d){ return '<div class="cal-dh">'+d+'</div>'; }).join('');

  for(var i=0; i<firstDow; i++) html += '<div class="cal-d cal-empty"></div>';

  for(var d=1; d<=daysInMonth; d++){
    var ds = _isoDate(_calYear, _calMonth, d);
    var cls = 'cal-d';
    if(ds === today) cls += ' today';
    var isStart = ds === _rangeStart;
    var isEnd   = _rangeEnd && ds === _rangeEnd;
    var inRange = _rangeStart && _rangeEnd && ds > _rangeStart && ds < _rangeEnd;
    if(isStart) cls += ' sel-start';
    if(isEnd)   cls += ' sel-end';
    if(inRange) cls += ' in-range';
    html += '<div class="'+cls+'" onclick="onCalDayClick(\''+ds+'\')">'+d+'</div>';
  }
  grid.innerHTML = html;

  var hint = document.getElementById('calHint');
  if(hint){
    if(_pickStep===1 && _rangeStart){
      hint.textContent = t('calendar.hint_pick_end','Выберите конечную дату');
    } else {
      hint.textContent = t('calendar.hint_pick_start','Выберите начало периода');
    }
  }
}

function onCalDayClick(ds){
  if(_pickStep === 0 || (_rangeStart && _rangeEnd)){
    _rangeStart = ds;
    _rangeEnd   = null;
    _pickStep   = 1;
    document.querySelectorAll('.drng-btn').forEach(function(b){b.classList.remove('on');});
    renderCalGrid();
    updateCalLabel();
  } else {
    if(ds < _rangeStart){
      _rangeEnd   = _rangeStart;
      _rangeStart = ds;
    } else {
      _rangeEnd = ds;
    }
    _pickStep = 0;
    document.querySelectorAll('.drng-btn').forEach(function(b){b.classList.remove('on');});
    renderCalGrid();
    updateCalLabel();
    closeCalendar();
    loadEvents();
  }
}

function fmtShort(ds){
  if(!ds) return '';
  var d = new Date(ds+'T12:00:00Z');
  return d.getUTCDate()+' '+_monthsShort()[d.getUTCMonth()];
}

function updateCalLabel(){
  var lbl = document.getElementById('calLabel');
  if(!lbl) return;
  if(!_rangeStart){ lbl.textContent = t('calendar.label_select','Выбрать'); return; }
  if(!_rangeEnd || _rangeStart === _rangeEnd){
    lbl.textContent = fmtShort(_rangeStart);
  } else {
    lbl.textContent = fmtShort(_rangeStart)+' — '+fmtShort(_rangeEnd);
  }
}

// ── Загрузка событий ───────────────────────────────────────────────────────
async function loadEvents(){
  var list = document.getElementById('ev-list');
  list.innerHTML = '<div class="empty-state">'+t('calendar.loading','Загрузка…')+'</div>';
  _openRowIdx = null;

  var from    = _rangeStart || todayStr();
  var to      = _rangeEnd   || from;
  var country = document.getElementById('f-country').value;
  var params  = '?from='+from+'&to='+to;
  if(country) params += '&country='+country;
  // SBF_Charts_Layer4_Spec, Фаза 1.2.2: тумблер «Мои инструменты»
  var mineBox = document.getElementById('f-mine');
  var wl = (window.SBF && window.SBF.user && window.SBF.user.watchlist) || [];
  if (mineBox && mineBox.checked && wl.length) params += '&symbols='+encodeURIComponent(wl.join(','));

  try {
    var r = await fetch('/api/calendar/events'+params);
    if(!r.ok) throw new Error(r.status);
    var events = await r.json();
    _lastEvents = events;
    renderRows(events);
  } catch(e) {
    list.innerHTML = '<div class="empty-state">'+t('calendar.load_error','Ошибка загрузки:')+' '+esc(String(e))+'</div>';
  }
}

// ── Рендер строк ───────────────────────────────────────────────────────────
function renderRows(events){
  var list = document.getElementById('ev-list');
  if(!events||!events.length){
    list.innerHTML = '<div class="empty-state">'+t('calendar.no_events_found','Событий за выбранный период не найдено 🟢')+'<br><small>'+t('calendar.no_events_hint','Попробуйте другой диапазон или фильтр')+'</small></div>';
    return;
  }

  var nowTs = Date.now()/1000;
  var nowInserted = false;
  var html = '';

  events.forEach(function(ev, idx){
    var evTs = ev.ts_utc ? new Date(ev.ts_utc).getTime()/1000 : null;
    var isPast = evTs != null && evTs < nowTs;
    var hasFact = ev.actual != null && ev.actual !== '';

    if(!nowInserted && evTs != null && evTs >= nowTs){
      html += '<div class="now-line"><span>'+t('calendar.now_label','Сейчас')+'</span></div>';
      nowInserted = true;
    }

    var imp = impCls(ev.impact);
    var flag = FLAGS[ev.country] || '🌐';
    var time = fmtTime(ev.ts_utc);
    // Бэкенд уже кладёт свой event_key в саму запись (та же колонка, что
    // группирует econ_event_history) -- используем его, а не пересчитываем
    // свой slug: два независимых алгоритма НИКОГДА не совпадали (хэш на
    // бэкенде vs текстовый slug тут), поэтому /api/event/{key}/history не
    // находил вообще ничего, даже когда данные были. eventKey() оставлен
    // только как аварийный фоллбек на случай отсутствующего поля.
    var key = ev.event_key || eventKey(ev);
    var defSym = COUNTRY_SYM[ev.country] || 'EURUSD';

    var surpriseCls = '';
    if(hasFact && ev.forecast != null && ev.forecast !== ''){
      var a = parseFloat(ev.actual), f = parseFloat(ev.forecast);
      if(!isNaN(a)&&!isNaN(f)) surpriseCls = a>=f ? 'surp-up' : 'surp-dn';
    }

    html += '<div class="ev-row'+
      (isPast?' past':'')+(imp!=='h'?' dim-imp':'')+'"'
      +' data-imp="'+(ev.impact||'')+'"'
      +' data-idx="'+idx+'"'
      +' data-key="'+esc(key)+'"'
      +' data-sym="'+defSym+'"'
      +' data-yahoo="'+(ev.yahoo_url?esc(ev.yahoo_url):'')+'">'
      +'<div class="ev-cells" onclick="toggleRow('+idx+')">'
        +'<span class="ev-time">'+time+'</span>'
        +'<span class="ev-flag">'+flag+' '+esc(ev.country||'')+'</span>'
        +'<span class="ev-name" title="'+esc(translatedEventName(ev))+'">'+esc(translatedEventName(ev))+'</span>'
        +'<span class="ev-imp '+imp+'">'+impLabel(ev.impact)+'</span>'
        +'<span class="ev-num'+' '+(hasFact?surpriseCls:'')+'">'+(hasFact?esc(ev.actual):'—')+'</span>'
        +'<span class="ev-num ev-fore">'+(ev.forecast!=null&&ev.forecast!==''?esc(ev.forecast):'—')+'</span>'
        +'<span class="ev-num ev-prev">'+(ev.previous!=null&&ev.previous!==''?esc(ev.previous):'—')+'</span>'
        +'<span class="ev-chev">▾</span>'
      +'</div>'
      +'<div class="ev-detail" id="detail-'+idx+'">'
        +'<div class="ev-detail-inner">'
          +'<div class="ev-desc" id="desc-'+idx+'"></div>'
          +'<div class="seg-ctrl" id="seg-'+idx+'">'
            +'<button class="seg-btn on" data-tab="price" onclick="switchTab('+idx+',this)">'+t('calendar.tab_price','Ценовой график')+'</button>'
            +'<button class="seg-btn" data-tab="history" onclick="switchTab('+idx+',this)">'+t('calendar.tab_history','График событий')+'</button>'
            +'<button class="seg-btn" data-tab="vol" onclick="switchTab('+idx+',this)">'+t('calendar.tab_volatility','Волатильность')+'</button>'
            +'<button class="seg-btn" data-tab="impact" onclick="switchTab('+idx+',this)">'+t('calendar.tab_impact','Влияние')+'</button>'
          +'</div>'
          +'<div id="tab-price-'+idx+'" class="tab-pane on">'
            +'<div class="sym-sel">'
              +'<label>'+t('calendar.instrument_label','Инструмент:')+'</label>'
              +'<select id="sym-sel-'+idx+'" onchange="loadPriceChart('+idx+')">'
                +SYMBOLS.map(function(s){return '<option value="'+s+'"'+(s===defSym?' selected':'')+'>'+esc(symLabel(s))+'</option>';}).join('')
              +'</select>'
            +'</div>'
            +'<div id="price-chart-'+idx+'"><div class="chart-loading">'+t('calendar.loading_chart','Загрузка графика…')+'</div></div>'
          +'</div>'
          +'<div id="tab-history-'+idx+'" class="tab-pane"><div class="chart-loading">'+t('calendar.loading_history','Загрузка истории…')+'</div></div>'
          +'<div id="tab-vol-'+idx+'" class="tab-pane"><div class="chart-loading">'+t('calendar.loading_reaction','Загрузка статистики…')+'</div></div>'
          +'<div id="tab-impact-'+idx+'" class="tab-pane"><div class="chart-loading">'+t('calendar.loading_reaction','Загрузка статистики…')+'</div></div>'
        +'</div>'
      +'</div>'
      +'</div>';
  });

  if(!nowInserted) html += '<div class="now-line"><span>'+t('calendar.now_label','Сейчас')+'</span></div>';

  list.innerHTML = html;
  applyFilters();
}

// ── Аккордеон ──────────────────────────────────────────────────────────────
function toggleRow(idx){
  var row = document.querySelector('.ev-row[data-idx="'+idx+'"]');
  if(!row) return;

  var wasOpen = row.classList.contains('open');
  document.querySelectorAll('.ev-row.open').forEach(function(r){r.classList.remove('open');});

  if(wasOpen) return;

  row.classList.add('open');
  _openRowIdx = idx;

  var ev = _lastEvents[idx];
  if(ev){
    var descEl = document.getElementById('desc-'+idx);
    if(descEl){
      // §3 — короткое описание из глоссария
      var gloss = getGlossEntry(ev.title);
      var yahoo = ev.yahoo_url
        ? ' <a href="'+esc(ev.yahoo_url)+'" target="_blank" rel="noopener">'+t('calendar.source_link','Источник →')+'</a>' : '';
      var glossHtml = gloss
        ? '<div class="ev-gloss-short">'+esc(t(gloss.shortKey, gloss.short))
          +'</div><button class="ev-gloss-btn" onclick="openGlossForEvent('+idx+')">'+t('calendar.gloss_more_link','Подробнее →')+'</button>'
        : '';
      descEl.innerHTML =
        '<b style="font-size:14px">'+esc(translatedEventName(ev))+'</b>'
        +(ev.actual   ? '<br><span style="color:var(--up)">'+t('calendar.detail_actual_label','Факт:')+' <b>'+esc(ev.actual)+'</b></span>' : '')
        +(ev.forecast ? ' · '+t('calendar.detail_forecast_label','Прогноз:')+' '+esc(ev.forecast) : '')
        +(ev.previous ? ' · '+t('calendar.detail_previous_label','Предыдущее:')+' '+esc(ev.previous) : '')
        +yahoo
        +glossHtml;
    }
    loadPriceChart(idx);
  }
}

// ── Переключение вкладок ───────────────────────────────────────────────────
function switchTab(idx, btn){
  if(btn.classList.contains('coming')) return;
  var ctrl = document.getElementById('seg-'+idx);
  ctrl.querySelectorAll('.seg-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  var tab = btn.dataset.tab;
  ['history','price','vol','impact'].forEach(function(t){
    var el = document.getElementById('tab-'+t+'-'+idx);
    if(el) el.classList.toggle('on', t===tab);
  });
  if(tab==='history') loadEventHistory(idx);
  if(tab==='price') loadPriceChart(idx);
  if(tab==='vol') loadReactionTab(idx, 'vol');
  if(tab==='impact') loadReactionTab(idx, 'impact');
}

// ── Волатильность / Влияние (Фаза 2, event_reaction_stats) ─────────────────
// Один и тот же /api/chart/event-reaction кормит обе вкладки — кэшируем один
// фетч на (event_type,symbol), тот же паттерн, что _histCache выше.
var _reactionCache = {};

function _reactionKey(idx){
  var row = document.querySelector('.ev-row[data-idx="'+idx+'"]');
  var ev = _lastEvents[idx];
  if(!row || !ev || !ev.event_type) return null;
  var sel = document.getElementById('sym-sel-'+idx);
  var sym = sel ? sel.value : row.dataset.sym;
  return {eventType: ev.event_type, symbol: sym, cacheKey: ev.event_type+'|'+sym};
}

async function loadReactionTab(idx, which){
  var pane = document.getElementById('tab-'+which+'-'+idx);
  if(!pane) return;

  if(!(window.sbfAuth && window.sbfAuth.isLoggedIn && window.sbfAuth.isLoggedIn())){
    pane.innerHTML = '<div class="soon-box">🔒 '+t('calendar.reaction_locked','Доступно после регистрации')+'</div>';
    return;
  }

  var k = _reactionKey(idx);
  if(!k){
    pane.innerHTML = '<div class="soon-box">'+t('calendar.reaction_no_symbol','Нет привязки к инструменту для этой страны')+'</div>';
    return;
  }

  if(_reactionCache[k.cacheKey] !== undefined){
    pane.innerHTML = _renderReactionPane(_reactionCache[k.cacheKey], which);
    return;
  }

  pane.innerHTML = '<div class="chart-loading">'+t('calendar.loading_reaction','Загрузка статистики…')+'</div>';
  try {
    var r = await window.sbfAuth.fetch('/api/chart/event-reaction?event_type='+encodeURIComponent(k.eventType)+'&symbol='+encodeURIComponent(k.symbol));
    var stats = null;
    if(r.status !== 404 && r.ok){
      var data = await r.json();
      stats = data && (data.n6 || data.n12);
    }
    _reactionCache[k.cacheKey] = stats;
    pane.innerHTML = _renderReactionPane(stats, which);
  } catch(e){
    pane.innerHTML = '<div class="chart-loading">'+t('calendar.generic_error','Ошибка:')+' '+esc(String(e))+'</div>';
  }
}

function _renderReactionPane(stats, which){
  if(!stats){
    // < 4 публикаций у нас в истории — честно, не "скоро" и не прочерки
    return '<div class="soon-box">'+t('calendar.reaction_not_enough','Пока недостаточно прошлых публикаций этого типа события для этого инструмента, чтобы посчитать статистику.')+'</div>';
  }
  if(which === 'vol'){
    var avg = stats.avg_move_60m != null ? stats.avg_move_60m.toFixed(0) : '—';
    var max = stats.max_move_60m != null ? stats.max_move_60m.toFixed(0) : '—';
    var baseline = (stats.baseline_ratio_30m != null)
      ? '<div class="hist-row"><span class="hd">'+fmt_(t('calendar.reaction_baseline_tpl','×{ratio} к обычному ходу этого часа суток (по всем дням, не только с этим событием)'), {ratio: stats.baseline_ratio_30m.toFixed(2)})+'</span></div>'
      : '';
    var period = (stats.period_from && stats.period_to)
      ? '<div style="margin-top:6px;font-size:10.5px;color:var(--muted)">'+fmt_(t('calendar.reaction_period_tpl','Период: {from} — {to}'), {from: stats.period_from, to: stats.period_to})+'</div>'
      : '';
    return '<div class="chart-wrap"><div class="hist-list">'
      + '<div class="hist-row"><span class="hd">'+fmt_(t('calendar.reaction_summary_tpl','За последние {n} публикаций инструмент в среднем двигался на {avg} п. в течение часа после выхода (максимум — {max} п.)'), {n: stats.n, avg: avg, max: max})+'</span></div>'
      + baseline
      + '</div>'
      + period
      + '<div style="margin-top:6px;font-size:10px;color:var(--muted);font-style:italic">'+t('calendar.reaction_disclaimer','Историческая статистика, не прогноз и не рекомендация.')+'</div>'
      + '</div>';
  }
  // impact: доля up/down отдельно среди beat и miss -- описательно, без
  // предположения о "правильном" направлении (нет общей таблицы полярности
  // индикаторов по всем странам, только то, что реально видно в данных).
  var rows = [];
  if(stats.n_beat != null && stats.beat_up_share != null){
    rows.push('<div class="hist-row"><span class="hd">'+t('calendar.impact_beat_label','Факт лучше прогноза')+' (n='+stats.n_beat+')</span>'
      +'<span class="hv">'+Math.round(stats.beat_up_share*100)+'% ↑</span>'
      +'<span class="hd">'+Math.round(stats.beat_down_share*100)+'% ↓</span></div>');
  }
  if(stats.n_miss != null && stats.miss_up_share != null){
    rows.push('<div class="hist-row"><span class="hd">'+t('calendar.impact_miss_label','Факт хуже прогноза')+' (n='+stats.n_miss+')</span>'
      +'<span class="hv">'+Math.round(stats.miss_up_share*100)+'% ↑</span>'
      +'<span class="hd">'+Math.round(stats.miss_down_share*100)+'% ↓</span></div>');
  }
  if(!rows.length){
    return '<div class="soon-box">'+t('calendar.reaction_not_enough','Пока недостаточно прошлых публикаций этого типа события для этого инструмента, чтобы посчитать статистику.')+'</div>';
  }
  var period = (stats.period_from && stats.period_to)
    ? '<div style="margin-top:6px;font-size:10.5px;color:var(--muted)">'+fmt_(t('calendar.reaction_period_tpl','Период: {from} — {to}'), {from: stats.period_from, to: stats.period_to})+'</div>'
    : '';
  return '<div class="chart-wrap"><div class="hist-list">'+rows.join('')+'</div>'
    + period
    + '<div style="margin-top:6px;font-size:10px;color:var(--muted);font-style:italic">'+t('calendar.reaction_disclaimer','Историческая статистика, не прогноз и не рекомендация.')+'</div>'
    + '</div>';
}

// ── График событий (факт vs прогноз) ──────────────────────────────────────
var _histCache = {};
async function loadEventHistory(idx){
  var pane = document.getElementById('tab-history-'+idx);
  if(!pane) return;
  var row  = document.querySelector('.ev-row[data-idx="'+idx+'"]');
  if(!row) return;
  var key = row.dataset.key;
  if(!key) { pane.innerHTML = '<div class="chart-loading">'+t('calendar.event_key_undefined','Ключ события не определён')+'</div>'; return; }

  if(_histCache[key] !== undefined){
    pane.innerHTML = _renderHistPane(key, _histCache[key], idx);
    return;
  }

  pane.innerHTML = '<div class="chart-loading">'+t('calendar.loading_history','Загрузка истории…')+'</div>';
  try {
    var r = await fetch('/api/event/'+encodeURIComponent(key)+'/history');
    var data = r.ok ? await r.json() : [];
    _histCache[key] = Array.isArray(data) ? data : [];
    pane.innerHTML = _renderHistPane(key, _histCache[key], idx);
  } catch(e){
    pane.innerHTML = '<div class="chart-loading">'+t('calendar.generic_error','Ошибка:')+' '+esc(String(e))+'</div>';
  }
}

function _renderHistPane(key, data, idx){
  var chart = window.SBFGrafik ? SBFGrafik.renderEventHistory(data) : '';
  var listHtml = '';
  if(data.length){
    var sorted = data.slice().reverse().slice(0,8);
    listHtml = '<div class="hist-list">'
      + sorted.map(function(d){
          var dt = new Date(d.ts*1000);
          var ds = dt.toLocaleDateString(_dtLocale(),{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
          var surpCls = d.actual!=null&&d.forecast!=null
            ? (parseFloat(d.actual)>=parseFloat(d.forecast)?'surp-up':'surp-dn') : '';
          return '<div class="hist-row"><span class="hd">'+ds+'</span>'
            +'<span class="hv '+surpCls+'">'+(d.actual!=null?d.actual:'—')+'</span>'
            +'<span class="hd">'+(d.forecast!=null?d.forecast:'—')+'</span>'
            +'<span class="hd">'+(d.previous!=null?d.previous:'—')+'</span>'
            +'</div>';
        }).join('')
      +'</div>';
  }
  return '<div class="chart-wrap">'+chart
    +(data.length?'<div style="margin-top:8px;font-family:JetBrains Mono,monospace;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:4px">'+t('calendar.recent_values_label','Последние значения')+'</div>'+listHtml:'')
    +'</div>';
}

// ── Ценовой график (свечи + маркеры) ──────────────────────────────────────
var _SYM_MAP = {XAUUSD:'GOLD', XAGUSD:'SILVER'};

function loadPriceChart(idx){
  var pane = document.getElementById('price-chart-'+idx);
  if(!pane) return;
  var sel = document.getElementById('sym-sel-'+idx);
  var raw = sel ? sel.value : 'EURUSD';
  var sym = _SYM_MAP[raw] || raw;
  var fr = document.createElement('iframe');
  fr.src = '/chart.html?s='+encodeURIComponent(sym)+'&embed=1';
  fr.style.cssText = 'width:100%;border:none;display:block;height:520px';
  fr.dataset.priceFrame = '1';
  fr.allowFullscreen = true;
  fr.setAttribute('allow', 'fullscreen');
  fr.onload = function(){
    try {
      var h = fr.contentWindow.document.body.scrollHeight;
      if (h > 0) fr.style.height = h + 'px';
    } catch(e) {}
  };
  pane.innerHTML = '';
  pane.appendChild(fr);
}

window.addEventListener('message', function(e){
  if (!e.data || e.data.type !== 'sbf-chart-height') return;
  document.querySelectorAll('iframe[data-price-frame]').forEach(function(fr){
    try {
      if (fr.contentWindow === e.source) fr.style.height = e.data.h + 'px';
    } catch(ex) {}
  });
});

// ── Init ───────────────────────────────────────────────────────────────────
setPreset('today', document.getElementById('preset-today'));
updateCalLabel();
</script>
