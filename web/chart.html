<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBF Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/design.css">
<script src="/assets/i18n.js?v=2" defer></script>
<script src="/assets/sbf-header.js?v=15" defer></script>
<script src="/assets/sbf-auth.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="/assets/grafik-engine.js"></script>
<script src="/assets/sbf-thermo-widget.js"></script>
<style>
:root{
  --cream:#FBF6EF; --paper:#FFFFFF; --line:#E7DFCF; --grid:#F0E9DA;
  --ink:#2B2B33; --muted:#8A8275; --gold:#C9A227; --glow:#E6C257;
  --up:#1e8e5a; --down:#c0392b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Montserrat,sans-serif;padding:0}
.chart-top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace}
.chart-top a{font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:.3px}
.chart-top a:hover{color:var(--gold)}
.chart-body{padding:18px}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:960px;margin:0 auto;
  box-shadow:0 6px 24px rgba(43,43,51,.06)}
.hd{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hd .sym{font-weight:700;font-size:18px}
.hd .px{font-family:'JetBrains Mono';font-weight:600;font-size:19px;transition:color .25s}
.hd .px.up{color:var(--up)} .hd .px.down{color:var(--down)}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono'}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 7px var(--up);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.hd .stat{font-family:'JetBrains Mono';font-size:12px;color:var(--muted)}
.hd .stat b{color:var(--ink);font-weight:600}
.bias{font-size:11px;padding:3px 9px;border-radius:5px;font-family:'JetBrains Mono'}
.bias.bear{color:var(--down);border:1px solid var(--down)}
.bias.bull{color:var(--up);border:1px solid var(--up)}
.bias.flat{color:var(--muted);border:1px solid var(--line)}
/* Ряд контролов */
.ctrl-row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--paper)}
.tf-grp,.mode,.tog{display:flex;gap:3px}
.mode{margin-left:auto}
/* Разделитель в контролах */
.ctrl-sep{width:1px;height:22px;background:var(--line);flex-shrink:0}
#chart{height:440px}
.card.sbf-fs{display:flex!important;flex-direction:column!important;overflow:hidden!important}
.card.sbf-fs #chartContainer{flex:1;min-height:0;position:relative}
.card.sbf-fs #chart{height:100%!important;width:100%!important}
body.embed .chart-top,body.embed .beginner,body.embed .foot,body.embed .g-bottom-nav,body.embed .sbf-hd,body.embed #strip{display:none!important}
@media(max-width:760px){.chart-top{display:none}}
body.embed .ctrl-sep,body.embed .tog-label,body.embed #tog,body.embed .tog-hints{display:none!important}
body.embed{overflow:hidden}
body.embed .chart-body{padding:0}
body.embed .card{border-radius:0;box-shadow:none;border:none;max-width:100%}
.beginner{padding:12px 18px;border-top:1px solid var(--line);background:rgba(201,162,39,.06);font-size:13px;line-height:1.55;display:flex;gap:10px}
.beginner .ic{color:var(--gold);font-weight:700} .beginner b{color:var(--gold)}
.foot{padding:8px 18px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.tog-label{font-size:10px;font-family:'JetBrains Mono';color:var(--muted);padding:0 4px;letter-spacing:.3px;text-transform:uppercase}
.tog-hints{display:flex;flex-direction:column;gap:0;background:rgba(248,245,238,.7);border-bottom:1px solid var(--line)}
.tog-hints:empty{display:none}
.tog-hint-chip{font-family:'JetBrains Mono';font-size:11px;color:#444;padding:6px 14px;line-height:1.55;border-bottom:1px solid rgba(231,223,207,.6)}
.tog-hint-chip:last-child{border-bottom:none}
.tog-hint-chip b{color:#2B2B33;font-weight:600}
#newsLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.news-zone{position:absolute;top:0;bottom:20px;background:var(--gold);opacity:.08;cursor:pointer;pointer-events:auto}
.news-zone:hover{opacity:.14}
#confluenceLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confluence-band{position:absolute;left:0;right:0;background:var(--gold);cursor:pointer;pointer-events:auto}
.confluence-band.mid{opacity:.10}
.confluence-band.strong{opacity:.18}
.confluence-band:hover{opacity:.26}
.confluence-band.flash-highlight{opacity:.4;transition:opacity .3s}

/* Сессионная карта (Layer 3, Фаза 2) */
#sessionLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sess-band{position:absolute;top:0;bottom:0}
.sess-asia{background:var(--ink);opacity:.05}
.sess-london{background:var(--gold);opacity:.05}
.sess-ny{background:var(--up);opacity:.05}
.sess-overlap{background:var(--gold);opacity:.10}
.sess-label{position:absolute;top:3px;left:5px;font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;pointer-events:none}
.heat-strip-wrap{padding:0 18px 10px;display:none}
.heat-strip{display:flex;height:6px;border-radius:3px;overflow:hidden}
.heat-strip .hs-seg{flex:1;background:var(--gold);cursor:pointer}
.heat-strip .hs-seg:hover{outline:1px solid var(--gold)}
.hs-edu-link{color:var(--gold);font-weight:600;text-decoration:none}
.hs-edu-link:hover{text-decoration:underline}

/* Сентимент толпы (Layer 3, Фаза 3) */
.sentiment-panel{border-top:1px solid var(--line);padding:8px 18px 0}
.sentiment-hd{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;padding-bottom:6px;cursor:pointer;letter-spacing:.2px}
.sentiment-badge{margin-left:auto;color:var(--gold);font-weight:700;cursor:pointer;font-size:11px}
.sentiment-body{height:0;overflow:hidden;transition:height .15s ease}
.sentiment-body.on{height:64px;margin-bottom:8px}
.sentiment-lock{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:14px 0}

/* Мои сделки (Layer 4, Фаза 2) */
.trades-teaser{display:flex;align-items:center;gap:10px;padding:8px 18px;background:rgba(201,162,39,.08);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink)}
.trades-teaser a{color:var(--gold);font-weight:600;text-decoration:none}
.trades-teaser a:hover{text-decoration:underline}
.trades-teaser button{margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px}
.evt-card .trade-context{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(201,162,39,.07);border:1px solid rgba(201,162,39,.18);font-size:12px;line-height:1.6}
.evt-card .trade-context div{margin-bottom:2px}
#eventLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.evt-line{position:absolute;top:0;bottom:20px;width:0;border-left:1px dashed rgba(43,43,51,.2);pointer-events:none}
.evt-marker{position:absolute;bottom:4px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);cursor:pointer;pointer-events:auto;box-shadow:0 0 0 2px var(--paper)}
.evt-marker.high{background:var(--gold)}
.evt-marker.medium{background:rgba(43,43,51,.4)}
.evt-badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-45deg);font-family:'JetBrains Mono';font-size:9px;color:var(--muted);white-space:nowrap}
.evt-card-backdrop{position:fixed;inset:0;background:rgba(43,43,51,.28);z-index:100;display:none}
.evt-card-backdrop.on{display:block}
.evt-card{position:fixed;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 34px rgba(43,43,51,.18);z-index:101;padding:16px 18px;font-family:'JetBrains Mono',monospace;width:300px;max-width:calc(100vw - 20px);max-height:70vh;overflow-y:auto;display:none}
.evt-card.on{display:block}
@media(max-width:760px){
  .evt-card{left:0!important;right:0;bottom:0;top:auto!important;width:100%;max-width:100%;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(43,43,51,.2)}
}
.evt-card .evt-close{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--muted);font-size:15px;background:none;border:none;line-height:1;padding:4px}
.evt-card .evt-item{padding:10px 0;border-top:1px solid var(--line)}
.evt-card .evt-item:first-child{border-top:none}
.evt-card h4{margin:0 0 6px;font-family:Montserrat,sans-serif;font-size:14px;line-height:1.35;padding-right:20px}
.evt-card .evt-meta{font-size:11px;color:var(--muted);margin-bottom:8px}
.evt-card .evt-countdown{font-size:12px;color:var(--gold);font-weight:600;margin-bottom:8px}
.evt-card .evt-nums{display:flex;gap:18px;margin-bottom:6px}
.evt-card .evt-nums div{font-size:11px;color:var(--muted)}
.evt-card .evt-nums b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.evt-card .evt-actual{font-size:20px;font-weight:700;margin-top:2px}
.evt-card .evt-actual.up{color:var(--up)}
.evt-card .evt-actual.down{color:var(--down)}
.evt-reaction{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(201,162,39,.07);border:1px solid rgba(201,162,39,.18);font-size:12px;line-height:1.5}
.evt-reaction.loading{color:var(--muted)}
.evt-reaction.locked{display:flex;align-items:center;gap:8px;color:var(--muted)}
.evt-reaction .evt-lock{font-size:13px}
.evt-reaction-title{font-weight:700;color:var(--ink);margin-bottom:4px;font-family:'JetBrains Mono'}
.evt-reaction-disclaimer{margin-top:6px;font-size:10px;color:var(--muted);font-style:italic}
.pulse-feed-lock{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:8px 0}

/* Термометр дня (Layer 3, Фаза 1) */
.thermo{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line)}
.thermo.collapsed .thermo-chips{display:none}
.thermo-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:1;min-width:0}
.thermo-chip{background:var(--grid);border-radius:10px;padding:7px 10px;cursor:pointer;min-width:0;transition:background .15s}
.thermo-chip:hover{background:var(--line)}
.thermo-chip .tc-label{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'JetBrains Mono',monospace;letter-spacing:.2px}
.thermo-chip .tc-value{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'JetBrains Mono',monospace;margin-top:1px}
.thermo-chip .tc-value.tc-hot{color:var(--up)}
.thermo-chip .tc-value.tc-warm{color:var(--gold)}
.thermo-chip .tc-value.tc-cold{color:var(--muted)}
.thermo-chip .tc-bar{height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.thermo-chip .tc-bar i{display:block;height:100%;background:var(--gold)}
.thermo-chevron{border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer;font-size:13px;width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s,color .15s}
.thermo-chevron:hover{background:var(--grid);color:var(--ink)}
.thermo.collapsed .thermo-chevron{transform:rotate(-90deg)}
.thermo-hist-caption{font-size:11px;color:var(--muted);line-height:1.4;margin-top:4px}
.thermo-hist{display:flex;align-items:flex-end;gap:2px;height:56px;margin:10px 0 4px}
.thermo-hist .bar{flex:1;background:var(--line);border-radius:2px 2px 0 0;min-height:2px}
.thermo-hist .bar.today{background:var(--gold)}
@media (max-width:760px){
  .thermo-chips{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,1fr);gap:4px;max-height:64px;overflow:hidden}
  .thermo-chip{padding:3px 7px;display:flex;flex-direction:column;justify-content:center}
  .thermo-chip .tc-label{font-size:8.5px;line-height:1.15}
  .thermo-chip .tc-value{font-size:11px;line-height:1.2;margin-top:0}
  .thermo-chip .tc-bar{display:none}
}
</style>
</head>
<body>
<div class="chart-top">
  <a href="javascript:history.back()" data-i18n="chart.back">← Назад</a>
  <span style="color:var(--line)">|</span>
  <a href="/" style="font-weight:700;color:var(--ink)">SBF</a>
  <nav class="g-nav" style="margin-left:auto">
    <a href="/" class="g-nav-item" data-i18n="nav.today">Сегодня</a>
    <a href="/edu/" class="g-nav-item" data-i18n="nav.edu">Обучение</a>
    <a href="/calendar" class="g-nav-item" data-i18n="nav.calendar">Календарь</a>
  </nav>
</div>
<div class="chart-body">
<div class="card">
  <div class="hd">
    <span class="sym" id="sym">—</span>
    <span class="px mono" id="px">—</span>
    <span class="live"><span class="dot"></span>live</span>
    <span class="bias" id="bias">—</span>
    <span class="stat">RSI <b id="rsi">—</b></span>
    <span class="stat"><span data-i18n="chart.nearest_label">ближайший:</span> <b id="near">—</b></span>
  </div>
  <div class="ctrl-row">
    <div class="tf-grp" id="tf">
      <button class="tf" data-tf="M30">M30</button><button class="tf" data-tf="H1">H1</button>
      <button class="tf" data-tf="H4">H4</button><button class="tf on" data-tf="D1">D1</button>
      <button class="tf" data-tf="W1">W1</button>
    </div>
    <div class="ctrl-sep"></div>
    <span class="tog-label" data-i18n="chart.layers_label">слои</span>
    <div class="tog" id="tog">
      <button class="chip on" data-t="piv" data-i18n="home.pivots_toggle">Пивоты</button>
      <button class="chip" data-t="cndl" data-i18n="home.patterns_toggle">Паттерны</button>
      <button class="chip" data-t="smc">SMC</button>
      <button class="chip on" data-t="evt" data-i18n="chart.events_toggle">События</button>
      <button class="chip" data-t="news" data-i18n="chart.news_toggle">Новости</button>
      <button class="chip on" data-t="lvl" data-i18n="chart.levels_toggle">Уровни</button>
      <button class="chip" data-t="zone" data-i18n="chart.zones_toggle">Зоны</button>
      <button class="chip" data-t="sess" data-i18n="chart.sessions_toggle">Сессии</button>
      <button class="chip on" data-t="trades" data-i18n="chart.trades_toggle" style="display:none">Мои сделки</button>
    </div>
  </div>
  <div class="tog-hints" id="togHints"></div>
  <div class="trades-teaser" id="tradesTeaser" style="display:none">
    <span data-i18n="chart.trades_teaser_text">Записывай сделки в журнал — они появятся здесь, на графике.</span>
    <a href="/journal.html#trades" data-i18n="chart.trades_teaser_link">Открыть журнал →</a>
    <button id="tradesTeaserClose" aria-label="close">✕</button>
  </div>
  <div class="thermo" id="thermo">
    <div class="thermo-chips" id="thermoChips"></div>
    <button class="thermo-chevron" id="thermoChevron" aria-label="toggle">▾</button>
  </div>
  <div id="chartContainer" style="position:relative">
    <div id="chart"></div>
    <div id="sessionLayer"></div>
    <div id="confluenceLayer"></div>
    <div id="newsLayer"></div>
    <div id="eventLayer"></div>
    <svg id="tradesLayer" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden"></svg>
  </div>
  <div class="sentiment-panel" id="sentimentPanel" style="display:none">
    <div class="sentiment-hd" id="sentimentHd">
      <span data-i18n="chart.sentiment_title">Настроение толпы</span>
      <span class="sentiment-badge" id="sentimentBadge" style="display:none">⚡ <span data-i18n="chart.sentiment_divergence_short">расходится</span></span>
      <button class="thermo-chevron" id="sentimentChevron" aria-label="toggle">▾</button>
    </div>
    <div class="sentiment-body" id="sentimentBody"></div>
  </div>
  <div class="heat-strip-wrap" id="heatStripWrap">
    <div class="heat-strip" id="heatStrip"></div>
  </div>
  <div class="beginner"><span class="ic">&#9432;</span><div id="explain">…</div></div>
  <div class="foot" data-i18n="chart.footer_disclaimer">образовательная подсветка паттернов — контекст, не инвестиционная рекомендация</div>
</div>
<div class="evt-card-backdrop" id="evtBackdrop"></div>
<div class="evt-card" id="evtCard"></div>

<script>
const _SP = new URLSearchParams(location.search);
// SBF_Charts_Layer4_Spec, Фаза 1.2.3: без deep-link (?s=) — последний
// просмотренный инструмент пользователя, иначе первый из ватчлиста, иначе
// GOLD. Читаем localStorage-кэш auth-контекста (sbf-header.js) СИНХРОННО —
// сетевой /api/auth/me асинхронный и пришёл бы слишком поздно (PARAM нужен
// немедленно для первого рендера графика, ждать событие sbf:user-ready
// означало бы пустой экран до его прихода).
function _defaultChartSymbol() {
  try {
    const cached = JSON.parse(localStorage.getItem('sbf_user_cache') || 'null');
    if (cached) {
      const lastSym = cached.prefs && cached.prefs.last_symbol;
      if (lastSym) return lastSym;
      if (Array.isArray(cached.watchlist) && cached.watchlist.length) return cached.watchlist[0];
    }
  } catch (e) {}
  return 'GOLD';
}
const PARAM = _SP.get('s') || _defaultChartSymbol();
if (_SP.get('embed') === '1') document.body.classList.add('embed');
// SBF_Charts_Layer4_Spec, Фаза 3: переход из утреннего отчёта — график на
// M30/H1 (default_tf пользователя, иначе H1), диапазон "сегодня+вчера",
// слой Событий принудительно ON, термометр раскрыт.
const FOCUS_TODAY = _SP.get('focus') === 'today';
if (FOCUS_TODAY) localStorage.setItem('sbf_thermo_collapsed', '0'); // термометр раскрыт (спека Ф3) — ставим ДО initThermoCollapse() ниже по файлу, тот читает это же значение при построении DOM
function _focusTodayTF() {
  try {
    const cached = JSON.parse(localStorage.getItem('sbf_user_cache') || 'null');
    const dtf = cached && cached.prefs && cached.prefs.default_tf;
    if (dtf === 'M30' || dtf === 'H1') return dtf;
  } catch (e) {}
  return 'H1';
}
const YF = {
  GOLD:'GC=F', SILVER:'SI=F',
  BTC:'BTC-USD', ETH:'ETH-USD', SOL:'SOL-USD',
  SPX:'^GSPC', NASDAQ:'^IXIC', DJI:'^DJI', VIX:'^VIX',
  WTI:'CL=F', NG:'NG=F',
  EURUSD:'EURUSD=X', GBPUSD:'GBPUSD=X', USDJPY:'JPY=X', DXY:'DX-Y.NYB',
};
const BYBIT = {BTC:'BTCUSDT', ETH:'ETHUSDT', SOL:'SOLUSDT'};

// ── Состояние ───────────────────────────────────────────────────────────────
let chart = null, candleSeries = null, lastCandle = null, ws = null, curTF = 'D1';
let _curData = null;           // результат SBFGrafik.loadBars
let _curLines = [];            // priceLine refs (для удаления)
let _curEvents = [];           // события календаря для текущего symbol/tf (Фаза 1)
let _curNewsBursts = [];       // зоны новостных всплесков для текущего symbol/tf (Фаза 3)
let _curLevels = [];           // исторические S/R-уровни для текущего symbol (Layer 2, Фаза 1)
let _curConfluence = [];       // зоны внимания для текущего symbol (Layer 2, Фаза 2)
let _curPatterns = [];         // паттерны из core.patterns.detect() (Layer 2, Фаза 3)
let _curPatternsShown = [];    // после дедупликации — то, что реально на графике (для хит-теста клика)
let _evtRO = null;             // ResizeObserver слоя событий
const TOGGLES = {piv:true, cndl:false, smc:false, evt: FOCUS_TODAY || localStorage.getItem('sbf_chart_evt') !== '0', news:false,
  lvl: localStorage.getItem('sbf_chart_lvl') !== '0', zone:false, sess:false, trades:true};
document.querySelector('#tog [data-t="evt"]').classList.toggle('on', TOGGLES.evt);
document.querySelector('#tog [data-t="lvl"]').classList.toggle('on', TOGGLES.lvl);

// ── i18n ───────────────────────────────────────────────────────────────────
// Статическая страница (не Jinja) — тот же паттерн, что в journal.html: t()
// смотрит на window.sbfI18n при каждом вызове (а не кэширует в замыкании),
// т.к. этот <script> исполняется синхронно, ДО defer-скриптов i18n.js/
// sbf-header.js. fmt_() — простая подстановка {ключ} в шаблон (как в index.html).
function t(key, fallback) {
  const i = window.sbfI18n;
  return i ? i.t(key, fallback) : (fallback || key);
}
function fmt_(tpl, vars) { return tpl.replace(/\{(\w+)\}/g, (_, k) => (vars[k] != null ? vars[k] : '')); }
// Голый .toLocaleString('en') без опций режет дробную часть до 3 знаков
// (дефолт Intl) -- для форекс-мажоров вроде EURUSD (нужен 4-й знак, пипс)
// это схлопывало РАЗНЫЕ уровни (R2/R1/PP/S1/S2 и т.п.) в одинаковый текст
// "1.14". Та же магнитудная эвристика, что и priceFormat графика ниже.
function fmtPrice(v) {
  if (v == null) return '—';
  const av = Math.abs(+v);
  const prec = av < 10 ? 4 : av < 1000 ? 2 : 1;
  return (+v).toLocaleString('en', {minimumFractionDigits: prec, maximumFractionDigits: prec});
}

function _patchI18n(root) {
  if ((window.sbfI18n && window.sbfI18n.lang) === 'ru') return;
  const tt = window.sbfI18n ? window.sbfI18n.t : (k, fb) => (fb || k);
  (root || document).querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = tt(el.getAttribute('data-i18n'), el.textContent);
  });
}
window.sbfI18n
  ? window.sbfI18n.ready.then(() => { _patchI18n(document); })
  : document.addEventListener('DOMContentLoaded', () => {
      if (window.sbfI18n) window.sbfI18n.ready.then(() => { _patchI18n(document); });
    });

// ── Шапка ──────────────────────────────────────────────────────────────────
function buildExplain(meta, near) {
  if (!near) return '';
  const side = near.name[0]==='S' ? t('chart.side_support','поддержки')
    : near.name[0]==='R' ? t('chart.side_resistance','сопротивления')
    : t('chart.side_pivot','точки разворота');
  const where = Math.abs(near.dist_pct) < 0.5
    ? fmt_(t('chart.near_close_tpl','вплотную к {side}'), {side})
    : fmt_(t('chart.near_far_tpl','в {pct}% от {side}'), {pct: Math.abs(near.dist_pct), side});
  const rsiV = meta.rsi;
  const rsiTxt = rsiV < 30 ? t('chart.rsi_oversold_txt','ниже 30 — зона перепроданности (исторически возможен отскок)')
    : rsiV > 70 ? t('chart.rsi_overbought_txt','выше 70 — зона перекупленности (исторически возможна коррекция)')
    : fmt_(t('chart.rsi_neutral_txt','{v} — нейтральная зона'), {v: rsiV});
  const pats = (meta.patterns||[]).length
    ? fmt_(t('chart.pattern_spotted_tpl',' Замечен паттерн: <b>{list}</b>.'), {list: meta.patterns.join(', ')})
    : '';
  const mainLine = fmt_(t('chart.explain_main_tpl','Цена <b>{where} {name} {price}</b> — уровень, у которого исторически разворачивалась цена.'),
    {where, name: near.name, price: fmtPrice(near.price)});
  const legendLine = t('chart.explain_legend','Красные линии сверху — сопротивление, зелёные снизу — поддержка, золотая — точка разворота.');
  const rsiLine = fmt_(t('chart.explain_rsi_tpl','RSI <b>{rsi}</b>.'), {rsi: rsiTxt});
  return `${mainLine}
    ${legendLine}
    ${rsiLine}${pats}`;
}

function flash(el, up) {
  el.classList.remove('up','down'); void el.offsetWidth;
  el.classList.add(up ? 'up' : 'down');
}

// ── Тумблеры паттернов/SMC ─────────────────────────────────────────────────
// Источник маркеров — core/patterns.py через /api/chart/patterns (Layer 2,
// Фаза 3) — единый источник паттернов для рендера И бэктеста (см. Acceptance
// спеки), НЕ SBFGrafik.detectCandles() (тот остаётся для образовательной
// галереи паттернов на index.html/edu — отдельная задача, не трогали).
function getCandleMarkers() {
  _curPatternsShown = [];
  if (!_curPatterns.length) return [];
  const minGap = (TF_SEC[curTF] || 86400) * 6; // дедупликация — как раньше "6 баров"
  const lastSeen = {};
  const shown = _curPatterns.filter(p => {
    if (lastSeen[p.pattern_key] !== undefined && (p.ts - lastSeen[p.pattern_key]) < minGap) return false;
    lastSeen[p.pattern_key] = p.ts;
    return true;
  });
  _curPatternsShown = shown;
  return shown.map(p => {
    const col = p.direction === 'bullish' ? '#2E8B6F' : p.direction === 'bearish' ? '#C0504D' : '#C9A227';
    return {
      time: unixToBarTime(p.ts),
      position: p.direction === 'bullish' ? 'belowBar' : p.direction === 'bearish' ? 'aboveBar' : 'inBar',
      color: col,
      shape: p.direction === 'bullish' ? 'arrowUp' : p.direction === 'bearish' ? 'arrowDown' : 'circle',
      text: p.display_name_ru
    };
  });
}

async function refreshPatterns(tf) {
  _curPatterns = [];
  if (_curData && _curData.lw.length) {
    const bars = _curData.lw;
    const from = barTimeToUnix(bars[0].time);
    const to = barTimeToUnix(bars[bars.length - 1].time) + (TF_SEC[tf] || 86400) * 6;
    try {
      const r = await fetch(`/api/chart/patterns?symbol=${encodeURIComponent(PARAM)}&tf=${tf}&from=${from}&to=${to}`);
      const data = await r.json();
      if (Array.isArray(data)) _curPatterns = data;
    } catch (e) {}
  }
}

function findPatternAtX(x) {
  if (!chart || !_curPatternsShown.length) return null;
  let best = null, bestDist = 8;
  _curPatternsShown.forEach(p => {
    const px = chart.timeScale().timeToCoordinate(unixToBarTime(p.ts));
    if (px == null) return;
    const d = Math.abs(px - x);
    if (d <= bestDist) { bestDist = d; best = p; }
  });
  return best;
}

          {n: stats.n, histDate, pct, avg: stats.avg_move_5.toFixed(1), adverse: stats.max_adverse_5.toFixed(1)})}</div>
        <div class="evt-reaction-disclaimer">${escapeHtml(t('chart.reaction_disclaimer', 'Историческая статистика, не прогноз и не рекомендация.'))}</div>
      </div>`;
    })
    .catch(() => {});

function getSMCMarkers() {
  if (!_curData) return [];
  const evts = SBFGrafik.detectSMC(_curData.bars, 5);
  const start = Math.max(0, _curData.bars.length - 60);
  const swingTypes = ['hh','lh','hl','ll'];
  return evts
    .filter(e => swingTypes.includes(e.type) && e.i >= start)
    .map(e => {
      const lw = _curData.lw[e.i];
      if (!lw) return null;
      return {
        time: lw.time,
        position: e.dir==='bull' ? 'belowBar' : 'aboveBar',
        color: e.dir==='bull' ? '#2E8B6F' : '#C0504D',
        shape: 'circle',
        text: e.label
      };
    }).filter(Boolean);
}

function applySMCLines(evts) {
  const lines = [];
  if (!candleSeries) return lines;
  evts.forEach(ev => {
    if (ev.type === 'bos') {
      const col = ev.dir==='bear' ? '#c0392b' : '#1e8e5a';
      lines.push(candleSeries.createPriceLine({
        price: ev.y, color: col, lineWidth: 1, lineStyle: 2,
        axisLabelVisible: true, title: ev.label
      }));
    }
    if (ev.type === 'fvg') {
      const col = ev.dir==='bull' ? '#1D9E75' : '#c0392b';
      lines.push(candleSeries.createPriceLine({
        price: ev.yTop, color: col, lineWidth: 1, lineStyle: 3,
        axisLabelVisible: false, title: 'FVG'
      }));
      lines.push(candleSeries.createPriceLine({
        price: ev.yBot, color: col, lineWidth: 1, lineStyle: 3,
        axisLabelVisible: false, title: ''
      }));
    }
    if (ev.type === 'ob') {
      const col = ev.dir==='bull' ? '#C9A227' : '#B07CC6';
      lines.push(candleSeries.createPriceLine({
        price: ev.yTop, color: col, lineWidth: 1, lineStyle: 2,
        axisLabelVisible: false, title: 'OB'
      }));
      lines.push(candleSeries.createPriceLine({
        price: ev.yBot, color: col, lineWidth: 1, lineStyle: 2,
        axisLabelVisible: false, title: ''
      }));
    }
  });
  return lines;
}

// Функция (не статический объект) — вызывается заново при каждом рендере

  const hints = getTogHints();
  el.innerHTML = Object.entries(TOGGLES)
    .filter(([,v]) => v)
    .map(([k]) => hints[k] ? `<span class="tog-hint-chip">${hints[k]}</span>` : '')

function applyToggles() {
  if (!candleSeries) return;

  // Снять старые priceLine
  _curLines.forEach(l => { try { candleSeries.removePriceLine(l); } catch(e){} });
  _curLines = [];

  // Пивоты (из JSON levels)
  if (TOGGLES.piv && _curData && _curData.levels.length) {
    _curData.levels.forEach(L => {
      _curLines.push(candleSeries.createPriceLine({
        price: L.price, color: L.color, lineWidth: 1, lineStyle: 2,
        axisLabelVisible: true, title: L.name
      }));
    });
  }

  // SMC priceLine (BOS, FVG, OB)
  if (TOGGLES.smc && _curData) {
    const smcEvts = SBFGrafik.detectSMC(_curData.bars, 5);
    _curLines = _curLines.concat(applySMCLines(smcEvts));
  }

  // Исторические S/R-уровни (Layer 2, Фаза 1) — сплошная линия (пивоты — пунктир),
  // толщина по числу касаний. lightweight-charts принимает только целые
  // lineWidth 1..4 — округляем градацию спеки (1/1.5/2.5px) до ближайших шагов.
  if (TOGGLES.lvl && _curLevels.length) {
    _curLevels.forEach(L => {
      const width = L.touches >= 5 ? 3 : L.touches >= 3 ? 2 : 1;
      const color = L.kind === 'support' ? 'rgba(30,142,90,.6)'
        : L.kind === 'resistance' ? 'rgba(192,57,43,.6)' : 'rgba(201,162,39,.6)';
      _curLines.push(candleSeries.createPriceLine({
        price: L.price, color, lineWidth: width, lineStyle: 0,
        axisLabelVisible: true, title: '×' + L.touches
      }));
    });
  }

  // Маркеры (свечные паттерны + SMC свинги)
  let markers = [];
  if (TOGGLES.cndl) markers = markers.concat(getCandleMarkers());
  if (TOGGLES.smc)  markers = markers.concat(getSMCMarkers());
  markers.sort((a,b) => a.time > b.time ? 1 : a.time < b.time ? -1 : 0);
  candleSeries.setMarkers(markers);
  updateTogHints();
}

// ── Слой событий календаря (Фаза 1, SBF_Charts_Layer1_Spec) ────────────────
const TF_SEC = {M30:1800, H1:3600, H4:14400, D1:86400, W1:604800};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// D1/W1-бары приходят от loadBars как business-day строки 'YYYY-MM-DD'
// (см. web/data/ohlc_*_D1.json), M30/H1/H4 — как unix-секунды. LightweightCharts
// требует ровно тот же тип Time, каким был засеян candleSeries.setData(), иначе
// timeToCoordinate/getVisibleRange возвращают/принимают несовместимый формат.
function barTimeToUnix(time) {
  return typeof time === 'number' ? time : Math.floor(Date.parse(time + 'T00:00:00Z') / 1000);
}
function unixToBarTime(ts) {
  return (curTF === 'D1' || curTF === 'W1') ? new Date(ts * 1000).toISOString().slice(0, 10) : ts;
}

// Координата X события: сначала через API графика (точный маппинг по барам),
// с фолбэком на линейную интерполяцию по видимому диапазону — нужно для
// будущих событий за пределами последнего бара (visible range расширен на
// 6 баров вправо, см. setVisibleLogicalRange в drawOurs).
function tsToX(ts, width) {
  if (!chart) return null;
  let x = chart.timeScale().timeToCoordinate(unixToBarTime(ts));
  if (x != null) return x;
  const vr = chart.timeScale().getVisibleRange();
  if (!vr) return null;
  const vrFrom = barTimeToUnix(vr.from), vrTo = barTimeToUnix(vr.to);
  if (ts < vrFrom || ts > vrTo) return null;
  // Найдено на Layer4 Ф2 (сделки у самого правого края графика не ловились
  // кликом): интерполяция ДОЛЖНА идти по ширине именно временнОй панели
  // (chart.timeScale().width()), а не по ширине всего #chartContainer —
  // тот шире на гуттер шкалы цен справа (~60-90px), из-за чего у правого
  // края интерполированная X съезжала В гуттер, где канвас-график уже не
  // перехватывает клики. Тот же баг был бы и у real-time событий/зон за
  // последним баром (видимый диапазон расширен на 6 баров — см. drawOurs),
  // просто раньше не попадали в тестовые сценарии Layer1-3.
  const paneWidth = chart.timeScale().width() || width;
  return (ts - vrFrom) / (vrTo - vrFrom) * paneWidth;
}

// Кластеризация событий ближе 8px по X в один маркер (см. Acceptance спеки)
function clusterEvents(items) {
  // Кластеризация по ЯКОРЮ (первая точка кластера), не по последней добавленной —
  // сравнение с последней даёт неограниченно расползающуюся "цепочку" при плотных
  // равномерных событиях (тот же баг нашёлся и был исправлен в Layer2 —
  // sr_levels_job.py._cluster/confluence_job.py._cluster_factors — там на реальных
  // данных кластер растягивался в 18 раз шире заявенного допуска). Здесь риск ниже
  // (события реже расставлены так же равномерно плотно, как ценовые уровни/пивоты),
  // но тот же класс ошибки, поэтому чинится тем же способом.
  const clusters = [];
  let cur = null;
  items.forEach(it => {
    if (cur && (it.x - cur.x) < 8) {
      cur.items.push(it.ev);
    } else {
      cur = {x: it.x, items: [it.ev]};
      clusters.push(cur);
    }
  });
  return clusters;
}

function fmtCountdown(ts) {
  const diff = ts - Math.floor(Date.now() / 1000);
  if (diff <= 0) return null;
  const h = Math.floor(diff / 3600), m = Math.floor((diff % 3600) / 60);
  if (h >= 24) return fmt_(t('chart.event_in_days_tpl', 'через {d}д {h}ч'), {d: Math.floor(h / 24), h: h % 24});
  if (h > 0)   return fmt_(t('chart.event_in_hm_tpl', 'через {h}ч {m}м'), {h, m});
  return fmt_(t('chart.event_in_m_tpl', 'через {m}м'), {m});
}

function actualDir(ev) {
  const a = parseFloat(String(ev.actual).replace(',', '.'));
  const f = parseFloat(String(ev.forecast).replace(',', '.'));
  if (isNaN(a) || isNaN(f)) return '';
  return a > f ? 'up' : a < f ? 'down' : '';
}

// ── «Прошлые разы» — Фаза 2 (SBF_Charts_Layer1_Spec) ────────────────────────

  const id = _reactionElId(ev);

    return `<div class="evt-reaction locked" id="${id}">

function renderReactionStats(stats) {
  const avg = stats.avg_move_60m != null ? stats.avg_move_60m.toFixed(0) : '—';
  const max = stats.max_move_60m != null ? stats.max_move_60m.toFixed(0) : '—';
  return `<div class="evt-reaction-title">${t('chart.reaction_title','Прошлые разы')}</div>
    <div>${fmt_(t('chart.reaction_summary_tpl','За последние {n} публикаций {sym} в среднем двигался на {avg} п. в течение часа после выхода (максимум — {max} п.)'),
      {n: stats.n, sym: PARAM, avg, max})}</div>
    <div class="evt-reaction-disclaimer">${t('chart.reaction_disclaimer','Историческая статистика, не прогноз и не рекомендация.')}</div>`;

function loadReactionBlock(ev) {
  if (!window.sbfAuth || !window.sbfAuth.isLoggedIn() || !ev.event_type) return;
  const el = document.getElementById(_reactionElId(ev));
  if (!el) return;
  window.sbfAuth.fetch(`/api/chart/event-reaction?event_type=${encodeURIComponent(ev.event_type)}&symbol=${encodeURIComponent(PARAM)}`)
    .then(r => (r.status === 404 || !r.ok) ? null : r.json())
    .then(data => {
      const stats = data && (data.n6 || data.n12);
      if (!stats) { el.remove(); return; }  // < 4 публикаций — карточка без блока, не с прочерками
      el.classList.remove('loading');
      el.innerHTML = renderReactionStats(stats);
    })
    .catch(() => { el.remove(); });
}

  const countdown = fmtCountdown(ev.ts);

// ── Новостные всплески — Фаза 3 (SBF_Charts_Layer1_Spec) ───────────────────
// Как и координата события в Фазе 1, но зона (прямоугольник), а не точка —
// клэмпим края к видимому окну графика (в отличие от tsToX, которая для
// отдельного маркера просто скрывает точку за пределами видимости).
function tsToXClamp(ts, width) {
  if (!chart) return null;
  // См. комментарий в tsToX — паровый баг: клэмп/интерполяция должны идти по
  // ширине временнОй панели графика (без гуттера шкалы цен справа), не по
  // ширине всего #chartContainer, иначе элементы у правого края съезжают в
  // некликабельную зону шкалы цен.
  const paneWidth = chart.timeScale().width() || width;
  let x = chart.timeScale().timeToCoordinate(unixToBarTime(ts));
  if (x != null) return Math.max(0, Math.min(paneWidth, x));
  const vr = chart.timeScale().getVisibleRange();
  if (!vr) return null;
  const vrFrom = barTimeToUnix(vr.from), vrTo = barTimeToUnix(vr.to);
  if (vrTo === vrFrom) return null;
  const frac = (ts - vrFrom) / (vrTo - vrFrom);
  return Math.max(0, Math.min(paneWidth, frac * paneWidth));
}

function findLevelAtY(y) {

  let best = null, bestDist = 6; // px

    if (ly == null) return;
    const d = Math.abs(ly - y);
    if (d <= bestDist) { bestDist = d; best = L; }

  return best;

// Один обработчик кликов на чарт для уровней (Ф1) и зон внимания (Ф2) — сначала
// точный хит по уровню (±6px), иначе более широкий хит по диапазону зоны,
// чтобы клик не открывал сразу две карточки одна поверх другой.
// Приоритет хит-теста: сделка (Layer4 Ф2 — личные данные пользователя, самый
// высокий приоритет) → паттерн (самый точечный) → уровень (±6px по Y) → зона
// (широкий диапазон Y) — иначе клик по паттерну внутри зоны открыл бы карточку
// зоны вместо паттерна.
function setupLevelClickHandler() {
  chart.subscribeClick(param => {
    if (!param.point) return;
    const rect = document.getElementById('chart').getBoundingClientRect();
    const x = rect.left + param.point.x, y = rect.top + param.point.y;
    if (TOGGLES.trades) {
      const T = findTradeAt(param.point.x, param.point.y);
      if (T) { openTradeCard(T, x, y); return; }
    }
    if (TOGGLES.cndl) {
      const P = findPatternAtX(param.point.x);
      if (P) { openPatternCard(P, x, y); return; }
    }
    if (TOGGLES.lvl) {
      const L = findLevelAtY(param.point.y);
      if (L) { openLevelCard(L, x, y); return; }
    }
    if (TOGGLES.zone) {
      const Z = findZoneAtY(param.point.y);
      if (Z) { openZoneCard(Z, x, y); return; }
    }
  });
}

// ── Сессионная карта — Layer 3, Фаза 2 (SBF_Charts_Layer3_Spec) ────────────
// DST-правила продублированы из core/sessions.py намеренно (см. комментарий
// там) — нужно уметь считать границы для ЛЮБОГО видимого дня графика при
// скролле в историю, не только для «сегодня», которое отдаёт API.
let _curSessionProfile = []; // 24 значения avg_range из hourly_vol_profile

function nthSundayUTC(year, month, n) {
  const d0 = new Date(Date.UTC(year, month - 1, 1));
  const firstSunDay = 1 + ((7 - d0.getUTCDay()) % 7);
  return new Date(Date.UTC(year, month - 1, firstSunDay + (n - 1) * 7));
}
function lastSundayUTC(year, month) {
  const lastDay = new Date(Date.UTC(year, month, 0));
  const lastSunDay = lastDay.getUTCDate() - lastDay.getUTCDay();
  return new Date(Date.UTC(year, month - 1, lastSunDay));
}
function isEuDst(dateUTC) {
  const y = dateUTC.getUTCFullYear();
  return dateUTC >= lastSundayUTC(y, 3) && dateUTC < lastSundayUTC(y, 10);
}
function isUsDst(dateUTC) {
  const y = dateUTC.getUTCFullYear();
  return dateUTC >= nthSundayUTC(y, 3, 2) && dateUTC < nthSundayUTC(y, 11, 1);
}
function sessionBoundsUtc(dateUTC) {
  const london = isEuDst(dateUTC) ? [7, 16] : [8, 17];
  const ny = isUsDst(dateUTC) ? [12, 21] : [13, 22];
  return {asia: [0, 8], london, ny};
}
// Разбивка на неперекрывающиеся сегменты + отдельный сегмент перекрытия
// Лондон+NY (спека требует его визуально плотнее, не просто альфа-блендинг).
function sessionSegmentsForDate(dateUTC) {
  const b = sessionBoundsUtc(dateUTC);
  const segs = [{name: 'asia', from: b.asia[0], to: b.asia[1]}];
  const ovFrom = Math.max(b.london[0], b.ny[0]), ovTo = Math.min(b.london[1], b.ny[1]);
  if (ovFrom < ovTo) {
    if (b.london[0] < ovFrom) segs.push({name: 'london', from: b.london[0], to: ovFrom});
    segs.push({name: 'overlap', from: ovFrom, to: ovTo});
    if (ovTo < b.ny[1]) segs.push({name: 'ny', from: ovTo, to: b.ny[1]});
  } else {
    segs.push({name: 'london', from: b.london[0], to: b.london[1]});
    segs.push({name: 'ny', from: b.ny[0], to: b.ny[1]});
  }
  return segs;
}

function redrawSessionLayer() {
  const layer = document.getElementById('sessionLayer');
  if (!layer) return;
  layer.innerHTML = '';
  if (!TOGGLES.sess || !chart || !(curTF === 'M30' || curTF === 'H1')) return;
  const width = document.getElementById('chartContainer').clientWidth;
  const vr = chart.timeScale().getVisibleRange();
  if (!vr) return;
  const fromTs = barTimeToUnix(vr.from), toTs = barTimeToUnix(vr.to);
  const dayStart0 = Math.floor(fromTs / 86400) * 86400 - 86400;
  for (let dayStart = dayStart0; dayStart <= toTs + 86400; dayStart += 86400) {
    const dateUTC = new Date(dayStart * 1000);
    sessionSegmentsForDate(dateUTC).forEach(seg => {
      const x1 = tsToXClamp(dayStart + seg.from * 3600, width);
      const x2 = tsToXClamp(dayStart + seg.to * 3600, width);
      if (x1 == null || x2 == null || x2 <= x1) return;
      const div = document.createElement('div');
      div.className = 'sess-band sess-' + seg.name;
      div.style.left = x1 + 'px';
      div.style.width = (x2 - x1) + 'px';
      if (x2 - x1 > 60 && seg.name !== 'overlap') {
        const label = document.createElement('span');
        label.className = 'sess-label';
        label.textContent = t('chart.sess_' + seg.name, seg.name);
        div.appendChild(label);
      }
      layer.appendChild(div);
    });
  }
}

// ── Сентимент толпы vs цена — Layer 3, Фаза 3 (SBF_Charts_Layer3_Spec) ─────
// Символы = sentiment_job.py STARTER_SYMBOLS (продублировано намеренно —
// нужно решить "показывать ли панель вообще" ДО авторизованного запроса,
// анониму нельзя узнать это через сам гейтованный /api/chart/sentiment).
const SENTIMENT_SYMBOLS = new Set(['BTC', 'ETH', 'GOLD', 'SPX', 'EURUSD']);
let _sentimentChart = null, _sentimentSeries = null, _sentimentExpanded = false, _curSentiment = null;

// Строит данные для lightweight-charts с явными "whitespace"-точками
// (объект без value) на пропущенных часах — иначе библиотека по умолчанию
// плавно соединит соседние реальные точки прямой линией через пропуск.
// Acceptance спеки: "час с total=3 — разрыв линии, не нулевая точка".
function buildSentimentSeriesData(points) {
  if (!points.length) return [];
  const byHour = {};
  points.forEach(p => { byHour[p.ts_hour] = p; });
  const hours = points.map(p => p.ts_hour).sort((a, b) => a - b);
  const out = [];
  for (let h = hours[0]; h <= hours[hours.length - 1]; h += 3600) {
    const p = byHour[h];
    out.push(p ? {time: h, value: p.score} : {time: h});
  }
  return out;
}

// ── Мои сделки — Layer 4, Фаза 2 (SBF_Charts_Layer4_Spec) ──────────────────
// ЯДРО слоя (спека): точки входа/выхода на том же графике, где уровни/зоны/
// события/сессии. ВАЖНО (найдено на Фазе 1, см. память/vault): trades.
// exit_price/close_ts NOT NULL в схеме БД — открытых (незакрытых) сделок в
// текущей модели данных не существует, только пост-фактум журнал закрытых.
// Ветка "пунктирная линия до текущей цены" из спеки поэтому недостижима
// сейчас (hasExit всегда true на практике) — код её поддерживает НА БУДУЩЕЕ
// (если схема когда-то расширится), но живьём не бывает.
const SVG_NS = 'http://www.w3.org/2000/svg';
const MAX_TRADES_WITH_LINES = 50;
let _curMyTrades = [];

function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function updateTradesChipVisibility() {

    dismissed = !!(layers && layers.trades_teaser_dismissed);

}

function redrawTradesLayer() {
  const layer = document.getElementById('tradesLayer');
  if (!layer) return;
  layer.innerHTML = '';
  if (!TOGGLES.trades || !chart || !candleSeries || !_curMyTrades.length) return;
  const width = document.getElementById('chartContainer').clientWidth;
  const withLines = _curMyTrades.length <= MAX_TRADES_WITH_LINES;
  _curMyTrades.forEach(tr => {
    const ex = tsToXClamp(tr.entry_ts, width);
    const ey = candleSeries.priceToCoordinate(tr.entry_price);
    if (ex == null || ey == null) return;
    const isLong = tr.direction === 'long';
    const dirColor = isLong ? '#1e8e5a' : '#c0392b';
    const hasExit = tr.exit_ts != null && tr.exit_price != null;
    let exX = null, exY = null;
    if (hasExit) {
      exX = tsToXClamp(tr.exit_ts, width);
      exY = candleSeries.priceToCoordinate(tr.exit_price);
    }

    if (withLines && hasExit && exX != null && exY != null) {
      const lineColor = (tr.r == null || tr.r >= 0) ? '#1e8e5a' : '#c0392b';
      const line = svgEl('line', {
        x1: ex, y1: ey, x2: exX, y2: exY, stroke: lineColor, 'stroke-width': 1.4, opacity: 0.65,
      });
      if (!hasExit) line.setAttribute('stroke-dasharray', '4,3'); // будущее: открытая сделка (см. комментарий выше)
      layer.appendChild(line);
    }

    if (tr.sl != null) {
      const slY = candleSeries.priceToCoordinate(tr.sl);
      if (slY != null) {
        layer.appendChild(svgEl('line', {
          x1: ex - 7, y1: slY, x2: ex + 7, y2: slY,
          stroke: '#c0392b', 'stroke-width': 1.4, 'stroke-dasharray': '2,2',
        }));
      }
    }
    if (tr.tp != null) {
      const tpY = candleSeries.priceToCoordinate(tr.tp);
      if (tpY != null) {
        layer.appendChild(svgEl('line', {
          x1: ex - 7, y1: tpY, x2: ex + 7, y2: tpY,
          stroke: '#1e8e5a', 'stroke-width': 1.4, 'stroke-dasharray': '2,2',
        }));
      }
    }

    const s = 5;
    const tri = isLong
      ? `${ex - s},${ey + s} ${ex + s},${ey + s} ${ex},${ey - s}`
      : `${ex - s},${ey - s} ${ex + s},${ey - s} ${ex},${ey + s}`;
    layer.appendChild(svgEl('polygon', {points: tri, fill: dirColor, stroke: '#fff', 'stroke-width': 1}));

    if (hasExit && exX != null && exY != null) {
      const q = 4;
      layer.appendChild(svgEl('rect', {
        x: exX - q, y: exY - q, width: q * 2, height: q * 2,
        fill: '#2B2B33', stroke: '#fff', 'stroke-width': 1,
      }));
    }
  });
}

function findTradeAt(px, py) {
  if (!candleSeries || !_curMyTrades.length) return null;
  const width = document.getElementById('chartContainer').clientWidth;
  let best = null, bestDist = 8;
  _curMyTrades.forEach(tr => {
    [[tr.entry_ts, tr.entry_price], [tr.exit_ts, tr.exit_price]].forEach(([ts, price]) => {
      if (ts == null || price == null) return;
      // tsToXClamp — та же функция, что redrawTradesLayer() использует для
      // РЕНДЕРА маркеров; tsToX (без клэмпа) возвращает null у самого края
      // видимого диапазона и хит-тест не находил бы маркер, который
      // визуально ЕСТЬ на экране (нашёл на реальных данных — синтетическая
      // сделка у правого края текущего окна не открывала карточку по тапу).
      const x = tsToXClamp(ts, width), y = candleSeries.priceToCoordinate(price);
      if (x == null || y == null) return;
      const d = Math.hypot(x - px, y - py);
      if (d <= bestDist) { bestDist = d; best = tr; }
    });
  });
  return best;
}

  document.getElementById('evtCardClose').addEventListener('click', closeEventCard);
  card.classList.add('on');
  document.getElementById('evtBackdrop').classList.add('on');
  if (window.innerWidth > 760) {
    const w = 300;
    const left = Math.max(10, Math.min(clickX - w / 2, window.innerWidth - w - 10));
    card.style.left = left + 'px';
    card.style.top = Math.min(clickY + 14, window.innerHeight - 120) + 'px';
  }
  const body = document.getElementById('thermoNewsBody');
  if (!window.sbfAuth || !window.sbfAuth.isLoggedIn()) {
    body.innerHTML = `<div class="pulse-feed-lock">🔒 ${escapeHtml(t('chart.pattern_stats_locked', 'Доступно после регистрации'))}</div>`;
    return;
  }
  // GOLD: pulse_scores содержит cashtag $GOLD — это акция Barrick Gold Corp,
  // а не товар XAU/USD этого графика (та же коллизия, что уже обошли в
  // day_thermo_job._PULSE_CATEGORY для новостного фона). /api/pulse/feed для
  // GOLD подмешал бы новости про акцию в ленту по товару — используем вместо
  // этого /api/chart/news (тот же источник news_instrument_tags, без cashtag-
  // ветки), тот же формат айтемов {title,url,source,ts}, так что рендер общий.
  const newsUrl = _PULSE_FEED_SYMBOLS.has(PARAM)
    ? `/api/pulse/feed?symbol=${encodeURIComponent(PARAM)}`
    : `/api/chart/news?symbol=${encodeURIComponent(PARAM)}&from=${Math.floor(Date.now() / 1000) - 14 * 86400}&to=${Math.floor(Date.now() / 1000)}`;
  window.sbfAuth.fetch(newsUrl)
    .then(r => r.json())
    .then(items => {
      if (!Array.isArray(items) || !items.length) { body.innerHTML = `<div class="pulse-feed-lock">—</div>`; return; }
      // /api/pulse/feed сортирует по убыванию ts, /api/chart/news — по возрастанию
      // (окно всплеска, там порядок не важен) — сортируем сами, чтобы не зависеть
      // от конвенции конкретного источника.
      const sorted = items.slice().sort((a, b) => b.ts - a.ts);
      body.innerHTML = sorted.slice(0, 15).map(it => `<div class="evt-item">
        <div>${it.url ? `<a href="${escapeHtml(it.url)}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>` : escapeHtml(it.title)}</div>
        <div class="evt-meta">${escapeHtml(it.source || '')} · ${fmtDaysAgo(it.ts)}</div>
      </div>`).join('');
    })
    .catch(() => { body.innerHTML = `<div class="pulse-feed-lock">—</div>`; });
}

function scrollToThermoZone() {
  if (!chart) return;
  if (!TOGGLES.zone) {
    TOGGLES.zone = true;
    document.querySelector('#tog [data-t="zone"]').classList.toggle('on', true);
    applyToggles();
  }
  try { chart.timeScale().scrollToRealTime(); } catch (e) {}
  redrawConfluenceLayer();
  const layer = document.getElementById('confluenceLayer');
  const bands = layer ? layer.querySelectorAll('.confluence-band') : [];
  bands.forEach(b => {
    b.classList.add('flash-highlight');
    setTimeout(() => b.classList.remove('flash-highlight'), 1200);
  });
}

function onThermoChipClick(key, clickX, clickY) {
  if (!_curThermo) return;
  if (key === 'vol') { openThermoHistCard('range', clickX, clickY); return; }
  if (key === 'dvol') { openThermoHistCard('dvol', clickX, clickY); return; }
  if (key === 'news') { openThermoNewsCard(clickX, clickY); return; }
  if (key === 'evt') { if (_curThermo.next_event) openEventCard([_curThermo.next_event], clickX, clickY); return; }
  if (key === 'zone') {
    scrollToThermoZone();
    // В отличие от остальных чипов, «До зоны» раньше только скроллил и
    // подсвечивал полосы на графике -- без попапа это выглядело так, будто
    // клик вообще ничего не делает (особенно если полосы вне области
    // видимости). Открываем ту же карточку зоны, что и клик по полосе на
    // графике (openZoneCard), если удаётся сопоставить её в _curConfluence.
    if (_curThermo.nearest_zone_low != null) {
      const z = _curConfluence.find(c =>
        Math.abs(c.price_low - _curThermo.nearest_zone_low) < 1e-6 &&
        Math.abs(c.price_high - _curThermo.nearest_zone_high) < 1e-6);
      if (z) openZoneCard(z, clickX, clickY);
    }
    return;
  }
}

async function refreshThermo() {
  _curThermo = null;
  try {
    const r = await fetch(`/api/chart/thermo?symbol=${encodeURIComponent(PARAM)}`);
    if (r.ok) _curThermo = await r.json();
  } catch (e) {}
  renderThermo();
}

(function initThermoCollapse() {
  const el = document.getElementById('thermo');
  const chevron = document.getElementById('thermoChevron');
  // title меняется местами со смыслом клика (свернуть/развернуть) -- держим
  // отдельно от data-i18n-title, тот выставляется только один раз при
  // _patchI18n(), а тут состояние динамическое и меняется от клика к клику.
  function syncTitle(collapsed) {
    chevron.title = collapsed
      ? t('chart.thermo_expand_title', 'Развернуть панель показателей дня')
      : t('chart.thermo_collapse_title', 'Свернуть панель показателей дня');
  }
  const collapsed = localStorage.getItem(THERMO_COLLAPSED_KEY) === '1';
  el.classList.toggle('collapsed', collapsed);
  syncTitle(collapsed);
  // t() тут же на первом вызове почти всегда попадёт на русский fallback --
  // assets/i18n.js подключён через defer и ещё не выполнился на этом месте
  // кода (см. аналогичный комментарий у _patchI18n выше). Один раз досчитываем
  // правильный текст, когда словарь готов -- как и остальной i18n на странице.
  (window.sbfI18n
    ? window.sbfI18n.ready
    : new Promise(res => document.addEventListener('DOMContentLoaded', () =>
        (window.sbfI18n ? window.sbfI18n.ready : Promise.resolve()).then(res)))
  ).then(() => syncTitle(el.classList.contains('collapsed')));
  chevron.addEventListener('click', () => {
    const next = !el.classList.contains('collapsed');
    el.classList.toggle('collapsed', next);
    syncTitle(next);
    localStorage.setItem(THERMO_COLLAPSED_KEY, next ? '1' : '0');
  });
})();

// Живой countdown в чипе события — обновляем текст раз в 30с без рефетча данных.
setInterval(() => { if (_curThermo) renderThermo(); }, 30000);

// ── Главный рендер «Наш» ───────────────────────────────────────────────────
async function drawOurs(tf) {
  curTF = tf;
  // По умолчанию ON на M30/H1, OFF на H4+ (см. спеку Фазы 3) — пересчитывается
  // заново при каждой смене TF, ручной выбор пользователя между TF не хранится.
  TOGGLES.news = (tf === 'M30' || tf === 'H1');
  document.querySelector('#tog [data-t="news"]').classList.toggle('on', TOGGLES.news);
  // Зоны внимания: ON на H1-D1, OFF на M30 (шум) и W1 (масштаб) — см. Фаза 2 спеки.
  TOGGLES.zone = !(tf === 'M30' || tf === 'W1');
  document.querySelector('#tog [data-t="zone"]').classList.toggle('on', TOGGLES.zone);
  // Сессионная карта: ON только на M30/H1 (см. Layer3 Фаза2 — на H4+/D1/W1 сутки
  // сжаты слишком сильно, полосы сессий были бы неразличимы).
  TOGGLES.sess = (tf === 'M30' || tf === 'H1');
  document.querySelector('#tog [data-t="sess"]').classList.toggle('on', TOGGLES.sess);
  _curData = await SBFGrafik.loadBars(PARAM, tf);
  // Дождаться словаря i18n (если он есть) ДО построения текста — на первом
  // рендере этот async-код стартует раньше defer-скриптов (см. секцию i18n
  // выше); loadBars() — сетевой запрос, поэтому к этому моменту window.sbfI18n
  // уже обычно назначен, но его словарь (ready) может ещё грузиться.
  if (window.sbfI18n && window.sbfI18n.ready) { try { await window.sbfI18n.ready; } catch(e){} }
  const m = _curData.meta;

  // Шапка
  document.getElementById('sym').textContent = m.label + ' · ' + m.interval;
  const pxEl = document.getElementById('px');
  pxEl.textContent = m.last != null ? fmtPrice(m.last) : '—';

  // ВАЖНО: biasStr приходит из API/grafik-engine.js (SBFGrafik.calcBias) и
  // ВСЕГДА на русском (см. calcBias — возвращает 'бычья'/'медвежья'/'нейтр'
  // независимо от языка страницы; тот же движок используется index.html,
  // который матчит те же 'быч'/'медвеж' подстроки). Поэтому сравнение ниже
  // НЕ трогаем — переводим только то, что реально показываем пользователю.
  const biasStr = m.bias || SBFGrafik.calcBias(_curData.bars);
  const biasEl = document.getElementById('bias');
  biasEl.textContent = biasStr.includes('быч') ? t('home.bias_bull_short','бычья') : biasStr.includes('медвеж') ? t('home.bias_bear_short','медвежья') : t('home.bias_neutr_short','нейтр');
  biasEl.className = 'bias ' + (biasStr.includes('быч') ? 'bull' : biasStr.includes('медвеж') ? 'bear' : 'flat');

  const rsiVal = m.rsi != null ? m.rsi : SBFGrafik.calcRSI14(_curData.bars);
  document.getElementById('rsi').textContent = rsiVal != null ? rsiVal : '—';

  const near = m.nearest || SBFGrafik.nearestPivot(m.last, SBFGrafik.calcPivots(_curData.bars));
  document.getElementById('near').textContent = near
    ? `${near.name} ${fmtPrice(near.price)} (${near.dist_pct > 0 ? '+' : ''}${near.dist_pct}%)`
    : '—';

  document.getElementById('explain').innerHTML = buildExplain(
    {...m, rsi: rsiVal}, near
  );

  // Инициализация LightweightCharts
  if (chart) { try { chart.remove(); } catch(e){} }
  document.getElementById('chart').innerHTML = '';
  chart = LightweightCharts.createChart(document.getElementById('chart'), {
    autoSize: true,
    localization: {locale:'en'},
    layout: {background:{type:'solid',color:'#FFFFFF'}, textColor:'#2B2B33', fontFamily:'JetBrains Mono'},
    grid: {vertLines:{color:'#F0E9DA'}, horzLines:{color:'#F0E9DA'}},
    rightPriceScale: {borderColor:'#E7DFCF'},
    timeScale: {borderColor:'#E7DFCF', timeVisible: tf==='M30'||tf==='H1'||tf==='H4', rightOffset:6},
    crosshair: {mode: LightweightCharts.CrosshairMode.Normal,
      vertLine:{color:'#C9A227', labelBackgroundColor:'#C9A227'},
      horzLine:{color:'#C9A227', labelBackgroundColor:'#C9A227'}},
  });
  // Без явного priceFormat Lightweight Charts берёт дефолт precision:2 —
  // ось цены, ценовые линии (R2/R1/PP/S1/S2) и крестик показывали 1.14 для
  // EURUSD вместо 1.1438, и несколько РАЗНЫХ уровней визуально схлопывались
  // в одно и то же "1.14". Precision по порядку цены: форекс-мажоры вроде
  // EURUSD (<10) нужен пипс = 4-й знак, JPY-пары/сырьё/VIX (10-1000) — 2-3,
  // индексы/крипта/золото (>=1000) — 1-2. Точной карты по символам нет,
  // магнитудная эвристика — простой и достаточно надёжный прокси.
  const _refPx = Math.abs(m && m.last != null ? m.last : (_curData.lw.length ? _curData.lw[_curData.lw.length-1].close : 1));
  const _pxPrecision = _refPx < 10 ? 4 : _refPx < 1000 ? 2 : 1;
  candleSeries = chart.addCandlestickSeries({
    upColor:'#1e8e5a', downColor:'#c0392b', borderVisible:false,
    wickUpColor:'#1e8e5a', wickDownColor:'#c0392b',
    priceFormat: {type:'price', precision:_pxPrecision, minMove: 1/Math.pow(10,_pxPrecision)}
  });
  candleSeries.setData(_curData.lw);
  lastCandle = _curData.lw.length ? Object.assign({}, _curData.lw[_curData.lw.length-1]) : null;

  // Объём
  const vol = chart.addHistogramSeries({priceFormat:{type:'volume'}, priceScaleId:'vol'});
  chart.priceScale('vol').applyOptions({scaleMargins:{top:0.86, bottom:0}});
  vol.setData(_curData.volume);

  // Последние ~120 баров, история доступна прокруткой — если пришли по
  // ссылке из отчёта (focus=today, SBF_Charts_Layer4_Spec Ф3), сужаем до
  // "сегодня + вчера" по реальным меткам времени баров (не фиксированным
  // числом баров — надёжнее на FX-парах с гэпами по выходным).
  const n = _curData.lw.length;
  let visFrom = Math.max(0, n - 120);
  if (FOCUS_TODAY) {
    const dayStart = Math.floor(Date.now() / 86400000) * 86400 - 86400; // начало вчера, UTC
    const idx = _curData.lw.findIndex(b => barTimeToUnix(b.time) >= dayStart);
    if (idx >= 0) visFrom = idx;
  }
  chart.timeScale().setVisibleLogicalRange({from: visFrom, to: n+6});

  // Исторические S/R-уровни (Layer 2, Фаза 1) + паттерны (Фаза 3) — до
  // applyToggles(), т.к. их рендер идёт оттуда же.
  await refreshLevels();
  await refreshPatterns(tf);

  // Слои (пивоты/паттерны/SMC/уровни)
  applyToggles();

  // События календаря (Фаза 1) + новостные всплески (Фаза 3) — по одному фетчу
  // на symbol/tf каждый.
  setupEventLayerObservers();
  setupLevelClickHandler();
  await refreshEvents(tf);
  await refreshNewsBursts(tf);
  await refreshConfluence();
  redrawConfluenceLayer();
  await refreshSessions();
  redrawSessionLayer();
  await refreshThermo();
  await refreshSentimentPanel();
  await refreshMyTrades();
  redrawTradesLayer();
}

// ── Живая цена ─────────────────────────────────────────────────────────────
function applyLive(price) {
  if (price == null) return;
  const pxEl = document.getElementById('px');
  const prev = parseFloat(pxEl.textContent.replace(/,/g,''));
  pxEl.textContent = fmtPrice(price);
  if (!isNaN(prev) && price !== prev) flash(pxEl, price > prev);
  if (lastCandle && candleSeries) {
    lastCandle.close = price;
    lastCandle.high  = Math.max(lastCandle.high, price);
    lastCandle.low   = Math.min(lastCandle.low,  price);
    candleSeries.update(lastCandle);
  }
}

async function pollQuotes() {
  try {
    const q = await (await fetch('./data/quotes.json?t='+Date.now())).json();
    const sym = YF[PARAM];
    if (q.quotes && q.quotes[sym]) applyLive(q.quotes[sym].price);
  } catch(e){}
}

function startCryptoWS() {
  if (!BYBIT[PARAM]) return false;
  try {
    ws = new WebSocket('wss://stream.bybit.com/v5/public/spot');
    ws.onopen = () => ws.send(JSON.stringify({op:'subscribe', args:['tickers.'+BYBIT[PARAM]]}));
    ws.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.topic && m.data && m.data.lastPrice) applyLive(parseFloat(m.data.lastPrice));
    };
    return true;
  } catch(e) { return false; }
}
function stopWS() { if (ws) { try { ws.close(); } catch(e){}; ws = null; } }

// ── Переключение ────────────────────────────────────────────────────────────
async function render(tf) {
  await drawOurs(tf);
}

document.getElementById('tf').addEventListener('click', e => {
  if (!e.target.dataset.tf) return;
  document.querySelectorAll('#tf button').forEach(x => x.classList.remove('on'));
  e.target.classList.add('on');
  render(e.target.dataset.tf);
});

document.getElementById('tog').addEventListener('click', e => {
  if (!e.target.dataset.t) return;
  const t = e.target.dataset.t;
  TOGGLES[t] = !TOGGLES[t];
  e.target.classList.toggle('on', TOGGLES[t]);
  if (t === 'evt') localStorage.setItem('sbf_chart_evt', TOGGLES.evt ? '1' : '0');
  if (t === 'lvl') localStorage.setItem('sbf_chart_lvl', TOGGLES.lvl ? '1' : '0');
  // SBF_Charts_Layer4_Spec, Фаза 1.4: зеркалим в user_prefs.chart_layers для
  // залогиненных — вход с нового устройства восстановит настройку. Только
  // evt/lvl — единственные ДЕЙСТВИТЕЛЬНО персистентные тогглы в этом файле
  // (zone/news/sess пересчитываются заново на каждый TF по спекам Layer2/3
  // Фаза 2/3 — намеренно TF-зависимы без persistence, синхронизировать в
  // user_prefs было бы тихим нарушением ИХ acceptance-критериев).
  if ((t === 'evt' || t === 'lvl') && window.sbfAuth && window.sbfAuth.isLoggedIn()) {
    window.sbfAuth.fetch('/api/user/chart-prefs', {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({layers: {evt: TOGGLES.evt, lvl: TOGGLES.lvl}}),
    }).catch(() => {});
  }
  applyToggles();
  redrawEventLayer();
  redrawNewsLayer();
  redrawConfluenceLayer();
  redrawSessionLayer();
  renderHeatStrip();
});

function _reportHeight() {
  if (window.parent !== window)
    window.parent.postMessage({type:'sbf-chart-height', h: document.body.scrollHeight}, '*');
}

// ── Старт ───────────────────────────────────────────────────────────────────
const _initialTF = FOCUS_TODAY ? _focusTodayTF() : 'D1';
if (FOCUS_TODAY) {
  document.querySelectorAll('#tf .tf').forEach(b => b.classList.toggle('on', b.dataset.tf === _initialTF));
}
render(_initialTF).then(() => {
  if (!startCryptoWS()) { pollQuotes(); setInterval(pollQuotes, 8000); }
  SBFGrafik.chartFullscreenButton(document.querySelector('.card'));
  _reportHeight();
});

// SBF_Charts_Layer4_Spec, Фаза 1.2.3: запомнить текущий инструмент как
// последний просмотренный (fire-and-forget, не блокирует рендер графика).
// _sbfLoadUserContext (sbf-header.js) может ещё не отработать в момент
// загрузки страницы — ждём sbf:user-ready, а не проверяем isLoggedIn() сразу.
document.addEventListener('sbf:user-ready', ev => {
  if (!ev.detail) return; // анонимный визитёр
  window.sbfAuth.fetch('/api/user/chart-prefs', {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({last_symbol: PARAM}),
  }).catch(() => {});
});

// SBF_Charts_Layer4_Spec, Фаза 1.4: восстановить сохранённые тогглы evt/lvl
// с сервера (вход с нового устройства) — localStorage уже применён к TOGGLES
// синхронно при определении начального состояния (см. `const TOGGLES =` выше),
// но серверная версия для залогиненного пользователя имеет приоритет, раз уж
// она пришла позже первого рендера — перерисовываем задетые слои, не весь график.
document.addEventListener('sbf:user-ready', ev => {
  if (!ev.detail) return;
  const raw = ev.detail.prefs && ev.detail.prefs.chart_layers;
  if (!raw) return;
  let saved;
  try { saved = JSON.parse(raw); } catch (e) { return; }
  let changed = false;
  if (typeof saved.evt === 'boolean' && saved.evt !== TOGGLES.evt) {
    TOGGLES.evt = saved.evt;
    localStorage.setItem('sbf_chart_evt', TOGGLES.evt ? '1' : '0');
    changed = true;
  }
  if (typeof saved.lvl === 'boolean' && saved.lvl !== TOGGLES.lvl) {
    TOGGLES.lvl = saved.lvl;
    localStorage.setItem('sbf_chart_lvl', TOGGLES.lvl ? '1' : '0');
    changed = true;
  }
  if (!changed) return;
  document.querySelector('#tog [data-t="evt"]').classList.toggle('on', TOGGLES.evt);
  document.querySelector('#tog [data-t="lvl"]').classList.toggle('on', TOGGLES.lvl);
  applyToggles();
  redrawEventLayer();
});

// SBF_Charts_Layer4_Spec, Фаза 2: drawOurs() на первом рендере мог отработать
// ДО того, как auth-контекст пришёл (sbf:user-ready асинхронный) — тогда
// _curMyTrades осталась бы пустой навсегда для только что вошедшего
// пользователя без перезагрузки. Досчитываем при готовности контекста.
document.addEventListener('sbf:user-ready', async ev => {
  await refreshMyTrades();
  redrawTradesLayer();
});
</script>
