  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{max-width:100vw;overflow-x:hidden;scroll-behavior:smooth}
    body{background:#fff;font-family:'DM Sans',system-ui,sans-serif;color:#18181a}
    #sbf-book-root{min-height:100vh}
    .back-to-edu{
      position:fixed;bottom:20px;right:20px;z-index:500;
      background:#18181a;color:rgba(255,255,255,0.6);
      font-family:'DM Sans',sans-serif;font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;
      padding:7px 13px;text-decoration:none;transition:all .2s;
      border:1px solid rgba(255,255,255,0.08);
    }
    .back-to-edu:hover{background:#c9973a;color:#fff}
    .messenger-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
    @media(max-width:768px){.messenger-grid{grid-template-columns:1fr}.hide-mobile{display:none!important}.g2{grid-template-columns:1fr!important}.g3{grid-template-columns:1fr!important}.g4{grid-template-columns:1fr 1fr!important}}
    @keyframes priceTick{0%{opacity:.4}50%{opacity:1}100%{opacity:.7}}
    @keyframes signalFlash{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
    @keyframes resultPop{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(201,151,58,.5)}70%{box-shadow:0 0 0 10px rgba(201,151,58,0)}100%{box-shadow:0 0 0 0 rgba(201,151,58,0)}}
  </style>
</head>

// ─── Interactive 1: Session Clock ─────────────────────────────────────────────
function SessionClock() {
  const { useState } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const [selected, setSelected] = useState(null); // hour 0-23 UTC
  const [feedback, setFeedback] = useState(null);

  // Sessions in UTC hours
  const sessions = [
    { name:S.clockCityTokyo,  start:0,  end:9,  color:"#7c3aed", score:"low",    msk:S.clockMskTokyo },
    { name:S.clockCityLondon, start:8,  end:17, color:"#2563eb", score:"peak",   msk:S.clockMskLondon },
    { name:S.clockCityNy,     start:13, end:22, color:"#d97706", score:"peak",   msk:S.clockMskNy },
  ];

  // Quality per hour (0-23 UTC)
  const hourQuality = [
    1,1,1,0,0,0,0,0,          // 0-7  Asia / dead
    3,4,5,5,5,5,               // 8-13 London open → peak
    5,5,5,5,5,4,4,             // 14-20 NY overlap
    3,2,1,1,                   // 21-23 close
  ];

  const qualColor = (q) => q===5?"#2ecc71":q===4?"#f59e0b":q===3?"#d97706":q===2?"rgba(255,255,255,0.3)":"rgba(255,255,255,0.1)";
  const qualLabel = (q) => q===5?S.qualPeak:q===4?S.qualGood:q===3?S.qualModerate:q===2?S.qualWeak:S.qualNone;

  const R = 130, r = 76, CX = 160, CY = 160;
  const toAngle = h => (h / 24) * 360 - 90;
  const toRad   = deg => deg * Math.PI / 180;

  const arcPath = (startH, endH, radius) => {
    const a1 = toRad(toAngle(startH));
    const a2 = toRad(toAngle(endH));
    const x1 = CX + radius * Math.cos(a1), y1 = CY + radius * Math.sin(a1);
    const x2 = CX + radius * Math.cos(a2), y2 = CY + radius * Math.sin(a2);
    const large = (endH - startH) > 12 ? 1 : 0;
    return `M${x1},${y1} A${radius},${radius} 0 ${large},1 ${x2},${y2}`;
  };

  const handleHourClick = (h) => {
    setSelected(h);
    const q = hourQuality[h];
    if (q >= 4) {
      setFeedback({
        type:"success",
        msg:`${S.clockFbSuccessLead} ${h}:00 UTC (${h+3}:00 ${S.mskAbbrev}) — ${qualLabel(q)}. ${S.clockCityLondon}${h>=13?S.clockFbSuccessLondonNy:""} ${S.clockFbSuccessTail}`
      });
    } else if (q === 3) {
      setFeedback({
        type:"warn",
        msg:`${S.clockFbWarnLead} ${h}:00 UTC ${S.clockFbWarnMid} ${h<8?"08:00":"14:00"} ${S.clockFbWarnTail}`
      });
    } else {
      setFeedback({
        type:"error",
        msg:`${S.clockFbErrorLead} ${h}:00 UTC — ${qualLabel(q)}. ${S.clockFbErrorTail}`
      });
    }
  };

  return (
    <div style={{background:C.black,borderRadius:8,padding:"36px 40px",color:C.white}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
        <span style={{fontSize:28}}>⏱️</span>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.gold}}>{S.clockTitle}</div>
          <Mono size={11} color="rgba(255,255,255,0.4)" spacing={2}>{S.clockTag}</Mono>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"320px 1fr",gap:36,alignItems:"start"}} className="g2">

        {/* Clock SVG */}
        <div>
          <div style={{textAlign:"center",marginBottom:10}}>
            <Mono size={10} color="rgba(255,255,255,0.3)" spacing={1}>{S.clockPickHour}</Mono>
          </div>
          <svg viewBox="0 0 320 320" style={{width:"100%",display:"block"}}>
            <circle cx={CX} cy={CY} r={R+16} fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>

            {/* Session arcs */}
            {sessions.map((s,i) => (
              <path key={i}
                d={arcPath(s.start, s.end, R+8)}
                fill="none" stroke={s.color} strokeWidth="12" strokeLinecap="butt" opacity="0.35"/>
            ))}

            {/* Hour segments */}
            {Array.from({length:24},(_,h) => {
              const a1 = toRad(toAngle(h));
              const a2 = toRad(toAngle(h+0.85));
              const x1=CX+r*Math.cos(a1), y1=CY+r*Math.sin(a1);
              const x2=CX+R*Math.cos(a1), y2=CY+R*Math.sin(a1);
              const x3=CX+R*Math.cos(a2), y3=CY+R*Math.sin(a2);
              const x4=CX+r*Math.cos(a2), y4=CY+r*Math.sin(a2);
              const q = hourQuality[h];
              const isSelected = selected===h;
              return (
                <path key={h}
                  d={`M${x1},${y1} L${x2},${y2} L${x3},${y3} L${x4},${y4} Z`}
                  fill={isSelected?"#fff":qualColor(q)}
                  stroke="rgba(0,0,0,0.3)" strokeWidth="1"
                  style={{cursor:"pointer",transition:"fill .15s"}}
                  onClick={()=>handleHourClick(h)}/>
              );
            })}

            {/* Hour labels */}
            {[0,3,6,9,12,15,18,21].map(h => {
              const a = toRad(toAngle(h));
              const lx = CX + (r-18)*Math.cos(a), ly = CY + (r-18)*Math.sin(a);
              return <text key={h} x={lx} y={ly+4} fontSize="11" fill="rgba(255,255,255,0.35)" textAnchor="middle" fontFamily="monospace">{h}</text>;
            })}

            {/* Center */}
            <circle cx={CX} cy={CY} r={r-2} fill={C.chart}/>
            <text x={CX} y={CY-8}  fontSize="11" fill="rgba(255,255,255,0.5)" textAnchor="middle" fontFamily="monospace">XAU/USD</text>
            <text x={CX} y={CY+8}  fontSize="13" fill={C.gold} textAnchor="middle" fontFamily="'DM Serif Display',serif">{S.clockCenterLabel}</text>
            {selected!==null && (
              <text x={CX} y={CY+24} fontSize="11" fill="#fff" textAnchor="middle" fontFamily="monospace">{selected}:00 UTC</text>
            )}
          </svg>

          {/* Legend */}
          <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center",marginTop:8}}>
            {[{c:"#2ecc71",l:S.legendPeak},{c:"#f59e0b",l:S.legendGood},{c:"#d97706",l:S.legendModerate},{c:"rgba(255,255,255,0.15)",l:S.legendWeak}].map((lg,i)=>(
              <div key={i} style={{display:"flex",gap:5,alignItems:"center",fontSize:11,color:"rgba(255,255,255,0.5)"}}>
                <div style={{width:10,height:10,borderRadius:2,background:lg.c}}/>
                {lg.l}
              </div>
            ))}
          </div>
        </div>

        {/* Right panel */}
        <div>
          {/* Sessions list */}
          <div style={{marginBottom:20}}>
            <Mono size={10} color="rgba(255,255,255,0.3)" spacing={1} style={{display:"block",marginBottom:12}}>{S.clockSessionsLabel}</Mono>
            {sessions.map((s,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",marginBottom:8,background:"rgba(255,255,255,0.04)",borderRadius:4,border:`1px solid rgba(255,255,255,0.06)`,borderLeft:`3px solid ${s.color}`}}>
                <div>
                  <span style={{fontWeight:700,fontSize:13,color:s.color}}>{s.name}</span>
                  <span style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginLeft:8}}>{s.msk}</span>
                </div>
                <Chip color={s.score==="peak"?C.gold:"rgba(255,255,255,0.2)"}>{s.score==="peak"?S.chipPeak:S.chipLow}</Chip>
              </div>
            ))}
            <div style={{padding:"10px 14px",background:"rgba(201,151,58,0.08)",borderRadius:4,border:`1px solid rgba(201,151,58,0.2)`,borderLeft:`3px solid ${C.gold}`}}>
              <span style={{fontWeight:700,fontSize:13,color:C.gold}}>{S.clockOverlapTitle}</span>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginLeft:8}}>{S.clockOverlapRange}</span>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginTop:4}}>{S.clockOverlapDesc}</div>
            </div>
          </div>

          {/* Volatility heatmap */}
          <div style={{marginBottom:20}}>
            <Mono size={10} color="rgba(255,255,255,0.3)" spacing={1} style={{display:"block",marginBottom:8}}>{S.clockVolatilityLabel}</Mono>
            <div style={{display:"grid",gridTemplateColumns:"repeat(12,1fr)",gap:2}}>
              {hourQuality.map((q,h)=>(
                <div key={h} title={`${h}:00 UTC`}
                  style={{height:28,borderRadius:2,background:qualColor(q),cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"transform .1s"}}
                  onClick={()=>handleHourClick(h)}
                  onMouseEnter={e=>e.currentTarget.style.transform="scaleY(1.15)"}
                  onMouseLeave={e=>e.currentTarget.style.transform="scaleY(1)"}>
                  <span style={{fontSize:8,color:"rgba(0,0,0,0.5)",fontFamily:"monospace"}}>{h}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Feedback */}
          {feedback ? (
            <div style={{padding:"16px 20px",borderRadius:6,background:feedback.type==="success"?"rgba(45,122,79,0.15)":feedback.type==="warn"?"rgba(217,119,6,0.15)":"rgba(192,57,43,0.15)",border:`1px solid ${feedback.type==="success"?C.greenD:feedback.type==="warn"?"#d97706":C.redD}`,animation:"resultPop .3s ease"}}>
              <div style={{fontSize:13,color:feedback.type==="success"?"#2ecc71":feedback.type==="warn"?"#f59e0b":"#e74c3c",lineHeight:1.7}}>{feedback.msg}</div>
            </div>
          ) : (
            <div style={{padding:"16px 20px",borderRadius:4,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.07)",fontSize:12,color:"rgba(255,255,255,0.3)",textAlign:"center"}}>
              {S.clockHint}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Interactive 2: Live Scalping Simulator ───────────────────────────────────
function ScalpingSimulator() {
  const { useState, useEffect, useRef, useMemo, useCallback } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  const W = 720, H = 300;
  const RSI_H = 70;
  const PAD = {l:48, r:16, t:12, b:24};
  const N = 60; // visible bars

  // EMA calculation
  const calcEMA = (arr, p) => {
    const k = 2/(p+1);
    const res = new Array(arr.length).fill(null);
    let s = 0, cnt = 0;
    for (let i=0; i<arr.length; i++) {
      s += arr[i]; cnt++;
      if (cnt >= p) { res[i] = cnt===p ? s/p : arr[i]*k + res[i-1]*(1-k); }
    }
    return res;
  };

  // RSI calculation
  const calcRSI = (closes, p=14) => {
    const res = new Array(closes.length).fill(null);
    if (closes.length < p+1) return res;
    let avgG=0, avgL=0;
    for (let i=1; i<=p; i++) { const d=closes[i]-closes[i-1]; d>0?avgG+=d:avgL-=d; }
    avgG/=p; avgL/=p;
    res[p] = avgL===0 ? 100 : 100-100/(1+avgG/avgL);
    for (let i=p+1; i<closes.length; i++) {
      const d=closes[i]-closes[i-1];
      const g=d>0?d:0, l=d<0?-d:0;
      avgG=(avgG*(p-1)+g)/p; avgL=(avgL*(p-1)+l)/p;
      res[i] = avgL===0 ? 100 : 100-100/(1+avgG/avgL);
    }
    return res;
  };

  // Seed price series (realistic M5 XAU/USD)
  const seedPrices = useRef((() => {
    let p = 2510;
    return Array.from({length:120}, () => {
      p += (Math.random()-0.49)*2.2;
      return Math.round(p*100)/100;
    });
  })());

  const [bars, setBars]         = useState(seedPrices.current.slice(0,N));
  const [running, setRunning]   = useState(false);
  const [position, setPosition] = useState(null); // {entry, time}
  const [results, setResults]   = useState([]);   // [{pnl, type}]
  const [signal, setSignal]     = useState(null); // 'buy'|null
  const [feedback, setFeedback] = useState(null);
  const [streak, setStreak]     = useState(0);
  const intervalRef = useRef(null);
  const barIndexRef = useRef(N);
  const posRef = useRef(null);

  // Keep posRef in sync
  useEffect(() => { posRef.current = position; }, [position]);

  const addBar = useCallback(() => {
    setBars(prev => {
      const idx = barIndexRef.current;
      let newClose;
      if (idx < seedPrices.current.length) {
        newClose = seedPrices.current[idx];
      } else {
        const last = prev[prev.length-1];
        newClose = Math.round((last + (Math.random()-0.49)*2.2)*100)/100;
        seedPrices.current.push(newClose);
      }
      barIndexRef.current++;
      const next = [...prev.slice(1), newClose];

      // Auto-close position by SL or TP
      if (posRef.current) {
        const pnl = Math.round((newClose - posRef.current.entry)*100)/100;
        if (pnl <= -15) {
          setResults(r => [...r, {pnl:-15, type:"sl"}]);
          setStreak(0);
          setFeedback({type:"sl", msg:S.simSlMsg});
          setPosition(null);
          setTimeout(()=>setFeedback(null), 2200);
        } else if (pnl >= 5) {
          setResults(r => [...r, {pnl:5, type:"tp"}]);
          setStreak(s => s+1);
          setFeedback({type:"tp", msg:S.simTpMsg});
          setPosition(null);
          setTimeout(()=>setFeedback(null), 2200);
        }
      }
      return next;
    });
  }, []);

  useEffect(() => {
    if (running) { intervalRef.current = setInterval(addBar, 600); }
    else         { clearInterval(intervalRef.current); }
    return () => clearInterval(intervalRef.current);
  }, [running, addBar]);

  // Compute indicators
  const closes = bars;
  const ema9  = useMemo(() => calcEMA(closes, 9),  [closes]);
  const ema21 = useMemo(() => calcEMA(closes, 21), [closes]);
  const rsi   = useMemo(() => calcRSI(closes, 14), [closes]);

  // Signal detection: EMA9 crosses above EMA21 + RSI comes out of 35
  const lastRsi = rsi[rsi.length-1];
  const prevRsi = rsi[rsi.length-2];
  const lastE9  = ema9[ema9.length-1];
  const prevE9  = ema9[ema9.length-2];
  const lastE21 = ema21[ema21.length-1];
  const prevE21 = ema21[ema21.length-2];
  const hasSignal = useMemo(() => {
    if (!lastE9||!prevE9||!lastE21||!prevE21||!lastRsi||!prevRsi) return false;
    const emaCross = prevE9 <= prevE21 && lastE9 > lastE21;
    const rsiConfirm = prevRsi < 35 && lastRsi >= 35;
    return emaCross || rsiConfirm;
  }, [lastE9,prevE9,lastE21,prevE21,lastRsi,prevRsi]);

  useEffect(() => {
    if (hasSignal && !position && running) setSignal("buy");
    else if (position) setSignal(null);
  }, [hasSignal, position, running]);

  const handleBuy = () => {
    if (position || !running) return;
    const entry = closes[closes.length-1];
    setPosition({entry, time: closes.length});
    setSignal(null);
    setFeedback({type:"open", msg:`${S.simOpenPrefix} ${entry}. SL: ${Math.round((entry-15)*100)/100} / TP: ${Math.round((entry+5)*100)/100}`});
    setTimeout(()=>setFeedback(null), 2000);
  };

  const handleManualClose = () => {
    if (!position) return;
    const entry = position.entry;
    const exit = closes[closes.length-1];
    const pnl = Math.round((exit-entry)*100)/100;
    setResults(r => [...r, {pnl, type:"manual"}]);
    if (pnl > 0) setStreak(s=>s+1); else setStreak(0);
    setFeedback({type:pnl>=0?"tp":"sl", msg:`${pnl>=0?S.simClosedProfit:S.simClosedLoss}: ${pnl>0?"+":""}${pnl} ${S.unitPct}`});
    setPosition(null);
    setTimeout(()=>setFeedback(null), 2000);
  };

  const reset = () => {
    setRunning(false); setPosition(null); setResults([]);
    setSignal(null); setFeedback(null); setStreak(0);
    barIndexRef.current = N;
    setBars(seedPrices.current.slice(0,N));
  };

  // Chart math
  const visMin = Math.min(...closes)*0.9995;
  const visMax = Math.max(...closes)*1.0005;
  const CW = W - PAD.l - PAD.r;
  const CH = H - PAD.t - PAD.b;
  const toX = i => PAD.l + (i/(N-1))*CW;
  const toY = v => PAD.t + CH - ((v-visMin)/(visMax-visMin))*CH;
  const toRsiY = v => H + 8 + (RSI_H-8) - (v/100)*(RSI_H-16);

  const pricePath = closes.map((v,i)=>`${i===0?"M":"L"}${toX(i)},${toY(v)}`).join(" ");
  const emaPath = (arr,skip=0) => {
    let d="";
    arr.forEach((v,i)=>{ if(v!==null&&i>skip) d+=`${d===""||arr[i-1]===null?"M":"L"}${toX(i)},${toY(v)}`; });
    return d;
  };
  const rsiPath = rsi.map((v,i)=>v!==null?`${rsi[i-1]===null||i===0?"M":"L"}${toX(i)},${toRsiY(v)}`:"").filter(Boolean).join(" ");

  // Stats
  const totalPnl = results.reduce((s,r)=>s+r.pnl,0);
  const wins = results.filter(r=>r.pnl>0).length;
  const wr = results.length ? Math.round(wins/results.length*100) : 0;
  const curPrice = closes[closes.length-1];
  const curPnl = position ? Math.round((curPrice-position.entry)*100)/100 : null;

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"36px 40px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:28}}>⚔️</span>
          <div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black}}>{S.simTitle}</div>
            <Mono size={11} color={C.inkSoft} spacing={2}>{S.simTag}</Mono>
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          {/* Stats */}
          <div style={{display:"flex",gap:12,fontFamily:"monospace",fontSize:12,alignItems:"center"}}>
            <span style={{color:totalPnl>=0?C.greenD:C.redD,fontWeight:700}}>{totalPnl>=0?"+":""}{Math.round(totalPnl*100)/100} {S.unitPct}</span>
            <span style={{color:C.inkSoft}}>{wins}W/{results.length-wins}L</span>
            <span style={{color:C.inkMid}}>WR {wr}%</span>
            {streak>1 && <span style={{color:C.gold}}>🔥{streak}</span>}
          </div>
          <button onClick={reset} style={{padding:"7px 14px",background:"transparent",border:`1px solid ${C.border}`,color:C.inkMid,cursor:"pointer",fontFamily:"monospace",fontSize:11,borderRadius:3}}>{S.simResetBtn}</button>
          <button onClick={()=>setRunning(r=>!r)}
            style={{padding:"9px 18px",background:running?C.black:C.greenD,color:"#fff",border:"none",cursor:"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:1,fontWeight:700,borderRadius:3}}>
            {running?S.simPauseBtn:S.simStartBtn}
          </button>
        </div>
      </div>

      {/* Signal alert */}
      {signal && !position && (
        <div style={{background:"rgba(201,151,58,0.12)",border:`2px solid ${C.gold}`,borderRadius:4,padding:"10px 16px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",animation:"pulseRing 1s infinite"}}>
          <span style={{fontSize:13,fontWeight:700,color:C.gold}}>{S.simSignalAlert}</span>
          <button onClick={handleBuy} style={{padding:"8px 18px",background:C.gold,color:C.black,border:"none",cursor:"pointer",fontFamily:"monospace",fontSize:12,fontWeight:700,borderRadius:3,animation:"signalFlash .6s ease infinite"}}>
            BUY NOW
          </button>
        </div>
      )}

      {/* Position bar */}
      {position && (
        <div style={{background:curPnl>=0?"rgba(45,122,79,0.1)":"rgba(192,57,43,0.1)",border:`1px solid ${curPnl>=0?C.greenD:C.redD}`,borderRadius:4,padding:"10px 16px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:curPnl>=0?C.greenD:C.redD,fontFamily:"monospace",fontWeight:700}}>
            {S.simPositionPrefix} {position.entry} → {curPrice} {S.simPositionMid} {curPnl>=0?"+":""}{curPnl} {S.unitPct}
          </span>

<script>
// Скрипт для конвертации UTC времени в локальное время пользователя
document.addEventListener('DOMContentLoaded', function() {
    var _pageLang = "{{ lang }}";
    var _intlLocale = _pageLang === 'ro' ? 'ro-RO' : 'ru-RU';
    const utcTimes = document.querySelectorAll('.local-time[data-utc]');

    utcTimes.forEach(function(element) {
        // Получаем UTC время из data-utc атрибута
        var utcString = element.getAttribute('data-utc');

        try {
            // Парсим UTC дату и время
            var utcDate = new Date(utcString);

            // Конвертируем в локальное время пользователя
            var localDate = new Date(utcDate.getTime() + utcDate.getTimezoneOffset() * 60000);

            // Форматируем для отображения (например, "19:00 МСК")
            var hours = String(localDate.getHours()).padStart(2, '0');
            var minutes = String(localDate.getMinutes()).padStart(2, '0');
            var timeZoneName = Intl.DateTimeFormat(_intlLocale, { timeZoneName: 'long' }).format(localDate);
            
            // Обновляем текст элемента с локальным временем
            element.innerHTML = '<span class="local-time-display">' + hours + ':' + minutes + ' ' + timeZoneName.replace(/\s/g, '') + '</span>';
        } catch (e) {
            console.error('Ошибка конвертации времени:', e);
        }
    });
});
</script>
