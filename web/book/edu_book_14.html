function fillTemplate(str, vars) {
  if (!str) return str;
  return str.replace(/\{\{(\w+)\}\}/g, (m, key) => {
    const v = vars ? vars[key] : undefined;
    if (v === undefined || v === null || (typeof v === "number" && isNaN(v))) {
      console.error("[ch14] отсутствует значение для {{" + key + "}}");
      return "—";
    }
    return String(v);
  });
}

// ─── Хук: серия ступени 7 (глава 12) — только для счётчика в шапке ─────────
function useSeriesProgress() {
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  React.useEffect(() => {
    let alive = true;
    fetch("/api/journal/series-progress")
      .then(r => r.ok ? r.json() : null)
      .catch(() => null)
      .then(d => { if (alive) { setData(d); setLoading(false); } });
    return () => { alive = false; };
  }, []);
  return { data, loading };
}
function SeriesCounter({ progress, loading, lang }) {
  if (loading || !progress) return null;
  const goBack = () => { window.location.href = getChUrl(12, lang); };
  let label;
  if (progress.status === "done") label = "50/50 ✓";
  else if (progress.status === "in_progress") label = `${progress.trade_count} / ${progress.target}`;
  else if (progress.status === "blocked") label = lang==="ru" ? "бумага" : lang==="ro" ? "hârtie" : "paper";
  else label = lang==="ru" ? "не начата" : lang==="ro" ? "neîncepută" : "not started";
  return (
    /* Счётчик серии — переход к разделу, то есть управление. Был <div>
       с курсором: мышью работает, с клавиатуры нет. */
    <button type="button" onClick={goBack} style={{cursor:"pointer",background:"none",fontFamily:"monospace",fontSize:11.5,color:C.goldText,border:`1px solid ${C.borderGold}`,borderRadius:20,padding:"5px 14px",letterSpacing:0.5,whiteSpace:"nowrap"}}>
    {label}
    </button>
  );
}

  const [data, setData] = React.useState(null);

  React.useEffect(() => {
    let alive = true;

  return { data, loading };
}

// ─── Cold open ──────────────────────────────────────────────────────────────
// ─── Cold start: "Сколько ты платишь" (SPEC_coldstart_interactives_ch6_15.md
// §10). Заменяет ColdOpen14. Спред 0.3 и цель 5 пунктов -- те же реальные
// числа, что заданы по умолчанию в CostArithmetic ниже, не новые.
function ColdStart14Entry() {
  const T = window.Ch14Content[INITIAL_LANG] || window.Ch14Content.ru;
  const cs = T.coldStart;
  const SPREAD = 0.3, TARGET = 5, TRADING_DAYS = 252;
  return (
    <div id="secColdOpen" style={{scrollMarginTop:130}}>
      <ColdStart
        tag={cs.tag}
        ask={cs.ask}
        action={{ type: "numberInput", numberInput: { default: 10, placeholder: cs.placeholder, unit: cs.unit } }}
        reveal={(n) => {
          const annual = Math.round(SPREAD * n * TRADING_DAYS * 100) / 100;
          const equivWins = Math.round(annual / TARGET * 10) / 10;
          return fillTemplate(cs.revealTemplate, { n, annual, equivWins });
        }}
        bridge={cs.bridge}
      />
    </div>
  );
}

// ─── Арифметика издержек — главный калькулятор ─────────────────────────────
function beThreshold(target, stop, cost) {
  return (stop + cost) / (target + stop) * 100;
}

function CostArithmetic({ onCompleted }) {
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const T = window.Ch14Content[INITIAL_LANG] || window.Ch14Content.ru;
  const ca = T.costArithmetic;
  const [step, setStep] = React.useState(1);
  const [target, setTarget] = React.useState(5);
  const [stop, setStop] = React.useState(15);
  const [spread, setSpread] = React.useState(0.3);
  const [commission, setCommission] = React.useState(0);
  const [tradesPerDay, setTradesPerDay] = React.useState(10);
  const firedRef = React.useRef(false);

  const example = React.useMemo(() => ({
    before: beThreshold(5, 15, 0),
    after: beThreshold(5, 15, 0.3),
  }), []);

  const custom = React.useMemo(() => {
    const cost = Math.max(0, spread) + Math.max(0, commission);
    const t = Math.max(0.1, target), s = Math.max(0.1, stop);
    const beBefore = beThreshold(t, s, 0);
    const beAfter = beThreshold(t, s, cost);
    const costDay = cost * Math.max(0, tradesPerDay);
    const costMonth = costDay * 21;
    const leverTarget = beThreshold(t * 2, s, cost);
    const leverStop = beThreshold(t, s * (2 / 3), cost);
    const leverCost = beThreshold(t, s, cost * 0.7);
    return { beBefore, beAfter, costDay, costMonth, leverTarget, leverStop, leverCost };
  }, [target, stop, spread, commission, tradesPerDay]);

  React.useEffect(() => {
    if (step === 3 && !firedRef.current) {
      firedRef.current = true;
      fetch("/api/journal/gate-flag", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ flag_key: "risk_math_completed" }),
      }).then(() => { if (onCompleted) onCompleted(); }).catch(() => {});
    }
  }, [step]);

  return (
    <div id="secCostArithmetic" style={{marginBottom:16,scrollMarginTop:130}}>
      {step === 1 && (
        <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:8,padding:"26px 30px",marginBottom:20}}>
          <StepTag n="1" label={ca.step1Label}/>
          <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:20}}>{ca.step1Body}</p>
          <button onClick={()=>setStep(2)} style={{padding:"12px 28px",background:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:1}}>→</button>
        </div>
      )}

      {step >= 2 && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"24px 28px",marginBottom:20}}>
          <StepTag n="2" label={ca.step2Label}/>
          <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,marginBottom:16}}>{ca.step2Intro}</p>
          <div style={{display:"flex",gap:24,flexWrap:"wrap",justifyContent:"center",background:C.black,borderRadius:6,padding:"20px 24px",marginBottom:14}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:26,color:"#fff"}}>{example.before.toFixed(0)}%</div>
              <Mono size={9} color="rgba(255,255,255,0.5)" spacing={0.5}>{ca.step2BeforeLabel}</Mono>
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:26,color:C.goldText}}>{example.after.toFixed(1)}%</div>
              <Mono size={9} color="rgba(255,255,255,0.5)" spacing={0.5}>{ca.step2AfterLabel}</Mono>
            </div>
          </div>
          {step === 2 && (
            <div style={{textAlign:"center",marginTop:6}}>
              <button onClick={()=>setStep(3)} style={{padding:"11px 24px",background:C.gold,color:"#18181a",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:11.5,letterSpacing:1,fontWeight:700}}>{S.stepDo} →</button>
            </div>
          )}
        </div>
      )}

      {step >= 3 && (
        <div style={{background:C.black,borderRadius:8,padding:"28px 5vw 32px",color:"#fff",marginBottom:20}}>
          <StepTag n="3" label={ca.step3Label}/>
          <p style={{fontSize:13.5,color:"rgba(255,255,255,0.75)",lineHeight:1.7,marginBottom:20}}>{ca.step3Intro}</p>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:22}} className="g2">
            {[[ca.targetLabel,target,setTarget],[ca.stopLabel,stop,setStop],[ca.spreadLabel,spread,setSpread],[ca.commissionLabel,commission,setCommission],[ca.tradesPerDayLabel,tradesPerDay,setTradesPerDay]].map(([label,val,setter],i) => (
              <div key={i}>
                <Mono size={10} color="rgba(255,255,255,0.5)" spacing={0.5} style={{display:"block",marginBottom:6}}>{label}</Mono>
                <input type="number" aria-label={label} step={0.1} min={0} value={val} onChange={e=>setter(+e.target.value)} style={{width:"100%",padding:"9px 12px",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:4,color:"#fff",fontFamily:"monospace",fontSize:14}}/>
              </div>
            ))}
          </div>

          <div style={{display:"flex",gap:20,flexWrap:"wrap",justifyContent:"center",marginBottom:20}}>
            <div style={{textAlign:"center",minWidth:130}}>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#fff"}}>{custom.beBefore.toFixed(0)}%</div>
              <Mono size={9} color="rgba(255,255,255,0.5)" spacing={0.5}>{ca.resultBeBeforeLabel}</Mono>
            </div>
            <div style={{textAlign:"center",minWidth:130}}>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.goldText}}>{custom.beAfter.toFixed(1)}%</div>
              <Mono size={9} color="rgba(255,255,255,0.5)" spacing={0.5}>{ca.resultBeAfterLabel}</Mono>
            </div>
            <div style={{textAlign:"center",minWidth:130}}>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#fff"}}>{custom.costDay.toFixed(1)}</div>
              <Mono size={9} color="rgba(255,255,255,0.5)" spacing={0.5}>{ca.resultCostDayLabel}</Mono>
            </div>
            <div style={{textAlign:"center",minWidth:130}}>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#fff"}}>{custom.costMonth.toFixed(0)}</div>
              <Mono size={9} color="rgba(255,255,255,0.5)" spacing={0.5}>{ca.resultCostMonthLabel}</Mono>
            </div>
          </div>

          <div style={{background:"rgba(255,255,255,0.04)",borderRadius:6,padding:"16px 20px"}}>
            <Mono size={10} color={C.goldText} spacing={1} style={{display:"block",marginBottom:10,textTransform:"uppercase"}}>{ca.leversTitle}</Mono>
            <p style={{fontSize:12.5,color:"rgba(255,255,255,0.8)",lineHeight:1.7,marginBottom:8}}>{ca.leverTarget(custom.leverTarget.toFixed(0))}</p>
            <p style={{fontSize:12.5,color:"rgba(255,255,255,0.8)",lineHeight:1.7,marginBottom:8}}>{ca.leverStop(custom.leverStop.toFixed(0))}</p>
            <p style={{fontSize:12.5,color:"rgba(255,255,255,0.8)",lineHeight:1.7,marginBottom:8}}>{ca.leverCost(custom.leverCost.toFixed(0))}</p>
            <p style={{fontSize:12,color:"rgba(255,255,255,0.55)",lineHeight:1.65,fontStyle:"italic",margin:0}}>{ca.leverHours}</p>
          </div>
        </div>
      )}

      {step >= 3 && (
        <div style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"24px 28px",marginBottom:16}}>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18,color:C.black,marginBottom:14}}>{ca.reveal.title}</div>
          <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.75,marginBottom:12}}>{ca.reveal.body1}</p>
          <p style={{fontSize:14,color:C.black,fontWeight:600,lineHeight:1.75,margin:0}}>{ca.reveal.body2}</p>
        </div>
      )}

      {step >= 3 && (
        <div style={{background:C.goldPale,border:`1px dashed ${C.borderGold}`,borderRadius:6,padding:"12px 16px",marginBottom:8}}>
          <p style={{fontSize:11.5,color:C.black,margin:0}}>{ca.gateNote}</p>
        </div>
      )}
      {step >= 2 && <p style={{fontSize:11.5,color:C.inkFaint,fontStyle:"italic",marginBottom:8}}>{ca.compliance}</p>}
      {step >= 3 && (
        <a href="/chart.html?s=GOLD" target="_blank" rel="noopener" style={{fontFamily:"monospace",fontSize:12,color:C.goldText,textDecoration:"none",borderBottom:`1px dotted ${C.gold}`}}>{ca.openOnChart}</a>
      )}
    </div>
  );
}

// ─── Часы достижимости цели ────────────────────────────────────────────────
function useHourlyProfile() {
  const [state, setState] = React.useState({ loading: true, hours: null, meta: null });
  React.useEffect(() => {
    let cancelled = false;
    fetch("/data/edu_stats/hourly_profile.json")
      .then(r => r.json())
      .then(d => {
        if (cancelled) return;
        const gold = d.GOLD;
        const months = Object.keys(gold.by_period).sort();
        const latest = months[months.length - 1];
        setState({ loading: false, hours: gold.by_period[latest], meta: d._meta });
      })
      .catch(() => { if (!cancelled) setState({ loading: false, hours: null, meta: null }); });
    return () => { cancelled = true; };
  }, []);
  return state;
}

function TargetFeasibility() {
  const T = window.Ch14Content[INITIAL_LANG] || window.Ch14Content.ru;
  const tf = T.targetFeasibility;
  const { loading, hours } = useHourlyProfile();
  // [ДОПУЩЕНИЕ] Дефолт 10, не 5: на реальных данных GOLD минимальный часовой
  // медианный диапазон — 6.35pt (час 22 UTC), то есть цель 5pt достижима все
  // 23/23 измеренных часа — не иллюстрирует "окно уже, чем кажется" вообще.
  // При 10pt эффект настоящий (12/23), при 12-15pt — узкое окно вокруг
  // перекрытия Лондон-NY (часы 12,13,14 UTC), как и утверждает текст.
  const [target, setTarget] = React.useState(10);
  const [guess, setGuess] = React.useState(12);
  const [revealed, setRevealed] = React.useState(false);

  const cells = React.useMemo(() => {
    if (!hours) return [];
    const out = [];
    for (let h = 0; h < 24; h++) {
      const rec = hours[String(h)];
      if (!rec) { out.push({ h, state: "nodata" }); continue; }
      out.push({ h, state: rec.median_pts >= target ? "ok" : "notok", median: rec.median_pts });
    }
    return out;
  }, [hours, target]);

  const measured = cells.filter(c => c.state !== "nodata").length;
  const hoursOk = cells.filter(c => c.state === "ok").length;

  return (
    <div id="secTargetFeasibility" style={{marginBottom:48,scrollMarginTop:130}}>
      <p style={{fontSize:14,color:C.inkMid,lineHeight:1.78,marginBottom:14,maxWidth:820}}>{tf.intro}</p>
      <p style={{fontSize:14,color:C.inkMid,lineHeight:1.78,marginBottom:22,maxWidth:820}}>{tf.body2}</p>

      {loading ? <p style={{fontSize:12.5,color:C.inkFaint}}>…</p> : (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px",marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:16,flexWrap:"wrap"}}>
            <Mono size={10} color={C.inkFaint} spacing={0.5}>{tf.sliderLabel}</Mono>
            <input type="range" aria-label={tf.sliderLabel} min={1} max={20} step={0.5} value={target} onChange={e=>setTarget(+e.target.value)} style={{flex:1,minWidth:140}}/>
            <Mono size={13} color={C.goldText} spacing={0}>{target}</Mono>
          </div>

          {/* SPEC_charts_and_interactivity_standard.md (29.07): real class-B
              element -- reader commits a guess about the real dataset BEFORE
              seeing the grid, then sees the real outcome and how far off they
              were. The grid itself stays live afterward (class A unchanged). */}
          {!revealed ? (
            <div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:6,padding:"16px 18px"}}>
              <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6,marginBottom:12}}>{tf.predictQuestion(target)}</p>
              <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                <Mono size={10} color={C.inkFaint} spacing={0.5}>{tf.predictInputLabel}</Mono>
                <input type="number" aria-label={tf.predictInputLabel} min={0} max={23} value={guess} onChange={e=>setGuess(Math.max(0,Math.min(23,+e.target.value)))} style={{width:60,padding:"6px 8px",border:`1px solid ${C.border}`,borderRadius:4,fontFamily:"monospace",fontSize:13}}/>
                <button onClick={()=>setRevealed(true)} style={{padding:"9px 18px",background:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:11.5,letterSpacing:0.5,fontWeight:600}}>{tf.predictCta}</button>
              </div>
            </div>
          ) : (
            <React.Fragment>
              <p style={{fontSize:12.5,color:C.goldText,fontFamily:"monospace",marginBottom:14}}>{tf.predictResult(guess, hoursOk)}</p>
              <div style={{display:"grid",gridTemplateColumns:"repeat(24,1fr)",gap:3,marginBottom:12}}>
                {cells.map(c => (
                  <div key={c.h} title={`${c.h}:00 UTC${c.median!=null?` — ${c.median.toFixed(1)}pt`:""}`} style={{height:36,borderRadius:3,background: c.state==="ok" ? C.gold : c.state==="notok" ? "rgba(0,0,0,0.12)" : "rgba(0,0,0,0.04)",display:"flex",alignItems:"flex-end",justifyContent:"center",paddingBottom:2}}>
                    <Mono size={7} color={c.state==="ok" ? "#18181a" : C.inkFaint} spacing={0}>{c.h}</Mono>
                  </div>
                ))}
              </div>
              <div style={{display:"flex",gap:16,flexWrap:"wrap",marginBottom:10}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:10,height:10,borderRadius:2,background:C.gold,display:"inline-block"}}/><Mono size={9.5} color={C.inkFaint} spacing={0}>{tf.okLegend}</Mono></div>
                <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:10,height:10,borderRadius:2,background:"rgba(0,0,0,0.12)",display:"inline-block"}}/><Mono size={9.5} color={C.inkFaint} spacing={0}>{tf.notOkLegend}</Mono></div>
                <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:10,height:10,borderRadius:2,background:"rgba(0,0,0,0.04)",display:"inline-block"}}/><Mono size={9.5} color={C.inkFaint} spacing={0}>{tf.noDataLegend}</Mono></div>
              </div>
              <p style={{fontSize:13.5,color:C.black,fontWeight:600,margin:0}}>{tf.hoursOkLabel(hoursOk, measured)}</p>
            </React.Fragment>
          )}
        </div>
      )}

      {/* Три вывода из карты часов, где третий объясняет первые два. Выложенные
          разом, они дочитываются до конца и вывод теряется; по одному — каждый
          успевает сработать. Это был самый длинный кусок главы (2125 знаков). */}
      <div style={{marginBottom:16}}>
        <RevealSteps bodies={[tf.point1, tf.point2, tf.point3].filter(Boolean)}
                     lang={INITIAL_LANG} preset="layers"/>
      </div>

      <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:6,padding:"14px 18px",marginBottom:8}}>
        <p style={{fontSize:12,color:C.black,lineHeight:1.6,margin:0}}>{tf.honestPlate}</p>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <Mono size={9.5} color={C.inkFaint} spacing={0}>{tf.symbolNote}</Mono>
        <a href="/chart.html?s=GOLD" target="_blank" rel="noopener" style={{fontFamily:"monospace",fontSize:11,color:C.goldText,textDecoration:"none",borderBottom:`1px dotted ${C.gold}`}}>{tf.openOnChart}</a>
      </div>
    </div>
  );
}

      {/* 🔴 Итоги главы читались как пять пронумерованных абзацев — то есть

          : INITIAL_LANG === "ro"
          ? "Bifează ce poți explica cu propriile cuvinte chiar acum — fără să te uiți mai sus."

function LiveAccountGate({ gate, loading, mathCompletedJustNow }) {
  const T = window.Ch14Content[INITIAL_LANG] || window.Ch14Content.ru;

  const c = gate.conditions;

  const rows = [
    { ok: c.trades.ok, label: g.condTrades(c.trades.have) },
    { ok: c.weeks.ok, label: g.condWeeks(c.weeks.have) },
    { ok: c.system.ok, label: g.condSystem },
    { ok: c.math.ok, label: g.condMath },
  ];

  return (
    <div id="secGate" style={{marginBottom:48,scrollMarginTop:130}}>
      <Mono size={11} color={C.goldText} spacing={3} style={{display:"block",marginBottom:14}}>{g.tag}</Mono>
      <p style={{fontSize:14,color:C.inkMid,lineHeight:1.78,marginBottom:24,maxWidth:800}}>{g.limitParagraph}</p>

      <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:8,padding:"28px 32px"}}>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:C.black,marginBottom:12}}>{g.title}</div>
        <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,marginBottom:20}}>{g.body1}</p>

        <div style={{marginBottom:20}}>
          {rows.map((r,i) => (
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom: i<rows.length-1 ? `1px solid ${C.border}` : "none"}}>
              <span style={{width:18,height:18,borderRadius:"50%",background: r.ok ? C.gold : "transparent",border:`1.5px solid ${r.ok?C.gold:C.inkFaint}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {r.ok && <span style={{color:"#18181a",fontSize:11,fontWeight:700}}>✓</span>}
              </span>
              <span style={{fontSize:13,color:C.inkMid}}>{r.label}</span>
            </div>
          ))}
        </div>

        {!gate.all_ok ? (
          <div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:6,padding:"14px 18px"}}>
            <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6,margin:0}}>{g.blockedNote}</p>
          </div>
        ) : (
          <div>
            <div style={{fontWeight:600,fontSize:14,color:C.black,marginBottom:12}}>{g.readyTitle}</div>
            <p style={{fontSize:13,color:C.inkMid,lineHeight:1.7,marginBottom:12}}>{g.readyBody1}</p>
            <p style={{fontSize:13,color:C.inkMid,lineHeight:1.7,marginBottom:12}}>{g.readyBody2}</p>
            <p style={{fontSize:13,color:C.inkMid,lineHeight:1.7,marginBottom:16}}>{g.readyBody3}</p>

            <label style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:14,cursor:"pointer"}}>
              <input type="checkbox" checked={checked} onChange={e=>setChecked(e.target.checked)} style={{marginTop:3}}/>
              <span style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6}}>{g.checkboxLabel}</span>
            </label>
            {checked && <p style={{fontSize:12,color:C.goldText,marginBottom:14}}>{g.confirmedNote}</p>}

            {/* 🔴 Здесь была пунктирная рамка с текстом «раздел выбора
                площадки ещё не открыт — список с проверенными данными
                готовится отдельно». Данные проверены и лежат в
                partners.json; тот же список показывает глава 11 и страница
                /brokers. Обещание заменено тем, что оно обещало. */}
            <PartnerPicker limit={3} place="ch14_ladder9" errorText={g.loadError}/>
          </div>
        )}
      </div>
    </div>
  );
}
