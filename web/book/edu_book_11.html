  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{max-width:100vw;overflow-x:hidden;scroll-behavior:smooth}
    body{background:#ffffff;font-family:'DM Sans',system-ui,sans-serif;color:#18181a}
    #sbf-book-root{min-height:100vh}
    .back-to-edu{
      position:fixed;bottom:20px;right:20px;z-index:500;
      background:#18181a;color:rgba(255,255,255,0.6);
      font-family:'DM Sans',sans-serif;font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;
      padding:7px 13px;text-decoration:none;transition:all .2s;
      border:1px solid rgba(255,255,255,0.08);
    }
    .back-to-edu:hover{background:#c9973a;color:#fff}
    .messenger-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
    @media(max-width:768px){.messenger-grid{grid-template-columns:1fr}.hide-mobile{display:none!important}.g2{grid-template-columns:1fr!important}.g3{grid-template-columns:1fr!important}}

    @keyframes packetMove {
      0%   { transform: translateX(0); opacity:1; }
      85%  { transform: translateX(var(--tx)); opacity:1; }
      100% { transform: translateX(var(--tx)); opacity:0; }
    }
    @keyframes hftPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(242,54,69,0); }
      50%      { box-shadow: 0 0 0 8px rgba(242,54,69,0.3); }
    }
    @keyframes profitPop {
      0%   { opacity:0; transform:translateY(0) scale(0.7); }
      30%  { opacity:1; transform:translateY(-12px) scale(1.05); }
      80%  { opacity:1; transform:translateY(-20px) scale(1); }
      100% { opacity:0; transform:translateY(-30px) scale(0.9); }
    }
    @keyframes scanLine {
      0%   { top:0; }
      100% { top:100%; }
    }
    @keyframes blink { 50%{opacity:0} }
  </style>
</head>

// ─── Interactive 1: HFT Front-Running Animation ───────────────────────────────
function HFTSimulator() {
  const { useState, useEffect, useRef } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  const [phase, setPhase] = useState("idle"); // idle → sending → intercept → execute → done
  const [hftProfit, setHftProfit] = useState(0);
  const [totalRuns, setTotalRuns] = useState(0);
  const [packets, setPackets] = useState([]);
  const [logs, setLogs] = useState([]);
  const [userPrice, setUserPrice] = useState(200.00);
  const timerRef = useRef(null);

  const addLog = (msg, color="#fff") => setLogs(prev => [{msg, color, t: Date.now()}, ...prev].slice(0,8));

  const runSimulation = () => {
    if (phase !== "idle") return;
    const qty = 1000;
    const price = 200.00;
    setUserPrice(price);
    setPhase("sending");
    addLog(S.logSend(qty, price), "rgba(255,255,255,0.8)");

    // Phase 1: packet in transit
    setTimeout(() => {
      setPhase("intercept");
      addLog(S.logDetect, C.red);
      addLog(S.logBuyUp(qty, price), C.red);
    }, 900);

    // Phase 2: HFT executes
    setTimeout(() => {
      setPhase("execute");
      const hftBuy  = price;
      const hftSell = price + 0.05;
      const profit  = Math.round(qty * (hftSell - hftBuy) * 100) / 100;
      setHftProfit(prev => Math.round((prev + profit) * 100) / 100);
      setTotalRuns(r => r + 1);
      addLog(S.logSellBack(hftSell, profit), "#f59e0b");
    }, 1800);

    // Phase 3: User order fills at worse price
    setTimeout(() => {
      setPhase("done");
      addLog(S.logFilled(price+0.05), C.gold);
      addLog(S.logExplainer, "rgba(255,255,255,0.4)");
    }, 2700);

    setTimeout(() => setPhase("idle"), 4500);
  };

  // Animate packets
  useEffect(() => {
    if (phase === "sending" || phase === "intercept") {
      const interval = setInterval(() => {
        setPackets(prev => {
          const filtered = prev.filter(p => Date.now() - p.born < 1200);
          if (filtered.length < 6) {
            return [...filtered, {id: Date.now(), born: Date.now(), intercepted: phase === "intercept"}];
          }
          return filtered;
        });
      }, 180);
      return () => clearInterval(interval);
    } else {
      setPackets([]);
    }
  }, [phase]);

  const stateColor = phase === "intercept" || phase === "execute" ? C.red : phase === "done" ? C.gold : C.cyan;
  const stateLabel = {
    idle:S.stateIdle, sending:S.stateSending,
    intercept:S.stateIntercept, execute:S.stateExecute,
    done:S.stateDone
  }[phase];

  return (
    <div style={{background:C.chart,borderRadius:8,padding:"36px 40px",color:C.white,overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
        <span style={{fontSize:28}}>🤖</span>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.gold}}>{S.hftTitle}</div>
          <Mono size={11} color="rgba(255,255,255,0.4)" spacing={2}>{S.hftTag}</Mono>
        </div>
      </div>

      {/* Network diagram */}
      <div style={{position:"relative",height:140,marginBottom:24,borderRadius:6,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",overflow:"hidden"}}>
        {/* Scan line */}
        {(phase==="intercept"||phase==="execute") && (
          <div style={{position:"absolute",left:0,right:0,height:1,background:`linear-gradient(90deg,transparent,${C.red},transparent)`,animation:"scanLine 0.8s linear infinite",zIndex:2,opacity:0.5}}/>
        )}

        {/* Nodes */}
        {[
          {label:S.nodeYou,      sub:S.nodeYouSub,    x:"5%",  icon:"👤", color:"rgba(255,255,255,0.6)"},
          {label:S.nodeNet,sub:S.nodeNetSub,     x:"28%", icon:"🌐", color:"rgba(255,255,255,0.3)"},
          {label:S.nodeHft,     sub:S.nodeHftSub,  x:"52%", icon:"🤖", color:phase==="intercept"||phase==="execute"?C.red:"rgba(255,255,255,0.4)", pulse:phase==="intercept"||phase==="execute"},
          {label:S.nodeExch,  sub:S.nodeExchSub,    x:"75%", icon:"🏛️", color:"rgba(255,255,255,0.4)"},
          {label:S.nodeFill,sub:S.nodeFillSub,   x:"93%", icon:"✅", color:phase==="done"?C.gold:"rgba(255,255,255,0.3)"},
        ].map((n,i) => (
          <div key={i} style={{position:"absolute",left:n.x,top:"50%",transform:"translate(-50%,-50%)",textAlign:"center",zIndex:3}}>
            <div style={{
              width:44,height:44,borderRadius:"50%",
              background:n.color==="rgba(255,255,255,0.6)"?"rgba(37,99,235,0.2)":n.color===C.red?"rgba(242,54,69,0.2)":n.color===C.gold?"rgba(201,151,58,0.2)":"rgba(255,255,255,0.06)",
              border:`1.5px solid ${n.color}`,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:18,margin:"0 auto 6px",
              animation: n.pulse ? "hftPulse 0.6s ease infinite" : "none"
            }}>{n.icon}</div>
            <div style={{fontSize:10,fontWeight:700,color:n.color}}>{n.label}</div>
            <div style={{fontSize:9,color:"rgba(255,255,255,0.25)"}}>{n.sub}</div>
          </div>
        ))}

        {/* Wire */}
        <div style={{position:"absolute",left:"10%",right:"4%",top:"50%",height:1,background:"rgba(255,255,255,0.08)",zIndex:1}}/>

        {/* Animated packets */}
        {packets.map(pk => {
          const age = (Date.now() - pk.born) / 1200;
          const left = `${8 + age * 62}%`;
          return (
            <div key={pk.id} style={{
              position:"absolute",top:"calc(50% - 5px)",left,
              width:10,height:10,borderRadius:"50%",
              background:pk.intercepted ? C.red : C.cyan,

            {label:S.statOverpay, val:`$${(totalRuns*50).toFixed(0)}`, color:C.gold},

// ─── Interactive 2: Volume Profile Builder ────────────────────────────────────
function VolumeProfileBuilder() {
  const { useState, useRef, useCallback, useMemo } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  const W = 720, H = 340;
  const CHART_W = 490; // candles area
  const PROF_X = CHART_W + 10; // profile starts here
  const PAD = {l:44, t:16, b:28};
  const CW = CHART_W - PAD.l;
  const CH = H - PAD.t - PAD.b;

  // Fixed candle data: sideways accumulation zone 
  const candles = useMemo(() => [
    {o:2498,h:2508,l:2493,c:2503,v:340},{o:2503,h:2512,l:2497,c:2499,v:280},
    {o:2499,h:2506,l:2492,c:2505,v:420},{o:2505,h:2514,l:2500,c:2501,v:310},
    {o:2501,h:2509,l:2495,c:2507,v:390},{o:2507,h:2516,l:2502,c:2503,v:260},
    {o:2503,h:2510,l:2496,c:2508,v:480},{o:2508,h:2518,l:2504,c:2504,v:290},
    {o:2504,h:2512,l:2498,c:2510,v:350},{o:2510,h:2519,l:2505,c:2506,v:310},
    {o:2506,h:2513,l:2499,c:2511,v:520},{o:2511,h:2521,l:2507,c:2507,v:270},
    {o:2507,h:2515,l:2501,c:2512,v:440},{o:2512,h:2520,l:2506,c:2508,v:300},
    {o:2508,h:2516,l:2502,c:2514,v:380},{o:2514,h:2523,l:2509,c:2509,v:260},
    {o:2509,h:2517,l:2503,c:2515,v:590},{o:2515,h:2524,l:2510,c:2510,v:280},
    {o:2510,h:2518,l:2504,c:2516,v:350},{o:2516,h:2525,l:2511,c:2511,v:310},
    // breakout hint at the end
    {o:2511,h:2528,l:2509,c:2526,v:890},{o:2526,h:2538,l:2522,c:2534,v:1240},
  ], []);

  const PRICE_MIN = 2488, PRICE_MAX = 2542;
  const toY = p => PAD.t + CH - ((p - PRICE_MIN) / (PRICE_MAX - PRICE_MIN)) * CH;
  const toP = y => PRICE_MIN + ((PAD.t + CH - y) / CH) * (PRICE_MAX - PRICE_MIN);
  const toX = i => PAD.l + (i / candles.length) * CW;
  const candleW = Math.max(2, Math.floor(CW / candles.length) - 2);

  // Range selection
  const [selStart, setSelStart] = useState(null); // candle index
  const [selEnd,   setSelEnd  ] = useState(null);
  const [dragging, setDragging] = useState(false);
  const [revealed, setRevealed] = useState(false);
  const svgRef = useRef(null);

  const getIdx = useCallback((e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const idx = Math.floor((x - PAD.l) / CW * candles.length);
    return Math.max(0, Math.min(candles.length - 1, idx));
  }, [candles.length]);

  const onMouseDown = (e) => {
    const idx = getIdx(e);
    setSelStart(idx); setSelEnd(idx);
    setDragging(true); setRevealed(false);
  };
  const onMouseMove = (e) => { if (dragging) setSelEnd(getIdx(e)); };
  const onMouseUp   = () => { setDragging(false); if (selStart !== null) setRevealed(true); };

  // Compute volume profile for selected range
  const profile = useMemo(() => {
    if (selStart === null || selEnd === null) return [];
    const lo = Math.min(selStart, selEnd);
    const hi = Math.max(selStart, selEnd);
    const selected = candles.slice(lo, hi + 1);
    if (selected.length === 0) return [];

    const BINS = 20;
    const pMin = Math.min(...selected.map(c=>c.l));
    const pMax = Math.max(...selected.map(c=>c.h));
    const binSize = (pMax - pMin) / BINS;
    const bins = Array.from({length:BINS}, (_,i) => ({
      price: pMin + (i + 0.5) * binSize,
      priceLo: pMin + i * binSize,
      priceHi: pMin + (i+1) * binSize,
      vol: 0
    }));

    selected.forEach(c => {
      const range = c.h - c.l || 1;
      bins.forEach(b => {
        const overlap = Math.max(0, Math.min(c.h, b.priceHi) - Math.max(c.l, b.priceLo));
        bins[bins.indexOf(b)].vol += c.v * (overlap / range);
      });
    });

    return bins;
  }, [selStart, selEnd, candles]);

  const maxVol = profile.length ? Math.max(...profile.map(b=>b.vol)) : 1;
  const pocIdx = profile.length ? profile.reduce((mi,b,i)=>b.vol>profile[mi].vol?i:mi, 0) : -1;
  const pocPrice = pocIdx >= 0 ? profile[pocIdx].price : null;

  // Range selection box
  const selLo = selStart !== null && selEnd !== null ? Math.min(selStart, selEnd) : null;
  const selHi = selStart !== null && selEnd !== null ? Math.max(selStart, selEnd) : null;

  const PROF_W = W - PROF_X - 8;

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"36px 40px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <span style={{fontSize:28}}><img class='mi-icon' style='vertical-align:middle' src='/assets/icons/icon-bar-chart.png' alt='' width='20' height='20' /></span>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black}}>{S.vpTitle}</div>
          <Mono size={11} color={C.inkSoft} spacing={2}>{S.vpTag}</Mono>
        </div>
      </div>

      {!revealed
        ? <div style={{background:"rgba(201,151,58,0.07)",border:`1px solid ${C.borderGold}`,borderRadius:4,padding:"12px 16px",marginBottom:14,fontSize:13,color:C.inkMid}}>
            <strong>{S.vpTaskLabel}</strong>{S.vpTaskBody}
          </div>
        : <div style={{background:C.greenPale,border:`1px solid ${C.greenD}`,borderRadius:4,padding:"12px 16px",marginBottom:14,display:"flex",gap:10,alignItems:"center"}}>
            <span style={{fontSize:20}}><img class='mi-icon' style='vertical-align:middle' src='/assets/icons/icon-target.png' alt='' width='20' height='20' /></span>
            <div style={{fontSize:13,color:C.greenD}}>
              <strong>{S.vpResultStrong(pocPrice ? Math.round(pocPrice) : "—")}</strong>{S.vpResultRest}
            </div>
          </div>
      }

      {/* Chart */}
      <div style={{borderRadius:4,overflow:"hidden",border:`1px solid ${C.border}`,cursor:"crosshair",marginBottom:16}}>
        <svg
          ref={svgRef}
          viewBox={`0 0 ${W} ${H}`}
          style={{width:"100%",display:"block",background:C.chart,userSelect:"none",touchAction:"none"}}
          onMouseDown={onMouseDown}
          onMouseMove={onMouseMove}
          onMouseUp={onMouseUp}
          onMouseLeave={()=>{ if(dragging){setDragging(false);} }}>

          {/* Grid */}
          {[2495,2505,2515,2525,2535].map(p=>(
            <g key={p}>
              <line x1={PAD.l} y1={toY(p)} x2={CHART_W} y2={toY(p)} stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>
              <text x={PAD.l-4} y={toY(p)+4} fontSize="9" fill="rgba(255,255,255,0.2)" textAnchor="end" fontFamily="monospace">{p}</text>
            </g>
          ))}

          {/* Selection highlight */}
          {selLo !== null && (
            <rect
              x={toX(selLo)} y={PAD.t}
              width={toX(selHi+1) - toX(selLo)}
              height={CH}
              fill="rgba(201,151,58,0.1)"
              stroke="rgba(201,151,58,0.4)"
              strokeWidth="1"
              strokeDasharray="4 3"/>
          )}

          {/* Candles */}
          {candles.map((c,i)=>{
            const bull = c.c >= c.o;
            const col = bull ? C.green : C.red;
            const bT = toY(Math.max(c.o,c.c));
            const bB = toY(Math.min(c.o,c.c));
            const x = toX(i) + (CW/candles.length - candleW)/2;
            return (
              <g key={i}>
                <line x1={x+candleW/2} y1={toY(c.h)} x2={x+candleW/2} y2={toY(c.l)} stroke={col} strokeWidth="1.2"/>
                <rect x={x} y={bT} width={candleW} height={Math.max(bB-bT,1)} fill={col} rx="1"/>
              </g>
            );
          })}

          {/* "НАКОПЛЕНИЕ" label */}
          <rect x={PAD.l+4} y={PAD.t+4} width={90} height={16} fill="rgba(201,151,58,0.15)" rx="2"/>
          <text x={PAD.l+8} y={PAD.t+14} fontSize="9" fill={C.gold} fontFamily="monospace">{S.vpAccum}</text>

          {/* "ПРОБОЙ" label */}
          <rect x={toX(20)+2} y={PAD.t+4} width={62} height={16} fill="rgba(8,153,129,0.15)" rx="2"/>
          <text x={toX(20)+6} y={PAD.t+14} fontSize="9" fill={C.green} fontFamily="monospace">{S.vpBreakout}</text>

          {/* Divider */}
          <line x1={CHART_W} y1={PAD.t} x2={CHART_W} y2={H-PAD.b} stroke="rgba(255,255,255,0.06)" strokeWidth="1" strokeDasharray="4 4"/>

          {/* Volume Profile bars */}
          {revealed && profile.map((b,i) => {
            const barW = (b.vol / maxVol) * PROF_W * 0.9;
            const y = toY(b.priceHi);
            const bh = Math.max(toY(b.priceLo) - toY(b.priceHi), 1);
            const isPoc = i === pocIdx;
            return (
              <g key={i}>
                <rect x={PROF_X} y={y} width={barW} height={bh}
                  fill={isPoc ? "rgba(242,54,69,0.7)" : "rgba(8,153,129,0.35)"}
                  stroke={isPoc ? C.red : "none"} strokeWidth="1"/>
                {isPoc && (
                  <>
                    <line x1={PAD.l} y1={toY(b.price)} x2={W} y2={toY(b.price)}
                      stroke={C.red} strokeWidth="1.5" strokeDasharray="5 3" opacity="0.7"/>
                    <rect x={PROF_X + barW + 2} y={toY(b.price)-9} width={42} height={16} fill={C.red} opacity="0.9" rx="2"/>
                    <text x={PROF_X + barW + 24} y={toY(b.price)+3} fontSize="9" fill="#fff" textAnchor="middle" fontFamily="monospace" fontWeight="bold">POC</text>
                  </>
                )}
              </g>
            );
          })}

          {/* Profile axis label */}
          {revealed && (
            <text x={PROF_X + PROF_W/2} y={H-4} fontSize="9" fill="rgba(255,255,255,0.25)" textAnchor="middle" fontFamily="monospace">{S.vpVolAxis}</text>
          )}
        </svg>
      </div>

      {/* Stats */}
      {revealed && (
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
          {[
            {label:S.vpStatPoc,  val:pocPrice?`${Math.round(pocPrice)}`:"—", color:C.red},
            {label:S.vpStatCandles,val:selLo!==null?selHi-selLo+1:"—",       color:C.gold},
            {label:S.vpStatTotalVol,val:selLo!==null?profile.reduce((s,b)=>s+Math.round(b.vol),0).toLocaleString():"—", color:"rgba(255,255,255,0.8)"},
            {label:S.vpStatPocVal,  val:pocIdx>=0?S.vpLots(Math.round(profile[pocIdx].vol)):"—", color:C.green},
          ].map((m,i)=>(
            <div key={i} style={{background:C.surfaceMid,borderRadius:4,padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:10,color:C.inkSoft,marginBottom:4,letterSpacing:0.5}}>{m.label}</div>
              <div style={{fontSize:15,fontWeight:700,color:m.color,fontFamily:"monospace"}}>{m.val}</div>
            </div>
          ))}
        </div>
      )}

      {!revealed && (
        <div style={{textAlign:"center",padding:"16px",color:C.inkFaint,fontSize:13,fontFamily:"monospace"}}>
          {S.vpDragHint}
        </div>
      )}
    </div>
  );
}

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:40}} className="g2">
          {vpConcepts.map((c,i)=><InfoCard key={i} {...c}/>)}
        </div>

        {/* POC usage guide */}
        <div style={{background:C.black,borderRadius:6,padding:"28px 32px",marginBottom:56}}>
          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:20}}>{S.pocGuideTitle}</Mono>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:0}} className="g3">
            {[
              {n:"01",title:S.poc1Title,color:"#2ecc71",
               text:S.poc1Text},
              {n:"02",title:S.poc2Title,color:C.gold,
               text:S.poc2Text},
              {n:"03",title:S.poc3Title,color:C.cyan,
               text:S.poc3Text},
            ].map((r,i)=>(
              <div key={i} style={{padding:"20px 24px",borderLeft:i>0?"1px solid rgba(255,255,255,0.06)":"none"}}>
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
                  <Mono size={11} color={C.gold} spacing={0}>{r.n}</Mono>
                  <span style={{fontSize:13,fontWeight:700,color:r.color}}>{r.title}</span>
                </div>
                <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",lineHeight:1.7}}>{r.text}</div>
              </div>
            ))}
          </div>
        </div>

        {/* ── INTERACTIVE 2: Volume Profile Builder ── */}
        <div style={{marginBottom:64}}>
          <VolumeProfileBuilder/>
        </div>

        <Rule/>

        {/* ── CONCLUSIONS ── */}
        <div style={{background:C.black,borderRadius:8,padding:"44px 48px"}}>
          <div style={{textAlign:"center",marginBottom:32}}>
            <Mono size={11} color={C.gold} spacing={4} style={{display:"block",marginBottom:12}}>{S.conclTag}</Mono>
            <h3 style={{fontFamily:"'DM Serif Display',serif",fontSize:28,color:C.white,fontWeight:400}}>{S.conclTitle}</h3>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            {conclusions.map((c,i)=>(
              <div key={i} style={{display:"flex",gap:14,alignItems:"flex-start",padding:"14px 16px",background:"rgba(255,255,255,0.04)",borderRadius:4,border:"1px solid rgba(255,255,255,0.06)"}}>
                <span style={{color:C.gold,fontFamily:"monospace",fontSize:11,marginTop:2,flexShrink:0}}>0{i+1}</span>
                <span style={{fontSize:13,color:"rgba(255,255,255,0.7)",lineHeight:1.65}}>{c}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Footer */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:48,marginTop:48,borderTop:`1px solid ${C.border}`}}>
          <span onClick={()=>setAskOpen(true)} style={{fontSize:14,color:C.inkSoft,fontFamily:"monospace",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}>
            {S.askAnalyst}
          </span>
          <button
            onClick={()=>window.location.href=getChUrl(12)}
            style={{background:C.black,color:C.white,border:"none",padding:"18px 35px",cursor:"pointer",fontFamily:"monospace",fontSize:14,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.target.style.background=C.gold}
            onMouseLeave={e=>e.target.style.background=C.black}>
            {S.nextChapter}
          </button>
        </div>

      </div>

      {askOpen && <AskAnalystPopup onClose={()=>setAskOpen(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter11/>);
{% endraw %}
</script>
</body>
</html>
