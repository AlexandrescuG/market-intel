// ─── Цена незнания — реальный калькулятор на вводе пользователя ────────────
function PriceOfNotKnowingCalc() {
  const { useState, useMemo } = React;
  const T11 = window.Ch11Content[INITIAL_LANG] || window.Ch11Content.ru;
  const p = T11.priceOfNotKnowing;
  const [trades, setTrades] = useState(20);
  const [costA, setCostA] = useState(1.2);
  const [costB, setCostB] = useState(1.8);
  const [target, setTarget] = useState(15);

  const { monthlyDiff, yearlyDiff, equivTrades } = useMemo(() => {
    const diffPerTrade = Math.abs(costB - costA);
    const monthly = diffPerTrade * trades;
    const yearly = monthly * 12;
    const equiv = target > 0 ? yearly / target : null;
    return { monthlyDiff: monthly, yearlyDiff: yearly, equivTrades: equiv };
  }, [trades, costA, costB, target]);

  const Field = ({ label, value, onChange, step = 0.1 }) => (
    <div style={{marginBottom:16}}>
      <Mono size={10} color={C.inkFaint} spacing={0.5} style={{display:"block",marginBottom:6}}>{label}</Mono>
      <input type="number" value={value} step={step} onChange={e=>onChange(+e.target.value)} style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:4,fontFamily:"monospace",fontSize:14}}/>
    </div>
  );

  return (
    <div id="secPriceOfNotKnowing11" style={{marginBottom:48,scrollMarginTop:130}}>
      <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{T11.priceOfNotKnowing.tag}</Mono>
      <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black,marginBottom:10}}>{p.title}</div>
      <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,marginBottom:24,maxWidth:800}}>{p.intro}</p>

      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"26px 30px"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:8}} className="g2">
          <Field label={p.tradesLabel} value={trades} onChange={setTrades} step={1}/>
          <Field label={p.targetLabel} value={target} onChange={setTarget} step={1}/>
          <Field label={p.costALabel} value={costA} onChange={setCostA}/>
          <Field label={p.costBLabel} value={costB} onChange={setCostB}/>
        </div>
        <div style={{display:"flex",gap:24,flexWrap:"wrap",justifyContent:"center",background:C.black,borderRadius:6,padding:"20px 24px",marginTop:12,marginBottom:16}}>
          <div style={{textAlign:"center"}}><div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.gold}}>{monthlyDiff.toFixed(1)}</div><Mono size={9.5} color="rgba(255,255,255,0.5)" spacing={0.5}>{p.monthlyDiffLabel}</Mono></div>
          <div style={{textAlign:"center"}}><div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.gold}}>{yearlyDiff.toFixed(1)}</div><Mono size={9.5} color="rgba(255,255,255,0.5)" spacing={0.5}>{p.yearlyDiffLabel}</Mono></div>
          <div style={{textAlign:"center"}}><div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#fff"}}>{equivTrades!=null?equivTrades.toFixed(1):"—"}</div><Mono size={9.5} color="rgba(255,255,255,0.5)" spacing={0.5}>{p.equivTradesLabel}</Mono></div>
        </div>
        <p style={{fontSize:13,color:C.black,fontWeight:600,lineHeight:1.7,marginBottom:12}}>{p.keyPoint}</p>
        <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.7,margin:0,fontStyle:"italic"}}>{p.honestNote}</p>
      </div>
    </div>
  );
}

// ─── Путь твоей заявки — переписанный симулятор, ядро главы ───────────────

  const { useState } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const T11 = window.Ch11Content[INITIAL_LANG] || window.Ch11Content.ru;
  const op = T11.orderPath;
  const [step, setStep] = useState(1);
  const [mode, setMode] = useState("calm");

  const metrics = mode === "calm"
    ? { delay: "~20–50 мс", spread: INITIAL_LANG==="ru"?"обычный":INITIAL_LANG==="ro"?"normal":"typical", requote: INITIAL_LANG==="ru"?"низкая":INITIAL_LANG==="ro"?"scăzută":"low" }

        <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:8,padding:"26px 30px",marginBottom:20}}>
          <StepTag n="1" label={S.stepExplain}/>
          <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:20}}>{op.step1Legend}</p>

        </div>
      )}

      {step >= 2 && (
        <div style={{background:C.black,borderRadius:8,padding:"30px 5vw 34px",color:"#fff"}}>
          <StepTag n="2-3" label={S.stepShow+" → "+S.stepDo}/>

          <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:8}}>
            <span style={{color:"rgba(255,255,255,0.3)",fontSize:18}}>↙</span>
            <span style={{color:"rgba(255,255,255,0.3)",fontSize:18}}>↘</span>
          </div>
          <div style={{display:"flex",gap:16,justifyContent:"center",marginBottom:24,flexWrap:"wrap"}}>
            <div style={{background:"rgba(242,54,69,0.1)",border:"1px solid rgba(242,54,69,0.3)",borderRadius:6,padding:"12px 16px",textAlign:"center",minWidth:150}}>
              <div style={{fontSize:11.5,color:"#fff",fontWeight:600}}>{op.nodeBbook}</div>
            </div>
            <div style={{background:"rgba(8,153,129,0.1)",border:"1px solid rgba(8,153,129,0.3)",borderRadius:6,padding:"12px 16px",textAlign:"center",minWidth:150}}>
              <div style={{fontSize:11.5,color:"#fff",fontWeight:600}}>{op.nodeAbook}</div>
              <Mono size={9} color="rgba(255,255,255,0.4)" spacing={0} style={{display:"block",marginTop:4}}>→ {op.nodeMarket}</Mono>
            </div>
          </div>

          {step === 3 && (
            <div style={{background:"rgba(255,255,255,0.04)",borderRadius:6,padding:"18px 22px"}}>

// ─── Что измерить самому — домашнее задание ────────────────────────────────
function MeasureYourBroker() {
  const { useState, useMemo } = React;
  const T11 = window.Ch11Content[INITIAL_LANG] || window.Ch11Content.ru;
  const m = T11.measureYourBroker;
  const items = [[m.m1Title,m.m1Text],[m.m2Title,m.m2Text],[m.m3Title,m.m3Text],[m.m4Title,m.m4Text]];
  // SPEC_charts_and_interactivity_standard.md: cards 1/2 ("your hours" spread
  // vs "on release" spread) were pure static text -- both are the same unit
  // (pips the reader measures themselves), so a live ratio between them is a
  // genuine class A without inventing a monthly-cost model that would
  // duplicate ch14's own CostArithmetic (this chapter's own outro text
  // explicitly defers full cost math to ch14, using the reader's numbers).
  const [normalSpread, setNormalSpread] = useState(2.0);
  const [releaseSpread, setReleaseSpread] = useState(8.0);
  const multiplier = useMemo(() => normalSpread > 0 ? releaseSpread / normalSpread : null, [normalSpread, releaseSpread]);
  return (
    <div style={{marginBottom:48}}>
      <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:20,maxWidth:820}}>{m.intro}</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}} className="g2">
        {items.map(([t,x],i) => (
          <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"18px 20px"}}>
            <div style={{fontWeight:600,fontSize:13,color:C.black,marginBottom:8}}>{t}</div>
            <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6,margin: i<2 ? 10 : 0}}>{x}</p>
            {i<2 && <a href="/chart.html?s=GOLD" target="_blank" rel="noopener" style={{fontFamily:"monospace",fontSize:10.5,color:C.gold,textDecoration:"none",borderBottom:`1px dotted ${C.gold}`}}>{m.openOnChart}</a>}
          </div>
        ))}
      </div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"20px 24px",marginBottom:16}}>
        <Mono size={10} color={C.gold} spacing={1} style={{display:"block",marginBottom:14,textTransform:"uppercase"}}>{m.multiplierLabel}</Mono>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}} className="g2">
          <div>
            <Mono size={10} color={C.inkFaint} spacing={0.5} style={{display:"block",marginBottom:6}}>{m.m1Title}</Mono>
            <input type="number" value={normalSpread} step={0.1} min={0} onChange={e=>setNormalSpread(+e.target.value)} style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:4,fontFamily:"monospace",fontSize:14}}/>
          </div>
          <div>
            <Mono size={10} color={C.inkFaint} spacing={0.5} style={{display:"block",marginBottom:6}}>{m.m2Title}</Mono>
            <input type="number" value={releaseSpread} step={0.1} min={0} onChange={e=>setReleaseSpread(+e.target.value)} style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:4,fontFamily:"monospace",fontSize:14}}/>
          </div>
        </div>
        <div style={{textAlign:"center",background:C.black,borderRadius:6,padding:"18px 24px"}}>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:28,color:C.gold}}>{multiplier!=null?multiplier.toFixed(1)+"×":"—"}</div>
          <Mono size={9.5} color="rgba(255,255,255,0.5)" spacing={0.5}>{m.multiplierResultLabel}</Mono>
        </div>
      </div>
      <p style={{fontSize:13,color:C.inkSoft,lineHeight:1.7,fontStyle:"italic",margin:0}}>{m.outro}</p>
    </div>
  );
}

// ─── Предикт недели ─────────────────────────────────────────────────────────
function PredictLossPct() {
  const { useState } = React;
  const T11 = window.Ch11Content[INITIAL_LANG] || window.Ch11Content.ru;
  const p = T11.predict;
  const [picked, setPicked] = useState(null);
  // options[2] ("Больше десяти" / more than ten pp) is the one ESMA's own
  // methodology confirms -- the reveal below now depends on which of the
  // 3 options was actually picked, not a fixed sentence for any click.
  const correct = picked === 2;
  const correctPrefix = INITIAL_LANG==="ru" ? "Верно. " : INITIAL_LANG==="ro" ? "Corect. " : "Correct. ";
  const wrongPrefix = INITIAL_LANG==="ru" ? "На деле разрыв больше, чем ты предположил. " : INITIAL_LANG==="ro" ? "De fapt diferența e mai mare decât ai presupus. " : "The gap is actually bigger than you guessed. ";
  const esmaFact = INITIAL_LANG==="ru"?"По методике ESMA разброс между площадками действительно бывает больше десяти процентных пунктов — точную таблицу по нашим партнёрам опубликуем вместе с инструментом сравнения.":INITIAL_LANG==="ro"?"După metodologia ESMA, diferența dintre platforme poate fi într-adevăr mai mare de zece puncte procentuale — tabelul exact pentru partenerii noștri va fi publicat odată cu instrumentul de comparare.":"Per ESMA's methodology, the gap between platforms genuinely can exceed ten percentage points — we'll publish the exact table for our partners alongside the comparison tool.";
  return (
    <div style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px",marginTop:8,marginBottom:24}}>
      <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{p.tag}</Mono>
      <p style={{fontSize:14.5,color:C.black,lineHeight:1.65,marginBottom:14}}>{p.question}</p>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        {p.options.map((o,i) => (
          <button key={i} onClick={()=>setPicked(i)} style={{fontFamily:"monospace",fontSize:12,padding:"9px 20px",cursor:"pointer",background:picked===i?C.gold:"#fff",color:picked===i?"#18181a":C.inkMid,border:`1px solid ${picked===i?C.gold:C.border}`,borderRadius:4}}>{o}</button>
        ))}
      </div>
      {picked !== null && <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.7,marginBottom:10,background:C.goldPale,padding:"12px 16px",borderRadius:4}}>{(correct ? correctPrefix : wrongPrefix) + esmaFact}</p>}
      <p style={{fontSize:11,color:C.inkFaint}}>{p.xpNote}</p>
    </div>
  );
}
