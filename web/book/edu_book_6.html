// ─── Interactive 2: Bollinger Squeeze Hunter ─────────────────────────────────
function BollingerSqueeze() {
  const { useState, useRef } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  const W = 700, H = 280;
  const dataLen = 70;
  const points = [];
  let currentPrice = 120;

  for (let i = 0; i <= dataLen; i++) {
    let vol = 0;
    if (i < 25) vol = 8; // Expansion
    else if (i >= 25 && i <= 45) vol = 1.5; // THE SQUEEZE
    else if (i > 45) vol = 12; // Breakout
    
    let trend = 0;
    if (i > 45) trend = (i - 45) * 3; // Pump
    else trend = Math.sin(i / 4) * 3; // Walk

    currentPrice = 120 + trend;
    let upBand = currentPrice + (vol * 2.5);
    let lowBand = currentPrice - (vol * 2.5);
    
    points.push({ x: i * (W / dataLen), c: currentPrice, u: upBand, l: lowBand });
  }

  const minP = Math.min(...points.map(p => p.l)) - 10;
  const maxP = Math.max(...points.map(p => p.u)) + 10;
  const toY = p => H - ((p - minP) / (maxP - minP)) * H;

  const pLine = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${toY(p.c)}`).join(' ');
  const uLine = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${toY(p.u)}`).join(' ');
  const lLine = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${toY(p.l)}`).join(' ');
  const areaPath = uLine + ' ' + points.slice().reverse().map(p => `L${p.x},${toY(p.l)}`).join(' ') + ' Z';

  const [revealed, setRevealed] = useState(false);
  const [msg, setMsg] = useState(S.sqzInitialMsg);
  const [errFlash, setErrFlash] = useState(false);
  const svgRef = useRef(null);

  const handleClick = (e) => {
    if (revealed) return;
    const rect = svgRef.current.getBoundingClientRect();
    const xClick = e.clientX - rect.left;
    const clickIndex = Math.round(xClick / (W / dataLen));

    if (clickIndex >= 25 && clickIndex <= 45) {
      setRevealed(true);
      setMsg(S.sqzCorrectMsg);
    } else {
      setMsg(S.sqzWrongMsg);
      setErrFlash(true);
      setTimeout(() => setErrFlash(false), 500);
    }
  };

  const reset = () => {
    setRevealed(false);
    setMsg(S.sqzInitialMsg);
  };

  const visibleWidth = revealed ? W : (45 * (W / dataLen));

  return (
    <div style={{background:C.surface, border:`1px solid ${errFlash ? C.redB : C.border}`, borderRadius:8, padding:"40px", transition: "border 0.3s"}}>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:32}}>
        <span style={{fontSize:32}}>🗜️</span>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:24,color:C.black}}>{S.sqzHeader}</div>
          <Mono size={11} color={C.inkSoft} spacing={2}>{S.sqzBadge}</Mono>
        </div>
      </div>

      <div style={{marginBottom: 24, padding: "16px 20px", background: revealed ? "rgba(8,153,129,0.08)" : C.surfaceMid, borderRadius: 6, color: revealed ? C.greenD : C.inkMid, fontWeight: revealed ? 600 : 400, fontSize: 15, borderLeft: revealed ? `4px solid ${C.greenB}` : `4px solid transparent`, transition:"all .3s"}}>
        {msg}
      </div>

      <div style={{position:"relative", background:C.chart, borderRadius:6, overflow:"hidden", cursor: revealed ? "default" : "crosshair", boxShadow:"inset 0 0 20px rgba(0,0,0,0.5)"}} onClick={handleClick} ref={svgRef}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%", display:"block"}}>
          
          <clipPath id="chartMask">
            <rect x="0" y="0" width={visibleWidth} height={H} style={{transition: "width 1.5s cubic-bezier(0.4, 0, 0.2, 1)"}} />
          </clipPath>

          <g clipPath="url(#chartMask)">
            {[0.2, 0.4, 0.6, 0.8].map(v => (
              <line key={v} x1="0" y1={H*v} x2={W} y2={H*v} stroke="rgba(255,255,255,0.05)" strokeWidth="1" strokeDasharray="4 4" />
            ))}

            {/* Area */}
            <path d={areaPath} fill="rgba(37,99,235,0.08)" />
            
            {/* Bands */}
            <path d={uLine} fill="none" stroke={C.blue} strokeWidth="1.5" opacity="0.6" />
            <path d={lLine} fill="none" stroke={C.blue} strokeWidth="1.5" opacity="0.6" />
            
            {/* SMA */}
            <path d={points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${toY((p.u+p.l)/2)}`).join(' ')} fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="1" strokeDasharray="5 5" />

            {/* Price */}
            <path d={pLine} fill="none" stroke={C.gold} strokeWidth="2.5" />
          </g>

          {/* Highlights */}
          {revealed && (
            <g style={{animation: "fadeIn 1s forwards"}}>
              <rect x={25 * (W/dataLen)} y="0" width={20 * (W/dataLen)} height={H} fill="rgba(201,151,58,0.15)" />
              <line x1={25 * (W/dataLen)} y1="0" x2={25 * (W/dataLen)} y2={H} stroke={C.gold} strokeWidth="1" strokeDasharray="4 4" opacity="0.5"/>
              <line x1={45 * (W/dataLen)} y1="0" x2={45 * (W/dataLen)} y2={H} stroke={C.gold} strokeWidth="1" strokeDasharray="4 4" opacity="0.5"/>
              
              <rect x={29 * (W/dataLen)} y="15" width={80} height={24} fill={C.gold} rx="4" />
              <text x={34 * (W/dataLen)} y="31" fill={C.black} fontSize="11" fontFamily="monospace" fontWeight="bold" textAnchor="middle">SQUEEZE</text>
              
              <text x={58 * (W/dataLen)} y="50" fill={C.greenB} fontSize="16" fontWeight="bold" textAnchor="middle">{S.sqzBreakoutLabel}</text>
            </g>
          )}

          {/* Fog line */}
          {!revealed && (
             <line x1={visibleWidth} y1="0" x2={visibleWidth} y2={H} stroke="rgba(255,255,255,0.5)" strokeWidth="2" strokeDasharray="4 4" />
          )}
        </svg>

        {/* Fog overlay */}
        {!revealed && (
          <div style={{position:"absolute", top:0, right:0, bottom:0, left: `${(45/dataLen)*100}%`, background:"rgba(19,23,34,0.92)", display:"flex", alignItems:"center", justifyContent:"center", backdropFilter:"blur(2px)"}}>
            <span style={{color:"rgba(255,255,255,0.4)", fontSize:13, fontFamily:"monospace", letterSpacing:2}}>{S.sqzFutureHidden}</span>
          </div>
        )}
      </div>

      {revealed && (

<script>
// Скрипт для конвертации UTC времени в локальное время пользователя
document.addEventListener('DOMContentLoaded', function() {
    var _pageLang = "{{ lang }}";
    var _intlLocale = _pageLang === 'ro' ? 'ro-RO' : _pageLang === 'en' ? 'en-US' : 'ru-RU';
    const utcTimes = document.querySelectorAll('.local-time[data-utc]');

    utcTimes.forEach(function(element) {
        // Получаем UTC время из data-utc атрибута
        var utcString = element.getAttribute('data-utc');

        try {
            // Парсим UTC дату и время
            var utcDate = new Date(utcString);

            // Конвертируем в локальное время пользователя
            var localDate = new Date(utcDate.getTime() + utcDate.getTimezoneOffset() * 60000);

            // Форматируем для отображения (например, "19:00 МСК")
            var hours = String(localDate.getHours()).padStart(2, '0');
            var minutes = String(localDate.getMinutes()).padStart(2, '0');
            var timeZoneName = Intl.DateTimeFormat(_intlLocale, { timeZoneName: 'long' }).format(localDate);
            
            // Обновляем текст элемента с локальным временем
            element.innerHTML = '<span class="local-time-display">' + hours + ':' + minutes + ' ' + timeZoneName.replace(/\s/g, '') + '</span>';
        } catch (e) {
            console.error('Ошибка конвертации времени:', e);
        }
    });
});
</script>
