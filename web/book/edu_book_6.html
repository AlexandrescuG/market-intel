const {C, Mono, Chip, Rule, AntiMythBlock, RevealSteps, AskAnalystBtn, getChUrl, QuizBlock, ImpactMatrix, ComplianceFootnote, ColdStart, CardTabs} = window.AcademyShared;

const SectionTitle = ({children,sub,align="left",id}) => (
  <div id={id} style={{textAlign:align,marginBottom:36,scrollMarginTop:130}}>
    <h2 style={{fontFamily:"'DM Serif Display',serif",fontSize:"clamp(24px,3.2vw,36px)",fontWeight:400,color:C.black,lineHeight:1.15,marginBottom:sub?10:0}}>{children}</h2>
    {sub && <p style={{fontSize:15,color:C.inkSoft,lineHeight:1.65,maxWidth:680,margin:align==="center"?"0 auto":0}}>{sub}</p>}
  </div>
);
const StepTag = ({n,label}) => (
  <Mono size={9.5} color={C.inkFaint} spacing={2} style={{display:"block",marginBottom:8,textTransform:"uppercase"}}>{n} · {label}</Mono>
);
const InfoCard = ({icon,title,text,accent=C.gold}) => (
  <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"20px 24px",borderRadius:6,borderLeft:`3px solid ${accent}`}}>
    {icon && <div style={{fontSize:22,marginBottom:10}}>{icon}</div>}
    <div style={{fontWeight:600,fontSize:13.5,color:C.black,marginBottom:8}}>{title}</div>
    <div style={{fontSize:12.5,color:C.inkMid,lineHeight:1.65}}>{text}</div>
  </div>
);

// fillTemplate/Stat -- та же дисциплина, что в главе 5: незаполненный
// плейсхолдер -- честный "—" + console.error, а не тихая подстановка.
function fillTemplate(str, vars) {
  if (!str) return str;
  return str.replace(/\{\{(\w+)\}\}/g, (m, key) => {
    const v = vars ? vars[key] : undefined;
    if (v === undefined || v === null || (typeof v === "number" && isNaN(v))) {
      console.error("[ch6] отсутствует значение для {{" + key + "}}");
      return "—";
    }
    return String(v);
  });
}

// ── Загрузка данных главы: surprise_reaction.json (ядро) + ch6_release_day.json (cold open).
function useCh6Data() {
  const { useState, useEffect } = React;
  const [state, setState] = useState({ loading: true, error: null, stats: null, scene: null });
  useEffect(() => {
    let cancelled = false;
    Promise.all([
      fetch("/data/edu_stats/surprise_reaction.json").then(r => { if (!r.ok) throw new Error("surprise_reaction.json HTTP " + r.status); return r.json(); }),
      fetch("/data/edu_scenes/ch6_release_day.json").then(r => { if (!r.ok) throw new Error("ch6_release_day.json HTTP " + r.status); return r.json(); }),
    ]).then(([stats, scene]) => {
      if (!cancelled) setState({ loading: false, error: null, stats, scene });
    }).catch(err => {
      console.error("[ch6] load failed:", err);
      if (!cancelled) setState({ loading: false, error: err, stats: null, scene: null });
    });
    return () => { cancelled = true; };
  }, []);
  return state;
}

// ── vars: единственный источник чисел для текстовых {{плейсхолдеров}}.
function buildVars(stats, scene, lang) {
  if (!stats || !scene) return null;
  const T6 = window.Ch6Content[lang] || window.Ch6Content.ru;
  const bi = stats.by_impact || {};
  const dir = stats.direction || {};
  const msl = stats.move_small_large || {};
  const meta = stats._meta || {};
  const ex = (stats.sim_releases || []).find(s => s.kind === "big_positive");
  const verdictText = dir.verdict_key === "coin_flip" ? T6.coreMeasure.verdictCoinFlip
    : dir.verdict_key === "weak_tilt" ? T6.coreMeasure.verdictWeakTilt
    : dir.verdict_key === "strong_tilt" ? T6.coreMeasure.verdictStrongTilt : null;

  return {
    release_bar_range: scene.meta.release_bar_range,
    peak_vs_quiet: scene.meta.peak_vs_quiet,
    impact_high: bi.high ? bi.high.median_move : null,
    impact_medium: bi.medium ? bi.medium.median_move : null,
    impact_low: bi.low ? bi.low.median_move : null,
    impact_high_iqr: bi.high ? `${bi.high.iqr[0]}–${bi.high.iqr[1]}` : null,
    n_impact_high: bi.high ? bi.high.n : null,
    n_impact_low: bi.low ? bi.low.n : null,
    impact_high_vs_low: (bi.high && bi.low && bi.low.median_move) ? Math.round((bi.high.median_move / bi.low.median_move) * 100) / 100 : null,
    dir_hit_rate: dir.hit_rate, n_releases_dir: dir.n,
    dir_ci: dir.ci95 ? `${dir.ci95[0]}–${dir.ci95[1]}%` : null,
    dir_verdict: verdictText,
    release_median_move: bi.high ? bi.high.median_move : null,
    n_releases: meta.n_releases, coverage_days: meta.coverage_days,
    move_small: msl.move_small, move_large: msl.move_large, move_ratio: msl.move_ratio,
    n_small: msl.n_small, n_large: msl.n_large,
    parse_failed_pct: meta.parse_failed_share != null ? Math.round(meta.parse_failed_share * 10000) / 100 : null,
    ex_forecast: ex ? ex.forecast : null, ex_actual: ex ? ex.actual : null,
    ex_surprise: ex ? Math.round((ex.actual - ex.forecast) * 100) / 100 : null,
    ex_std: ex ? Math.round((ex.actual - ex.forecast) / ex.surprise_sigma * 100) / 100 : null,
    ex_sigma: ex ? ex.surprise_sigma : null,
  };
}

// ─── Cold start: "Найди релиз" (SPEC_coldstart_interactives_ch6_15.md §2) ──────
// Заменяет прежний ColdOpen6 (статичная гистограмма) -- тот же сценарий
// ch6_release_day.json, но теперь читатель сначала тапает по свече, где, по
// его мнению, вышла новость, и только потом видит реальный ответ.
function ColdStart6Entry({ scene }) {
  const T6 = window.Ch6Content[INITIAL_LANG] || window.Ch6Content.ru;
  const cs = T6.coldStart;
  if (!scene) return <div style={{background:C.black,padding:"60px 5vw",textAlign:"center"}}><Mono size={11} color={C.gold} spacing={4}>{cs.tag}</Mono></div>;
  const meta = scene.meta;
  const candles = (scene.candles || []).map(c => ({ ...c, time: Math.floor(Date.parse(c.time) / 1000) }));
  const markerTime = Math.floor(Date.parse(meta.marker_time) / 1000);
  const timeLabel = meta.marker_time.slice(11, 16);
  return (
    <ColdStart
      tag={cs.tag}
      ask={cs.ask}
      action={{ type: "chartTap", chart: {
        candles, visibleCount: candles.length, dataSource: "/data/edu_scenes/ch6_release_day.json",
        height: 320, markerTime, markerText: meta.marker_label,
        isCorrect: (t) => t === markerTime,
      }}}
      reveal={() => fillTemplate(cs.revealTemplate, {
        marker_label: meta.marker_label, date: meta.date, time: timeLabel,
        release_bar_range: meta.release_bar_range, peak_vs_quiet: meta.peak_vs_quiet,
      })}
      bridge={cs.bridge}
    />
  );
}

// ─── Cold start, середина: "Сюрприз или число" (§2 середина) ──────────────────
// Один и тот же реальный релиз (big_positive, уже используется в SurpriseCalc
// для объяснения сигмы) -- сначала как игра "угадай направление", позже как
// разобранный пример. actualDir считается из его же настоящих свечей (open
// первого бара -> close последнего, честные 3 часа окна), ничего не выдумано.
function ColdStart6Middle({ stats }) {
  const T6 = window.Ch6Content[INITIAL_LANG] || window.Ch6Content.ru;
  const cm = T6.coldStartMiddle;
  const dir = (stats && stats.direction) || null;
  const ex = stats ? (stats.sim_releases || []).find(s => s.kind === "big_positive") : null;
  if (!ex || !dir) return null;
  const open0 = ex.candles[0].open, closeLast = ex.candles[ex.candles.length - 1].close;
  const movePts = Math.round((closeLast - open0) * 100) / 100;
  const actualDir = closeLast > open0 ? "up" : "down";
  return (
    <ColdStart
      tag={cm.tag}
      ask={fillTemplate(cm.askTemplate, { ex_forecast: ex.forecast, ex_actual: ex.actual })}
      action={{ type: "choice", options: [
        { label: cm.dirUp, value: "up" }, { label: cm.dirDown, value: "down" },
      ]}}
      reveal={() => fillTemplate(cm.revealTemplate, {
        actualDirWord: actualDir === "up" ? cm.dirUp : cm.dirDown,
        move_pts: Math.abs(movePts), open0: open0.toFixed(2), closeLast: closeLast.toFixed(2),
        n: dir.n, hit_rate: dir.hit_rate, ci_lo: dir.ci95[0], ci_hi: dir.ci95[1],
      })}
      bridge={cm.bridge}
    />
  );
}

// ─── Анти-миф → Голос SBF → Цена незнания ──────────────────────────────────────
function IntroBlock({ vars }) {
  const T6 = window.Ch6Content[INITIAL_LANG] || window.Ch6Content.ru;
  return (

      <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{T6.voiceSbf.tag}</Mono>
      <div style={{borderLeft:`4px solid ${C.gold}`,paddingLeft:24,marginBottom:28}}>
        {T6.voiceSbf.body.split("\n\n").map((p,i) => <p key={i} style={{fontSize:16,fontStyle:"italic",color:C.inkMid,lineHeight:1.7,fontFamily:"'DM Serif Display',serif",marginBottom:12}}>{p}</p>)}
      </div>

      <div style={{background:C.black,borderRadius:8,padding:"26px 30px",color:C.white}}>
        <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{T6.priceOfNotKnowing.tag}</Mono>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:C.white,marginBottom:12}}>{T6.priceOfNotKnowing.title}</div>
        {/* Разбор открывается по шагам — см. комментарий в главе 9.
            Живые числа подставляются до передачи в компонент: fillTemplate

            {{cost_per_trade}} вместо цифры. */}
        <RevealSteps lang={INITIAL_LANG} preset="cost" dark
          bodies={T6.priceOfNotKnowing.body.split("\n\n")
                    .map(p => vars ? fillTemplate(p, vars) : p)}/>
      </div>
    </div>
  );
}

// ─── Что такое календарь на самом деле ─────────────────────────────────────────

  return (
    <div style={{marginBottom:48}}>
      <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:24,maxWidth:820}}>{cal.preamble}</p>

        <InfoCard title={cal.colPrev} text={cal.colPrevDesc} accent={C.inkFaint}/>
        <InfoCard title={cal.colForecast} text={cal.colForecastDesc}/>
        <InfoCard title={cal.colActual} text={cal.colActualDesc} accent={C.green}/>
      </div>

        <p style={{fontSize:14,color:C.black,lineHeight:1.65,margin:0,fontWeight:600}}>{cal.surprisePlate}</p>
      </div>

        {title: cal.importanceTitle, body: cal.importanceText},

// ─── Сюрприз, а не число: калькулятор в 3 шага ────────────────────────────────

  const { useState } = React;
  const T6 = window.Ch6Content[INITIAL_LANG] || window.Ch6Content.ru;
  const sc = T6.surpriseCalc;
  const bins = (stats && stats.bins) || [];
  const [binIdx, setBinIdx] = useState(0);
  const b = bins[binIdx];

  return (
    <div style={{marginBottom:56}}>
      <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:24,maxWidth:820}}>{sc.intro}</p>

      <div style={{marginBottom:16}}><StepTag n="1" label={STRINGS[INITIAL_LANG].stepExplain}/></div>
      <div style={{background:C.black,borderRadius:8,padding:"22px 26px",color:"#fff",marginBottom:28}}>
        <p style={{fontSize:13.5,lineHeight:1.75,color:"rgba(255,255,255,0.8)",margin:0}}>{vars ? fillTemplate(sc.step1Legend, vars) : "—"}</p>
      </div>

      <div style={{marginBottom:16}}><StepTag n="2" label={STRINGS[INITIAL_LANG].stepShow}/></div>
      <p style={{fontSize:13,color:C.inkMid,lineHeight:1.7,marginBottom:24,maxWidth:780}}>{sc.step2Legend}</p>

      <div style={{marginBottom:16}}><StepTag n="3" label={STRINGS[INITIAL_LANG].stepDo}/></div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px"}}>
        <p style={{fontSize:13,color:C.inkMid,marginBottom:14}}>{sc.step3Task}</p>
        {bins.length > 0 ? (
          <>
            <input type="range" min="0" max={bins.length-1} value={binIdx} onChange={e=>setBinIdx(+e.target.value)} style={{width:"100%",marginBottom:14}}/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,fontFamily:"monospace",color:C.inkFaint,marginBottom:18}}>
              {bins.map((bb,i) => <span key={i}>{bb.from}σ{bb.to?`–${bb.to}σ`:"+"}</span>)}
            </div>
            <div style={{display:"flex",justifyContent:"center",alignItems:"baseline",gap:14,marginBottom:10}}>
              <Mono size={13} color={C.inkSoft} spacing={1}>{sc.sliderLabel}: {b.from}σ{b.to?`–${b.to}σ`:"+"}</Mono>
              <span style={{fontFamily:"'DM Serif Display',serif",fontSize:34,color:C.gold}}>{b.median_move != null ? b.median_move : "—"}</span>

// ─── Диаграмма рассеяния: сюрприз (σ) × реакция (доля дневного диапазона) ─────
function SurpriseScatter({ stats }) {
  const { useState, useMemo } = React;
  const [instrument, setInstrument] = useState("GOLD");
  const scatter = (stats && stats.scatter) || [];
  const symbols = useMemo(() => Array.from(new Set(scatter.map(p => p.symbol))).sort(), [scatter]);
  const points = useMemo(() => scatter.filter(p => p.symbol === instrument && p.move_30m_norm != null), [scatter, instrument]);

  const W = 720, H = 260, PAD = 30;
  const X_MAX = 4.5, Y_MAX = 1.4;
  const toX = s => PAD + ((Math.max(-X_MAX, Math.min(X_MAX, s)) + X_MAX) / (2*X_MAX)) * (W - 2*PAD);
  const toY = m => H - PAD - (Math.min(Y_MAX, m) / Y_MAX) * (H - 2*PAD);

  const bins = (stats && stats.bins) || [];

  return (
    <div>
      <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
        {symbols.map(s => (
          <button key={s} onClick={()=>setInstrument(s)} style={{fontFamily:"monospace",fontSize:10.5,padding:"5px 10px",cursor:"pointer",background:s===instrument?C.gold:"#fff",color:s===instrument?"#18181a":C.inkMid,border:`1px solid ${s===instrument?C.gold:C.border}`,borderRadius:3}}>{window.SBFSymbols ? window.SBFSymbols.symbolName(s, {lang: INITIAL_LANG, mode:"name+ticker"}) : s}</button>
        ))}
      </div>
      <div style={{overflowX:"auto"}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",minWidth:520,background:C.surface,border:`1px solid ${C.border}`,borderRadius:6}}>
          <line x1={toX(0)} y1={PAD} x2={toX(0)} y2={H-PAD} stroke={C.border} strokeWidth="1"/>
          <line x1={PAD} y1={H-PAD} x2={W-PAD} y2={H-PAD} stroke={C.border} strokeWidth="1"/>
          {bins.map((b,i) => {
            if (b.median_move == null) return null;
            const x1 = toX(b.from), x2 = toX(b.to != null ? b.to : X_MAX);
            const y = toY(b.median_move);
            return <line key={i} x1={x1} y1={y} x2={x2} y2={y} stroke={C.red} strokeWidth="2" opacity="0.55"/>;
          })}
          {points.map((p,i) => (
            <circle key={i} cx={toX(p.surprise_sigma)} cy={toY(p.move_30m_norm)} r="2.4" fill={C.gold} opacity="0.35">
              <title>{p.event_type} · {p.date} · {p.surprise_sigma}σ · {p.move_30m_norm}</title>
            </circle>
          ))}
          <text x={W/2} y={H-8} textAnchor="middle" fontSize="9" fontFamily="monospace" fill={C.inkFaint}>surprise, σ</text>
        </svg>
      </div>
      <p style={{fontSize:11,color:C.inkFaint,marginTop:8,fontStyle:"italic"}}>{window.SBFSymbols ? window.SBFSymbols.symbolName(instrument, {lang: INITIAL_LANG, mode:"name+ticker"}) : instrument} · {points.length} {INITIAL_LANG==="ru"?"точек":INITIAL_LANG==="ro"?"puncte":"points"} · {INITIAL_LANG==="ru"?"красная линия — медиана по бину":INITIAL_LANG==="ro"?"linia roșie — mediana pe bin":"red line — bin median"}</p>
    </div>
  );
}

// ─── Squeeze trainer (Bollinger Bands) — реальные бары GOLD M30, ротация из
// трёх реальных дней (пробой вверх / вниз / без пробоя). Полосы считаются
// (SMA20 ± 2·SD20) из настоящих закрытий, не рисуются формулой по индексу.
// Keys are neutral day IDs, not outcome claims: the real breakout direction
// is computed live from current data (see scenarioDirs in SqueezeTrainer),
// not hardcoded here. Found live 29.07: ohlc_GOLD_M30.json is append-only
// (never rolls), but 2 of these 3 squeeze points now compute a DIFFERENT
// direction than whatever they showed when first verified (day1 -> "none"
// today, not "up"; day3 -> "down", not "none") -- real feeds get corrected/
// revised after the fact, so a hardcoded direction label WILL eventually
// drift from what the formula actually says and contradict it on screen.
const SQUEEZE_SCENARIOS = [
  { key: "day1", squeezeIdx: 2135 },
  { key: "day2", squeezeIdx: 703 },
  { key: "day3", squeezeIdx: 962 },
];
const SQUEEZE_HALF_WINDOW = 35;
const SQUEEZE_BB_PERIOD = 20;
const SQUEEZE_CHECK_OFFSET = 25; // где именно проверяем пробой относительно точки сжатия — фиксированная точка, не последний видимый бар (иначе классификация "up/down/none" плывёт при любом изменении окна)

function useGoldM30() {
  const [candles, setCandles] = React.useState(null);
  React.useEffect(() => {
    let cancelled = false;
    fetch("/data/ohlc_GOLD_M30.json").then(r => r.json()).then(d => {
      if (!cancelled && d && Array.isArray(d.candles)) setCandles(d.candles);
    }).catch(() => {});
    return () => { cancelled = true; };
  }, []);
  return candles;
}

function bollinger(closes, i, period) {
  if (i < period - 1) return null;
  const win = closes.slice(i - period + 1, i + 1);
  const mean = win.reduce((a,b)=>a+b,0) / period;
  const variance = win.reduce((a,b)=>a+(b-mean)*(b-mean),0) / period;
  const sd = Math.sqrt(variance);
  return { mean, upper: mean + 2*sd, lower: mean - 2*sd };
}

function SqueezeTrainer() {
  const { useState, useRef, useMemo, useEffect } = React;
  const T6 = window.Ch6Content[INITIAL_LANG] || window.Ch6Content.ru;
  const sq = T6.squeeze;
  const candles = useGoldM30();
  const [scenario, setScenario] = useState("day1");

  const closes = useMemo(() => candles ? candles.map(c => +c.close) : [], [candles]);
  const bands = useMemo(() => closes.length ? closes.map((_,i) => bollinger(closes, i, SQUEEZE_BB_PERIOD)) : [], [closes]);
  // Real breakout direction per scenario, computed fresh every render from
  // whatever the data says right now -- see the SQUEEZE_SCENARIOS comment.
  const scenarioDirs = useMemo(() => {
    const out = {};
    if (!bands.length) return out;
    SQUEEZE_SCENARIOS.forEach(s => {
      const b = bands[s.squeezeIdx];
      const cc = closes[s.squeezeIdx + SQUEEZE_CHECK_OFFSET];
      out[s.key] = (b && cc != null) ? (cc > b.upper ? "up" : cc < b.lower ? "down" : "none") : null;
    });
    return out;
  }, [bands, closes]);

  const [revealed, setRevealed] = useState(false);
  const [msg, setMsg] = useState(sq.initialMsg);
  const [errFlash, setErrFlash] = useState(false);
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const seriesRef = useRef({});
  const clickHandlerRef = useRef(null);

  useEffect(() => { setRevealed(false); setMsg(sq.initialMsg); }, [scenario]);

  const scenarioIdx = SQUEEZE_SCENARIOS.findIndex(s => s.key === scenario);
  const { squeezeIdx } = SQUEEZE_SCENARIOS[scenarioIdx];
  const start = squeezeIdx - SQUEEZE_HALF_WINDOW, end = squeezeIdx + SQUEEZE_HALF_WINDOW;
  const zoneLocalStart = SQUEEZE_HALF_WINDOW - 7, zoneLocalEnd = SQUEEZE_HALF_WINDOW + 7;

  // SPEC_charts_and_interactivity_standard.md: this used to be a hand-rolled
  // <svg><path d=...> spline (real Bollinger math, fake render -- the spec's
  // own named worst-case example). Rebuilt on real LightweightCharts candles
  // + real band lines, real price/time axes, data-source attribute below.
  const windowCandles = useMemo(() => (candles ? candles.slice(start, end + 1) : []), [candles, start, end]);
  const windowBands = useMemo(() => (bands.length ? bands.slice(start, end + 1) : []), [bands, start, end]);

  const breakoutDir = scenarioDirs[scenario] ?? null;
  const breakoutText = breakoutDir === "up" ? sq.breakoutLabel : breakoutDir === "down" ? sq.breakoutLabelDown : sq.noBreakoutLabel;
  const dayWord = INITIAL_LANG==="ru"?"День":INITIAL_LANG==="ro"?"Ziua":"Day";
  const squeezeDate = candles && candles[squeezeIdx] ? new Date(candles[squeezeIdx].time * 1000).toLocaleDateString(INITIAL_LANG === "ru" ? "ru-RU" : INITIAL_LANG === "ro" ? "ro-RO" : "en-US", {day:"numeric", month:"long", year:"numeric"}) : "";

  const reset = () => { setRevealed(false); setMsg(sq.initialMsg); };

  clickHandlerRef.current = (time) => {
    if (revealed || !candles) return;
    const zoneStartTime = candles[squeezeIdx - 7].time, zoneEndTime = candles[squeezeIdx + 7].time;
    if (time >= zoneStartTime && time <= zoneEndTime) { setRevealed(true); setMsg(sq.correctMsg); }
    else { setMsg(sq.wrongMsg); setErrFlash(true); setTimeout(()=>setErrFlash(false),500); }
  };

  // Create the chart once.
  useEffect(() => {
    if (!containerRef.current || chartRef.current || typeof LightweightCharts === "undefined") return;
    const chart = LightweightCharts.createChart(containerRef.current, {
      width: containerRef.current.clientWidth, height: 320,
      layout: { background: { color: C.chartBg }, textColor: "rgba(255,255,255,0.55)" },
      grid: { vertLines: { color: "rgba(255,255,255,0.05)" }, horzLines: { color: "rgba(255,255,255,0.05)" } },
      rightPriceScale: { borderColor: "rgba(255,255,255,0.15)" },
      timeScale: { borderColor: "rgba(255,255,255,0.15)", timeVisible: true, secondsVisible: false },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: C.chartGreen, downColor: C.chartRed, borderUpColor: C.chartGreen, borderDownColor: C.chartRed,
      wickUpColor: C.chartGreen, wickDownColor: C.chartRed,
    });
    const upperSeries = chart.addLineSeries({ color: C.blue, lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
    const lowerSeries = chart.addLineSeries({ color: C.blue, lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
    chartRef.current = chart;
    seriesRef.current = { candleSeries, upperSeries, lowerSeries };
    chart.subscribeClick(param => { if (param.time != null && clickHandlerRef.current) clickHandlerRef.current(param.time); });
    const ro = new ResizeObserver(entries => { if (entries[0]) chart.applyOptions({ width: entries[0].contentRect.width }); });
    ro.observe(containerRef.current);
    return () => { ro.disconnect(); chart.remove(); chartRef.current = null; };
  }, []);

  // Push real data whenever the scenario/reveal state changes.
  useEffect(() => {
    const { candleSeries, upperSeries, lowerSeries } = seriesRef.current;
    if (!candleSeries || !windowCandles.length) return;
    const visibleCount = revealed ? windowCandles.length : Math.min(zoneLocalEnd + 1, windowCandles.length);
    const visible = windowCandles.slice(0, visibleCount);
    candleSeries.setData(visible.map(c => ({ time: c.time, open: +c.open, high: +c.high, low: +c.low, close: +c.close })));
    const bandSlice = windowBands.slice(0, visibleCount);
    upperSeries.setData(bandSlice.map((b,i) => b ? { time: visible[i].time, value: b.upper } : null).filter(Boolean));
    lowerSeries.setData(bandSlice.map((b,i) => b ? { time: visible[i].time, value: b.lower } : null).filter(Boolean));
    if (revealed && candles) {
      candleSeries.setMarkers([{ time: candles[squeezeIdx - 7].time, position: "aboveBar", color: C.gold, shape: "arrowDown", text: "SQUEEZE" }]);
    } else {
      candleSeries.setMarkers([]);
    }
    chartRef.current.timeScale().fitContent();
  }, [windowCandles, windowBands, revealed, zoneLocalEnd]);

  return (
    <div>
      <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
        {SQUEEZE_SCENARIOS.map((s,i) => {
          const dir = scenarioDirs[s.key];
          const dirText = dir === "up" ? sq.breakoutLabel : dir === "down" ? sq.breakoutLabelDown : dir === "none" ? sq.noBreakoutLabel : "…";
          return (
            <button key={s.key} onClick={()=>setScenario(s.key)} style={{fontFamily:"monospace",fontSize:11,padding:"7px 14px",cursor:"pointer",background:s.key===scenario?C.gold:"#fff",color:s.key===scenario?"#18181a":C.inkMid,border:`1px solid ${s.key===scenario?C.gold:C.border}`,borderRadius:4,fontWeight:600}}>{dayWord} {i+1} · {dirText.toLowerCase()}</button>
          );
        })}
      </div>
      <div style={{background:C.surface, border:`1px solid ${errFlash ? C.red : C.border}`, borderRadius:8, padding:"40px", transition:"border 0.3s"}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:32}}>
          <span style={{fontSize:32}}>🗜️</span>
          <div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:24,color:C.black}}>{sq.header}</div>
            <Mono size={11} color={C.inkSoft} spacing={2}>{sq.badge} · {squeezeDate}</Mono>
          </div>
        </div>

        <div style={{marginBottom:24,padding:"16px 20px",background:revealed?"rgba(45,122,79,0.08)":C.surfaceMid,borderRadius:6,color:revealed?C.green:C.inkMid,fontWeight:revealed?600:400,fontSize:14,borderLeft:revealed?`4px solid ${C.green}`:"4px solid transparent",transition:"all .3s"}}>
          {msg}
        </div>

        <div style={{position:"relative",borderRadius:6,overflow:"hidden",cursor:revealed?"default":"crosshair"}}>
          <div ref={containerRef} data-source="/data/ohlc_GOLD_M30.json"/>
          {!revealed && (
            <div style={{position:"absolute",top:0,right:0,bottom:0,width:"22%",background:"rgba(19,23,34,0.92)",display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(2px)",pointerEvents:"none"}}>
              <span style={{color:"rgba(255,255,255,0.4)",fontSize:12,fontFamily:"monospace",letterSpacing:1.5,textAlign:"center",padding:"0 8px"}}>{sq.futureHidden}</span>
            </div>
          )}
        </div>

        {revealed && (
          <div style={{marginTop:20,textAlign:"center"}}>
            <div style={{fontSize:16,fontWeight:700,color:breakoutDir==="none"?C.inkMid:C.green,marginBottom:16}}>{breakoutText}</div>
            <button onClick={reset} style={{background:"transparent",border:`1px solid ${C.inkMid}`,color:C.inkMid,padding:"10px 20px",borderRadius:4,cursor:"pointer",fontSize:12,fontFamily:"monospace",fontWeight:700,letterSpacing:1}}>{sq.hideBtn}</button>
          </div>
        )}
      </div>
      <p style={{fontSize:12,color:C.inkSoft,lineHeight:1.65,marginTop:14,fontStyle:"italic",maxWidth:780}}>{sq.calendarLink}</p>
      <a href="/chart.html?s=GOLD" target="_blank" rel="noopener" style={{fontFamily:"monospace",fontSize:12,color:C.gold,textDecoration:"none",borderBottom:`1px dotted ${C.gold}`}}>
        {(() => { const symLabel = window.SBFSymbols ? window.SBFSymbols.symbolName("GOLD", {lang: INITIAL_LANG, mode:"name+ticker"}) : "GOLD"; return INITIAL_LANG==="ru"?`Открыть ${symLabel} на графике →`:INITIAL_LANG==="ro"?`Deschide ${symLabel} pe grafic →`:`Open ${symLabel} on the chart →`; })()}
      </a>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginTop:28}} className="g2">
        <InfoCard title={sq.smaTitle} text={sq.smaText}/>
        <InfoCard title={sq.extremeTitle} text={sq.extremeText}/>
        <InfoCard title={sq.expansionTitle} text={sq.expansionText}/>
        <InfoCard title={sq.squeezeTitle} text={sq.squeezeText}/>
      </div>
    </div>
  );
}

      </div>

      <div style={{background:C.black,padding:"80px 5vw 70px",textAlign:"center",position:"relative",overflow:"hidden"}}>

          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <Chip color={C.gold}>{S.fundamentalChip}</Chip>
            <Chip color="rgba(255,255,255,0.3)">{S.technicalChip}</Chip>

      </div>

      {loading && <div style={{textAlign:"center",padding:"60px 0",fontFamily:"monospace",fontSize:13,color:C.inkFaint}}>{S.loadingLabel}</div>}
      {error && <div style={{textAlign:"center",padding:"40px 0",fontFamily:"monospace",fontSize:13,color:"#c0392b",background:C.redPale}}>{S.loadErrorLabel}</div>}

      {!loading && (
      <div style={{maxWidth:1060,margin:"0 auto",padding:"0 0 120px"}}>

        {/* SPEC_ch6_debug.md §1 (сквозное, здесь -- только для главы 6):
            margin:"0 -5vw" внутри maxWidth:1060 колонки не даёт настоящий
            full-bleed -- -5vw считается от вьюпорта, а доступная ширина уже
            обрезана родителем до 1060px, поэтому по краям оставались белые
            полосы (тёмный блок "уже по ширине", встык с полноширинным hero).

          <Mono size={10} color={C.inkFaint} spacing={2} style={{display:"block",marginBottom:10,textTransform:"uppercase"}}>{T6.sources.tag}</Mono>
          {/* SPEC_ch6_debug.md §6 (сквозное, здесь -- только для главы 6):
              был путь к таблицам БД и скрипту вместо реквизитов источника.

          <ol style={{fontSize:11.5,color:C.inkMid,lineHeight:1.8,paddingLeft:18,marginBottom:8}}>
            {T6.sources.list.map((s,i) => <li key={i}>{s}</li>)}

            {S.nextChapterBtn}

      </div>
      )}
    </div>
  );
}
