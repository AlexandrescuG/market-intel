// SceneEngine mounting helper (vanilla JS, ref-callback pattern -- same
// convention as chapters 1-3's era/scene renderers). Each JSX page defines
// its own copy since there's no shared module system between Jinja pages.
function SceneMount({ url, mode, symbol, copy }) {
  const { useRef, useEffect } = React;
  const ref = useRef(null);
  useEffect(() => {
    let cancelled = false;
    fetch(url).then(r => r.json()).then(data => {
      if (!cancelled && ref.current) window.SceneEngine.mount(ref.current, { mode, data, symbol, copy });
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [url]);
  return <div ref={ref}/>;
}

// ─── "Где ставить отложенные ордера" -- SPEC_ch4_debug.md §4.2. Было: статичная
// схема с четырьмя зонами на абстрактной линии. Теперь: одна перетаскиваемая
// (мышью и пальцем) линия на РЕАЛЬНЫХ M30-свечах GOLD; тип ордера -- не
// зазубренная из четырёх комбинаций, а прямое следствие того, где линия стоит
// относительно текущей цены. Подписи -- HTML поверх SVG (position:absolute,
// %-based top), а не текст внутри viewBox: при масштабировании 680-юнитного
// viewBox до 390px текст внутри SVG уезжал бы к нечитаемым ~6px, HTML-оверлей
// от этого не зависит и получает свой обычный responsive font-size из CSS.
function PendingOrderScheme() {
  const { useState, useEffect, useRef } = React;
  const T4 = window.Ch4Content[INITIAL_LANG] || window.Ch4Content.ru;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const P = T4.pendingScheme;

  const [candles, setCandles] = useState(null);
  const [levelPrice, setLevelPrice] = useState(null);
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const seriesRef = useRef({});
  const draggingRef = useRef(false);
  const priceLineRef = useRef(null);

  useEffect(() => {
    fetch("/data/ohlc_GOLD_M30.json").then(r => r.json()).then(d => {
      const all = d && d.candles;
      if (!Array.isArray(all) || !all.length) return;
      const recent = all.slice(-32);
      const highs = recent.map(c => c.high), lows = recent.map(c => c.low);
      const span = Math.max(...highs) - Math.min(...lows);
      setCandles(recent);
      setLevelPrice(recent[recent.length - 1].close + span * 0.22);
    }).catch(() => {});
  }, []);

  const currentPrice = candles ? candles[candles.length - 1].close : null;
  const eps = candles ? (Math.max(...candles.map(c=>c.high)) - Math.min(...candles.map(c=>c.low))) * 0.006 : 0;
  const above = levelPrice != null && currentPrice != null && levelPrice > currentPrice + eps;
  const below = levelPrice != null && currentPrice != null && levelPrice < currentPrice - eps;
  const levelColor = above ? "#0ea5e9" : below ? C.chartGreen : "rgba(255,255,255,0.35)";
  const levelLabel = above ? "BUY STOP · SELL LIMIT" : below ? "BUY LIMIT · SELL STOP" : "···";

  // SPEC_charts_and_interactivity_standard.md §2 (29.07 re-audit): this
  // already drew real OHLC candlesticks (not a spline) but with a
  // hand-rolled <svg>, no axes, no data-source. Real lightweight-charts
  // candles + real axes now; the draggable level stays a real
  // createPriceLine(), dragged via coordinateToPrice() on pointer events.
  useEffect(() => {
    if (!containerRef.current || chartRef.current || typeof LightweightCharts === "undefined") return;
    const chart = LightweightCharts.createChart(containerRef.current, {
      width: containerRef.current.clientWidth, height: 240,
      layout: { background: { color: C.black }, textColor: "rgba(255,255,255,0.5)" },
      grid: { vertLines: { color: "rgba(255,255,255,0.05)" }, horzLines: { color: "rgba(255,255,255,0.05)" } },
      rightPriceScale: { borderColor: "rgba(255,255,255,0.15)" },
      timeScale: { borderColor: "rgba(255,255,255,0.15)", timeVisible: true, secondsVisible: false },
      handleScroll: false, handleScale: false,
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: C.chartGreen, downColor: C.chartRed, borderUpColor: C.chartGreen, borderDownColor: C.chartRed,
      wickUpColor: C.chartGreen, wickDownColor: C.chartRed,
    });
    chartRef.current = chart;
    seriesRef.current = { candleSeries };
    const ro = new ResizeObserver(entries => { if (entries[0]) chart.applyOptions({ width: entries[0].contentRect.width }); });
    ro.observe(containerRef.current);

    var setFromClientY = function (clientY) {
      var rect = containerRef.current.getBoundingClientRect();
      var y = Math.max(0, Math.min(rect.height, clientY - rect.top));
      var p = candleSeries.coordinateToPrice(y);
      if (p != null) setLevelPrice(p);
    };
    var onMove = function (e) { if (draggingRef.current) { e.preventDefault(); setFromClientY(e.touches ? e.touches[0].clientY : e.clientY); } };
    var onUp = function () { draggingRef.current = false; };
    var onDown = function (e) { draggingRef.current = true; setFromClientY(e.touches ? e.touches[0].clientY : e.clientY); };
    var el = containerRef.current;
    el.style.cursor = "ns-resize"; el.style.touchAction = "none";
    el.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    el.addEventListener("touchstart", onDown, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onUp);

    return () => {
      ro.disconnect();
      el.removeEventListener("mousedown", onDown);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      el.removeEventListener("touchstart", onDown);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend", onUp);
      chart.remove(); chartRef.current = null;
    };
  }, []);

  useEffect(() => {
    const s = seriesRef.current;
    if (!s.candleSeries || !candles) return;
    s.candleSeries.setData(candles.map(c => ({ time: c.time, open: +c.open, high: +c.high, low: +c.low, close: +c.close })));
    chartRef.current.timeScale().fitContent();
  }, [candles]);

  useEffect(() => {
    const s = seriesRef.current;
    if (!s.candleSeries || levelPrice == null) return;
    if (priceLineRef.current) s.candleSeries.removePriceLine(priceLineRef.current);
    priceLineRef.current = s.candleSeries.createPriceLine({
      price: levelPrice, color: levelColor, lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: levelLabel,
    });
  }, [levelPrice, levelColor, levelLabel]);

  return (
    <div style={{background:C.black,borderRadius:6,padding:"28px 32px",marginBottom:56,overflow:"hidden"}}>
      <Mono size={11} color={C.goldText} spacing={3} style={{display:"block",marginBottom:16}}>{S.pendingDiagramLabel}</Mono>
      <p style={{fontSize:12,color:"rgba(255,255,255,0.55)",marginBottom:14}}>{P.hint}</p>
      <div ref={containerRef} data-source="/data/ohlc_GOLD_M30.json" style={{minHeight:240}}/>
      {(above || below) && (
        <p style={{fontSize:12.5,color:"rgba(255,255,255,0.75)",lineHeight:1.7,marginTop:18,marginBottom:0,maxWidth:620}}>
          {above ? P.aboveExplain : P.belowExplain}
        </p>
      )}
    </div>
  );
}

// ─── Interactive 2: Limit Order Catcher Game ─────────────────────────────────
function LimitCatcher() {
  const { useState, useEffect, useRef, useCallback } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  const W = 680, H = 300;
  const PRICE_MIN = 2490, PRICE_MAX = 2530;
  const toY = p => H - ((p - PRICE_MIN) / (PRICE_MAX - PRICE_MIN)) * H;
  const toP = y => PRICE_MIN + ((H - y) / H) * (PRICE_MAX - PRICE_MIN);

  const STOP_LIMIT_GAP = 1.5; // fixed buffer between the stop trigger and the limit price it hands off to
  const [limitPrice, setLimitPrice] = useState(2508);
  const [orderType, setOrderType] = useState("limit_buy"); // limit_buy | limit_sell | stop_buy | stop_sell | stop_limit | trailing_stop
  const [candles, setCandles] = useState(() => generateCandles(15, 2510));
  const [score, setScore] = useState(0);
  const [misses, setMisses] = useState(0);
  const [hits, setHits] = useState([]);
  const [running, setRunning] = useState(false);
  const [dragging, setDragging] = useState(false);
  const [stopLimitTriggered, setStopLimitTriggered] = useState(false);
  const [trailDistance, setTrailDistance] = useState(6);
  const [trailPeak, setTrailPeak] = useState(null);
  const svgRef = useRef(null);
  const intervalRef = useRef(null);

  // Switching order type resets any in-progress state from the previous type
  // (a half-triggered stop-limit or an accumulated trailing peak shouldn't
  // carry over to a freshly-selected order).
  useEffect(() => {
    setStopLimitTriggered(false);
    setTrailPeak(null);
  }, [orderType]);

  function generateCandles(n, startPrice) {
    let price = startPrice;
    return Array.from({length: n}, (_, i) => {
      const change = (Math.random() - 0.48) * 8;
      const open = price;
      const close = price + change;
      const high = Math.max(open, close) + Math.random() * 5;
      const low  = Math.min(open, close) - Math.random() * 5;
      price = close;
      return { open, close, high, low, x: i * (W / n) + 10 };
    });
  }

  const candleW = Math.floor(W / 15) - 4;

  // 🔴 Последнее состояние в ref — чтобы тик таймера не зависел от него ссылкой.
  //
  // Было: addCandle — useCallback с deps [limitPrice, orderType,
  // stopLimitTriggered, trailPeak, trailDistance], а эффект с таймером зависел
  // от addCandle. Перетаскивание линии ордера меняет limitPrice на КАЖДОМ
  // движении мыши, то есть на каждом кадре пересоздавалась функция, из-за неё
  // пересоздавался эффект, а из-за него — clearInterval + setInterval.
  // Итог: пока ведёшь линию, интервал в 1200 мс никогда не досчитывает до
  // конца, свечи стоят, а после отпускания рывком догоняют. Это и читается
  // как «тренажёр лагает».
  //
  // Присваивание во время рендера здесь намеренное: ref должен содержать
  // значения ЭТОГО рендера к моменту, когда сработает тик. Побочных эффектов
  // наружу нет, повторный рендер с теми же данными ничего не меняет.
  const stateRef = useRef({});
  stateRef.current = { candles, limitPrice, orderType, stopLimitTriggered,
                       trailPeak, trailDistance };

  const addCandle = useCallback(() => {
    const st = stateRef.current;
    const { limitPrice, orderType, stopLimitTriggered, trailPeak, trailDistance } = st;
    {
      const prev = st.candles;
      const last = prev[prev.length - 1];
      const change = (Math.random() - 0.48) * 8;
      const open = last.close;
      const close = open + change;
      const high = Math.max(open, close) + Math.random() * 6;
      const low  = Math.min(open, close) - Math.random() * 6;

      const newCandle = { open, close, high, low, x: (W/15)*14 + 10 };

      // Check hit
      const clampedLow  = Math.max(PRICE_MIN, low);
      const clampedHigh = Math.min(PRICE_MAX, high);
      const isBuy  = orderType === "limit_buy"  && limitPrice >= clampedLow  && limitPrice <= close;
      const isSell = orderType === "limit_sell" && limitPrice <= clampedHigh && limitPrice >= close;
      const isStopB= orderType === "stop_buy"   && limitPrice <= clampedHigh && limitPrice >= open;
      const isStopS= orderType === "stop_sell"  && limitPrice >= clampedLow  && limitPrice <= open;

      let stopLimitHitPrice = null;
      if (orderType === "stop_limit") {
        const stop = limitPrice, limit = limitPrice + STOP_LIMIT_GAP;
        const triggersThisCandle = stop <= clampedHigh && stop >= open;
        const isTriggered = stopLimitTriggered || triggersThisCandle;
        // Once triggered, a pending limit order sits at `limit`. It only fills
        // if price actually trades there -- if the candle gaps straight past
        // both levels without the range covering `limit`, it's a real, honest
        // miss (this is the "risk of not filling on a strong move" the
        // Block 2 card already warns about, not a bug).
        if (isTriggered && limit <= clampedHigh && limit >= clampedLow) {
          stopLimitHitPrice = limit;
        } else if (!stopLimitTriggered && triggersThisCandle) {
          setStopLimitTriggered(true);
        }
      }

      let trailHitPrice = null;
      let nextTrailPeak = trailPeak;
      if (orderType === "trailing_stop") {
        nextTrailPeak = Math.max(trailPeak ?? open, high);
        const trailLevel = nextTrailPeak - trailDistance;
        if (trailLevel >= clampedLow && trailLevel <= open) {
          trailHitPrice = trailLevel;
        } else {
          setTrailPeak(nextTrailPeak);
        }
      }

      if (isBuy || isSell || isStopB || isStopS) {
        setScore(s => s + 1);
        setHits(h => [...h.slice(-4), {price: limitPrice, x: newCandle.x, type: orderType}]);
      } else if (stopLimitHitPrice != null) {
        setScore(s => s + 1);
        setHits(h => [...h.slice(-4), {price: stopLimitHitPrice, x: newCandle.x, type: orderType}]);
        setStopLimitTriggered(false);
      } else if (trailHitPrice != null) {
        setScore(s => s + 1);
        setHits(h => [...h.slice(-4), {price: trailHitPrice, x: newCandle.x, type: orderType}]);
        setTrailPeak(null);
      }

      const shifted = prev.slice(1).map(c => ({...c, x: c.x - W/15}));
      setCandles([...shifted, newCandle]);
    }
    // 🔴 Пустой список зависимостей — в этом весь смысл правки: ссылка на
    // функцию стабильна, эффект с таймером её не пересоздаёт. Свежие значения
    // берутся из stateRef при каждом вызове.
    //
    // Заодно исчезла вторая проблема: setScore / setHits / setTrailPeak
    // вызывались ВНУТРИ updater-функции setCandles(prev => ...). Такая функция
    // обязана быть чистой, а React 18 в StrictMode вызывает её дважды именно
    // чтобы это вскрыть — счёт исполненных ордеров мог удваиваться. Теперь
    // все setState вызываются на одном уровне, из тела тика.
  }, []);

  useEffect(() => {
    if (!running) return undefined;
    const id = setInterval(addCandle, 1200);
    intervalRef.current = id;
    return () => clearInterval(id);
  }, [running, addCandle]);

  const getSVGY = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return (clientY - rect.top) * (H / rect.height);
  };

  const orderTypes = [
    {key:"limit_buy",   label:"BUY LIMIT",    color:C.chartGreenText, desc:S.descBuyLimit},
    {key:"limit_sell",  label:"SELL LIMIT",   color:C.chartRedText,   desc:S.descSellLimit},
    {key:"stop_buy",    label:"BUY STOP",     color:"#0ea5e9",    desc:S.descBuyStop},
    {key:"stop_sell",   label:"SELL STOP",    color:"#f59e0b",    desc:S.descSellStop},
    {key:"stop_limit",  label:"STOP LIMIT",   color:"#8b5cf6",    desc:S.descStopLimit},
    {key:"trailing_stop",label:"TRAILING STOP",color:"#14b8a6",   desc:S.descTrailingStop},
  ];
  const ORDER_COLOR_RGBA = {"#089981":"8,153,129","#f23645":"242,54,69","#0ea5e9":"14,165,233","#f59e0b":"245,158,11","#8b5cf6":"139,92,246","#14b8a6":"20,184,166"};
  const curOrder = orderTypes.find(o => o.key === orderType);
  const limitY = toY(limitPrice);
  const currentPrice = candles[candles.length - 1]?.close || 2510;
  const stopLimitFillPrice = limitPrice + STOP_LIMIT_GAP;
  const trailDisplayLevel = (trailPeak ?? currentPrice) - trailDistance;

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"36px 40px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24,flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <Icon name="game" size={24} color={C.goldText}/>
          <div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black}}>{S.gameTitle}</div>
            <Mono size={11} color={C.inkSoft} spacing={2}>{S.gameTag}</Mono>
          </div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:10,color:C.inkSoft,letterSpacing:1}}>{S.executedLabel}</div>
            <div style={{fontSize:24,fontWeight:700,color:C.green,fontFamily:"monospace"}}>{score}</div>
          </div>
          <button

        </div>

      {/* SPEC_charts_and_interactivity_standard.md §2.1 (29.07 re-audit): this

          swaps done elsewhere this session. Honest labeling instead, per

          candles for that claim are in PendingOrderScheme, right above. */}

            {o.label}<br/><span style={{fontSize:10,fontWeight:400,opacity:0.7}}>{o.desc}</span>

        ))}
      </div>

      {/* Chart */}
      <div style={{borderRadius:4,overflow:"hidden",border:`1px solid rgba(24,24,26,0.1)`,cursor:"ns-resize",marginBottom:16,position:"relative"}}>
        <svg
          ref={svgRef}
          viewBox={`0 0 ${W} ${H}`}
          style={{width:"100%",display:"block",background:C.chartBg,userSelect:"none",touchAction:"none"}}
          onMouseDown={e => {
            setDragging(true);
            const p = toP(getSVGY(e));
            if (orderType === "trailing_stop") {
              if (trailPeak == null) setTrailPeak(currentPrice);
              setTrailDistance(Math.round(Math.max(1, Math.min(20, currentPrice - p)) * 10) / 10);
            } else {
              setLimitPrice(Math.round(p*100)/100);
            }
          }}
          onMouseMove={e => {
            if (!dragging) return;
            const p = Math.max(PRICE_MIN, Math.min(PRICE_MAX, toP(getSVGY(e))));
            if (orderType === "trailing_stop") {
              setTrailDistance(Math.round(Math.max(1, Math.min(20, currentPrice - p)) * 10) / 10);
            } else {
              setLimitPrice(Math.round(p*100)/100);
            }
          }}
          onMouseUp={() => setDragging(false)}
          onMouseLeave={() => setDragging(false)}>

          {/* Grid */}
          {[2495,2500,2505,2510,2515,2520,2525].map(p => (
            <g key={p}>
              <line x1="0" y1={toY(p)} x2={W} y2={toY(p)} stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>
              <text x="4" y={toY(p)-3} fontSize="9" fill="rgba(255,255,255,0.2)" fontFamily="monospace">{p}</text>
            </g>
          ))}

          {/* Candles */}
          {candles.map((c,i) => {
            const bull = c.close >= c.open;
            const col = bull ? C.chartGreen : C.chartRed;
            const bodyT = toY(Math.max(c.open, c.close));
            const bodyB = toY(Math.min(c.open, c.close));
            return (
              <g key={i}>
                <line x1={c.x} y1={Math.max(0,toY(c.high))} x2={c.x} y2={Math.min(H,toY(c.low))} stroke={col} strokeWidth="1.5"/>
                <rect x={c.x-candleW/2} y={bodyT} width={candleW} height={Math.max(bodyB-bodyT,1)} fill={col} rx="1"/>
              </g>
            );
          })}

          {/* Hit markers */}
          {hits.map((h,i) => (
            <g key={i}>
              <circle cx={h.x} cy={toY(h.price)} r="6" fill={curOrder.color} opacity="0.8"/>
              <use href="#ic-check" x={h.x-4} y={toY(h.price)-4} width="8" height="8" color="#fff"/>
            </g>
          ))}

          {/* Order line(s) */}
          {orderType === "stop_limit" ? (
            <React.Fragment>
              <line x1="0" y1={limitY} x2={W} y2={limitY} stroke={curOrder.color} strokeWidth="1.5" strokeDasharray="6 3" opacity={stopLimitTriggered?0.35:1}/>
              <rect x={W-105} y={limitY-12} width={103} height={20} fill={curOrder.color} opacity={stopLimitTriggered?0.4:0.9} rx="2"/>
              <text x={W-54} y={limitY+3} fontSize="10" fill="#fff" textAnchor="middle" fontFamily="monospace" fontWeight="700">
                STOP {limitPrice.toFixed(1)}
              </text>
              <line x1="0" y1={toY(stopLimitFillPrice)} x2={W} y2={toY(stopLimitFillPrice)} stroke={curOrder.color} strokeWidth="1.5" strokeDasharray="2 2"/>
              <rect x={W-105} y={toY(stopLimitFillPrice)-12} width={103} height={20} fill={curOrder.color} opacity={stopLimitTriggered?0.9:0.4} rx="2"/>
              <text x={W-54} y={toY(stopLimitFillPrice)+3} fontSize="10" fill="#fff" textAnchor="middle" fontFamily="monospace" fontWeight="700">
                LIMIT {stopLimitFillPrice.toFixed(1)}
              </text>
            </React.Fragment>
          ) : orderType === "trailing_stop" ? (
            <React.Fragment>
              {trailPeak != null && (
                <line x1="0" y1={toY(trailPeak)} x2={W} y2={toY(trailPeak)} stroke={curOrder.color} strokeWidth="1" strokeDasharray="1 3" opacity="0.4"/>
              )}
              <line x1="0" y1={toY(trailDisplayLevel)} x2={W} y2={toY(trailDisplayLevel)} stroke={curOrder.color} strokeWidth="1.5"/>
              <rect x={W-115} y={toY(trailDisplayLevel)-12} width={113} height={20} fill={curOrder.color} opacity="0.9" rx="2"/>
              <text x={W-59} y={toY(trailDisplayLevel)+3} fontSize="10" fill="#fff" textAnchor="middle" fontFamily="monospace" fontWeight="700">
                TRAIL {trailDisplayLevel.toFixed(1)} (−{trailDistance})
              </text>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <line x1="0" y1={limitY} x2={W} y2={limitY} stroke={curOrder.color} strokeWidth="1.5" strokeDasharray="6 3"/>
              <rect x={W-105} y={limitY-12} width={103} height={20} fill={curOrder.color} opacity="0.9" rx="2"/>
              <text x={W-54} y={limitY+3} fontSize="10" fill="#fff" textAnchor="middle" fontFamily="monospace" fontWeight="700">
                {curOrder.label} {limitPrice.toFixed(1)}
              </text>
            </React.Fragment>
          )}

          {/* Current price */}
          <line x1="0" y1={toY(currentPrice)} x2={W} y2={toY(currentPrice)} stroke="rgba(255,255,255,0.2)" strokeWidth="1"/>
          <rect x="0" y={toY(currentPrice)-9} width={60} height={16} fill="rgba(255,255,255,0.15)" rx="2"/>
          <text x="5" y={toY(currentPrice)+3} fontSize="9" fill="rgba(255,255,255,0.6)" fontFamily="monospace">↔ {currentPrice.toFixed(1)}</text>
        </svg>
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
        <p style={{fontSize:13,color:C.inkMid,display:"flex",alignItems:"center",gap:6}}>
          {running && <Icon name="target" size={16} color={C.goldText}/>}
          {running
            ? (orderType === "trailing_stop" ? S.runningHintTrail : S.runningHint(curOrder.label))
            : S.idleHint}
        </p>
        <div style={{display:"flex",gap:16,fontFamily:"monospace",fontSize:12}}>
          <span style={{color:C.green,display:"inline-flex",alignItems:"center",gap:4}}><Icon name="check" size={14}/> {S.executedInlineLabel}: {score}</span>
        </div>
      </div>
    </div>
  );
}

    if (i === 1) return {...it, label: withGlossTerms(it.label, [{term:"ECN", word:"ECN"}], GLOSSARY, lang)};

    if (window.SBFAnon) window.SBFAnon.markChapterRead(4);
  }, []);

  // Этап 2 — предложение заполнить профиль+опросник за 30 дней PRO. Мягкая
  // просьба здесь (не жёсткое требование, то — на главе 6, см. serve.py
  // _handle_edu). Форма — iframe на /survey.html, чтобы не плодить третью
  // копию формы и не менять URL (спека: "внутри главы, не редиректом").
  // Отказ закрывает карточку до конца этого просмотра главы, не спрашивает
  // повторно (state, не localStorage — спека не просит помнить отказ вечно).
  const [proDismissed, setProDismissed] = React.useState(false);
  const [proFormOpen, setProFormOpen] = React.useState(false);
  const [proHighlight, setProHighlight] = React.useState(false);

  // Приход по ссылке «Пройти опросник в главе 4 →» с пейволла глав 6-15.
  //
  // 🔴 Раньше эта кнопка вела просто на /edu/b/4. Человек, которому пообещали
  // опросник, попадал на верх длинной главы: сам опросник лежит в самом низу,
  // свёрнутый за кнопкой «Заполнить». Найти его было нечем — обещание в
  // подписи кнопки страница не выполняла.
  //
  // По якорю #survey форма разворачивается сразу, страница прокручивается к
  // ней и блок на пару секунд подсвечивается — иначе после прокрутки неясно,
  // на что именно смотреть. Отказ «не сейчас» при этом игнорируем: человек
  // пришёл по прямой ссылке именно за этим.
  React.useEffect(() => {
    let t1 = 0, t2 = 0;
    const открыть = () => {
      if (window.location.hash !== "#survey") return;
      setProDismissed(false);
      setProFormOpen(true);
      setProHighlight(true);
      // Ждём кадр: блок появляется в этом же цикле отрисовки, до него
      // scrollIntoView прокручивал бы к пустому месту.
      t1 = setTimeout(() => {
        const el = document.getElementById("survey");
        if (el) el.scrollIntoView({behavior:"smooth", block:"center"});
      }, 120);
      t2 = setTimeout(() => setProHighlight(false), 2600);
    };
    открыть();
    // 🔴 hashchange обязателен, одного вызова при монтировании мало.
    // Переход на #survey со страницы, которая УЖЕ открыта, — это навигация
    // внутри документа: перезагрузки нет, React не перемонтируется, эффект с
    // пустыми зависимостями второй раз не выполнится. Браузер при этом
    // прокрутит к блоку сам, и со стороны выглядит правдоподобно — блок в
    // экране, но свёрнут. Ровно та жалоба, с которой всё началось.
    window.addEventListener("hashchange", открыть);
    return () => {
      window.removeEventListener("hashchange", открыть);

            в главе 11, если читатель перейдёт отсюда. */}
        <a href={getChUrl(11, lang)} data-anchor-return-title={
              lang==="ru" ? "Глава 4 · Ликвидность и Механика Ордеров" :
              lang==="ro" ? "Capitolul 4 · Lichiditate și Mecanica Ordinelor" :
              "Chapter 4 · Liquidity and Order Mechanics"
            }
            style={{display:"inline-block",fontSize:11.5,fontFamily:"monospace",color:C.goldText,textDecoration:"underline",marginBottom:56}}>
          {lang==="ru" ? "→ Глава 11: Тёмные пулы и HFT" : lang==="ro" ? "→ Capitolul 11: Dark pools și HFT" : "→ Chapter 11: Dark Pools and HFT"}
        </a>

        {/* Slippage table */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"28px 32px",marginBottom:56}}>
          <SectionTitle sub={S.slippageSub}>
            {S.slippageTitle}
          </SectionTitle>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead>
                <tr>
                  {S.tableHeaders.map(h => (
                    <th key={h} style={{textAlign:"left",padding:"10px 14px",fontSize:11,color:C.inkSoft,letterSpacing:1,borderBottom:`1px solid ${C.border}`,textTransform:"uppercase"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {slippageExamples.map((row,i) => (
                  <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                    <td style={{padding:"12px 14px",color:C.inkMid,fontSize:13}}>{row.scenario}</td>
                    <td style={{padding:"12px 14px",fontFamily:"monospace",fontSize:13}}>{row.before}</td>
                    <td style={{padding:"12px 14px",fontFamily:"monospace",fontSize:13}}>{row.after}</td>
                    <td style={{padding:"12px 14px",fontFamily:"monospace",fontWeight:700,color:row.color,fontSize:13}}>{row.diff}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p style={{fontSize:12,color:C.inkMid,marginTop:14}}>
            {withGlossTerms(S.slippageNote, [{term: lang==="ru"?"Пункт":"pip", word: lang==="ru"?"пункт":"pip"}], GLOSSARY, lang)}
          </p>
        </div>

        {/* ── INTERACTIVE 1: Market Depth ── */}
        <div style={{marginBottom:32}}>
          <MarketDepthSimulator/>
        </div>

        <NfpScene/>

        <Rule/>

        {/* ── BLOCK 2: Order types ── */}
        <SectionTitle id="secOrders" sub={S.block2Sub}>
          {S.block2Title}
        </SectionTitle>

        <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:8,padding:"18px 22px",marginBottom:24}}>
          <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,margin:0}}>{T4.orderTools.legendPreamble}</p>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,marginBottom:40}} className="g3">
          {orderTypes.map((o,i) => (
            <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:4,padding:"24px 28px",borderTop:`3px solid ${o.accent}`}}>
              <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12}}>
                <Icon name={o.icon} size={24} color={o.accent}/>
                <div style={{fontFamily:"'DM Serif Display',serif",fontSize:17,color:C.black}}>{o.title}</div>
              </div>
              <p style={{fontSize:13,color:C.inkMid,lineHeight:1.65,marginBottom:12}}>{o.text}</p>
              <div style={{fontSize:11,color:o.accent,fontFamily:"monospace",letterSpacing:0.5,padding:"8px 12px",background:`rgba(${o.accent===C.chartGreen?'8,153,129':o.accent===C.chartRed?'242,54,69':o.accent===C.blue?'37,99,235':o.accent==="#14b8a6"?'20,184,166':o.accent==="#8b5cf6"?'139,92,246':'201,151,58'},0.08)`,borderRadius:3}}>
                → {o.use}
              </div>
            </div>
          ))}
        </div>

        {/* Pending orders placement guide */}
        <PendingOrderScheme/>

        {/* Scenario cards */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}} className="g2">
          {T4.orderTools.scenarios.map((sc,i) => (
            <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"16px 18px"}}>
              <p style={{fontSize:12.5,color:C.inkFaint,marginBottom:6,fontStyle:"italic"}}>{sc.situation}</p>
              <p style={{fontSize:13,color:C.inkMid,margin:0}}>{sc.action}</p>
            </div>
          ))}
        </div>
        <p style={{fontSize:13,color:C.inkSoft,lineHeight:1.7,marginBottom:56,maxWidth:780,fontWeight:600}}>{T4.orderTools.finalRule}</p>

        {/* ── INTERACTIVE 2: Limit Catcher Game ── */}
        <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:8,padding:"18px 22px",marginBottom:20}}>
          <StepTag n="1" label={S.stepExplain}/>
          <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,margin:0}}>{T4.ordersTrainer.legend}</p>
        </div>
        <div style={{marginBottom:64}}>
          <LimitCatcher/>
        </div>

        <SevenQuestions/>

        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px",marginBottom:48}}>
          <Mono size={11} color={C.goldText} spacing={3} style={{display:"block",marginBottom:10}}>{T4.localeContext.tag}</Mono>
          <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,margin:0,maxWidth:780}}>{T4.localeContext.body}</p>
        </div>

        <Rule/>

        {/* ── CONCLUSIONS ── */}
        <div style={{background:C.black,borderRadius:8,padding:"44px 48px"}}>
          <div style={{textAlign:"center",marginBottom:32}}>
            <Mono size={11} color={C.goldText} spacing={4} style={{display:"block",marginBottom:12}}>{S.conclusionsTag}</Mono>
            <h3 style={{fontFamily:"'DM Serif Display',serif",fontSize:28,color:C.white,fontWeight:400}}>{S.conclusionsTitle}</h3>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}} className="g2">
            {conclusions.map((c,i) => (
              <div key={i} style={{display:"flex",gap:14,alignItems:"flex-start",padding:"14px 16px",background:"rgba(255,255,255,0.04)",borderRadius:4,border:"1px solid rgba(255,255,255,0.06)"}}>
                <span style={{color:C.goldText,fontFamily:"monospace",fontSize:11,marginTop:2,flexShrink:0}}>0{i+1}</span>
                <span style={{fontSize:13,color:"rgba(255,255,255,0.7)",lineHeight:1.65}}>{c}</span>
              </div>
            ))}
          </div>
        </div>

        {/* ── Этап 2: профиль + опросник → 30 дней PRO (§5) ── */}
        {!proDismissed && (
          <div id="survey" style={{
            border:`1.5px solid ${C.borderGold}`,borderRadius:8,padding:"26px 28px",
            marginTop:32,marginBottom:32,
            background:"linear-gradient(135deg,rgba(201,151,58,0.06),rgba(230,194,87,0.02))",
            // Подсветка приходу по якорю: после прокрутки к блоку должно быть
            // видно, ЧТО именно подсветилось, иначе прокрутка выглядит как
            // случайное положение страницы.
            boxShadow: proHighlight ? `0 0 0 4px rgba(201,151,58,0.28)` : "none",
            transition:"box-shadow .5s ease"
          }}>
            {!proFormOpen ? (
              <React.Fragment>
                <Mono size={11} color={C.goldText} spacing={3} style={{display:"block",marginBottom:10}}>
                  {lang==="ru"?"РАЗБЛОКИРОВАТЬ ГЛАВЫ 6-15":lang==="ro"?"DEBLOCHEAZĂ CAPITOLELE 6-15":"UNLOCK CHAPTERS 6-15"}
                </Mono>
                <p style={{fontSize:14.5,color:C.black,lineHeight:1.7,marginBottom:6,maxWidth:640}}>
                  {lang==="ru"
                    ? "Главы 6-15 — с этого места курс становится глубже. Заполни короткий профиль и опросник (2-3 минуты) — получишь 30 дней PRO бесплатно, без карты."
                    : lang==="ro"
                    ? "Capitolele 6-15 — de aici cursul devine mai avansat. Completează un profil scurt și un chestionar (2-3 minute) — primești 30 de zile PRO gratuit, fără card."
                    : "Chapters 6-15 — the course goes deeper from here. Fill in a short profile and survey (2-3 minutes) — get 30 days of PRO free, no card required."}
                </p>
                <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:14}}>
                  <button onClick={() => setProFormOpen(true)} style={{background:C.gold,color:"#18181a",border:"none",borderRadius:6,padding:"11px 22px",fontSize:13.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                    {lang==="ru"?"Заполнить →":lang==="ro"?"Completează →":"Fill in →"}
                  </button>
                  <button onClick={() => setProDismissed(true)} style={{background:"transparent",color:C.inkFaint,border:"none",fontSize:13,cursor:"pointer",fontFamily:"inherit",textDecoration:"underline"}}>
                    {lang==="ru"?"Не сейчас":lang==="ro"?"Nu acum":"Not now"}
                  </button>
                </div>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <Mono size={11} color={C.goldText} spacing={3}>
                    {lang==="ru"?"РАЗБЛОКИРОВАТЬ ГЛАВЫ 6-15":lang==="ro"?"DEBLOCHEAZĂ CAPITOLELE 6-15":"UNLOCK CHAPTERS 6-15"}
                  </Mono>
                  <button onClick={() => setProFormOpen(false)} style={{background:"transparent",border:"none",color:C.inkFaint,cursor:"pointer",fontSize:16,lineHeight:1}}>✕</button>
                </div>
                <iframe
                  src={lang==="ru"?"/survey.html":`/${lang}/survey.html`}
                  title="survey"
                  style={{width:"100%",height:720,border:`1px solid ${C.border}`,borderRadius:8,background:C.white}}
                />
              </React.Fragment>
            )}
          </div>
        )}

        <QuizBlock questions={T4.quiz} levelId="level_4" lang={lang} copy={{
          kicker: S.quizKicker, title: S.quizTitle, next: S.quizNext,
          stuckAll: S.quizStuckAll, stuckSome: S.quizStuckSome, backToSection: S.quizBackToSection,
        }} />

        {/* ── Предикт недели → клиффхэнгер гл.5 ── */}
        <div style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px",marginTop:32,marginBottom:24}}>
          <Mono size={11} color={C.goldText} spacing={3} style={{display:"block",marginBottom:10}}>
            {lang==="ru"?"ПРЕДИКТ НЕДЕЛИ":lang==="ro"?"PREDICȚIA SĂPTĂMÂNII":"PREDICTION OF THE WEEK"}
          </Mono>
          <p style={{fontSize:14.5,color:C.black,lineHeight:1.65,marginBottom:8}}>{T4.predict.question}</p>
          <p style={{fontSize:11,color:C.inkFaint}}>{T4.predict.xpNote}</p>
        </div>

        <div style={{border:`1px dashed ${C.borderGold}`,borderRadius:8,padding:"20px 24px",marginBottom:32,background:C.surface}}>
          <Mono size={11} color={C.goldText} spacing={3} style={{display:"block",marginBottom:10}}>
            {lang==="ru"?"КЛИФФХЭНГЕР → ГЛАВА 5":lang==="ro"?"CLIFFHANGER → CAPITOLUL 5":"CLIFFHANGER → CHAPTER 5"}
          </Mono>
          <p style={{fontSize:14,color:C.inkMid,lineHeight:1.7,margin:0}}>{T4.cliffhanger.body}</p>
        </div>

        <ComplianceFootnote lang={lang} />

        {/* Footer navigation */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:20,paddingTop:48,marginTop:48,borderTop:`1px solid ${C.border}`}}>
          <AskAnalystBtn tr={{askAnalyst:S.askQuestionLabel}} chapterNum={4} lang={lang} />
          <button
            onClick={() => window.location.href = getChUrl(5, lang)}
            style={{background:C.black,color:C.white,border:"none",padding:"18px 35px",cursor:"pointer",fontFamily:"monospace",fontSize:14,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.target.style.background=C.gold}
            onMouseLeave={e=>e.target.style.background=C.black}>
            {S.nextChapterBtn}
          </button>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter4 />);
{% endraw %}
</script>
</body>
