// ─── Interactive 2: Limit Order Catcher Game ─────────────────────────────────
function LimitCatcher() {
  const { useState, useEffect, useRef, useCallback } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  const W = 680, H = 300;
  const PRICE_MIN = 2490, PRICE_MAX = 2530;
  const toY = p => H - ((p - PRICE_MIN) / (PRICE_MAX - PRICE_MIN)) * H;
  const toP = y => PRICE_MIN + ((H - y) / H) * (PRICE_MAX - PRICE_MIN);

  const [limitPrice, setLimitPrice] = useState(2508);
  const [orderType, setOrderType] = useState("limit_buy"); // limit_buy | limit_sell | stop_buy | stop_stop
  const [candles, setCandles] = useState(() => generateCandles(15, 2510));
  const [score, setScore] = useState(0);
  const [misses, setMisses] = useState(0);
  const [hits, setHits] = useState([]);
  const [running, setRunning] = useState(false);
  const [dragging, setDragging] = useState(false);
  const svgRef = useRef(null);
  const intervalRef = useRef(null);

  function generateCandles(n, startPrice) {
    let price = startPrice;
    return Array.from({length: n}, (_, i) => {
      const change = (Math.random() - 0.48) * 8;
      const open = price;
      const close = price + change;
      const high = Math.max(open, close) + Math.random() * 5;
      const low  = Math.min(open, close) - Math.random() * 5;
      price = close;
      return { open, close, high, low, x: i * (W / n) + 10 };
    });
  }

  const candleW = Math.floor(W / 15) - 4;

  const addCandle = useCallback(() => {
    setCandles(prev => {
      const last = prev[prev.length - 1];
      const change = (Math.random() - 0.48) * 8;
      const open = last.close;
      const close = open + change;
      const high = Math.max(open, close) + Math.random() * 6;
      const low  = Math.min(open, close) - Math.random() * 6;

      const newCandle = { open, close, high, low, x: (W/15)*14 + 10 };

      // Check hit
      const clampedLow  = Math.max(PRICE_MIN, low);
      const clampedHigh = Math.min(PRICE_MAX, high);
      const isBuy  = orderType === "limit_buy"  && limitPrice >= clampedLow  && limitPrice <= close;
      const isSell = orderType === "limit_sell" && limitPrice <= clampedHigh && limitPrice >= close;
      const isStopB= orderType === "stop_buy"   && limitPrice <= clampedHigh && limitPrice >= open;
      const isStopS= orderType === "stop_sell"  && limitPrice >= clampedLow  && limitPrice <= open;

      if (isBuy || isSell || isStopB || isStopS) {
        setScore(s => s + 1);
        setHits(h => [...h.slice(-4), {price: limitPrice, x: newCandle.x, type: orderType}]);
      }

      const shifted = prev.slice(1).map(c => ({...c, x: c.x - W/15}));
      return [...shifted, newCandle];
    });
  }, [limitPrice, orderType]);

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(addCandle, 1200);
    } else {
      clearInterval(intervalRef.current);
    }
    return () => clearInterval(intervalRef.current);
  }, [running, addCandle]);

  const getSVGY = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return (clientY - rect.top) * (H / rect.height);
  };

  const orderTypes = [
    {key:"limit_buy",  label:"BUY LIMIT",  color:C.green,  desc:S.descBuyLimit},
    {key:"limit_sell", label:"SELL LIMIT", color:C.red,    desc:S.descSellLimit},
    {key:"stop_buy",   label:"BUY STOP",   color:"#0ea5e9",desc:S.descBuyStop},
    {key:"stop_sell",  label:"SELL STOP",  color:"#f59e0b",desc:S.descSellStop},
  ];
  const curOrder = orderTypes.find(o => o.key === orderType);
  const limitY = toY(limitPrice);
  const currentPrice = candles[candles.length - 1]?.close || 2510;

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"36px 40px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24,flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:28}}>🎮</span>
          <div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black}}>{S.gameTitle}</div>
            <Mono size={11} color={C.inkSoft} spacing={2}>{S.gameTag}</Mono>
          </div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:10,color:C.inkSoft,letterSpacing:1}}>{S.executedLabel}</div>
            <div style={{fontSize:24,fontWeight:700,color:C.greenD,fontFamily:"monospace"}}>{score}</div>

<script>
// Скрипт для конвертации UTC времени в локальное время пользователя
document.addEventListener('DOMContentLoaded', function() {
    var _pageLang = "{{ lang }}";
    var _intlLocale = _pageLang === 'ro' ? 'ro-RO' : _pageLang === 'en' ? 'en-US' : 'ru-RU';
    const utcTimes = document.querySelectorAll('.local-time[data-utc]');

    utcTimes.forEach(function(element) {
        // Получаем UTC время из data-utc атрибута
        var utcString = element.getAttribute('data-utc');

        try {
            // Парсим UTC дату и время
            var utcDate = new Date(utcString);

            // Конвертируем в локальное время пользователя
            var localDate = new Date(utcDate.getTime() + utcDate.getTimezoneOffset() * 60000);

            // Форматируем для отображения (например, "19:00 МСК")
            var hours = String(localDate.getHours()).padStart(2, '0');
            var minutes = String(localDate.getMinutes()).padStart(2, '0');
            var timeZoneName = Intl.DateTimeFormat(_intlLocale, { timeZoneName: 'long' }).format(localDate);
            
            // Обновляем текст элемента с локальным временем
            element.innerHTML = '<span class="local-time-display">' + hours + ':' + minutes + ' ' + timeZoneName.replace(/\s/g, '') + '</span>';
        } catch (e) {
            console.error('Ошибка конвертации времени:', e);
        }
    });
});
</script>
