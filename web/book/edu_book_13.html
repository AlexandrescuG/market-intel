function fillTemplate(str, vars) {
  if (!str) return str;
  return str.replace(/\{\{(\w+)\}\}/g, (m, key) => {
    const v = vars ? vars[key] : undefined;
    if (v === undefined || v === null || (typeof v === "number" && isNaN(v))) {
      console.error("[ch13] отсутствует значение для {{" + key + "}}");
      return "—";
    }
    return String(v);
  });
}

function useCh13Data() {
  const [state, setState] = React.useState({ loading: true, error: null, be: null });
  React.useEffect(() => {
    let cancelled = false;
    fetch("/data/edu_stats/breakeven_cost.json")
      .then(r => { if (!r.ok) throw new Error("breakeven_cost.json HTTP " + r.status); return r.json(); })
      .then(be => { if (!cancelled) setState({ loading: false, error: null, be }); })
      .catch(err => {
        console.error("[ch13] load failed:", err);
        if (!cancelled) setState({ loading: false, error: err, be: null });
      });
    return () => { cancelled = true; };
  }, []);

}

// ─── Арифметика пирамидинга ── математика ──────────────────────────────────
function pyramidCompute(firstSize, stepPts, addSize, nAdds, mode) {
  const entries = [{ price: 0, size: firstSize }];
  for (let k = 1; k <= nAdds; k++) {
    const size = mode === "decreasing" ? addSize / Math.pow(2, k - 1) : addSize;
    entries.push({ price: k * stepPts, size });
  }
  const totalSize = entries.reduce((s, e) => s + e.size, 0);
  const avgPrice = entries.reduce((s, e) => s + e.price * e.size, 0) / totalSize;
  const peak = nAdds * stepPts;
  const pnrPts = Math.max(0, peak - avgPrice);
  const pnrPct = peak > 0 ? (pnrPts / peak * 100) : 0;
  const riskRatio = totalSize / firstSize;
  return { avgPrice, pnrPts, pnrPct, riskRatio, totalSize };
}

function TradePlan() {
  const T = window.Ch13Content[INITIAL_LANG] || window.Ch13Content.ru;
  const tp = T.tradePlan;
  const [entry, setEntry] = React.useState("");
  const [stop, setStop] = React.useState("");
  const [exit, setExit] = React.useState("");
  const [add, setAdd] = React.useState("");
  const [cal, setCal] = React.useState("");
  const [saved, setSaved] = React.useState(false);
  const [busy, setBusy] = React.useState(false);

  const save = () => {
    setBusy(true);
    const plan_text = `${tp.entryLabel}: ${entry}\n${tp.stopLabel}: ${stop}\n${tp.exitLabel}: ${exit}\n${tp.addLabel}: ${add}\n${tp.calendarLabel}: ${cal}`;
    fetch("/api/journal/tradeplan", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ plan_text }),
    }).then(r => r.json()).then(res => { setBusy(false); if (res.ok) setSaved(true); }).catch(() => setBusy(false));
  };

  const fields = [[tp.entryLabel,entry,setEntry],[tp.stopLabel,stop,setStop],[tp.exitLabel,exit,setExit],[tp.addLabel,add,setAdd],[tp.calendarLabel,cal,setCal]];
  const ready = entry.trim() && stop.trim() && exit.trim();

  return (
    <div style={{marginBottom:48}}>
      <p style={{fontSize:14,color:C.inkMid,lineHeight:1.78,marginBottom:22,maxWidth:800}}>{tp.intro}</p>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"24px 28px"}}>
        {fields.map(([label,val,setter],i) => (
          <div key={i} style={{marginBottom:14}}>
            <Mono size={10} color={C.inkFaint} spacing={0.5} style={{display:"block",marginBottom:6}}>{label}</Mono>
            <input value={val} aria-label={label} onChange={e=>{setter(e.target.value); setSaved(false);}} style={{width:"100%",padding:"9px 12px",border:`1px solid ${C.border}`,borderRadius:4,fontFamily:"'DM Sans',sans-serif",fontSize:13}}/>
          </div>
        ))}
        <button onClick={save} disabled={!ready || busy} style={{padding:"11px 24px",background: ready ? C.black : C.inkFaint,color:"#fff",border:"none",borderRadius:4,cursor: ready ? "pointer" : "not-allowed",fontFamily:"monospace",fontSize:12,letterSpacing:0.5}}>{tp.saveBtn}</button>
        {saved && <p style={{fontSize:12,color:C.goldText,marginTop:10}}>{tp.savedNote}</p>}
      </div>
    </div>
  );
}

// standard.md ре-аудит: раньше печатал highlight.zero_pct на любой выбор --
// уровень 0 в костюме уровня 3. bucketIdx сравнивает реальное измерение с
// диапазоном, который выбрал читатель, и явно говорит, попал он или нет.
function bucketIdxBreakeven(pct) {
  if (pct < 30) return 0;
  if (pct < 60) return 1;
  if (pct < 85) return 2;
  return 3;
}
function PredictBreakeven({ be }) {
  const T = window.Ch13Content[INITIAL_LANG] || window.Ch13Content.ru;
  const p = T.predict;
  const [picked, setPicked] = React.useState(null);
  const highlight = be && be.highlight;
  const correctIdx = highlight ? bucketIdxBreakeven(highlight.zero_pct) : null;
  return (
    <div style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px",marginTop:8,marginBottom:24}}>
      <Mono size={11} color={C.goldText} spacing={3} style={{display:"block",marginBottom:10}}>{p.tag}</Mono>
