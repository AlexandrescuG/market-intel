// ─── Interactive 2: Pyramiding Simulator ─────────────────────────────────────
function PyramidingSim() {
  const { useState, useEffect, useRef, useCallback } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  const W = 680, H = 300;
  const BASE_PRICE = 2490;
  const PRICE_RANGE = 60; // 2490–2550
  const toY = p => H - ((p - BASE_PRICE) / PRICE_RANGE) * H;
  const toP = y => BASE_PRICE + ((H - y) / H) * PRICE_RANGE;

  // EMA calculation
  const calcEMA = (prices, period) => {
    const k = 2 / (period + 1);
    let ema = prices[0];
    return prices.map(p => { ema = p * k + ema * (1 - k); return +ema.toFixed(2); });
  };

  // Generate trending-up candle data
  const generateCandles = () => {
    let price = 2500;
    const candles = [];
    for (let i = 0; i < 40; i++) {
      // Bias upward with occasional pullback to EMA
      const pullback = (i % 7 === 6) ? -4 : 0; // pullback every 7 candles
      const drift = 0.8 + Math.random() * 0.6;
      const change = drift + pullback + (Math.random() - 0.4) * 3;
      const open = price;
      const close = Math.max(BASE_PRICE + 2, Math.min(BASE_PRICE + PRICE_RANGE - 2, open + change));
      const high = Math.max(open, close) + Math.random() * 2;
      const low  = Math.min(open, close) - Math.random() * 2;
      price = close;
      candles.push({ open: +open.toFixed(2), close: +close.toFixed(2), high: +high.toFixed(2), low: +low.toFixed(2) });
    }
    return candles;
  };

  const [allCandles] = useState(generateCandles);
  const [visibleCount, setVisibleCount] = useState(18);
  const [running, setRunning] = useState(false);
  const [positions, setPositions] = useState([]); // [{entry, lots, idx}]
  const [sl, setSl] = useState(null); // user SL price
  const [draggingSl, setDraggingSl] = useState(false);
  const [message, setMessage] = useState(S.simDefaultMsg);
  const [msgType, setMsgType] = useState("neutral"); // neutral|good|bad
  const [done, setDone] = useState(false);
  const [missed, setMissed] = useState(0);
  const svgRef = useRef(null);
  const timerRef = useRef(null);

  const visibleCandles = allCandles.slice(0, visibleCount).map((c,i) => ({
    ...c, x: 20 + i * ((W - 40) / 39)
  }));

  const closes = visibleCandles.map(c => c.close);
  const ema20 = calcEMA(closes, 20);
  const ema50 = calcEMA(closes, 50);

  const currentPrice = visibleCandles[visibleCandles.length - 1]?.close ?? BASE_PRICE;
  const currentEma20 = ema20[ema20.length - 1] ?? currentPrice;

  // Detect pullback: current price within 3 pts of EMA20 AND trending
  const nearEma20 = Math.abs(currentPrice - currentEma20) < 3.5;
  const canAdd = running && !done && nearEma20 && positions.length < 5;

  // Floating PnL
  const totalLots = positions.reduce((a,p) => a+p.lots, 0);
  const avgEntry = totalLots > 0 ? positions.reduce((a,p) => a+p.entry*p.lots, 0) / totalLots : 0;
  const floatPnl = totalLots > 0 ? ((currentPrice - avgEntry) * totalLots * 100).toFixed(0) : 0;
  const floatPnlNum = Number(floatPnl);

  const addPosition = useCallback(() => {
    if (!canAdd) {
      if (!nearEma20 && running) {
        setMessage(S.simWarnFar);
        setMsgType("bad");
      }
      return;
    }
    const lots = 1;
    setPositions(p => [...p, { entry: currentPrice, lots, idx: visibleCount }]);
    if (sl === null) setSl(+(currentPrice - 25).toFixed(2));
    else setSl(s => +(Math.max(s, currentPrice - 25)).toFixed(2)); // trail SL up
    setMessage(`✅ +${lots} ${S.simLotAt} ${currentPrice.toFixed(2)}. ${S.simTotalPositionsLabel}: ${positions.length+1}. ${S.simSlUpdated}`);
    setMsgType("good");
  }, [canAdd, currentPrice, visibleCount, sl, nearEma20, running, positions.length]);

  // Trail stop: when price moves +15 from entry, trail SL to breakeven
  useEffect(() => {
    if (positions.length > 0 && sl !== null) {
      const firstEntry = positions[0].entry;
      if (currentPrice - firstEntry >= 15 && sl < firstEntry) {
        setSl(firstEntry);
        setMessage(S.simBreakeven);
        setMsgType("good");
      }
    }
  }, [currentPrice, positions, sl]);

  // Check SL hit
  useEffect(() => {
    if (sl !== null && currentPrice <= sl && positions.length > 0 && running) {
      setRunning(false);
      setDone(true);
      const pnl = ((sl - avgEntry) * totalLots * 100).toFixed(0);
      const sign = Number(pnl) >= 0 ? "+" : "";
      setMessage(`📊 ${S.simStatStopLoss} ${sl} ${S.simSlTriggered} ${S.simResultLabel}: ${sign}${pnl} ${S.simPointsOnWord} ${totalLots} ${S.simLotsWord}.`);
      setMsgType(Number(pnl) >= 0 ? "good" : "bad");
    }
  }, [currentPrice, sl, positions, running]);

  // Auto advance candles
  useEffect(() => {
    if (running && !done) {
      timerRef.current = setInterval(() => {
        setVisibleCount(v => {
          if (v >= allCandles.length) {
            setRunning(false);
            setDone(true);
            setMessage(S.simComplete);
            setMsgType("good");
            return v;
          }
          return v + 1;
        });
      }, 900);
    } else {
      clearInterval(timerRef.current);
    }
    return () => clearInterval(timerRef.current);
  }, [running, done, allCandles.length]);

  const reset = () => {
    setVisibleCount(18); setRunning(false); setPositions([]); setSl(null);
    setDone(false); setMissed(0);
    setMessage(S.simDefaultMsg);
    setMsgType("neutral");
    clearInterval(timerRef.current);
  };

  // SL drag
  const getSVGY = (e) => {
    if (!svgRef.current) return 0;
    const rect = svgRef.current.getBoundingClientRect();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return Math.max(0, Math.min(H, (clientY - rect.top) * (H / rect.height)));
  };
  const onSlMouseDown = (e) => { e.stopPropagation(); setDraggingSl(true); };
  const onMouseMove = (e) => { if (draggingSl && sl !== null) setSl(+(toP(getSVGY(e))).toFixed(2)); };
  const onMouseUp = () => setDraggingSl(false);

  const candleW = 11;
  const msgBg = msgType==="good" ? "rgba(8,153,129,0.12)" : msgType==="bad" ? "rgba(242,54,69,0.1)" : "rgba(255,255,255,0.04)";
  const msgColor = msgType==="good" ? C.green : msgType==="bad" ? C.red : "rgba(255,255,255,0.6)";

  // TP line at +150 from first entry
  const tpPrice = positions.length > 0 ? +(positions[0].entry + 150).toFixed(2) : null;

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"36px 40px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:28}}>🧱</span>
          <div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black}}>{S.simTitle}</div>
            <Mono size={11} color={C.inkSoft} spacing={2}>{S.simSubtitle}</Mono>
          </div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          {done && <button onClick={reset} style={{padding:"8px 16px",background:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:11,letterSpacing:1}}>{S.simResetBtn}</button>}
          {!done && (
            <button

      {/* Done summary */}

                <p style={{fontSize:13,color:C.inkMid,lineHeight:1.65}}>{r.desc}</p>

            </div>
          ))}
        </div>

        {/* Risk math */}
        <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:6,padding:"28px 36px",marginBottom:56}}>
          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:16}}>{S.riskMathHeader}</Mono>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16}} className="g3">
            {[
              {step:S.riskStep1,price:"2485.50",lots:1,sl:"2405.50",note:S.riskNote1},
              {step:S.riskStep2,price:"2500.00",lots:2,sl:"2420.00",note:S.riskNote2},
              {step:S.riskStep3,price:"2512.00",lots:3,sl:"2440.00",note:S.riskNote3},
            ].map((s,i) => (
              <div key={i} style={{background:"rgba(201,151,58,0.06)",borderRadius:4,padding:"16px"}}>
                <div style={{fontFamily:"monospace",fontSize:10,color:C.gold,letterSpacing:1,marginBottom:10}}>{s.step}</div>
                <div style={{fontSize:12,color:C.black,marginBottom:4}}>{S.riskPriceLabel} <strong>{s.price}</strong></div>
                <div style={{fontSize:12,color:C.black,marginBottom:4}}>{S.riskLotsLabel} <strong>{s.lots}</strong></div>
                <div style={{fontSize:12,color:C.redD,marginBottom:8}}>SL: {s.sl}</div>
                <div style={{fontSize:11,color:C.inkMid,fontFamily:"monospace"}}>{s.note}</div>
              </div>
            ))}
          </div>
          <div style={{marginTop:16,padding:"12px 16px",background:"rgba(8,153,129,0.08)",borderRadius:4,border:`1px solid ${C.green}33`}}>
            <span style={{fontSize:13,color:C.greenD,fontWeight:600}}>{S.riskSummaryLabel}</span>
            <span style={{fontFamily:"monospace",fontSize:13,color:C.greenD}}>
              {S.riskSummaryFormula}<strong>{S.riskSummaryBold}</strong>{S.riskSummaryTail}
            </span>
          </div>
        </div>

        {/* ── INTERACTIVE 2 ── */}
        <div style={{marginBottom:64}}>
          <PyramidingSim/>
        </div>

        <Rule/>

        {/* ── CHECKLIST ── */}
        <div style={{marginBottom:64}}>
          <SectionTitle sub={S.checklistSub} align="center">
            {S.checklistTitle}
          </SectionTitle>
          <div style={{display:"grid",gap:10}}>
            {checklistItems.map((item,i) => (
              <div
                key={i}
                onClick={() => toggleCheck(i)}
                style={{
                  display:"flex",gap:14,alignItems:"center",
                  padding:"16px 20px",borderRadius:4,cursor:"pointer",
                  border:`1px solid ${checked[i] ? C.green : C.border}`,
                  background: checked[i] ? C.greenPale : C.surface,
                  transition:"all .2s"
                }}>
                <div style={{
                  width:22,height:22,borderRadius:3,flexShrink:0,
                  border:`2px solid ${checked[i] ? C.green : C.border}`,
                  background: checked[i] ? C.green : "transparent",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  color:"#fff",fontSize:13,transition:"all .2s"
                }}>{checked[i] ? "✓" : ""}</div>
                <span style={{fontSize:14,color:checked[i] ? C.greenD : C.inkMid,lineHeight:1.5}}>{item}</span>
              </div>
            ))}
          </div>
          {checkedCount === checklistItems.length && (
            <div style={{marginTop:20,background:C.greenPale,border:`1px solid ${C.green}`,borderRadius:4,padding:"18px 24px",textAlign:"center"}}>
              <div style={{fontWeight:700,color:C.greenD,fontSize:15,marginBottom:4}}>{S.checklistDoneTitle}</div>
              <div style={{fontSize:13,color:C.greenD}}>{S.checklistDoneBody}</div>
            </div>
          )}
        </div>

        {/* ── CONCLUSIONS ── */}
        <div style={{background:C.black,borderRadius:8,padding:"44px 48px"}}>
          <div style={{textAlign:"center",marginBottom:32}}>
            <Mono size={11} color={C.gold} spacing={4} style={{display:"block",marginBottom:12}}>{S.conclusionsTitle}</Mono>
            <h3 style={{fontFamily:"'DM Serif Display',serif",fontSize:28,color:C.white,fontWeight:400}}>{S.conclusionsSub}</h3>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            {conclusions.map((c,i) => (
              <div key={i} style={{display:"flex",gap:14,alignItems:"flex-start",padding:"14px 16px",background:"rgba(255,255,255,0.04)",borderRadius:4,border:"1px solid rgba(255,255,255,0.06)"}}>
                <span style={{color:C.gold,fontFamily:"monospace",fontSize:11,marginTop:2,flexShrink:0}}>{String(i+1).padStart(2,"0")}</span>
                <span style={{fontSize:13,color:"rgba(255,255,255,0.7)",lineHeight:1.65}}>{c}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Footer navigation */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:48,marginTop:48,borderTop:`1px solid ${C.border}`}}>
          <span onClick={() => setAskOpen(true)} style={{fontSize:14,color:C.inkSoft,fontFamily:"monospace",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}>
            {S.footerAsk}
          </span>
          <button
            onClick={() => window.location.href = getChUrl(14)}
            style={{background:C.black,color:C.white,border:"none",padding:"18px 35px",cursor:"pointer",fontFamily:"monospace",fontSize:14,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.target.style.background=C.gold}
            onMouseLeave={e=>e.target.style.background=C.black}>
            {S.footerNext}
          </button>
        </div>

      </div>

      {askOpen && <AskAnalystPopup onClose={() => setAskOpen(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter13 />);
{% endraw %}
</script>
</body>
</html>
