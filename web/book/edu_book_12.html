function BalanceScales({t}) {
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const [bullActive, setBullActive] = useState([]);
  const [bearActive, setBearActive] = useState([]);

  const bullWeight = bullActive.reduce((s,id)=>{
    const f = t.bullFactors.find(x=>x.id===id);
    return s+(f?f.weight:0);
  },0);
  const bearWeight = bearActive.reduce((s,id)=>{
    const f = t.bearFactors.find(x=>x.id===id);
    return s+(f?f.weight:0);
  },0);

  const diff = bullWeight - bearWeight;
  const maxW = 16;
  // Tilt: positive = bull wins (left goes down in visual = left plate lower)
  const tilt = Math.max(-35, Math.min(35, diff * 4));
  const result = diff >= 6 ? "strong_bull" : diff >= 2 ? "mild_bull" : diff <= -6 ? "strong_bear" : diff <= -2 ? "mild_bear" : "neutral";
  const resultColor = result.includes("bull") ? C.bull : result === "neutral" ? C.gold : C.bear;

  const toggle = (side, id) => {
    if(side==="bull") setBullActive(a=>a.includes(id)?a.filter(x=>x!==id):[...a,id]);
    else setBearActive(a=>a.includes(id)?a.filter(x=>x!==id):[...a,id]);
  };

  const reset = () => { setBullActive([]); setBearActive([]); };

  // Beam tilt: negative tilt = bear heavier (right goes down)
  const beamAngle = -tilt; // positive = left (bull) plate goes down

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"28px 24px",marginBottom:52}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
        <Chip>{t.scalesTag}</Chip>
      </div>
      <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,fontWeight:700,color:C.black,marginBottom:4}}>{t.scalesTitle}</div>
      <div style={{fontSize:13,color:C.inkSoft,marginBottom:24}}>{t.scalesSub}</div>

      {/* Visual scales SVG */}
      <div style={{textAlign:"center",marginBottom:24,userSelect:"none"}}>
        <svg viewBox="0 0 400 180" style={{width:"100%",maxWidth:460,overflow:"visible"}} xmlns="http://www.w3.org/2000/svg">
          {/* Stand */}
          <line x1="200" y1="40" x2="200" y2="160" stroke={C.inkSoft} strokeWidth="3"/>
          <ellipse cx="200" cy="162" rx="30" ry="6" fill={C.surfaceMid}/>
          {/* Pivot */}
          <circle cx="200" cy="42" r="6" fill={C.gold}/>
          {/* Beam — rotates around pivot */}
          <g transform={`rotate(${beamAngle}, 200, 42)`}>
            <line x1="60" y1="42" x2="340" y2="42" stroke={C.black} strokeWidth="2.5"/>
            {/* Left string (bull) */}
            <line x1="80" y1="42" x2="80" y2="88" stroke={C.inkSoft} strokeWidth="1.5"/>
            {/* Right string (bear) */}
            <line x1="320" y1="42" x2="320" y2="88" stroke={C.inkSoft} strokeWidth="1.5"/>
            {/* Left plate (bull) */}
            <ellipse cx="80" cy="92" rx="44" ry="10" fill="rgba(34,197,94,.15)" stroke={C.bull} strokeWidth="1.5"/>
            <text x="80" y="96" textAnchor="middle" fontSize="10" fontFamily="monospace" fill={C.bull} fontWeight="700">
              {t.scalesBullLabel}
            </text>
            {/* Bull weight indicators */}
            {bullWeight > 0 && (
              <text x="80" y="80" textAnchor="middle" fontSize="11" fontFamily="monospace" fill={C.bull} fontWeight="900">
                +{bullWeight}
              </text>
            )}
            {/* Right plate (bear) */}
            <ellipse cx="320" cy="92" rx="44" ry="10" fill="rgba(239,68,68,.15)" stroke={C.bear} strokeWidth="1.5"/>
            <text x="320" y="96" textAnchor="middle" fontSize="10" fontFamily="monospace" fill={C.bear} fontWeight="700">
              {t.scalesBearLabel}
            </text>
            {bearWeight > 0 && (
              <text x="320" y="80" textAnchor="middle" fontSize="11" fontFamily="monospace" fill={C.bear} fontWeight="900">
                +{bearWeight}
              </text>
            )}
          </g>
        </svg>
      </div>

      {/* Result bar */}
      <div style={{background:"rgba(0,0,0,.04)",border:`1px solid ${C.border}`,padding:"12px 16px",marginBottom:24,textAlign:"center"}}>
        <div style={{fontFamily:"monospace",fontSize:14,fontWeight:700,color:resultColor}}>{t.scalesResult[result]}</div>
        {(bullWeight>0||bearWeight>0) && (
          <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:6,flexWrap:"wrap"}}>
            <Mono size={11} color={C.bull} spacing={1}>{S.scalesBullShort}: +{bullWeight}</Mono>
            <Mono size={11} color={C.bear} spacing={1}>{S.scalesBearShort}: +{bearWeight}</Mono>
          </div>
        )}
      </div>

      {/* Factor grids */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
        {/* Bull factors */}
        <div>
          <div style={{fontFamily:"monospace",fontSize:10,letterSpacing:2,color:C.bull,marginBottom:10,fontWeight:700}}>🐂 {t.scalesBullLabel}</div>
          {t.bullFactors.map(f=>(
            <div key={f.id} onClick={()=>toggle("bull",f.id)}
              style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",marginBottom:6,cursor:"pointer",
                border:`1px solid ${bullActive.includes(f.id)?C.bull:C.border}`,
                background:bullActive.includes(f.id)?"rgba(34,197,94,.08)":"#fff",transition:"all .2s"}}>
              <span style={{fontSize:16}}>{f.emoji}</span>
              <span style={{flex:1,fontSize:12,color:C.inkMid,lineHeight:1.4}}>{f.label}</span>
              <span style={{fontFamily:"monospace",fontSize:10,color:bullActive.includes(f.id)?C.bull:C.inkFaint,fontWeight:700}}>+{f.weight}</span>
              <div style={{width:16,height:16,border:`1px solid ${bullActive.includes(f.id)?C.bull:C.border}`,
                background:bullActive.includes(f.id)?C.bull:"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s"}}>
                {bullActive.includes(f.id)&&<span style={{color:"#fff",fontSize:10}}>✓</span>}
              </div>
            </div>
          ))}
        </div>
        {/* Bear factors */}
        <div>
          <div style={{fontFamily:"monospace",fontSize:10,letterSpacing:2,color:C.bear,marginBottom:10,fontWeight:700}}>🐻 {t.scalesBearLabel}</div>
          {t.bearFactors.map(f=>(
            <div key={f.id} onClick={()=>toggle("bear",f.id)}
              style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",marginBottom:6,cursor:"pointer",
                border:`1px solid ${bearActive.includes(f.id)?C.bear:C.border}`,
                background:bearActive.includes(f.id)?"rgba(239,68,68,.08)":"#fff",transition:"all .2s"}}>
              <span style={{fontSize:16}}>{f.emoji}</span>
              <span style={{flex:1,fontSize:12,color:C.inkMid,lineHeight:1.4}}>{f.label}</span>
              <span style={{fontFamily:"monospace",fontSize:10,color:bearActive.includes(f.id)?C.bear:C.inkFaint,fontWeight:700}}>+{f.weight}</span>
              <div style={{width:16,height:16,border:`1px solid ${bearActive.includes(f.id)?C.bear:C.border}`,
                background:bearActive.includes(f.id)?C.bear:"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s"}}>
                {bearActive.includes(f.id)&&<span style={{color:"#fff",fontSize:10}}>✓</span>}
              </div>
            </div>
          ))}
        </div>
      </div>
      <button onClick={reset} style={{marginTop:16,background:"transparent",border:`1px solid ${C.border}`,color:C.inkSoft,padding:"8px 18px",cursor:"pointer",fontFamily:"monospace",fontSize:10,letterSpacing:2}}>{t.scalesReset}</button>
    </div>
  );
}

// ─────────────────────────────────────────────
// SIGNAL STRENGTH GAME
// ─────────────────────────────────────────────
function SignalGame({t}) {
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const [idx,setIdx] = useState(0);
  const [chosen,setChosen] = useState(null);
  const [score,setScore] = useState(0);
  const [done,setDone] = useState(false);

  const sc = t.scenarios;
  const cur = sc[idx];
  const levels = ["weak","medium","strong"];
  const labelMap = {weak:t.signalWeak, medium:t.signalMedium, strong:t.signalStrong};
  const colorMap = {weak:"#f59e0b", medium:"#3b82f6", strong:"#22c55e"};

  const choose = (lv) => {
    if(chosen) return;
    const ok = lv === cur.correct;
    if(ok) setScore(s=>s+1);
    setChosen(lv);
  };

  const next = () => {
    if(idx+1>=sc.length){setDone(true);return;}
    setIdx(i=>i+1);
    setChosen(null);
  };

  if(done) return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"36px 28px",textAlign:"center"}}>
      <div style={{fontSize:48,marginBottom:12}}><img class='mi-icon' style='vertical-align:middle' src='/assets/icons/icon-target.png' alt='' width='20' height='20' /></div>
      <div style={{fontFamily:"monospace",fontSize:28,color:C.gold,fontWeight:700,marginBottom:8}}>{score} / {sc.length}</div>
      <div style={{fontSize:14,color:C.inkSoft,marginBottom:20}}>{t.signalFinish}</div>
      {score>=2 && (
        <div style={{background:"#fff",border:`1px solid ${C.borderGold}`,display:"inline-block",padding:"14px 28px"}}>
          <span style={{fontFamily:"monospace",fontSize:11,letterSpacing:3,color:C.gold,display:"block",marginBottom:4}}>🔮 ICHIMOKU READER</span>
          <span style={{fontFamily:"monospace",fontSize:12,color:C.inkSoft}}>+{score===3?"80":"50"} BONUS XP</span>
        </div>
      )}
    </div>
  );

  const ok = chosen === cur.correct;

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"26px 26px 22px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <Chip>{t.gameTag}</Chip>
          <Mono size={11} color={C.inkFaint} spacing={0}>{idx+1} {t.signalOf} {sc.length}</Mono>
        </div>
        <Mono size={12} color={C.inkSoft} spacing={1}>{t.signalScore}: {score}</Mono>
      </div>

      {/* Scenario */}
      <div style={{background:"#fff",border:`1px solid ${C.border}`,padding:"18px 20px",marginBottom:20}}>
        <Mono size={10} color={C.gold} spacing={2} style={{display:"block",marginBottom:8}}>{S.scenarioLabel(cur.id)}</Mono>
        <p style={{fontSize:15,color:C.black,lineHeight:1.7,fontWeight:500}}>{cur.desc}</p>
      </div>

      {/* Choices */}
      {!chosen && (
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {levels.map(lv=>(
            <button key={lv} onClick={()=>choose(lv)}
              style={{padding:"14px 8px",cursor:"pointer",border:`2px solid ${colorMap[lv]}`,
                background:`${colorMap[lv]}10`,fontFamily:"monospace",fontSize:11,letterSpacing:2,
                color:colorMap[lv],fontWeight:700,transition:"all .2s"}}
              onMouseEnter={e=>{e.currentTarget.style.background=`${colorMap[lv]}25`;}}
              onMouseLeave={e=>{e.currentTarget.style.background=`${colorMap[lv]}10`;}}
            >{labelMap[lv]}</button>
          ))}
        </div>
      )}

      {/* Result */}
      {chosen && (
        <div>
          <div style={{padding:"16px 20px",background:ok?"rgba(34,197,94,.08)":"rgba(239,68,68,.08)",border:`1px solid ${ok?C.bull:C.bear}`,marginBottom:14}}>
            <div style={{fontSize:16,fontWeight:700,color:ok?C.bull:C.bear,marginBottom:4}}>
              {ok?t.signalCorrect:t.signalWrong}
              <span style={{fontFamily:"monospace",fontSize:12,marginLeft:10,color:colorMap[cur.correct]}}> → {labelMap[cur.correct]}</span>
            </div>
            <div style={{fontSize:13,color:C.inkMid,lineHeight:1.7}}>
              <strong style={{color:C.black}}>{t.signalExplain}</strong> {cur.explanation}
            </div>
          </div>
          <button onClick={next}
            style={{background:C.black,color:C.white,border:"none",padding:"11px 24px",cursor:"pointer",fontFamily:"monospace",fontSize:11,letterSpacing:2,fontWeight:700,float:"right",transition:"background .2s"}}
            onMouseEnter={e=>e.currentTarget.style.background=C.gold}
            onMouseLeave={e=>e.currentTarget.style.background=C.black}
          >{idx+1<sc.length?t.signalNext:t.signalFinish}</button>
          <div style={{clear:"both"}}/>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────
// QUIZ
// ─────────────────────────────────────────────
function Quiz({t}) {
  const [started,setStarted] = useState(false);
  const [qidx,setQidx] = useState(0);
  const [score,setScore] = useState(0);
  const [sel,setSel] = useState(null);
  const [done,setDone] = useState(false);
  const qq = t.quiz;

  const choose = (i) => {
    if(sel!==null) return;
    setSel(i);
    if(i===qq[qidx].c) setScore(s=>s+1);
    setTimeout(()=>{setSel(null);if(qidx+1>=qq.length)setDone(true);else setQidx(x=>x+1);},950);
  };

  if(!started) return (
    <div style={{textAlign:"center"}}>
      <button onClick={()=>setStarted(true)}
        style={{background:"transparent",border:`1px solid ${C.black}`,color:C.black,padding:"13px 36px",cursor:"pointer",fontFamily:"monospace",fontSize:11,letterSpacing:3,transition:"all .2s"}}
        onMouseEnter={e=>{e.currentTarget.style.background=C.black;e.currentTarget.style.color="#fff";}}
        onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color=C.black;}}
      >{t.quizStartBtn}</button>
    </div>
  );

  if(done) return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"36px 28px",textAlign:"center"}}>
      <div style={{fontSize:48,marginBottom:14}}>🏅</div>
      <div style={{fontFamily:"monospace",fontSize:28,color:C.gold,fontWeight:700,marginBottom:8}}>{score} / {qq.length}</div>
      <p style={{fontSize:14,color:C.inkSoft,marginBottom:24}}>{score>=5?t.passmsg:t.failmsg}</p>
      {score>=5&&<div style={{background:"#fff",border:`1px solid ${C.borderGold}`,display:"inline-block",padding:"14px 28px"}}>
        <span style={{fontFamily:"monospace",fontSize:11,letterSpacing:3,color:C.gold,display:"block",marginBottom:4}}>{t.medalTitle}</span>
        <span style={{fontFamily:"monospace",fontSize:12,color:C.inkSoft}}>{t.medalDesc}</span>
      </div>}
    </div>
  );

  const q = qq[qidx];
  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"26px 28px"}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:18,alignItems:"center"}}>
        <Chip>{t.qof(qidx+1,qq.length)}</Chip>
        <Mono size={12} color={C.inkSoft} spacing={1}>{t.qcor(score)}</Mono>
      </div>
      <p style={{fontSize:16,color:C.black,marginBottom:18,lineHeight:1.55,fontWeight:500}}>{q.q}</p>
      <div style={{display:"grid",gap:10}}>
        {q.o.map((opt,i)=>{
          let bg="#fff",bc=C.border;
          if(sel!==null){if(i===q.c){bg="rgba(34,197,94,.08)";bc="#86efac";}else if(i===sel){bg="rgba(239,68,68,.08)";bc="#fca5a5";}}
          return <button key={i} onClick={()=>choose(i)}
            style={{background:bg,border:`1px solid ${bc}`,color:C.ink,padding:"11px 15px",cursor:"pointer",textAlign:"left",fontFamily:"'DM Sans',sans-serif",fontSize:14,transition:"all .2s"}}>{opt}</button>;
        })}
      </div>
    </div>
  );
}

          <button onClick={()=>window.location.href=getChUrl(13)}
            style={{background:C.black,color:C.white,border:"none",padding:"16px 28px",cursor:"pointer",fontFamily:"monospace",fontSize:13,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.currentTarget.style.background=C.gold}
            onMouseLeave={e=>e.currentTarget.style.background=C.black}
          >{t.nextCh}</button>
        </div>

      </div>

      {askOpen&&<AskAnalystPopup chapterNum={12} lang={INITIAL_LANG} onClose={()=>setAskOpen(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter12/>);
{% endraw %}
</script>
</body>
</html>
