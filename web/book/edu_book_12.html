  if (!str) return str;
  return str.replace(/\{\{(\w+)\}\}/g, (m, key) => {

    }
    return String(v);
  });
}

// ─── Статистика: чистые функции, без React ─────────────────────────────────
const Z975 = 1.959964, Z80 = 0.841621;

function choose(n, k) {
  let r = 1;
  for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return r;
}
function binomAtLeast(n, k, p) {
  let s = 0;
  for (let i = k; i <= n; i++) s += choose(n, i) * Math.pow(p, i) * Math.pow(1 - p, n - i);
  return s * 100;
}
function sampleSizeNeeded(p1, p0) {
  if (p1 <= p0) return null;
  const num = Z975 * Math.sqrt(p0 * (1 - p0)) + Z80 * Math.sqrt(p1 * (1 - p1));
  return Math.ceil((num * num) / ((p1 - p0) * (p1 - p0)));
}
function spread50(p1) {
  const se = Math.sqrt(p1 * (1 - p1) / 50);
  return {
    lo: Math.max(0, (p1 - Z975 * se) * 100),
    hi: Math.min(100, (p1 + Z975 * se) * 100),
  };
}
function prob5LossStreak(p1, k, nTrials) {
  const q = 1 - p1;
  let dp = new Array(k).fill(0);
  dp[0] = 1;
  for (let t = 0; t < nTrials; t++) {
    const nd = new Array(k).fill(0);
    for (let s = 0; s < k; s++) {
      const ps = dp[s];
      if (ps === 0) continue;
      nd[0] += ps * p1;
      if (s + 1 < k) nd[s + 1] += ps * q;
    }
    dp = nd;
  }
  const survived = dp.reduce((a, b) => a + b, 0);
  return (1 - survived) * 100;
}

const ICHIMOKU_SYMBOLS = ["GOLD", "EURUSD", "BTC", "SPX"];
const ICHIMOKU_DISPLAY_N = 90;
const ICHIMOKU_SHIFT = 26;

function computeIchimoku(candles) {
  const n = candles.length;
  const tenkan = new Array(n), kijun = new Array(n), spanA = new Array(n), spanB = new Array(n);
  for (let i = 0; i < n; i++) {
    const t0 = Math.max(0, i - 8), k0 = Math.max(0, i - 25), b0 = Math.max(0, i - 51);
    let tHi = -Infinity, tLo = Infinity;
    for (let j = t0; j <= i; j++) { tHi = Math.max(tHi, candles[j].high); tLo = Math.min(tLo, candles[j].low); }
    let kHi = -Infinity, kLo = Infinity;
    for (let j = k0; j <= i; j++) { kHi = Math.max(kHi, candles[j].high); kLo = Math.min(kLo, candles[j].low); }
    let bHi = -Infinity, bLo = Infinity;
    for (let j = b0; j <= i; j++) { bHi = Math.max(bHi, candles[j].high); bLo = Math.min(bLo, candles[j].low); }
    tenkan[i] = (tHi + tLo) / 2;
    kijun[i] = (kHi + kLo) / 2;
    spanA[i] = (tenkan[i] + kijun[i]) / 2;
    spanB[i] = (bHi + bLo) / 2;
  }
  return { tenkan, kijun, spanA, spanB };
}

// Real calendar date N weekdays after a 'YYYY-MM-DD' string -- used only to
// place the forward-shifted cloud (spanA/spanB) past the last real candle,
// which is inherent to how Ichimoku is defined (the cloud is drawn ahead of
// price), not a data fabrication: the VALUES are 100% computed from real
// historical highs/lows, only their future calendar slot is projected.
function addWeekdays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00Z");
  let added = 0;
  while (added < n) {
    d.setUTCDate(d.getUTCDate() + 1);
    const day = d.getUTCDay();
    if (day !== 0 && day !== 6) added++;
  }
  return d.toISOString().slice(0, 10);
}

function IchimokuLiveChart() {
  const { useState, useEffect, useMemo, useRef } = React;
  const T = window.Ch12Content[INITIAL_LANG] || window.Ch12Content.ru;
  const lc = T.liveChart;
  const [symbol, setSymbol] = useState("GOLD");
  const [full, setFull] = useState(null);
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const seriesRef = useRef({});

  useEffect(() => {
    let cancelled = false;
    setFull(null);
    fetch("/data/ohlc_" + symbol + "_D1.json").then(r => r.json()).then(d => {
      if (!cancelled && d && Array.isArray(d.candles)) setFull(d.candles);
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [symbol]);

  const ind = useMemo(() => full ? computeIchimoku(full) : null, [full]);

  // Create the chart once.
  useEffect(() => {
    if (!containerRef.current || chartRef.current || typeof LightweightCharts === "undefined") return;
    const chart = LightweightCharts.createChart(containerRef.current, {
      width: containerRef.current.clientWidth, height: 320,
      layout: { background: { color: C.black }, textColor: "rgba(255,255,255,0.55)" },
      grid: { vertLines: { color: "rgba(255,255,255,0.05)" }, horzLines: { color: "rgba(255,255,255,0.05)" } },
      rightPriceScale: { borderColor: "rgba(255,255,255,0.15)" },
      timeScale: { borderColor: "rgba(255,255,255,0.15)" },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: C.chartGreen, downColor: C.chartRed, borderUpColor: C.chartGreen, borderDownColor: C.chartRed,
      wickUpColor: C.chartGreen, wickDownColor: C.chartRed,
    });
    const tenkanSeries = chart.addLineSeries({ color: "#e53e3e", lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
    const kijunSeries = chart.addLineSeries({ color: "#3182ce", lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
    const chikouSeries = chart.addLineSeries({ color: "#805ad5", lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
    const spanASeries = chart.addLineSeries({ color: "#38a169", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    const spanBSeries = chart.addAreaSeries({ topColor: "rgba(56,161,105,0.18)", bottomColor: "rgba(56,161,105,0.18)", lineColor: "#c53030", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    chartRef.current = chart;
    seriesRef.current = { candleSeries, tenkanSeries, kijunSeries, chikouSeries, spanASeries, spanBSeries };
    const ro = new ResizeObserver(entries => { if (entries[0]) chart.applyOptions({ width: entries[0].contentRect.width }); });
    ro.observe(containerRef.current);
    return () => { ro.disconnect(); chart.remove(); chartRef.current = null; };
  }, []);

  // Push real data whenever symbol/candles change.
  useEffect(() => {
    const s = seriesRef.current;
    if (!s.candleSeries || !full || !ind) return;
    const n = full.length;
    const startIdx = Math.max(0, n - ICHIMOKU_DISPLAY_N);
    const window_ = full.slice(startIdx);

    s.candleSeries.setData(window_.map(c => ({ time: c.time, open: +c.open, high: +c.high, low: +c.low, close: +c.close })));

    const toSeries = (arr, offsetIdx) => {
      const out = [];
      for (let i = startIdx; i < n; i++) {
        const v = arr[i];
        if (v == null) continue;
        const j = i + offsetIdx;
        if (j >= 0 && j < n) out.push({ time: full[j].time, value: v });
      }
      return out;
    };
    s.tenkanSeries.setData(toSeries(ind.tenkan, 0));
    s.kijunSeries.setData(toSeries(ind.kijun, 0));
    // Chikou: today's close plotted ICHIMOKU_SHIFT days back -- always a real
    // past date already in the data.
    s.chikouSeries.setData(toSeries(full.map(c => c.close), -ICHIMOKU_SHIFT));

    // Cloud (spanA/spanB): plotted ICHIMOKU_SHIFT days ahead. Where that
    // lands past the last real candle, generate the real future weekday.
    const lastDate = full[n - 1].time;
    const cloud = (arr) => {
      const out = [];
      for (let i = startIdx; i < n; i++) {
        const v = arr[i];
        if (v == null) continue;
        const j = i + ICHIMOKU_SHIFT;
        const time = j < n ? full[j].time : addWeekdays(lastDate, j - (n - 1));
        out.push({ time, value: v });
      }
      return out;
    };
    s.spanASeries.setData(cloud(ind.spanA));
    s.spanBSeries.setData(cloud(ind.spanB));

    chartRef.current.timeScale().fitContent();
  }, [full, ind]);

  return (
    <div style={{background:C.black,borderRadius:6,padding:"24px 5vw 28px",marginBottom:32,overflow:"hidden"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,marginBottom:14}}>
        <Mono size={11} color={C.gold} spacing={2}>{lc.tag}</Mono>
        <div style={{display:"flex",gap:6}}>
          {ICHIMOKU_SYMBOLS.map(s => (
            <button key={s} onClick={()=>setSymbol(s)} style={{fontFamily:"monospace",fontSize:10.5,padding:"5px 10px",cursor:"pointer",background:s===symbol?C.gold:"transparent",color:s===symbol?"#18181a":"rgba(255,255,255,0.6)",border:`1px solid ${s===symbol?C.gold:"rgba(255,255,255,0.2)"}`,borderRadius:3}}>{window.SBFSymbols ? window.SBFSymbols.symbolName(s, {lang: INITIAL_LANG, mode:"name+ticker"}) : s}</button>
          ))}
        </div>
      </div>
      <div style={{position:"relative",minHeight:280}}>
        <div ref={containerRef} data-source={"/data/ohlc_" + symbol + "_D1.json"}/>
        {!full && (
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
            <Mono size={11} color="rgba(255,255,255,0.4)" spacing={1}>{lc.loadingLabel}</Mono>
          </div>
        )}
      </div>
      <div style={{display:"flex",gap:16,flexWrap:"wrap",marginTop:14,marginBottom:14}}>
        {[["#e53e3e",lc.tenkanLabel],["#3182ce",lc.kijunLabel],["rgba(56,161,105,0.7)",lc.cloudLabel],["#805ad5",lc.chikouLabel]].map(([col,label],i) => (
          <div key={i} style={{display:"flex",alignItems:"center",gap:6}}>

  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

    const p0 = 0.5, p1 = 0.55;

  const custom = React.useMemo(() => {
    const p0 = 1 / (1 + Math.max(rr, 0.01));

            <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:16,flexWrap:"wrap"}}>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:32,color:C.black}}>{progress.trade_count} <span style={{fontSize:16,color:C.inkSoft}}>{l7.ofLabel} {progress.target}</span></div>
              <div style={{flex:1,minWidth:160,height:8,background:"rgba(0,0,0,0.08)",borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${Math.min(100, progress.trade_count/progress.target*100)}%`,background:C.gold}}/>
              </div>
            </div>

            {progress.status === "done" ? (
              <div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:6,padding:"14px 18px",marginBottom:14}}>
                <div style={{fontWeight:600,fontSize:13,color:C.black,marginBottom:6}}>{l7.doneTitle}</div>
                <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6,margin:0}}>{l7.doneBody}</p>
              </div>
            ) : progress.paper_mode ? (
              <button onClick={tick} disabled={busy} style={{padding:"11px 22px",background:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:0.5,marginBottom:14}}>{l7.manualTickBtn}</button>
            ) : null}

            {progress.discipline && progress.predict_pct != null && (
              <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.65,marginBottom:14}}>{l7.predictVsActual(progress.predict_pct, progress.discipline.off_system_pct)}</p>
            )}

            {!confirming ? (
              <button onClick={()=>setConfirming(true)} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:4,padding:"8px 16px",cursor:"pointer",fontFamily:"monospace",fontSize:11,color:C.inkMid}}>{l7.changeBtn}</button>
            ) : (
              <div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:6,padding:"16px 20px"}}>
                <div style={{fontWeight:600,fontSize:12.5,color:C.black,marginBottom:6}}>{l7.confirmChangeTitle}</div>
                <p style={{fontSize:12,color:C.inkMid,lineHeight:1.6,marginBottom:12}}>{l7.confirmChangeBody}</p>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>setConfirming(false)} style={{padding:"8px 16px",background:"none",border:`1px solid ${C.border}`,borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:11}}>{l7.confirmChangeNo}</button>
                  <button onClick={()=>{setConfirming(false); setEntry(""); setStop(""); setExit("");}} style={{padding:"8px 16px",background:"#c0392b",color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:11}}>{l7.confirmChangeYes}</button>
                </div>
              </div>
            )}
          </div>
        ) : (
          <div>
            <div style={{fontWeight:600,fontSize:14,color:C.black,marginBottom:16}}>{l7.formTitle}</div>
            {[[l7.entryLabel,entry,setEntry],[l7.stopLabel,stop,setStop],[l7.exitLabel,exit,setExit]].map(([label,val,setter],i) => (
              <div key={i} style={{marginBottom:14}}>
                <Mono size={10} color={C.inkFaint} spacing={0.5} style={{display:"block",marginBottom:6}}>{label}</Mono>
                <input value={val} onChange={e=>setter(e.target.value)} style={{width:"100%",padding:"10px 12px",border:`1px solid ${C.border}`,borderRadius:4,fontFamily:"'DM Sans',sans-serif",fontSize:13}}/>
              </div>
            ))}
            <div style={{marginBottom:20}}>
              <Mono size={10} color={C.inkFaint} spacing={0.5} style={{display:"block",marginBottom:6}}>{l7.predictLabel}</Mono>
              <input type="number" min={0} max={100} value={predictPct} onChange={e=>setPredictPct(+e.target.value)} style={{width:120,padding:"10px 12px",border:`1px solid ${C.border}`,borderRadius:4,fontFamily:"monospace",fontSize:13}}/>
            </div>
            <button onClick={submit} disabled={!readyToStart || busy} style={{padding:"12px 26px",background: readyToStart ? C.black : C.inkFaint,color:"#fff",border:"none",borderRadius:4,cursor: readyToStart ? "pointer" : "not-allowed",fontFamily:"monospace",fontSize:12,letterSpacing:0.5}}>{l7.startBtn}</button>
          </div>
        )}

      </div>
      <p style={{fontSize:11.5,color:C.inkFaint,fontStyle:"italic",marginTop:14}}>{l7.cannotPromiseNote}</p>
    </div>
  );
}

// ─── Счётчик серии в шапке ───────────────────────────────────────────────────
function SeriesCounter({ progress, loading, lang }) {
  const S = STRINGS[lang] || STRINGS.ru;
  if (loading || !progress) return null;
  const scrollToStep7 = () => {
    const el = document.getElementById("secLadderStep7");
    if (el) el.scrollIntoView({behavior:"smooth"});
  };
  let label;
  if (progress.status === "done") label = S.seriesCounterDone;
  else if (progress.status === "in_progress") label = `${progress.trade_count} / ${progress.target}`;
  else if (progress.status === "blocked") label = S.seriesCounterBlocked;
  else label = S.seriesCounterNotYet;
  return (
    <div onClick={scrollToStep7} title={S.seriesCounterGoto} style={{cursor:"pointer",fontFamily:"monospace",fontSize:11.5,color:C.gold,border:`1px solid ${C.borderGold}`,borderRadius:20,padding:"5px 14px",letterSpacing:0.5,whiteSpace:"nowrap"}}>
    {label}
    </div>
  );
}
