// ─── Хук: gate-status ступени 9 главы 14 (переиспользован для пути 2) ───────
function useGateStatus() {
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  React.useEffect(() => {
    let alive = true;
    fetch("/api/journal/gate-status")
      .then(r => r.ok ? r.json() : null)
      .catch(() => null)
      .then(d => { if (alive) { setData(d); setLoading(false); } });
    return () => { alive = false; };
  }, []);
  return { data, loading };
}

// ─── Три пути — ступень 10 ─────────────────────────────────────────────────
function ThreePaths({ lang }) {
  const T = window.Ch15Content[INITIAL_LANG] || window.Ch15Content.ru;
  const tp = T.threePaths;
  const { data: gate, loading: gateLoading } = useGateStatus();
  const [selected, setSelected] = React.useState(null);
  const [pace, setPace] = React.useState(5);

  const cardStyle = {
    background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10,
    padding: "24px 24px", display: "flex", flexDirection: "column", height: "100%",
  };
  const btnStyle = (active) => ({
    marginTop: "auto", padding: "12px 20px", background: active ? C.black : "#fff",
    color: active ? "#fff" : C.black, border: `1px solid ${C.black}`, borderRadius: 4,
    cursor: "pointer", fontFamily: "monospace", fontSize: 11.5, letterSpacing: 0.5, fontWeight: 600,
  });

  return (
    <div id="secThreePaths" style={{marginBottom:48,scrollMarginTop:130}}>
      <p style={{fontSize:14.5,color:C.black,lineHeight:1.78,marginBottom:28,maxWidth:800,fontFamily:"'DM Serif Display',serif",fontSize:19}}>{tp.intro}</p>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,marginBottom:28}} className="g3">
        <div style={cardStyle}>
          <div style={{fontWeight:600,fontSize:14,color:C.black,marginBottom:10}}>{tp.path1.title}</div>
          <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6,marginBottom:16,flex:1}}>{tp.path1.text}</p>
          <button onClick={()=>setSelected("demo")} style={btnStyle(selected==="demo")}>{tp.path1.cta}</button>
        </div>

        <div style={cardStyle}>
          <div style={{fontWeight:600,fontSize:14,color:C.black,marginBottom:10}}>{tp.path2.title}</div>
          <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6,marginBottom:12,flex:1}}>{tp.path2.text}</p>
          {/* SPEC_charts_and_interactivity_standard.md (29.07 re-audit): this
              real gate-status fetch used to render unconditionally, visible
              before any click -- clicking "live" only added a thank-you note,
              not a real consequence (class C dressed as B). Now it's gated
              behind the actual choice: the reader commits to path 2 first,
              THEN sees the real result. */}
          {selected === "live" && !gateLoading && gate && !gate.all_ok && (
            <div style={{background:"#fff",border:`1px solid ${C.border}`,borderRadius:6,padding:"10px 12px",marginBottom:12}}>
              <p style={{fontSize:11.5,color:C.inkMid,margin:"0 0 8px 0"}}>{tp.path2.blockedNote}</p>
              <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:10}}>
                {[["trades",tp.path2.condTrades],["weeks",tp.path2.condWeeks],["system",tp.path2.condSystem],["math",tp.path2.condMath]].map(([key,label]) => {
                  const cond = gate.conditions[key];
                  return (
                    <div key={key} style={{display:"flex",justifyContent:"space-between",fontSize:11,fontFamily:"monospace"}}>
                      <span style={{color:cond.ok?C.gold:C.inkMid}}>{cond.ok ? "✓" : "·"} {label}</span>
                      <span style={{color:cond.ok?C.gold:C.inkFaint}}>{cond.have}/{cond.need}</span>
                    </div>
                  );
                })}
              </div>
              {/* SPEC_charts_and_interactivity_standard.md (29.07): real class-A
                  element -- reader adjusts a real pace input, projection recomputes
                  from the real trades gap (need - have) returned by gate-status,
                  not a static number. */}
              {!gate.conditions.trades.ok && (
                <div style={{marginBottom:10}}>
                  <label style={{fontSize:10.5,color:C.inkFaint,fontFamily:"monospace",display:"block",marginBottom:4}}>{tp.path2.projLabel}: {pace}</label>
                  <input type="range" min="1" max="20" value={pace} onChange={e=>setPace(Number(e.target.value))} style={{width:"100%"}}/>
                  <p style={{fontSize:11,color:C.gold,fontFamily:"monospace",margin:"4px 0 0"}}>
                    {tp.path2.projResult(Math.ceil((gate.conditions.trades.need - gate.conditions.trades.have) / pace))}
                  </p>
                </div>
              )}
              <span onClick={()=>window.location.href=getChUrl(14,lang)} style={{fontSize:11,color:C.gold,cursor:"pointer",fontFamily:"monospace"}}>{tp.path2.gotoGate}</span>
            </div>
          )}
          {selected === "live" && !gateLoading && gate && gate.all_ok && (
            <div style={{background:"#fff",border:`1px dashed ${C.borderGold}`,borderRadius:6,padding:"10px 12px",marginBottom:12}}>
              <p style={{fontSize:11.5,color:C.inkFaint,fontStyle:"italic",margin:0}}>{tp.path2.pendingNote}</p>
            </div>
          )}
          <button onClick={()=>setSelected("live")} style={btnStyle(selected==="live")}>{tp.path2.cta}</button>
        </div>

        <div style={cardStyle}>
          <div style={{fontWeight:600,fontSize:14,color:C.black,marginBottom:10}}>{tp.path3.title}</div>
          <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6,marginBottom:12,flex:1}}>{tp.path3.text}</p>
          <div style={{background:"#fff",border:`1px dashed ${C.borderGold}`,borderRadius:6,padding:"10px 12px",marginBottom:12}}>
            <p style={{fontSize:11.5,color:C.inkFaint,fontStyle:"italic",margin:0}}>{tp.path3.pendingNote}</p>
          </div>
          <button onClick={()=>setSelected("managed")} style={btnStyle(selected==="managed")}>{tp.path3.cta}</button>
        </div>
      </div>

      {selected && <p style={{fontSize:13,color:C.gold,textAlign:"center",marginBottom:24}}>{tp.selectedNote}</p>}

      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"20px 24px"}}>
        <div style={{fontWeight:600,fontSize:12.5,color:C.black,marginBottom:8}}>{tp.whatWeDontDoTitle}</div>
        <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.65,margin:0}}>{tp.whatWeDontDo}</p>
      </div>
    </div>
  );
}

// ─── Проверь нас ────────────────────────────────────────────────────────────
function useClaims() {
  const [claims, setClaims] = React.useState(null);
  React.useEffect(() => {
    let cancelled = false;
    fetch("/data/edu_stats/course_claims.json")
      .then(r => r.json())
      .then(d => { if (!cancelled) setClaims(d.claims || []); })
      .catch(() => { if (!cancelled) setClaims([]); });
    return () => { cancelled = true; };
  }, []);
  return claims;
}

function VerifyUs({ lang }) {
  const T = window.Ch15Content[INITIAL_LANG] || window.Ch15Content.ru;
  const v = T.verifyUs;
  const claims = useClaims();
  const claimField = "claim_" + lang;

  return (
    <div style={{marginBottom:48}}>
      <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black,marginBottom:14}}>{v.title}</div>
      <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.75,marginBottom:12,maxWidth:800}}>{v.body1}</p>
      <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.75,marginBottom:22,maxWidth:800}}>{v.body2}</p>

      {claims === null ? <p style={{fontSize:12.5,color:C.inkFaint}}>…</p> : (
        <div style={{border:`1px solid ${C.border}`,borderRadius:8,overflow:"hidden",marginBottom:20}}>
          {claims.map((c,i) => (
            <div key={i} style={{padding:"13px 18px",borderBottom: i<claims.length-1 ? `1px solid ${C.border}` : "none",display:"flex",gap:14,alignItems:"flex-start",flexWrap:"wrap"}}>
              <Mono size={9} color={C.gold} spacing={0.5} style={{minWidth:60}}>{v.chapterLabel}{c.chapter}</Mono>
              <p style={{fontSize:12.5,color:C.black,lineHeight:1.55,margin:0,flex:1,minWidth:220}}>{c[claimField] || c.claim_ru}</p>
              <Mono size={9} color={C.inkFaint} spacing={0.5}>{v.typeLabels[c.type] || c.type}</Mono>
              {c.csv && <a href={c.csv} download style={{fontFamily:"monospace",fontSize:9.5,color:C.gold,textDecoration:"none",border:`1px solid ${C.gold}`,padding:"2px 8px",borderRadius:3}}>CSV</a>}
              {!c.csv && c.json && <a href={c.json} download style={{fontFamily:"monospace",fontSize:9.5,color:C.inkFaint,textDecoration:"none",border:`1px solid ${C.border}`,padding:"2px 8px",borderRadius:3}}>JSON</a>}
            </div>
          ))}
        </div>
      )}

      <a href="/data/edu_stats/course_claims.json" download style={{fontFamily:"monospace",fontSize:12,color:C.gold,textDecoration:"none",border:`1px solid ${C.gold}`,padding:"10px 18px",borderRadius:4,display:"inline-block"}}>{v.downloadClaims}</a>
    </div>
  );
}
