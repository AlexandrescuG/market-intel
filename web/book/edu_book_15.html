  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{max-width:100vw;overflow-x:hidden;scroll-behavior:smooth}
    body{background:#ffffff;font-family:'DM Sans',system-ui,sans-serif;color:#18181a}
    #sbf-book-root{min-height:100vh}
    .back-to-edu{
      position:fixed;bottom:20px;right:20px;z-index:500;
      background:#18181a;color:rgba(255,255,255,0.6);
      font-family:'DM Sans',sans-serif;font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;
      padding:7px 13px;text-decoration:none;transition:all .2s;
      border:1px solid rgba(255,255,255,0.08);
    }
    .back-to-edu:hover{background:#c9973a;color:#fff}
    .messenger-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
    @keyframes glowPulse{0%,100%{box-shadow:0 0 15px rgba(201,151,58,0.25)}50%{box-shadow:0 0 35px rgba(201,151,58,0.65)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
    @keyframes starPop{0%{transform:scale(0) rotate(-20deg);opacity:0}70%{transform:scale(1.2) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}
    .cta-pulse{animation:glowPulse 2.2s infinite}
    .cta-pulse:hover{transform:translateY(-3px);animation:none;box-shadow:0 0 50px rgba(201,151,58,0.85)!important}
    .broker-card{transition:all .3s cubic-bezier(.4,0,.2,1);border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);border-radius:12px}
    .broker-card:hover{transform:translateY(-5px);background:rgba(255,255,255,0.06);border-color:rgba(201,151,58,0.45)}
    .fade-up{animation:fadeUp .5s ease both}
    .gold-line{height:1px;background:linear-gradient(90deg,transparent,#c9973a,transparent);opacity:.35}
    @media(max-width:900px){.g3{grid-template-columns:1fr 1fr!important}}
    @media(max-width:768px){.messenger-grid{grid-template-columns:1fr}.hide-mobile{display:none!important}.g2,.g3{grid-template-columns:1fr!important}}
  </style>
</head>

// COMPONENT: BROKER MATCHMAKER
// ═══════════════════════════════════════════════════════════════════════════════
function BrokerMatchmaker({onOpenContact}) {
  const { useState } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const [step, setStep] = useState(0);
  const [scores, setScores] = useState({scalp:0,swing:0,pamm:0});
  const [result, setResult] = useState(null);
  const [chosen, setChosen] = useState(null);

  const handleAnswer = (val) => {
    const ns = {...scores,[val]:scores[val]+1};
    setScores(ns);
    if (step < MATCH_QUESTIONS.length - 1) {
      setChosen(null);
      setStep(s => s+1);
    } else {
      let winner = Object.entries(ns).sort((a,b)=>b[1]-a[1])[0][0];
      setResult(PROP_DATA[winner]);
    }
    setChosen(val);
  };

  const reset = () => { setStep(0); setScores({scalp:0,swing:0,pamm:0}); setResult(null); setChosen(null); };

  const q = MATCH_QUESTIONS[step];
  const progress = ((step) / MATCH_QUESTIONS.length) * 100;

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:16,padding:"40px",marginBottom:60}}>
      <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:32}}>
        <div style={{fontSize:32}}><img class='mi-icon' style='vertical-align:middle' src='/assets/icons/icon-target.png' alt='' width='20' height='20' /></div>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:24,color:C.white}}>{S.bmTitle}</div>
          <Mono size={11} color={C.inkSoft}>{S.bmSubtitle}</Mono>
        </div>
      </div>

      {!result ? (
        <div>
          {/* Progress */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <Mono size={11} color={C.gold} spacing={1}>{S.bmQuestionOf} {step+1} {S.bmOf} {MATCH_QUESTIONS.length}</Mono>
            <Mono size={11} color={C.inkFaint} spacing={1}>{Math.round(progress)}% {S.bmReadyPct}</Mono>
          </div>
          <div style={{height:4,background:"rgba(255,255,255,0.07)",borderRadius:3,marginBottom:28,overflow:"hidden"}}>
            <div style={{height:"100%",background:C.gold,width:`${progress}%`,transition:"width .4s",borderRadius:3}}/>
          </div>

          <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:24}}>
            <span style={{fontSize:24}}>{q.icon}</span>
            <h4 style={{fontFamily:"'DM Serif Display',serif",fontSize:"clamp(18px,2.5vw,24px)",color:C.white,fontWeight:400}}>{q.q}</h4>
          </div>

          <div style={{display:"grid",gap:12}}>
            {q.opts.map((opt,i) => (
              <button
                key={i}
                onClick={() => handleAnswer(opt.val)}
                style={{
                  display:"flex",gap:16,alignItems:"center",padding:"18px 20px",
                  background: chosen===opt.val ? `rgba(201,151,58,0.1)` : "rgba(255,255,255,0.03)",
                  border:`1px solid ${chosen===opt.val ? C.gold : "rgba(255,255,255,0.08)"}`,
                  borderRadius:8,cursor:"pointer",textAlign:"left",
                  color:C.white,fontFamily:"'DM Sans',sans-serif",fontSize:14,
                  transition:"all .2s"
                }}>
                <span style={{fontSize:22,flexShrink:0}}>{opt.emoji}</span>
                <span style={{lineHeight:1.5}}>{opt.label}</span>
              </button>
            ))}
          </div>
        </div>
      ) : (
        <div className="fade-up">
          <div style={{textAlign:"center",marginBottom:28}}>
            <div style={{fontSize:48,marginBottom:12}}>{result.icon}</div>
            <SectionLabel color={result.color}>{S.bmResultLabel}</SectionLabel>
            <h3 style={{fontFamily:"'DM Serif Display',serif",fontSize:"clamp(24px,3.5vw,36px)",color:C.white,marginBottom:12}}>{result.category}</h3>
            <p style={{fontSize:15,color:C.inkSoft,maxWidth:600,margin:"0 auto",lineHeight:1.65}}>{result.headline}</p>
          </div>

          {/* Recommended brokers */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:16,marginBottom:24}}>
            {result.brokers.slice(0,2).map((b,i) => (
              <div key={i} style={{background:"rgba(255,255,255,0.04)",border:`1px solid ${result.color}44`,borderRadius:8,padding:"20px"}}>
                <div style={{fontSize:24,marginBottom:10}}>{b.logo}</div>
                <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18,color:C.gold,marginBottom:6}}>{b.name}</div>
                <div style={{fontSize:12,color:C.inkSoft,lineHeight:1.55,marginBottom:12}}>{b.desc}</div>
                <div style={{fontSize:11,fontFamily:"monospace",color:result.color}}>{b.why}</div>
              </div>
            ))}
          </div>

          {/* Chapter refs */}

        {text:S.tqQ4Opt1Text,correct:false,hint:S.tqQ4Opt1Hint},
        {text:S.tqQ4Opt2Text,correct:true,hint:S.tqQ4Opt2Hint},
        {text:S.tqQ4Opt3Text,correct:false,hint:S.tqQ4Opt3Hint},
      ]
    },
    {
      q:S.tqQ5,
      opts:[
        {text:S.tqQ5Opt1Text,correct:false,hint:S.tqQ5Opt1Hint},
        {text:S.tqQ5Opt2Text,correct:true,hint:S.tqQ5Opt2Hint},
        {text:S.tqQ5Opt3Text,correct:false,hint:S.tqQ5Opt3Hint},
      ]
    },
  ];

  const [qIdx, setQIdx] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [selected, setSelected] = useState(null);
  const [done, setDone] = useState(false);

  const handleSelect = (i) => {
    if (selected !== null) return;
    setSelected(i);
    setTimeout(() => {
      const newAnswers = [...answers, {q:qIdx, a:i, correct:questions[qIdx].opts[i].correct}];
      setAnswers(newAnswers);
      if (qIdx + 1 >= questions.length) {
        setDone(true);
      } else {
        setQIdx(qi => qi+1);
        setSelected(null);
      }
    }, 1400);
  };

  const reset = () => { setQIdx(0); setAnswers([]); setSelected(null); setDone(false); };
  const score = answers.filter(a=>a.correct).length;
  const pct = done ? Math.round((score/questions.length)*100) : 0;

  const q = questions[qIdx];

  return (
    <div style={{background:"#0a0a0c",border:`1px solid ${C.border}`,borderRadius:16,padding:"40px",marginBottom:60}}>
      <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:32}}>
        <span style={{fontSize:32}}>🧩</span>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:24,color:C.white}}>{S.tqTitle}</div>
          <Mono size={11} color={C.inkSoft}>{S.tqSubtitle}</Mono>
        </div>
        {!done && <Chip color={C.gold} size={10} style={{marginLeft:"auto"}}>{qIdx+1} / {questions.length}</Chip>}
      </div>

      {!done ? (
        <div>
          {/* Progress */}
          <div style={{height:3,background:"rgba(255,255,255,0.06)",borderRadius:3,marginBottom:28,overflow:"hidden"}}>
            <div style={{height:"100%",background:C.gold,width:`${(qIdx/questions.length)*100}%`,transition:"width .4s",borderRadius:3}}/>
          </div>

          <h4 style={{fontFamily:"'DM Serif Display',serif",fontSize:"clamp(17px,2.3vw,22px)",color:C.white,fontWeight:400,marginBottom:24,lineHeight:1.4}}>{q.q}</h4>

          <div style={{display:"grid",gap:10}}>
            {q.opts.map((opt,i) => {
              const isSelected = selected === i;
              const showResult = selected !== null;
              const bg = !showResult ? "rgba(255,255,255,0.03)" : isSelected ? (opt.correct ? "rgba(8,153,129,0.15)" : "rgba(242,54,69,0.12)") : opt.correct ? "rgba(8,153,129,0.08)" : "rgba(255,255,255,0.02)";
              const border = !showResult ? "rgba(255,255,255,0.08)" : isSelected ? (opt.correct ? C.green : C.red) : opt.correct ? C.green+"55" : "rgba(255,255,255,0.05)";
              return (
                <div key={i}>
                  <button
                    onClick={() => handleSelect(i)}
                    disabled={selected !== null}
                    style={{width:"100%",display:"flex",gap:14,alignItems:"center",padding:"16px 18px",background:bg,border:`1px solid ${border}`,borderRadius:8,cursor:selected!==null?"default":"pointer",textAlign:"left",color:C.white,fontFamily:"'DM Sans',sans-serif",fontSize:14,transition:"all .25s"}}>
                    <div style={{width:24,height:24,borderRadius:"50%",background:!showResult?"rgba(255,255,255,0.08)":isSelected?(opt.correct?C.green:C.red):opt.correct?C.green+"66":"rgba(255,255,255,0.05)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0,color:C.white,fontWeight:700}}>
                      {!showResult ? String.fromCharCode(65+i) : isSelected ? (opt.correct?"✓":"✗") : opt.correct ? "✓" : String.fromCharCode(65+i)}
                    </div>
                    <span style={{lineHeight:1.5}}>{opt.text}</span>
                  </button>
                  {showResult && isSelected && (
                    <div style={{padding:"10px 16px",background:opt.correct?"rgba(8,153,129,0.08)":"rgba(242,54,69,0.07)",borderRadius:"0 0 6px 6px",marginTop:-1,border:`1px solid ${opt.correct?C.green+"33":C.red+"33"}`,borderTop:"none"}}>
                      <p style={{fontSize:12,color:opt.correct?C.green:C.red,lineHeight:1.55,fontFamily:"monospace"}}>{opt.hint}</p>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ) : (
        <div className="fade-up">
          <div style={{textAlign:"center",marginBottom:32}}>
            <div style={{fontSize:56,marginBottom:16}}>
              {pct>=80?"🏆":pct>=60?"🥈":"📚"}
            </div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:"clamp(28px,4vw,42px)",color:pct>=80?C.gold:pct>=60?C.inkSoft:C.inkFaint,marginBottom:12}}>
              {score} / {questions.length} {S.tqCorrectSuffix}
            </div>
            <div style={{fontSize:15,color:C.inkSoft,marginBottom:24}}>
              {pct>=80?S.tqResultGreat:pct>=60?S.tqResultGood:S.tqResultWeak}
            </div>
            {/* Wrong answers review */}
            {answers.filter(a=>!a.correct).length > 0 && (
              <div style={{background:"rgba(255,255,255,0.03)",borderRadius:8,padding:"16px 20px",marginBottom:20,textAlign:"left"}}>
                <Mono size={10} color={C.inkFaint} spacing={1} style={{display:"block",marginBottom:10}}>{S.tqReviewLabel}</Mono>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {[...new Set(answers.filter(a=>!a.correct).map(a=>{
                    const refs = {0:3,1:6,2:13,3:7,4:10};
                    return refs[a.q]||3;
                  }))].map(ch => (
                    <a key={ch} href={getChUrl(ch)} style={{fontSize:11,fontFamily:"monospace",color:C.red,background:"rgba(242,54,69,0.1)",padding:"4px 12px",borderRadius:3,textDecoration:"none",border:`1px solid rgba(242,54,69,0.2)`}}>
                      {S.tqChapterLink} {ch} →
                    </a>
                  ))}
                </div>
              </div>
            )}
          </div>
          <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
            <button onClick={onOpenContact} className="cta-pulse" style={{padding:"16px 32px",background:C.gold,color:C.black,border:"none",borderRadius:8,cursor:"pointer",fontFamily:"monospace",fontSize:14,fontWeight:700,letterSpacing:1}}>
              {S.tqStartTradingBtn}
            </button>
            <button onClick={reset} style={{padding:"16px 20px",background:"transparent",border:`1px solid ${C.border}`,color:C.inkSoft,borderRadius:8,cursor:"pointer",fontFamily:"monospace",fontSize:12}}>
              {S.tqRetryBtn}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

<script>
// Скрипт для конвертации UTC времени в локальное время пользователя
document.addEventListener('DOMContentLoaded', function() {
    var _pageLang = "{{ lang }}";
    var _intlLocale = _pageLang === 'ro' ? 'ro-RO' : _pageLang === 'en' ? 'en-US' : 'ru-RU';
    const utcTimes = document.querySelectorAll('.local-time[data-utc]');

    utcTimes.forEach(function(element) {
        // Получаем UTC время из data-utc атрибута
        var utcString = element.getAttribute('data-utc');

        try {
            // Парсим UTC дату и время
            var utcDate = new Date(utcString);

            // Конвертируем в локальное время пользователя
            var localDate = new Date(utcDate.getTime() + utcDate.getTimezoneOffset() * 60000);

            // Форматируем для отображения (например, "19:00 МСК")
            var hours = String(localDate.getHours()).padStart(2, '0');
            var minutes = String(localDate.getMinutes()).padStart(2, '0');
            var timeZoneName = Intl.DateTimeFormat(_intlLocale, { timeZoneName: 'long' }).format(localDate);
            
            // Обновляем текст элемента с локальным временем
            element.innerHTML = '<span class="local-time-display">' + hours + ':' + minutes + ' ' + timeZoneName.replace(/\s/g, '') + '</span>';
        } catch (e) {
            console.error('Ошибка конвертации времени:', e);
        }
    });
});
</script>
