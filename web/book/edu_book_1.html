  {y:1602,ru:"Амстердам. VOC (Vereenigde Oost-Indische Compagnie) выпускает первые акции в истории.",en:"Amsterdam. VOC (Dutch East India Company) issues the world's first shares.",ro:"Amsterdam. VOC emite primele acțiuni din istoria lumii.",
   detail:{ru:"VOC — Vereenigde Oost-Indische Compagnie, Объединённая Ост-Индская компания. Основана в 1602 году для торговли с Азией. Чтобы финансировать опасные и дорогостоящие морские экспедиции, она разделила собственность на акции и продала их публике. Первая в истории акционерная компания с ограниченной ответственностью. На пике капитализация VOC составляла ~$8 триллионов в современных деньгах — больше, чем Apple и Microsoft вместе. Именно здесь родился современный капитализм.",en:"VOC stands for Vereenigde Oost-Indische Compagnie — Dutch East India Company. Founded in 1602 to trade with Asia. To finance dangerous and expensive maritime expeditions, it divided ownership into shares and sold them to the public. The world's first joint-stock company with limited liability. At peak, VOC's market cap was ~$8 trillion in today's money — more than Apple and Microsoft combined. This is where modern capitalism was born.",ro:"VOC — Compania Olandezo-Indiei de Est, fondată în 1602 pentru comerț cu Asia. Pentru a finanța expediții maritime costisitoare, a împărțit proprietatea în acțiuni vândute publicului. Prima companie pe acțiuni cu răspundere limitată din lume. La apogeu, capitalizarea VOC era ~$8 trilioane în banii de astăzi."},

   detail:{ru:"24 брокера подписали Buttonwood Agreement 17 мая 1792 года под платаном (buttonwood tree) на Уолл-стрит. Маклер (Makler, нем.) — посредник в торговых сделках. Платан здесь — буквально дерево (американский платан, buttonwood), под которым собирались торговцы. Договорились: торговать только друг с другом, комиссия 0.25%. Никакого государства, никакого регулятора. Чистый рынок. Сейчас NYSE — крупнейшая биржа мира: $31.7 трлн капитализации.",en:"24 brokers signed the Buttonwood Agreement on May 17, 1792 under a buttonwood (sycamore) tree on Wall Street. 'Buttonwood' is a species of American sycamore — the actual tree they met under. They agreed: trade only with each other, 0.25% commission. No government, no regulator. Pure market. Today NYSE is the world's largest exchange at $31.7T market cap.",ro:"24 de brokeri au semnat Acordul Buttonwood pe 17 mai 1792 sub un copac platanus pe Wall Street. S-au angajat să tranzacționeze cu comision de 0,25%, fără regulator sau guvern. Astăzi NYSE este cea mai mare bursă din lume."},

   detail:{ru:"24 октября 1929 — «Чёрный четверг». S&P 500 потерял 89% за следующие 3 года. Главная причина: кредитное плечо 10:1 (купить акции с 10% своих денег). Когда рынок упал — брокеры требовали погашения кредитов, что вызывало каскадные принудительные продажи. Рынок восстановился до уровней 1929 года только в 1954 году — через 25 лет. Урок: кредитное плечо умножает как прибыли, так и потери.",en:"October 24, 1929 — 'Black Thursday'. S&P 500 lost 89% over 3 years. Main cause: leverage 10:1 (buy stocks with only 10% of your money). When the market fell, brokers demanded loan repayment, causing cascade forced selling. The market didn't recover to 1929 levels until 1954 — 25 years later. Lesson: leverage multiplies both gains and losses.",ro:"24 octombrie 1929 — 'Joia Neagră'. S&P 500 a pierdut 89% în 3 ani. Cauza principală: efect de levier 10:1. Piața a revenit la nivelurile din 1929 abia în 1954 — după 25 de ani."},

function App() {
  const [screen, setScreen] = React.useState("start");
  const [path, setPath] = React.useState("explorer");

  if (screen === "level1") {
    return (
      <Level1 
        onBack={() => setScreen("start")} 
        onNext={() => window.location.href = '/edu/b/2'} 
        path={path} 
      />
    );
  }
  
  if (screen === "soon") {
    return <ComingSoon onBack={() => setScreen("level1")} onTree={() => setScreen("tree")} />;
  }
  
  if (screen === "tree") {
    return <SkillTree onBack={() => setScreen("soon")} path={path} />;
  }
  
  return <StartScreen onStart={(p) => { setPath(p); setScreen("level1"); }} />;
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(React.createElement(App));
