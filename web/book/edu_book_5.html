// SceneEngine mounting helper -- same convention as chapters 2-4: each JSX
// page redefines its own copy since there's no shared module system between
// Jinja pages.
function SceneMount({ url, mode, symbol, copy }) {
  const { useRef, useEffect } = React;
  const ref = useRef(null);
  useEffect(() => {
    let cancelled = false;
    fetch(url).then(r => r.json()).then(data => {
      if (!cancelled && ref.current) window.SceneEngine.mount(ref.current, { mode, data, symbol, copy });
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [url]);
  return <div ref={ref}/>;
}

// SBFSessionTable mounting helper -- same ref-callback pattern as SceneMount.
function SessionTableMount({ lang, zone, mode }) {
  const { useRef, useEffect } = React;
  const ref = useRef(null);
  useEffect(() => {
    let cancelled = false;
    if (ref.current && window.SBFSessionTable) {
      window.SBFSessionTable.mount(ref.current, { lang, zone, mode }).catch(() => {});
    }
    return () => { cancelled = true; };
  }, [lang, zone, mode]);
  return <div ref={ref} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 24px"}}/>;
}

// ── fillTemplate: единственное место, где числа главы попадают в текст.
// Плейсхолдер без значения в vars -- честный "—" + console.error, а не
// тихая подстановка выдуманного числа (§8 критериев приёмки: "ни одного
// числа, написанного руками", незаполненный плейсхолдер -- блокирующий баг).
function fillTemplate(str, vars) {
  if (!str) return str;
  return str.replace(/\{\{(\w+)\}\}/g, (m, key) => {
    const v = vars ? vars[key] : undefined;
    if (v === undefined || v === null || (typeof v === "number" && isNaN(v))) {
      console.error("[ch5] отсутствует значение для {{" + key + "}}");
      return "—";
    }
    return String(v);
  });
}

// ── formatDelta: доля (0.0719) → подписанная строка в п.п. ("+7.2 п.п.").
// Используется только для честных заголовков блока §3.1 (разрез значим/незначим).
const DELTA_UNIT = { ru: "п.п.", ro: "p.p.", en: "pp" };
function formatDelta(delta, lang) {
  if (delta === null || delta === undefined) return "—";
  const sign = delta > 0 ? "+" : delta < 0 ? "−" : "±";
  return sign + Math.abs(delta * 100).toFixed(1) + " " + (DELTA_UNIT[lang] || DELTA_UNIT.ru);
}

// ── <Stat/>: примитив главы 5 (SPEC §3.4/§8) -- отображает уже вычисленное
// число или честно "—" + console.error, если данных нет. Числа сюда всегда
// приходят из hourly_profile.json/asia_sweep.json через компонент выше по
// дереву -- ни одного литерала в JSX-разметке.
function Stat({v, suffix="", prefix="", round}) {
  const ok = v !== undefined && v !== null && !(typeof v === "number" && isNaN(v));
  if (!ok) {
    console.error("[ch5] Stat: нет значения");
    return <span style={{color:C.red}}>—</span>;
  }
  const val = (round != null && typeof v === "number") ? v.toFixed(round) : v;
  return <span>{prefix}{val}{suffix}</span>;
}

// ── Загрузка всех данных главы: hourly_profile.json, asia_sweep.json,
// market_hours.json (через SBFSessionTable.load()), ch5_coldopen_day.json.
function useCh5Data() {
  const { useState, useEffect } = React;
  const [state, setState] = useState({ loading: true, error: null, hp: null, as: null, cfg: null, coldOpen: null });
  useEffect(() => {
    let cancelled = false;
    Promise.all([
      fetch("/data/edu_stats/hourly_profile.json").then(r => { if (!r.ok) throw new Error("hourly_profile.json HTTP " + r.status); return r.json(); }),
      fetch("/data/edu_stats/asia_sweep.json").then(r => { if (!r.ok) throw new Error("asia_sweep.json HTTP " + r.status); return r.json(); }),
      window.SBFSessionTable.load(),
      fetch("/data/edu_scenes/ch5_coldopen_day.json").then(r => { if (!r.ok) throw new Error("ch5_coldopen_day.json HTTP " + r.status); return r.json(); }),
    ]).then(([hp, as, cfg, coldOpen]) => {
      if (!cancelled) setState({ loading: false, error: null, hp, as, cfg, coldOpen });
    }).catch(err => {
      console.error("[ch5] load failed:", err);
      if (!cancelled) setState({ loading: false, error: err, hp: null, as: null, cfg: null, coldOpen: null });
    });
    return () => { cancelled = true; };
  }, []);
  return state;
}

// ── vars: единственный источник чисел для текстовых {{плейсхолдеров}}
// (остальные компоненты читают hp/as напрямую в своём собственном состоянии).
function buildVars(hp, as, cfg, lang) {
  if (!hp || !as || !cfg) return null;
  const g = hp.GOLD;
  if (!g) return null;
  const avg = g.avg_share || {};
  const ASIA_HOURS = [0,1,2,3,4,5,6];
  const nightVals = ASIA_HOURS.map(h => avg[h]).filter(v => v != null);
  const nightShare = nightVals.length ? Math.round((nightVals.reduce((a,b)=>a+b,0)/nightVals.length)*1000)/10 : null;

  const anchor = cfg.anchors.summer;
  const tstr = window.SBFSessionTable.timeString;
  const findEv = id => cfg.events.find(e => e.id === id);
  const evOverlap = findEv("overlap"), evLseClose = findEv("lse_close"), evUsMacro = findEv("us_macro"), evLseOpen = findEv("lse_open");

  const midHour = evLseOpen ? parseInt(evLseOpen.utc_dst.split(":")[0], 10) : null;
  const midShare = (midHour != null && avg[midHour] != null) ? Math.round(avg[midHour]*1000)/10 : null;

  return {
    n_days: g.coverage ? g.coverage.n_days : null,
    total_bars: g.total_bars,
    peak_hour: g.peak_hour, peak_share: g.peak_share,
    trough_hour: g.trough_hour, trough_share: g.trough_share,
    peak_ratio: g.peak_ratio,
    years_consistent: g.years_consistent, years_total: g.years_total,
    coverage_first: g.coverage ? g.coverage.first : null,
    coverage_last: g.coverage ? g.coverage.last : null,
    night_share: nightShare,
    midHour, midShare,
    sweep_total_days: as.total_days, sweep_days: as.sweep_days, sweep_pct: as.sweep_pct,
    reversal_pct: as.reversal_pct, continuation_pct: as.continuation_pct, neutral_pct: as.neutral_pct,
    overlap_local: evOverlap ? tstr(evOverlap, anchor, "Europe/Chisinau", lang) : null,
    overlap_md: evOverlap ? tstr(evOverlap, anchor, "Europe/Chisinau", lang) : null,
    overlap_kz: evOverlap ? tstr(evOverlap, anchor, "Asia/Almaty", lang) : null,
    us_data_md: evUsMacro ? tstr(evUsMacro, anchor, "Europe/Chisinau", lang) : null,
    lon_close_local: evLseClose ? tstr(evLseClose, anchor, "Europe/Chisinau", lang) : null,
  };
}

  const T5 = window.Ch5Content[INITIAL_LANG] || window.Ch5Content.ru;

  const meta = coldOpen.meta, candles = coldOpen.candles || [];
  const maxRange = Math.max(...candles.map(c => c.high - c.low));
  const peakTime = meta.peak_bar_time;
  // Строка после первого бара зависит от того, как крупнейший бар суток
  // соотносится с первой третью (meta.coldopen_key, см. build_ch5_coldopen_day.py) —
  // день выбирается как медианный, а не рекордный, и на тихий день утверждение
  // "бар больше первой трети" было бы неправдой рядом со своими же числами.
  const climax = (co.climaxByKey && co.climaxByKey[meta.coldopen_key]) || co.lines[3];
  const lines = co.lines.map((line, i) => i === 3 ? fillTemplate(climax, {day_range: meta.day_range}) : line);
  return (
    <div style={{background:C.black,padding:"70px 5vw 56px",color:"#fff"}}>
      <Mono size={11} color={C.gold} spacing={4} style={{display:"block",marginBottom:24,textAlign:"center"}}>{co.tag}</Mono>
      <div style={{maxWidth:840,margin:"0 auto 28px"}}>
        {lines.map((line,i) => (
          <p key={i} style={{fontSize: i<2 ? 15 : i===co.lines.length-1 ? 17 : 15.5, color: i>=4?"#fff":"rgba(255,255,255,0.72)", fontWeight: i>=4?600:400, lineHeight:1.75, marginBottom:14, fontFamily: i===co.lines.length-1 ? "'DM Serif Display',serif" : "inherit"}}>{line}</p>
        ))}
      </div>
      <div style={{display:"flex",alignItems:"flex-end",gap:2,height:140,maxWidth:900,margin:"0 auto 14px",padding:"0 4px"}}>
        {candles.map((c,i) => {
          const r = c.high - c.low;
          const h = Math.max(2, (r / maxRange) * 140);
          const isPeak = c.time === peakTime;
          const isQuiet = new Date(c.time).getUTCHours() < 8;
          return (
            <div key={i} title={c.time} style={{flex:1,height:h,background:isPeak?C.gold:isQuiet?"rgba(255,255,255,0.15)":"rgba(201,151,58,0.45)",borderRadius:1}}/>

      <div style={{display:"flex",justifyContent:"space-between",maxWidth:900,margin:"0 auto 30px",fontSize:10,fontFamily:"monospace",color:"rgba(255,255,255,0.35)",padding:"0 4px"}}>

// ─── Hour stats block: heatmap 24×N — ядро главы ──────────────────────────────
function HourStatsBlock({ hp, vars }) {
  const { useState } = React;
  const T5 = window.Ch5Content[INITIAL_LANG] || window.Ch5Content.ru;
  const hs = T5.hourStats;
  const [asset, setAsset] = useState("GOLD");
  const [subset, setSubset] = useState("all");
  const data = hp && hp[asset];
  const hours = Array.from({length:24}, (_,i) => i);

  const periods = data ? Object.keys(data.by_period).sort() : [];
  const cellVal = (period, h) => {
    if (subset === "all") {
      const c = data.by_period[period][h];
      return c ? c.share_of_day : null;
    }
    const key = subset === "friday" ? "friday" : subset === "nfp" ? "nfp_day" : "regular_day";
    const sub = data.subsets && data.subsets[key];
    return sub && sub.profile ? sub.profile[h] : null;
  };

  let maxVal = 0.0001;
  if (data) {
    if (subset === "all") {
      periods.forEach(p => hours.forEach(h => { const v = cellVal(p,h); if (v!=null && v>maxVal) maxVal = v; }));
    } else {
      hours.forEach(h => { const v = cellVal(null,h); if (v!=null && v>maxVal) maxVal = v; });
    }
  }

  // §3.1: заголовки блока выводов не должны утверждать больше, чем показывает
  // текущая выборка. periods_total/vs_regular приходят из hourly_profile.json
  // (hourly_profile.py), пересчитываются при смене инструмента через data.
  function subsetConclusionTitle(v, label) {
    if (!v || v.delta === null || v.n_a < 2) {
      return fillTemplate(hs.conclusionInsufficient, { label, n: v ? v.n_a : 0 });
    }
    return v.significant
      ? fillTemplate(hs.conclusionSubsetSignificant, { label, delta: formatDelta(v.delta, INITIAL_LANG), n: v.n_a })
      : fillTemplate(hs.conclusionSubsetNotSignificant, { label, n: v.n_a });
  }
  const curveTitle = data && data.periods_total < 3
    ? fillTemplate(hs.conclusionFewPeriods, { n: data.periods_total })
    : hs.conclusions[0].title;
  const conclusionTitles = data ? [
    curveTitle,
    hs.conclusions[1].title,
    subsetConclusionTitle(data.subsets && data.subsets.friday && data.subsets.friday.vs_regular, hs.fridayLabel),
    subsetConclusionTitle(data.subsets && data.subsets.nfp_day && data.subsets.nfp_day.vs_regular, hs.nfpLabel),
  ] : hs.conclusions.map(c => c.title);

  const warnings = data ? (data.warnings || []) : [];
  const warnText = { short_history: hs.coverageWarningShort, few_periods: hs.coverageWarningFew, under_one_year: hs.coverageWarningYear };

  return (
    <div>
      <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:24,maxWidth:820}}>{data ? fillTemplate(hs.preamble, {total_bars:data.total_bars, n_days:data.coverage?data.coverage.n_days:null, coverage_first:data.coverage?data.coverage.first:null, coverage_last:data.coverage?data.coverage.last:null}) : "—"}</p>

      <div style={{display:"flex",gap:20,flexWrap:"wrap",marginBottom:18,alignItems:"center"}}>
        <div>
          <Mono size={10} color={C.inkFaint} spacing={1} style={{display:"block",marginBottom:6,textTransform:"uppercase"}}>{hs.switchInstrument}</Mono>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {ASSET_ORDER.filter(a => hp && hp[a]).map(a => (
              <button key={a} onClick={() => setAsset(a)} style={{fontFamily:"monospace",fontSize:10.5,padding:"5px 10px",cursor:"pointer",background:a===asset?C.gold:"#fff",color:a===asset?"#18181a":C.inkMid,border:`1px solid ${a===asset?C.gold:C.border}`,borderRadius:3}}>{a}</button>
            ))}
          </div>
        </div>
        <div>
          <Mono size={10} color={C.inkFaint} spacing={1} style={{display:"block",marginBottom:6,textTransform:"uppercase"}}>{hs.switchSubset}</Mono>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {[["all",hs.subsetAll],["friday",hs.subsetFriday],["nfp",hs.subsetNfp],["regular",hs.subsetRegular]].map(([k,label]) => (
              <button key={k} onClick={() => setSubset(k)} style={{fontFamily:"monospace",fontSize:10.5,padding:"5px 10px",cursor:"pointer",background:k===subset?C.black:"#fff",color:k===subset?"#fff":C.inkMid,border:`1px solid ${k===subset?C.black:C.border}`,borderRadius:3}}>{label}</button>
            ))}
          </div>
        </div>
      </div>

      {!data ? <p style={{fontSize:13,color:C.inkFaint}}>—</p> : (
      <>
        {subset === "all" ? (
          <div style={{overflowX:"auto",marginBottom:8}}>
            <div style={{display:"inline-block",minWidth:640}}>
              <div style={{display:"flex",marginBottom:2}}>
                <div style={{width:70,flexShrink:0}}/>
                {hours.map(h => <div key={h} style={{flex:1,minWidth:22,textAlign:"center",fontSize:8,fontFamily:"monospace",color:C.inkFaint}}>{h}</div>)}
              </div>
              {periods.map(p => (
                <div key={p} style={{display:"flex",marginBottom:2}}>
                  <div style={{width:70,flexShrink:0,fontSize:10,fontFamily:"monospace",color:C.inkSoft,display:"flex",alignItems:"center"}}>{p}</div>
                  {hours.map(h => {
                    const v = cellVal(p, h);
                    const alpha = v != null ? Math.max(0.08, v / maxVal) : 0;
                    return <div key={h} title={v!=null ? (v*100).toFixed(1)+"%" : "—"} style={{flex:1,minWidth:22,height:22,background: v!=null ? `rgba(201,151,58,${alpha})` : "repeating-linear-gradient(45deg,#f0ebe0,#f0ebe0 3px,#fff 3px,#fff 6px)",border:`1px solid ${C.border}`}}/>;
                  })}
                </div>
              ))}
            </div>
          </div>
        ) : (
          <div style={{display:"flex",alignItems:"flex-end",gap:2,height:90,marginBottom:8}}>
            {hours.map(h => {
              const v = cellVal(null, h);
              const barH = v != null ? Math.max(3, (v/maxVal)*90) : 2;
              return <div key={h} title={h+":00 · "+(v!=null?(v*100).toFixed(1)+"%":"—")} style={{flex:1,height:barH,background: v!=null ? C.gold : C.border,borderRadius:1}}/>;
            })}
          </div>
        )}

        <div style={{display:"flex",gap:24,flexWrap:"wrap",marginBottom:28,fontFamily:"monospace",fontSize:12,color:C.inkMid}}>
          <span>{fillTemplate(hs.peakLine, {peak_hour:data.peak_hour, peak_share:data.peak_share})}</span>
          <span>{fillTemplate(hs.troughLine, {trough_hour:data.trough_hour, trough_share:data.trough_share})}</span>
          <span>{fillTemplate(hs.ratioLine, {peak_ratio:data.peak_ratio, years_consistent:data.years_consistent, years_total:data.years_total})}</span>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:28}} className="g2">
          {hs.conclusions.map((c,i) => (
            <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"16px 20px"}}>
              <div style={{fontWeight:600,fontSize:12.5,color:C.black,marginBottom:6}}>{conclusionTitles[i]}</div>
              <p style={{fontSize:12,color:C.inkMid,lineHeight:1.6,margin:0}}>{fillTemplate(c.body, vars)}</p>
            </div>
          ))}
        </div>

        <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:6,padding:"16px 20px",marginBottom:12}}>
          <div style={{fontWeight:600,fontSize:12.5,color:C.black,marginBottom:6}}>{hs.honestTitle}</div>
          <p style={{fontSize:12,color:C.inkMid,lineHeight:1.65,margin:0}}>{hs.honestBody}</p>
        </div>

        {warnings.length > 0 && (
          <div style={{background:C.redPale,border:"1px solid rgba(242,54,69,.25)",borderRadius:6,padding:"14px 18px",marginBottom:16}}>
            <div style={{fontWeight:600,fontSize:11.5,color:"#c0392b",marginBottom:6}}>{hs.coverageLabel}: {data.coverage ? `${data.coverage.first} → ${data.coverage.last} (${data.coverage.n_days}d, ${data.coverage.n_periods}p)` : "—"}</div>
            {warnings.map(w => <p key={w} style={{fontSize:11.5,color:"#c0392b",lineHeight:1.6,margin:"4px 0 0"}}>· {warnText[w] || w}</p>)}

  );
}

// ─── Liquidity Globe (глобус ликвидности, 3 шага, реальные данные) ───────────
function LiquidityGlobe({ hp }) {
  const { useState, useEffect, useRef } = React;
  const T5 = window.Ch5Content[INITIAL_LANG] || window.Ch5Content.ru;
  const gl = T5.globe;
  const [asset, setAsset] = useState("GOLD");
  const [hour, setHour] = useState(13);
  const [touring, setTouring] = useState(false);
  const timerRef = useRef(null);

  const data = hp && hp[asset];
  const avg = data ? data.avg_share : null;
  const hours = Array.from({length:24}, (_,i) => i);
  const maxShare = avg ? Math.max(...hours.map(h => avg[h] || 0)) : 1;

  const midHourLocal = data ? Math.round(((data.trough_hour + data.peak_hour + (data.peak_hour < data.trough_hour ? 24 : 0)) / 2) % 24) : null;
  const midShareLocal = (data && avg && midHourLocal != null && avg[midHourLocal] != null) ? Math.round(avg[midHourLocal]*1000)/10 : null;

  useEffect(() => {
    if (!touring || !data) return;
    const stops = [data.trough_hour, midHourLocal, data.peak_hour].filter(v => v != null);
    let i = 0;
    setHour(stops[0]);
    timerRef.current = setInterval(() => {
      i++;
      if (i >= stops.length) { setTouring(false); clearInterval(timerRef.current); return; }
      setHour(stops[i]);
    }, 2200);
    return () => clearInterval(timerRef.current);
  }, [touring, asset]);

  const sessionBand = (h) => {
    // приблизительные календарные окна (см. таблицу §3.2), не измерение --
    // используются только как фоновая подсказка "кто примерно за столом".
    const inAsia = h < 7 || h >= 21;
    const inLondon = h >= 7 && h < 16;
    const inNy = h >= 13 && h < 22;
    if (inLondon && inNy) return "overlap";
    if (inLondon) return "london";
    if (inNy) return "ny";
    if (inAsia) return "asia";
    return "";
  };
  const bandColor = { asia:"rgba(139,92,246,0.16)", london:"rgba(201,151,58,0.16)", ny:"rgba(45,122,79,0.16)", overlap:"rgba(240,54,69,0.14)", "":"transparent" };

  return (
    <div style={{background:C.black,borderRadius:8,padding:"32px 5vw",color:"#fff"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,marginBottom:20}}>
        <Mono size={11} color={C.gold} spacing={3}>{gl.tag}</Mono>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {ASSET_ORDER.filter(a => hp && hp[a]).map(a => (
            <button key={a} onClick={() => { setAsset(a); setTouring(false); }} style={{
              fontFamily:"monospace",fontSize:10.5,padding:"5px 10px",cursor:"pointer",
              background: a===asset ? C.gold : "transparent", color: a===asset ? "#18181a" : "rgba(255,255,255,0.55)",
              border:`1px solid ${a===asset?C.gold:"rgba(255,255,255,0.2)"}`,borderRadius:3
            }}>{a}</button>
          ))}
        </div>
      </div>

      {!data ? <p style={{color:"rgba(255,255,255,0.5)",fontSize:13}}>—</p> : (
      <>
        <p style={{fontSize:13.5,color:"rgba(255,255,255,0.7)",lineHeight:1.7,marginBottom:22,maxWidth:820}}>{fillTemplate(gl.step1Legend, {n_days: data.coverage ? data.coverage.n_days : null})}</p>

        {/* 24h band */}
        <div style={{display:"flex",borderRadius:4,overflow:"hidden",marginBottom:6,height:22}}>
          {hours.map(h => (
            <div key={h} style={{flex:1,background:bandColor[sessionBand(h)],borderRight: h===hour ? "none" : "1px solid rgba(255,255,255,0.04)",position:"relative"}}/>
          ))}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:9,fontFamily:"monospace",color:"rgba(255,255,255,0.3)",marginBottom:14}}>
          <span>00</span><span>06</span><span>12</span><span>18</span><span>23</span>
        </div>

        {/* bars */}
        <div style={{display:"flex",alignItems:"flex-end",gap:2,height:100,marginBottom:10}}>
          {hours.map(h => {
            const share = avg[h];
            const barH = share != null ? Math.max(3, (share/maxShare)*100) : 2;
            return (
              <div key={h} onClick={() => { setHour(h); setTouring(false); }} style={{flex:1,height:barH,background: h===hour ? C.gold : share!=null ? "rgba(201,151,58,0.4)" : "rgba(255,255,255,0.08)",cursor:"pointer",borderRadius:1}} title={h+":00 UTC"}/>
            );
          })}
        </div>
        <input type="range" min="0" max="23" value={hour} onChange={e => { setHour(+e.target.value); setTouring(false); }} style={{width:"100%",marginBottom:16}}/>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,background:"rgba(255,255,255,0.05)",borderRadius:6,padding:"14px 18px",marginBottom:20}}>
          <div>
            <Mono size={20} color={C.gold} spacing={0}>{String(hour).padStart(2,"0")}:00 UTC</Mono>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.55)",marginTop:4}}>
              {[sessionBand(hour)==="asia"||sessionBand(hour)==="" ? null : null].filter(Boolean)}
              {gl.sessionAsia}{(hour<7||hour>=21) ? " ●" : " ○"} · {gl.sessionLondon}{(hour>=7&&hour<16) ? " ●" : " ○"} · {gl.sessionNy}{(hour>=13&&hour<22) ? " ●" : " ○"}
              {(hour>=13&&hour<16) && <span style={{color:C.red,marginLeft:8}}>⚡ {gl.overlapBadge}</span>}
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <Mono size={20} color="#fff" spacing={0}>{avg[hour]!=null ? (avg[hour]*100).toFixed(1) : "—"}%</Mono>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",fontFamily:"monospace"}}>{gl.barLabel}</div>
          </div>
        </div>

        <button onClick={() => setTouring(t => !t)} style={{fontFamily:"monospace",fontSize:11,letterSpacing:1,padding:"9px 18px",background: touring?C.gold:"transparent",color: touring?"#18181a":C.gold,border:`1px solid ${C.gold}`,borderRadius:4,cursor:"pointer",marginBottom:20}}>
          {touring ? gl.stopBtn : gl.autoBtn}
        </button>

        <div style={{background:"rgba(255,255,255,0.04)",borderRadius:6,padding:"16px 20px",marginBottom:6}}>
          <Mono size={10} color="rgba(255,255,255,0.4)" spacing={1} style={{display:"block",marginBottom:8,textTransform:"uppercase"}}>{gl.step2Intro}</Mono>
          <p style={{fontSize:12.5,color:"rgba(255,255,255,0.65)",lineHeight:1.7,marginBottom:6}}>{fillTemplate(gl.step2Trough, {trough_hour:data.trough_hour, trough_share:data.trough_share})}</p>
          <p style={{fontSize:12.5,color:"rgba(255,255,255,0.65)",lineHeight:1.7,marginBottom:6}}>{fillTemplate(gl.step2Mid, {midHour: midHourLocal, midShare: midShareLocal})}</p>
          <p style={{fontSize:12.5,color:"rgba(255,255,255,0.65)",lineHeight:1.7}}>{fillTemplate(gl.step2Peak, {peak_hour:data.peak_hour, peak_share:data.peak_share, peak_ratio:data.peak_ratio})}</p>
        </div>

        <p style={{fontSize:12.5,color:"rgba(255,255,255,0.6)",lineHeight:1.7,marginTop:16,marginBottom:6}}>{gl.step3Task}</p>
        <p style={{fontSize:12.5,color:C.gold,lineHeight:1.7,marginBottom:16,fontStyle:"italic"}}>{gl.step3Reveal}</p>
        <div style={{textAlign:"center",fontFamily:"'DM Serif Display',serif",fontStyle:"italic",fontSize:16,color:"#fff",paddingTop:16,borderTop:"1px solid rgba(255,255,255,0.1)"}}>{gl.finalPlate}</div>
      </>
      )}
    </div>
  );
}

// ─── Asia Box trainer v2 (§3.9): real days, price-based check, 4-option question ──
function AsiaBoxTrainer({ as }) {
  const { useState, useRef, useEffect } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const T5 = window.Ch5Content[INITIAL_LANG] || window.Ch5Content.ru;
  const tr = T5.trainer;
  const days = (as && as.sample_days) || [];

  const W = 680, H = 300;
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState("draw"); // draw | guess | result
  const [drawing, setDrawing] = useState(false);
  const [box, setBox] = useState(null);
  const [startY, setStartY] = useState(null);
  const [answer, setAnswer] = useState(null);
  const [result, setResult] = useState(null);
  const [scores, setScores] = useState([]);
  const svgRef = useRef(null);

  const day = days[idx];
  const candles = day ? day.candles.map((c,i) => ({...c})) : [];
  const allPrices = candles.length ? candles.flatMap(c => [c.high, c.low]) : [0,1];
  const PMIN = Math.min(...allPrices), PMAX = Math.max(...allPrices);
  const pad = (PMAX - PMIN) * 0.1 || 1;
  const toY = p => H - ((p - (PMIN-pad)) / ((PMAX+pad) - (PMIN-pad))) * H;
  const toP = y => (PMIN-pad) + ((H - y) / H) * ((PMAX+pad) - (PMIN-pad));
  const step = candles.length ? (W-40) / candles.length : 1;

  const asiaCount = candles.filter(c => new Date(c.time).getUTCHours() < 7).length;

  const getSVGY = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return (clientY - rect.top) * (H / rect.height);
  };
  const handleMouseDown = (e) => { if (phase !== "draw") return; const y = getSVGY(e); setStartY(y); setDrawing(true); setBox({y1:y,y2:y}); };
  const handleMouseMove = (e) => { if (!drawing) return; setBox({y1:startY, y2:getSVGY(e)}); };
  const handleMouseUp = () => { if (!drawing) return; setDrawing(false); if (box && Math.abs(box.y2-box.y1) > 6) setPhase("guess"); };

  const submitAnswer = (opt) => {
    setAnswer(opt);
    const trueHi = day.asia_high, trueLo = day.asia_low;
    const trueRange = trueHi - trueLo;
    const userHi = toP(Math.min(box.y1,box.y2)), userLo = toP(Math.max(box.y1,box.y2));
    const boxOk = Math.abs(userHi - trueHi) <= trueRange*0.15 && Math.abs(userLo - trueLo) <= trueRange*0.15;
    const outcomeIdx = { reversal:0, continuation:1, no_sweep:2, neutral:3 }[day.outcome];
    const answerOk = opt === outcomeIdx;
    setResult({ boxOk, answerOk });
    setScores(s => [...s, answerOk]);
    setPhase("result");
  };

  const next = () => {
    if (idx + 1 >= days.length) { setPhase("done"); return; }
    setIdx(i => i+1); setPhase("draw"); setBox(null); setAnswer(null); setResult(null); setStartY(null); setDrawing(false);
  };
  const restart = () => { setIdx(0); setPhase("draw"); setBox(null); setAnswer(null); setResult(null); setScores([]); };

  if (!days.length) return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"30px",textAlign:"center",color:C.inkFaint}}>—</div>;

  const scoreCount = scores.filter(Boolean).length;

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"32px 36px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div>
          <Mono size={11} color={C.gold} spacing={2}>{tr.tag}</Mono>
          <div style={{fontFamily:"monospace",fontSize:12,color:C.inkSoft,marginTop:4}}>{fillTemplate(tr.dayCounter, {cur:idx+1, total:days.length})} · {tr.dateLabel}: {day.date}</div>
        </div>
        {phase !== "done" && <button onClick={restart} style={{padding:"8px 16px",background:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:11}}>{tr.resetBtn}</button>}
      </div>

      {phase === "done" ? (
        <div style={{textAlign:"center",padding:"30px 0"}}>
          <div style={{fontSize:28,fontFamily:"'DM Serif Display',serif",marginBottom:12}}>{fillTemplate(tr.resultTemplate, {score:scoreCount, total:days.length})}</div>
          <p style={{fontSize:12.5,color:C.inkFaint,marginBottom:16}}>{fillTemplate(tr.honestCount, {total:days.length})}</p>
          <button onClick={restart} style={{padding:"10px 24px",background:C.gold,color:"#18181a",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12,fontWeight:700}}>{tr.resetBtn}</button>
        </div>
      ) : (
      <>
        {phase === "draw" && idx === 0 && (
          <div style={{background:"rgba(201,151,58,0.08)",border:"1px solid rgba(201,151,58,0.25)",borderRadius:4,padding:"12px 16px",marginBottom:14}}>
            <StepTag n="1" label={S.stepExplain}/>
            <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6,margin:0}}>{tr.step1}</p>
            <StepTag n="2" label={S.stepShow}/>
            <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6,margin:0}}>{tr.step2}</p>
          </div>
        )}
        {phase === "draw" && <div style={{fontSize:12,color:C.inkFaint,marginBottom:10}}>{tr.boxToleranceNote}</div>}
        {phase === "guess" && (
          <div style={{background:C.greenPale,border:`1px solid ${C.green}`,borderRadius:4,padding:"14px 18px",marginBottom:14}}>
            {idx === 0 && <StepTag n="3" label={S.stepDo}/>}
            <p style={{fontSize:12.5,color:C.inkMid,marginBottom:10}}>{tr.step3Intro}</p>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {tr.options.map((o,i) => (
                <button key={i} onClick={() => submitAnswer(i)} style={{padding:"9px 16px",background:"#fff",color:C.black,border:`1px solid ${C.border}`,borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:11.5}}>{o}</button>
              ))}
            </div>
          </div>
        )}
        {phase === "result" && result && (
          <div style={{background: result.answerOk ? C.greenPale : C.redPale, border:`1px solid ${result.answerOk?C.green:C.red}`,borderRadius:4,padding:"14px 18px",marginBottom:14}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:6,color: result.answerOk?"#1f6b46":"#c0392b"}}>
              {tr.options[{ reversal:0, continuation:1, no_sweep:2, neutral:3 }[day.outcome]]} {result.boxOk ? "· ✓ box" : ""}
            </div>
            <p style={{fontSize:12,color:C.inkMid,lineHeight:1.6,margin:0}}>{day.date} · {day.outcome}{day.sweep_dir ? " ("+day.sweep_dir+")" : ""}</p>
            <button onClick={next} style={{marginTop:12,padding:"9px 18px",background:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:11.5}}>{tr.nextBtn}</button>
          </div>
        )}

        <div style={{borderRadius:4,overflow:"hidden",border:`1px solid ${C.border}`,position:"relative",userSelect:"none"}}>
          <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block",background:"#131722",cursor:phase==="draw"?"crosshair":"default",touchAction:"none"}}
            onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
            <line x1={20+asiaCount*step} y1={0} x2={20+asiaCount*step} y2={H} stroke="rgba(201,151,58,0.3)" strokeWidth="1" strokeDasharray="4 3"/>
            {candles.map((c,i) => {
              const bull = c.close >= c.open;
              const col = i < asiaCount ? "#8b5cf6" : bull ? "#2E7D5B" : "#B14848";
              const x = 20 + i*step;
              const bodyT = toY(Math.max(c.open,c.close)), bodyB = toY(Math.min(c.open,c.close));
              return (
                <g key={i}>
                  <line x1={x} y1={toY(c.high)} x2={x} y2={toY(c.low)} stroke={col} strokeWidth="1.3"/>
                  <rect x={x-Math.max(2,step*0.35)} y={bodyT} width={Math.max(4,step*0.7)} height={Math.max(bodyB-bodyT,1)} fill={col}/>
                </g>
              );
            })}
            {phase === "result" && (
              <rect x={20} y={toY(day.asia_high)} width={asiaCount*step} height={toY(day.asia_low)-toY(day.asia_high)} fill="rgba(139,92,246,0.08)" stroke="#8b5cf6" strokeWidth="1.3" strokeDasharray="5 3"/>
            )}
            {(idx===0 && phase==="draw") && (
              <rect x={20} y={toY(day.asia_high)} width={asiaCount*step} height={toY(day.asia_low)-toY(day.asia_high)} fill="rgba(201,151,58,0.1)" stroke={C.gold} strokeWidth="1.3" strokeDasharray="5 3"/>
            )}
            {box && phase !== "result" && (
              <rect x={20} y={Math.min(box.y1,box.y2)} width={asiaCount*step} height={Math.abs(box.y2-box.y1)} fill="rgba(201,151,58,0.08)" stroke={C.gold} strokeWidth="1.5" strokeDasharray="5 3"/>
            )}
            <rect x={18} y={4} width={110} height={16} fill="rgba(139,92,246,0.25)" rx="2"/>
            <text x={24} y={15} fontSize="9" fill="#c4b5fd" fontFamily="monospace" fontWeight="700">ASIA 00-07</text>
          </svg>
        </div>
        <p style={{fontSize:11,color:C.inkFaint,marginTop:10}}>{tr.xpNote}</p>
      </>
      )}
    </div>
  );
}

// ─── My Window (§3.11): personal block ────────────────────────────────────────
function MyWindowBlock({ cfg, hp, vars }) {
  const { useState, useEffect } = React;
  const T5 = window.Ch5Content[INITIAL_LANG] || window.Ch5Content.ru;
  const mw = T5.myWindow;
  const [archetype, setArchetype] = useState(null);
  const [saved, setSaved] = useState(false);

  const windowRanges = {
    morning: { startH:5, endH:9, label:{ru:"05:00–09:00",ro:"05:00–09:00",en:"05:00–09:00"} },
    evening: { startH:16, endH:20, label:{ru:"16:00–20:00",ro:"16:00–20:00",en:"16:00–20:00"} },
    night:   { startH:0, endH:4, label:{ru:"00:00–04:00",ro:"00:00–04:00",en:"00:00–04:00"} },
  };

  const g = hp && hp.GOLD;
  const range = archetype ? windowRanges[archetype] : null;
  let userShare = null;
  if (g && range) {
    const hours = [];
    for (let h = range.startH; h < range.endH; h++) hours.push(h);
    const vals = hours.map(h => g.avg_share[h]).filter(v => v != null);
    userShare = vals.length ? Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*1000)/10 : null;
  }

  let eventsIn = [], eventsMissed = [];
  if (cfg && range) {
    cfg.events.forEach(ev => {
      const h = parseInt(ev.utc_dst.split(":")[0], 10);
      const label = ev["label_" + INITIAL_LANG] || ev.label_en;
      if (h >= range.startH && h < range.endH) eventsIn.push(label); else eventsMissed.push(label);
    });
  }

  return (
    <div style={{marginBottom:48}}>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"28px 32px"}}>
        <Mono size={11} color={C.gold} spacing={2} style={{display:"block",marginBottom:14}}>{mw.askQuestion}</Mono>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:24}}>
          {[["morning",mw.morningBtn],["evening",mw.eveningBtn],["night",mw.nightBtn]].map(([k,label]) => (
            <button key={k} onClick={() => { setArchetype(k); setSaved(false); }} style={{padding:"12px 20px",background:archetype===k?C.gold:"#fff",color:archetype===k?"#18181a":C.black,border:`1px solid ${archetype===k?C.gold:C.border}`,borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:600}}>{label}</button>
          ))}
        </div>

        {archetype && (
          <div style={{background:"#fff",border:`1px solid ${C.borderGold}`,borderRadius:8,padding:"24px 28px"}}>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:C.black,marginBottom:6}}>{mw.cardTitle}: {range.label[INITIAL_LANG] || range.label.en}</div>
            <p style={{fontSize:13,color:C.inkMid,lineHeight:1.7,marginBottom:14}}>{fillTemplate(mw.shareLine, {...vars, user_window_share: userShare})}</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16}} className="g2">
              <div>
                <Mono size={10} color={C.inkFaint} spacing={1} style={{display:"block",marginBottom:6,textTransform:"uppercase"}}>{mw.eventsInLabel}</Mono>
                <p style={{fontSize:12,color:C.inkMid,lineHeight:1.6,margin:0}}>{eventsIn.length ? eventsIn.join(" · ") : "—"}</p>
              </div>
              <div>
                <Mono size={10} color={C.inkFaint} spacing={1} style={{display:"block",marginBottom:6,textTransform:"uppercase"}}>{mw.eventsMissedLabel}</Mono>
                <p style={{fontSize:12,color:C.inkFaint,lineHeight:1.6,margin:0}}>{eventsMissed.length ? eventsMissed.join(" · ") : "—"}</p>
              </div>
            </div>
            <p style={{fontSize:13,color:C.inkMid,lineHeight:1.75,marginBottom:18}}>{fillTemplate(mw.archetypes[archetype], vars)}</p>

            <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:6,padding:"16px 20px",marginBottom:16}}>
              <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.7,margin:0}}>{mw.journalBridge}</p>
            </div>

            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
              <button onClick={() => {
                setSaved(true);
                // SPEC_morning_brief_v2.md блок 6 -- раньше это было только
                // setSaved(true) локально, ничего не уходило на бэкенд.
                // Тот же паттерн, что saveSetup()/ритуал в главе 3: optimistic
                // UI + fire-and-forget PUT, анонимному пользователю бэкенд
                // молча вернёт 401 (см. _lp_require_auth), это ожидаемо.
                const doFetch = (window.sbfAuth && window.sbfAuth.isLoggedIn && window.sbfAuth.isLoggedIn()) ? window.sbfAuth.fetch : fetch;
                doFetch('/api/user/trading-window', {
                  method:'PUT', headers:{'Content-Type':'application/json'},
                  body: JSON.stringify({start_h: range.startH, end_h: range.endH, archetype}),
                }).catch(() => {});
              }} style={{padding:"11px 22px",background:saved?C.green:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12,fontWeight:700}}>
                {saved ? "✓" : ""} {mw.saveBtn}
              </button>
              <a href="/journal" style={{padding:"11px 22px",border:`1px solid ${C.border}`,borderRadius:4,color:C.black,textDecoration:"none",fontFamily:"monospace",fontSize:12}}>{mw.openJournalBtn}</a>
              {saved && <span style={{fontSize:11.5,color:C.green}}>{mw.savedNote}</span>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

      </div>

      {loading && <div style={{textAlign:"center",padding:"60px 0",fontFamily:"monospace",fontSize:13,color:C.inkFaint}}>{S.loadingLabel}</div>}
      {error && <div style={{textAlign:"center",padding:"40px 0",fontFamily:"monospace",fontSize:13,color:"#c0392b",background:C.redPale}}>{S.loadErrorLabel}</div>}

      {!loading && (
      <div style={{maxWidth:1060,margin:"0 auto",padding:"0 0 120px"}}>

        <div style={{margin:"0 -5vw 56px"}}><ColdOpen5 coldOpen={coldOpen}/></div>

        <div style={{padding:"0 5vw"}}>

        {/* ── АНТИ-МИФ → ГОЛОС SBF → ЦЕНА НЕЗНАНИЯ ── */}
        <div style={{marginBottom:48}}>
          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{T5.antiMyth.tag}</Mono>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px",marginBottom:28}}>
            <p style={{fontWeight:600,fontSize:14.5,color:C.black,marginBottom:10}}>{T5.antiMyth.title}</p>
            <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,marginBottom:12}}>{T5.antiMyth.body1}</p>
            <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,margin:0}}>{T5.antiMyth.body2}</p>
          </div>

          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{T5.voiceSbf.tag}</Mono>
          <div style={{borderLeft:`4px solid ${C.gold}`,paddingLeft:24,marginBottom:28}}>
            {T5.voiceSbf.body.split("\n\n").map((p,i) => <p key={i} style={{fontSize:16,fontStyle:"italic",color:C.inkMid,lineHeight:1.7,fontFamily:"'DM Serif Display',serif",marginBottom:12}}>{p}</p>)}
          </div>

          <div style={{background:C.black,borderRadius:8,padding:"26px 30px",color:C.white}}>
            <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{T5.priceOfNotKnowing.tag}</Mono>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:C.white,marginBottom:12}}>{T5.priceOfNotKnowing.title}</div>
            {T5.priceOfNotKnowing.body.split("\n\n").map((p,i) => <p key={i} style={{fontSize:13.5,lineHeight:1.75,color:"rgba(255,255,255,0.7)",marginBottom:10}}>{vars ? fillTemplate(p, vars) : p}</p>)}
          </div>
        </div>

        {/* ── Часы планеты ── */}
        <SectionTitle id="secClocks">{T5.clocks.title}</SectionTitle>
        <ClocksBlock/>

        {/* ── Глобус ликвидности ── */}
        <SectionTitle sub={S.globeSub}>{T5.globe.title}</SectionTitle>
        <div style={{marginBottom:24}}><StepTag n="1-3" label={S.stepExplain+" → "+S.stepShow+" → "+S.stepDo}/></div>
        <div style={{marginBottom:56}}><LiquidityGlobe hp={hp}/></div>

        {/* ── Почему сессии существуют ── */}
        <SectionTitle id="secWhySessions">{T5.whySessions.tag}</SectionTitle>
        <WhySessionsCards/>

        {/* ── Наши сутки — почасовая карта ── */}
        <SectionTitle>{T5.hourStats.title}</SectionTitle>
        <div style={{marginBottom:56}}><HourStatsBlock hp={hp} vars={vars}/></div>

        {/* ── Три мотора суток ── */}
        <SectionTitle>{T5.threeEngines.tag}</SectionTitle>
        <ThreeEngines vars={vars}/>

        {/* ── Где живут стопы ── */}
        <SectionTitle id="secStops">{T5.stops.title}</SectionTitle>
        <StopsSection/>

        {/* ── AMD как карта ── */}
        <SectionTitle>{T5.amd.title}</SectionTitle>
        <AmdHonestBlock as={as} vars={vars}/>

        {/* ── Сцена: реальный прокол ── */}
        <SectionTitle sub={S.sweepSub}>{T5.sweepScene.tag}</SectionTitle>
        <SweepScene vars={vars}/>

        {/* ── Тренажёр «Коробка Азии» v2 ── */}
        <SectionTitle sub={S.trainerSub}>{T5.trainer.tag}</SectionTitle>
        <div style={{marginBottom:56}}><AsiaBoxTrainer as={as}/></div>

        {/* ── Ловушка перевода часов ── */}
        <SectionTitle id="secDstTrap" sub={S.dstSub}>{T5.dstTrap.title}</SectionTitle>
        <DstTrapBlock vars={vars}/>

        {/* ── Твоё окно ── */}
        <SectionTitle sub={S.windowSub}>{T5.myWindow.title}</SectionTitle>
        <MyWindowBlock cfg={cfg} hp={hp} vars={vars}/>

        {/* ── Контекст локали ── */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px",marginBottom:48}}>
          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{T5.localeContext.tag}</Mono>
          <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,margin:0,maxWidth:780}}>{vars ? fillTemplate(T5.localeContext.body, vars) : T5.localeContext.body}</p>
        </div>

        <Rule/>

        <QuizBlock questions={T5.quiz} levelId="level_5" lang={lang} copy={{
          kicker: S.quizKicker, title: S.quizTitle, next: S.quizNext,
          stuckAll: S.quizStuckAll, stuckSome: S.quizStuckSome, backToSection: S.quizBackToSection,
        }} />

        <PredictHour vars={vars}/>

        <div style={{border:`1px dashed ${C.borderGold}`,borderRadius:8,padding:"20px 24px",marginBottom:32,background:C.surface}}>
          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{T5.cliffhanger.tag}</Mono>
          {T5.cliffhanger.body.split("\n\n").map((p,i) => <p key={i} style={{fontSize:14,color:C.inkMid,lineHeight:1.7,marginBottom:10}}>{p}</p>)}
        </div>

        <div style={{marginBottom:32}}>
          <Mono size={10} color={C.inkFaint} spacing={2} style={{display:"block",marginBottom:10,textTransform:"uppercase"}}>{T5.sources.tag}</Mono>
          <ol style={{fontSize:11.5,color:C.inkFaint,lineHeight:1.8,paddingLeft:18,marginBottom:8}}>
            {T5.sources.list.map((s,i) => <li key={i}>{s}</li>)}
          </ol>
          <p style={{fontSize:11,color:C.inkFaint,fontStyle:"italic"}}>{T5.sources.checked}</p>
        </div>

        <ComplianceFootnote lang={lang} />

        {/* Footer navigation */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:20,paddingTop:48,marginTop:16,borderTop:`1px solid ${C.border}`}}>
          <AskAnalystBtn tr={{askAnalyst:S.askQuestionLabel}} chapterNum={5} lang={lang} />
          <button
            onClick={() => window.location.href = getChUrl(6, lang)}
            style={{background:C.black,color:C.white,border:"none",padding:"18px 35px",cursor:"pointer",fontFamily:"monospace",fontSize:14,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.target.style.background=C.gold}
            onMouseLeave={e=>e.target.style.background=C.black}>
            {S.nextChapterBtn}
          </button>
        </div>

        </div>
      </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter5 />);
{% endraw %}
</script>
</body>
</html>
