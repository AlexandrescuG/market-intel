// ─── Interactive 1: Liquidity Globe — Session Timeline ────────────────────────
function LiquidityGlobe() {
  const { useState, useEffect, useRef } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const [hour, setHour] = useState(9);
  const [playing, setPlaying] = useState(false);
  const timerRef = useRef(null);

  const sessions = [
    {
      name:S.glSessionTokyoName, nameEn:"Tokyo", emoji:"🇯🇵",
      color:"#8b5cf6", colorLight:"rgba(139,92,246,0.15)",
      start:0, end:9,
      pairs:["USD/JPY","AUD/USD","NZD/USD"],
      desc:S.glSessionTokyoDesc,
      mskOffset:`+5 ${S.mskAbbrev}`
    },
    {
      name:S.glSessionLondonName, nameEn:"London", emoji:"🇬🇧",
      color:C.gold, colorLight:"rgba(201,151,58,0.15)",
      start:7, end:16,
      pairs:["EUR/USD","GBP/USD","XAU/USD"],
      desc:S.glSessionLondonDesc,
      mskOffset:`+2 ${S.mskAbbrev}`
    },
    {
      name:S.glSessionNyName, nameEn:"New York", emoji:"🇺🇸",
      color:C.green, colorLight:"rgba(8,153,129,0.15)",
      start:13, end:22,
      pairs:["EUR/USD","USD/CAD","DJI"],
      desc:S.glSessionNyDesc,
      mskOffset:`-5 ${S.mskAbbrev}`
    },
  ];

  const overlap = hour >= 13 && hour < 16;

  // Volume curve: peaks at overlap 13-16 GMT
  const getVolume = (h) => {
    if (h >= 13 && h < 16) return 100;
    if (h >= 7 && h < 13) return 55 + (h - 7) * 7;
    if (h >= 16 && h < 18) return 85 - (h - 16) * 15;
    if (h >= 18 && h < 22) return 55 - (h - 18) * 8;
    if (h >= 0 && h < 7) return 20 + h * 3;
    return 15;
  };

  const activeSessions = sessions.filter(s => hour >= s.start && hour < s.end);

  useEffect(() => {
    if (playing) {
      timerRef.current = setInterval(() => {
        setHour(h => h >= 23 ? 0 : h + 1);
      }, 700);
    } else {
      clearInterval(timerRef.current);
    }
    return () => clearInterval(timerRef.current);
  }, [playing]);

  const W = 680, H = 80;
  const barW = W / 24;

  // Build volume bars for chart
  const bars = Array.from({length:24}, (_,i) => ({h:i, vol: getVolume(i)}));

  const fmtHour = h => `${String(h).padStart(2,'0')}:00`;
  const mskHour = h => `${String((h+3)%24).padStart(2,'0')}:00 ${S.mskAbbrev}`;

  return (
    <div style={{background:C.black,borderRadius:8,padding:"36px 40px",color:C.white}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
        <span style={{fontSize:28}}><img class='mi-icon' style={{verticalAlign:'middle'}} src='/assets/icons/icon-globe.png' alt='' width='20' height='20' /></span>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.gold}}>{S.glTitle}</div>
          <Mono size={11} color="rgba(255,255,255,0.4)" spacing={2}>{S.glSubtitle}</Mono>
        </div>
      </div>

      {/* Time display */}
      <div style={{textAlign:"center",marginBottom:28}}>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:"clamp(36px,6vw,56px)",color:C.gold,letterSpacing:2}}>
          {fmtHour(hour)} <span style={{fontSize:"clamp(16px,2vw,22px)",color:"rgba(255,255,255,0.4)",letterSpacing:1}}>GMT</span>
        </div>
        <div style={{fontSize:14,color:"rgba(255,255,255,0.35)",marginTop:4,fontFamily:"monospace"}}>{mskHour(hour)}</div>
        {overlap && (
          <div style={{display:"inline-block",marginTop:10,background:"rgba(201,151,58,0.15)",border:"1px solid rgba(201,151,58,0.4)",padding:"5px 18px",borderRadius:3}}>
            <Mono size={11} color={C.gold} spacing={2}>{S.glOverlapBanner}</Mono>
          </div>
        )}
      </div>

      {/* Session cards */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:28}} className="g3">
        {sessions.map((s,i) => {
          const active = hour >= s.start && hour < s.end;
          return (
            <div key={i} style={{
              borderRadius:6,padding:"18px 20px",
              background: active ? s.colorLight : "rgba(255,255,255,0.03)",
              border: `1px solid ${active ? s.color : "rgba(255,255,255,0.07)"}`,
              transition:"all .4s",opacity: active ? 1 : 0.4
            }}>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:18}}>{s.emoji}</span>
                <div style={{fontWeight:700,fontSize:13,color: active ? s.color : "rgba(255,255,255,0.5)"}}>{s.name}</div>
                {active && <span style={{marginLeft:"auto",fontSize:9,fontFamily:"monospace",color:s.color,letterSpacing:1,background:`rgba(${s.color==='#8b5cf6'?'139,92,246':s.color===C.gold?'201,151,58':'8,153,129'},0.15)`,padding:"2px 7px",borderRadius:2}}>{S.glActiveBadge}</span>}
              </div>
              <div style={{fontSize:11,fontFamily:"monospace",color:"rgba(255,255,255,0.35)",marginBottom:8}}>
                {fmtHour(s.start)}–{fmtHour(s.end)} GMT · {s.mskOffset}
              </div>
              {active && <p style={{fontSize:12,color:"rgba(255,255,255,0.6)",lineHeight:1.6,marginBottom:10}}>{s.desc}</p>}
              {active && (
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {s.pairs.map(p => <span key={p} style={{fontSize:10,fontFamily:"monospace",color:s.color,background:`rgba(${s.color==='#8b5cf6'?'139,92,246':s.color===C.gold?'201,151,58':'8,153,129'},0.1)`,padding:"2px 8px",borderRadius:2}}>{p}</span>)}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Volume chart */}
      <div style={{marginBottom:20}}>
        <Mono size={9} color="rgba(255,255,255,0.3)" spacing={1} style={{display:"block",marginBottom:10}}>{S.glVolumeLabel}</Mono>
        <svg viewBox={`0 0 ${W} ${H+20}`} style={{width:"100%",display:"block"}}>
          {bars.map(({h,vol}) => {
            const s = sessions.find(s => h >= s.start && h < s.end);
            const color = s ? s.color : "rgba(255,255,255,0.15)";
            const isOverlap = h >= 13 && h < 16;
            const barH = (vol / 100) * H;
            const active = h === hour;
            return (
              <g key={h}>
                <rect
                  x={h * barW + 1}
                  y={H - barH}
                  width={barW - 2}
                  height={barH}
                  fill={isOverlap ? C.gold : color}
                  opacity={active ? 1 : 0.4}
                  rx="1"
                />
                {active && (
                  <rect x={h * barW + 1} y={0} width={barW - 2} height={H + 20}
                    fill="rgba(255,255,255,0.06)" rx="1"/>
                )}
                {h % 3 === 0 && (
                  <text x={h * barW + barW/2} y={H + 15} fontSize="8" fill="rgba(255,255,255,0.25)"
                    textAnchor="middle" fontFamily="monospace">{String(h).padStart(2,'0')}</text>
                )}
              </g>
            );
          })}
          {/* Current time line */}
          <line x1={hour * barW + barW/2} y1={0} x2={hour * barW + barW/2} y2={H}
            stroke={C.gold} strokeWidth="1.5" strokeDasharray="3 2"/>
        </svg>
      </div>

      {/* Slider + controls */}
      <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
        <input
          type="range" min={0} max={23} value={hour}
          onChange={e => setHour(Number(e.target.value))}
          style={{flex:1,minWidth:200,accentColor:C.gold,cursor:"pointer"}}
        />
        <button
          onClick={() => setPlaying(p => !p)}
          style={{padding:"10px 20px",background:playing?C.black:C.gold,color:playing?"#fff":C.black,
            border:playing?"1px solid rgba(255,255,255,0.2)":"none",
            borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:1,fontWeight:700}}>
          {playing ? S.glStopBtn : S.glAutoBtn}
        </button>
      </div>
      <div style={{marginTop:12,display:"flex",gap:20,flexWrap:"wrap"}}>
        {sessions.map((s,i) => (
          <div key={i} style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:10,height:10,borderRadius:2,background:s.color}}/>
            <span style={{fontSize:11,fontFamily:"monospace",color:"rgba(255,255,255,0.35)"}}>{s.nameEn}</span>
          </div>
        ))}
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <div style={{width:10,height:10,borderRadius:2,background:C.gold}}/>
          <span style={{fontSize:11,fontFamily:"monospace",color:"rgba(255,255,255,0.35)"}}>{S.glOverlapLegend}</span>
        </div>
      </div>
    </div>
  );
}

// ─── Interactive 2: Asia Box Trainer ─────────────────────────────────────────
function AsiaBoxTrainer() {
  const { useState, useRef, useEffect } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  const W = 680, H = 320;
  const PRICE_MIN = 2490, PRICE_MAX = 2540;
  const toY = p => H - ((p - PRICE_MIN) / (PRICE_MAX - PRICE_MIN)) * H;
  const toP = y => PRICE_MIN + ((H - y) / H) * (PRICE_MAX - PRICE_MIN);

  // Scenario: Asia range 2510–2520, London fake break DOWN then true break UP
  const asiaBoxTrue = { lo: 2508, hi: 2520 };

  // Pre-built candle data: Asia consolidation then London manipulation then breakout
  const buildCandles = () => {
    const candles = [];
    // Asia 00:00–07:00 (14 candles): tight range
    let price = 2514;
    for (let i = 0; i < 14; i++) {
      const open = price;
      const move = (Math.random() - 0.5) * 3;
      const close = Math.max(2509, Math.min(2519, open + move));
      const high = Math.max(open,close) + Math.random() * 1.5;
      const low  = Math.min(open,close) - Math.random() * 1.5;
      price = close;
      candles.push({open,close,high,low,session:"asia"});
    }
    // London manipulation 07:00–09:00 (4 candles): false break DOWN (stop hunt)
    const manip = [
      {open:price,close:price-4,high:price+0.5,low:price-7,session:"london_manip"},
      {open:price-4,close:price-6,high:price-2,low:price-8.5,session:"london_manip"},
      {open:price-6,close:price-2,high:price-1,low:price-7,session:"london_manip"},
      {open:price-2,close:price+1,high:price+2,low:price-3,session:"london_manip"},
    ];
    price = price+1;
    candles.push(...manip);
    // London true breakout 09:00–13:00 (8 candles): strong move UP
    for (let i = 0; i < 8; i++) {
      const open = price;
      const close = open + 2.5 + Math.random() * 2;
      const high = close + Math.random() * 2;
      const low = open - Math.random() * 1.5;
      price = close;
      candles.push({open,close,high,low,session:"london_true"});
    }
    return candles.map((c,i) => ({...c, x: 20 + i * ((W-40)/25)}));
  };

  const [candles] = useState(buildCandles);
  const [phase, setPhase] = useState("draw"); // draw | guess | result
  const [drawing, setDrawing] = useState(false);
  const [box, setBox] = useState(null); // {y1,y2} in SVG coords
  const [startY, setStartY] = useState(null);
  const [guess, setGuess] = useState(null); // "up"|"down"
  const [result, setResult] = useState(null);
  const svgRef = useRef(null);

  const getSVGY = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return (clientY - rect.top) * (H / rect.height);
  };

  const handleMouseDown = (e) => {
    if (phase !== "draw") return;
    const y = getSVGY(e);
    setStartY(y);
    setDrawing(true);
    setBox({y1:y,y2:y});
  };
  const handleMouseMove = (e) => {
    if (!drawing) return;
    setBox({y1:startY, y2:getSVGY(e)});
  };
  const handleMouseUp = () => {
    if (!drawing) return;
    setDrawing(false);
    if (box && Math.abs(box.y2 - box.y1) > 10) setPhase("guess");
  };

  const submitGuess = (dir) => {
    setGuess(dir);
    // True breakout was UP
    const boxOk = box && Math.min(box.y1,box.y2) <= toY(asiaBoxTrue.hi)+10
                      && Math.max(box.y1,box.y2) >= toY(asiaBoxTrue.lo)-10;
    const dirOk = dir === "up";
    setResult({boxOk, dirOk, perfect: boxOk && dirOk});
    setPhase("result");
  };

  const reset = () => { setPhase("draw"); setBox(null); setGuess(null); setResult(null); setStartY(null); setDrawing(false); };

  const candleW = 10;
  const sessionLabels = [
    {x:20, label:"АЗИЯ 00:00–07:00 GMT", color:"#8b5cf6"},
    {x:20 + 14 * ((W-40)/25), label:"ЛОНДОН", color:C.gold},
  ];

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"36px 40px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:28}}><img class='mi-icon' style={{verticalAlign:'middle'}} src='/assets/icons/icon-target.png' alt='' width='20' height='20' /></span>
          <div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black}}>{S.abTitle}</div>
            <Mono size={11} color={C.inkSoft} spacing={2}>{S.abSubtitle}</Mono>
          </div>
        </div>
        {phase !== "draw" && (
          <button onClick={reset} style={{padding:"9px 18px",background:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:11,letterSpacing:1}}>
            {S.abResetBtn}
          </button>
        )}
      </div>

      {/* Instructions */}
      {phase === "draw" && (
        <div style={{background:"rgba(201,151,58,0.08)",border:"1px solid rgba(201,151,58,0.25)",borderRadius:4,padding:"14px 18px",marginBottom:16}}>
          <Mono size={12} color={C.gold} spacing={1}>{S.abStep1}</Mono>
        </div>
      )}
      {phase === "guess" && (
        <div style={{background:C.greenPale,border:`1px solid ${C.green}`,borderRadius:4,padding:"14px 18px",marginBottom:16,display:"flex",gap:16,alignItems:"center",flexWrap:"wrap"}}>
          <Mono size={12} color={C.greenD} spacing={1}>{S.abStep2}</Mono>
          <div style={{display:"flex",gap:10,marginLeft:"auto"}}>
            <button onClick={() => submitGuess("up")} style={{padding:"10px 22px",background:C.green,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:13,fontWeight:700}}>{S.abUpBtn}</button>
            <button onClick={() => submitGuess("down")} style={{padding:"10px 22px",background:C.red,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:13,fontWeight:700}}>{S.abDownBtn}</button>
          </div>
        </div>
      )}
      {phase === "result" && result && (
        <div style={{background: result.perfect ? C.greenPale : result.dirOk ? "rgba(201,151,58,0.08)" : C.redPale,
          border: `1px solid ${result.perfect ? C.green : result.dirOk ? C.gold : C.red}`,
          borderRadius:4,padding:"16px 20px",marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:15,color: result.perfect ? C.greenD : result.dirOk ? C.gold : C.redD,marginBottom:8}}>
            {result.perfect ? S.abResultPerfectTitle :
             result.dirOk ? S.abResultDirOkTitle :
             S.abResultWrongTitle}
          </div>
          <p style={{fontSize:13,color:C.inkMid,lineHeight:1.65}}>
            {result.perfect
              ? S.abResultPerfectBody
              : result.dirOk
              ? S.abResultDirOkBody
              : S.abResultWrongBody}
          </p>
        </div>
      )}

      {/* Chart */}
      <div style={{borderRadius:4,overflow:"hidden",border:`1px solid ${C.border}`,position:"relative",userSelect:"none"}}>
        <svg
          ref={svgRef}
          viewBox={`0 0 ${W} ${H}`}
          style={{width:"100%",display:"block",background:C.chart,cursor: phase==="draw" ? "crosshair" : "default",touchAction:"none"}}
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onMouseLeave={handleMouseUp}
        >
          {/* Grid */}
          {[2495,2500,2505,2510,2515,2520,2525,2530,2535].map(p => (
            <g key={p}>
              <line x1="0" y1={toY(p)} x2={W} y2={toY(p)} stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>
              <text x="4" y={toY(p)-3} fontSize="9" fill="rgba(255,255,255,0.2)" fontFamily="monospace">{p}</text>
            </g>
          ))}

          {/* Session divider */}
          <line x1={20 + 14 * ((W-40)/25)} y1={0} x2={20 + 14 * ((W-40)/25)} y2={H}
            stroke="rgba(201,151,58,0.25)" strokeWidth="1" strokeDasharray="4 3"/>

          {/* Candles */}
          {candles.map((c,i) => {
            const bull = c.close >= c.open;
            const col = c.session === "asia" ? "#8b5cf6"
              : c.session === "london_manip" ? C.red
              : C.green;
            const bodyT = toY(Math.max(c.open,c.close));
            const bodyB = toY(Math.min(c.open,c.close));
            return (
              <g key={i}>
                <line x1={c.x} y1={toY(c.high)} x2={c.x} y2={toY(c.low)} stroke={col} strokeWidth="1.5"/>
                <rect x={c.x-candleW/2} y={bodyT} width={candleW} height={Math.max(bodyB-bodyT,1)} fill={col} rx="1"/>
              </g>
            );
          })}

          {/* True Asia box overlay (show in result) */}
          {phase === "result" && (
            <rect x={20} y={toY(asiaBoxTrue.hi)} width={14*((W-40)/25)}
              height={toY(asiaBoxTrue.lo)-toY(asiaBoxTrue.hi)}
              fill="rgba(139,92,246,0.1)" stroke="#8b5cf6" strokeWidth="1.5" strokeDasharray="5 3"/>
          )}

          {/* User's drawn box */}
          {box && (
            <rect
              x={20}
              y={Math.min(box.y1,box.y2)}
              width={14*((W-40)/25)}
              height={Math.abs(box.y2-box.y1)}
              fill="rgba(201,151,58,0.08)"
              stroke={C.gold}
              strokeWidth="1.5"
              strokeDasharray="5 3"
            />
          )}

          {/* Labels */}
          <rect x={18} y={4} width={140} height={16} fill="rgba(139,92,246,0.2)" rx="2"/>
          <text x={24} y={15} fontSize="9" fill="#8b5cf6" fontFamily="monospace" fontWeight="700">{S.abAsiaLabel}</text>
          <rect x={20 + 14*((W-40)/25)+4} y={4} width={120} height={16} fill="rgba(201,151,58,0.2)" rx="2"/>
          <text x={20 + 14*((W-40)/25)+10} y={15} fontSize="9" fill={C.gold} fontFamily="monospace" fontWeight="700">{S.abLondonLabel}</text>

          {/* Stop hunt annotation in result */}
          {phase === "result" && (
            <g>
              <line x1={20+14*((W-40)/25)+4} y1={toY(2506)} x2={20+16*((W-40)/25)} y2={toY(2506)}
                stroke={C.red} strokeWidth="1" strokeDasharray="3 2"/>
              <text x={20+16*((W-40)/25)+4} y={toY(2505)} fontSize="9" fill={C.red} fontFamily="monospace">STOP HUNT ↓</text>
              <text x={20+20*((W-40)/25)+4} y={toY(2523)} fontSize="9" fill={C.green} fontFamily="monospace">{S.abTrueBreakoutLabel}</text>
            </g>
          )}
        </svg>
      </div>

      <div style={{marginTop:12,display:"flex",gap:20,flexWrap:"wrap"}}>
        {[{color:"#8b5cf6",label:S.abLegendAsia},
          {color:C.red,label:S.abLegendManip},
          {color:C.green,label:S.abLegendTrue}
        ].map((l,i) => (
          <div key={i} style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:10,height:10,borderRadius:2,background:l.color}}/>
            <span style={{fontSize:11,fontFamily:"monospace",color:C.inkMid}}>{l.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

      </div>

      {askOpen && <AskAnalystPopup onClose={() => setAskOpen(false)}/>}
    </div>
  );
}

<script>
// Скрипт для конвертации UTC времени в локальное время пользователя
document.addEventListener('DOMContentLoaded', function() {
    var _pageLang = "{{ lang }}";
    var _intlLocale = _pageLang === 'ro' ? 'ro-RO' : _pageLang === 'en' ? 'en-US' : 'ru-RU';
    const utcTimes = document.querySelectorAll('.local-time[data-utc]');

    utcTimes.forEach(function(element) {
        // Получаем UTC время из data-utc атрибута
        var utcString = element.getAttribute('data-utc');
        
        try {
            // Парсим UTC дату и время
            var utcDate = new Date(utcString);
            
            // Конвертируем в локальное время пользователя
            var localDate = new Date(utcDate.getTime() + utcDate.getTimezoneOffset() * 60000);
            
            // Форматируем для отображения (например, "19:00 МСК")
            var hours = String(localDate.getHours()).padStart(2, '0');
            var minutes = String(localDate.getMinutes()).padStart(2, '0');
            var timeZoneName = Intl.DateTimeFormat(_intlLocale, { timeZoneName: 'long' }).format(localDate);
            
            // Обновляем текст элемента с локальным временем
            element.innerHTML = '<span class="local-time-display">' + hours + ':' + minutes + ' ' + timeZoneName.replace(/\s/g, '') + '</span>';
        } catch (e) {
            console.error('Ошибка конвертации времени:', e);
        }
    });
});
</script>
