  <span style={{fontFamily:"'Courier New',monospace",fontSize:size,letterSpacing:spacing,color,...style}}>{children}</span>;
const Chip = ({children,color=C.gold}) =>
  <span style={{fontFamily:"'Courier New',monospace",fontSize:11,letterSpacing:3,color,border:`1px solid ${color}`,padding:"4px 11px",display:"inline-block",textTransform:"uppercase"}}>{children}</span>;

  <div style={{height:1,background:`linear-gradient(90deg,transparent,${C.gold},transparent)`,width:w,margin:`${my}px auto`,opacity:0.4}}></div>;

const getChUrl = (ch) => {
  const p = new URLSearchParams(window.location.search).get('path') || 'explorer';
  let base = INITIAL_LANG === 'ru' ? '/edu/b' : `/edu/${INITIAL_LANG}/b`;
  return ch === 'start' ? `${base}?path=${p}` : `${base}/${ch}?path=${p}`;
};

// ─────────────────────────────────────────────
// EARNINGS SIMULATOR
// ─────────────────────────────────────────────
function EarningsSimulator({t}) {
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const [idx, setIdx] = useState(0);
  const [chosen, setChosen] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);

  const cases = t.cases;
  const c = cases[idx];

  const choose = (dir) => {
    if (chosen) return;
    const correct = dir === c.verdict;
    if (correct) setScore(s => s+1);
    setChosen(dir);
  };

  const next = () => {
    if (idx + 1 >= cases.length) { setDone(true); return; }
    setIdx(i => i+1);
    setChosen(null);
  };

  const getLang = () => INITIAL_LANG;
  const getExpl = () => {
    if (getLang() === 'en') return c.explanationEn || c.explanation;
    if (getLang() === 'ro') return c.explanationRo || c.explanation;
    return c.explanation;
  };

  if (done) return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"36px 32px",textAlign:"center"}}>
      <div style={{fontSize:48,marginBottom:12}}><img class='mi-icon' style='vertical-align:middle' src='/assets/icons/icon-trophy.png' alt='' width='20' height='20' /></div>
      <div style={{fontFamily:"monospace",fontSize:28,color:C.gold,fontWeight:700,marginBottom:8}}>{score} / {cases.length}</div>
      <div style={{fontSize:14,color:C.inkSoft,marginBottom:24}}>{t.simFinish}</div>
      {score >= 2 && <div style={{background:"#fff",border:`1px solid ${C.borderGold}`,display:"inline-block",padding:"14px 28px"}}>
        <span style={{fontFamily:"monospace",fontSize:11,color:C.gold,letterSpacing:3,display:"block",marginBottom:4}}><img class='mi-icon' style='vertical-align:middle' src='/assets/icons/icon-target.png' alt='' width='20' height='20' /> EARNINGS READER</span>
        <span style={{fontFamily:"monospace",fontSize:12,color:C.inkSoft}}>{score === 3 ? "+60 BONUS XP" : "+30 XP"}</span>
      </div>}
    </div>
  );

  const correct = chosen === c.verdict;

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"28px 28px 24px"}}>
      {/* Score + progress */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <Chip>{t.simTag}</Chip>
          <Mono size={12} color={C.inkFaint} spacing={0}>{idx+1} {t.simOf} {cases.length}</Mono>
        </div>
        <Mono size={12} color={C.inkSoft} spacing={1}>{t.simScore}: {score}</Mono>
      </div>

      {/* Company header */}
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16,marginBottom:20,flexWrap:"wrap"}}>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:"clamp(20px,3vw,28px)",fontWeight:700,color:C.black,marginBottom:4}}>{c.company}</div>
          <Mono size={11} color={C.inkFaint} spacing={1}>{c.sector}</Mono>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontFamily:"monospace",fontSize:14,color:C.inkSoft}}>Last close</div>
          <div style={{fontFamily:"monospace",fontSize:22,fontWeight:700,color:C.black}}>${c.price}</div>
        </div>
      </div>

      {/* Metrics table */}
      <div style={{marginBottom:24,border:`1px solid ${C.border}`,background:"#fff",overflow:"hidden"}}>
        {/* header */}
        <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1.2fr 80px",background:C.dark,padding:"10px 16px",gap:8}}>
          {S.metricsHeaders.map((h,i)=>
            <Mono key={i} size={10} color={i===0?C.gold:"rgba(255,255,255,.45)"} spacing={2} style={{fontWeight:700}}>{h}</Mono>
          )}
        </div>
        {c.items.map((item, i) => (
          <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1.2fr 80px",padding:"11px 16px",gap:8,borderTop:i>0?`1px solid ${C.border}`:"none",alignItems:"center"}}>
            <div style={{fontSize:13,color:C.inkMid,fontWeight:500}}>{item.label}</div>
            <div style={{fontFamily:"monospace",fontSize:13,color:C.black,fontWeight:700}}>{item.val}</div>
            <div style={{fontFamily:"monospace",fontSize:13,color:C.inkSoft}}>{item.exp}</div>
            <div style={{
              fontFamily:"monospace",fontSize:10,letterSpacing:1,fontWeight:700,
              color:item.beat?"#fff":"#fff",
              background:item.beat?C.bull:C.bear,
              padding:"3px 7px",textAlign:"center",borderRadius:2
            }}>{item.beat?"▲ BEAT":"▼ MISS"}</div>
          </div>
        ))}
      </div>

      {/* Choice buttons */}
      {!chosen && (
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:0}}>
          <button onClick={()=>choose("up")}
            style={{padding:"16px 12px",fontSize:15,fontWeight:700,cursor:"pointer",border:`2px solid ${C.bull}`,background:"rgba(34,197,94,.07)",color:C.bull,fontFamily:"'DM Sans',sans-serif",transition:"all .2s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="rgba(34,197,94,.18)"}}
            onMouseLeave={e=>{e.currentTarget.style.background="rgba(34,197,94,.07)"}}
          >{t.simChoiceUp}</button>
          <button onClick={()=>choose("down")}
            style={{padding:"16px 12px",fontSize:15,fontWeight:700,cursor:"pointer",border:`2px solid ${C.bear}`,background:"rgba(239,68,68,.07)",color:C.bear,fontFamily:"'DM Sans',sans-serif",transition:"all .2s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="rgba(239,68,68,.18)"}}
            onMouseLeave={e=>{e.currentTarget.style.background="rgba(239,68,68,.07)"}}
          >{t.simChoiceDown}</button>
        </div>
      )}

      {/* Result */}
      {chosen && (
        <div>
          <div style={{padding:"16px 20px",background:correct?"rgba(34,197,94,.08)":"rgba(239,68,68,.08)",border:`1px solid ${correct?C.bull:C.bear}`,marginBottom:14}}>
            <div style={{fontSize:16,fontWeight:700,color:correct?C.bull:C.bear,marginBottom:6}}>
              {correct ? t.simCorrect : t.simWrong}
              {" "}
              <span style={{fontFamily:"monospace",fontSize:13,fontWeight:700,color:correct?C.bull:C.bear}}>
                {c.verdict==="up"?"<img class='mi-icon' style='vertical-align:middle' src='/assets/icons/icon-trend-up.png' alt='' width='20' height='20' />":"<img class='mi-icon' style='vertical-align:middle' src='/assets/icons/icon-trend-down.png' alt='' width='20' height='20' />"} {c.verdictPct}
              </span>
            </div>
            <div style={{fontSize:13,color:C.inkMid,lineHeight:1.7}}>
              <strong style={{color:C.black}}>{t.simExplain}</strong> {getExpl()}
            </div>
          </div>
          <button onClick={next}
            style={{background:C.black,color:C.white,border:"none",padding:"12px 28px",cursor:"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:2,fontWeight:700,float:"right",transition:"background .2s"}}
            onMouseEnter={e=>e.currentTarget.style.background=C.gold}
            onMouseLeave={e=>e.currentTarget.style.background=C.black}
          >{idx+1<cases.length ? t.simNext : t.simFinish}</button>
          <div style={{clear:"both"}}></div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────
// DIVERGENCE HUNT INTERACTIVE
// ─────────────────────────────────────────────
function DivergenceHunt({t}) {
  const pRef = useRef(null);
  const rRef = useRef(null);
  const [step, setStep] = useState(0); // 0..4
  const [sel, setSel] = useState([]); // selected points: {chart:'p'|'r', idx:number}
  const [result, setResult] = useState(null); // 'correct'|'wrong'
  const [showSolution, setShowSolution] = useState(false);

  // Реальные данные: Gold (авг–ноя 2024). Пики: сен-26 (idx 5) и окт-30 (idx 29).
  // Цена: 2669.9 → 2788.5 (выше). RSI: 78.3 → 74.9 (ниже) = медвежья дивергенция.
  const pPrices = [2588.0,2619.9,2626.5,2651.2,2659.2,2669.9,2644.3,2636.1,2667.3,2647.1,2657.1,2645.8,2644.8,2615.0,2606.0,2620.6,2657.6,2647.8,2661.4,2674.0,2691.0,2713.7,2723.1,2744.2,2714.4,2734.9,2740.9,2742.9,2768.4,2788.5,2738.3,2738.6,2736.1,2740.3,2667.6,2698.4,2687.5];
  const rsiData  = [68.4,72.7,73.5,76.3,77.1,78.3,69.5,66.9,71.3,65.3,66.8,63.5,63.2,54.9,52.6,55.8,62.6,60.0,62.3,64.4,67.1,70.3,71.5,74.2,65.1,68.0,68.8,69.1,72.5,74.9,60.8,60.9,60.2,61.0,45.0,50.9,48.9];

  // Правильные пики — реальные данные
  const CORRECT_P = [5, 29];
  const CORRECT_R = [5, 29];

  const pPeaks = [5, 29];
  const rPeaks = [5, 29];

  const instructions = [t.huntStep1, t.huntStep2, t.huntStep3, t.huntStep4];
  const stepLabels = ["P1","P2","R1","R2"];

  const handleClick = (chart, idx) => {
    if(result) return;
    const newSel = [...sel, {chart, idx}];
    setSel(newSel);
    const nextStep = step + 1;
    setStep(nextStep);
    if(nextStep === 4) {
      // Validate
      const pSels = newSel.filter(s=>s.chart==='p').map(s=>s.idx).sort((a,b)=>a-b);
      const rSels = newSel.filter(s=>s.chart==='r').map(s=>s.idx).sort((a,b)=>a-b);
      const pOk = pSels.length===2 && pSels[0]<pSels[1];
      const rOk = rSels.length===2 && rSels[0]<rSels[1];
      // bearish: price second > first, rsi second < first
      const pBearish = pOk && pPrices[pSels[1]] > pPrices[pSels[0]];
      const rBearish = rOk && rsiData[rSels[1]] < rsiData[rSels[0]];
      setResult(pBearish && rBearish ? 'correct' : 'wrong');
    }
  };

  const reset = () => { setSel([]); setStep(0); setResult(null); setShowSolution(false); };

  const drawCharts = useCallback(()=>{
    const drawLine = (ref, data, label, color, peakIdxs, selPoints, h, showDiv) => {
      const canvas = ref.current;
      if(!canvas) return;
      const W=canvas.width, H=h;
      canvas.height=H;
      const ctx=canvas.getContext('2d');
      ctx.clearRect(0,0,W,H);
      const pad={l:36,r:16,t:12,b:20};
      const cW=W-pad.l-pad.r, cH=H-pad.t-pad.b;
      const mn=Math.min(...data)-3, mx=Math.max(...data)+3, rng=mx-mn;
      const px=i=>pad.l+i/(data.length-1)*cW;
      const py=v=>pad.t+cH-(v-mn)/rng*cH;

      // Zones for RSI
      if(label==="RSI"){
        ctx.fillStyle="rgba(239,68,68,.06)";ctx.fillRect(pad.l,pad.t,cW,py(70)-pad.t);
        ctx.fillStyle="rgba(34,197,94,.06)";ctx.fillRect(pad.l,py(30),cW,H-pad.b-py(30));
        ctx.strokeStyle="rgba(239,68,68,.3)";ctx.lineWidth=1;ctx.setLineDash([3,3]);
        ctx.beginPath();ctx.moveTo(pad.l,py(70));ctx.lineTo(W-pad.r,py(70));ctx.stroke();
        ctx.fillStyle="rgba(239,68,68,.5)";ctx.font="8px monospace";ctx.textAlign="left";ctx.fillText("70",W-pad.r+2,py(70)+3);
        ctx.strokeStyle="rgba(34,197,94,.3)";ctx.beginPath();ctx.moveTo(pad.l,py(30));ctx.lineTo(W-pad.r,py(30));ctx.stroke();
        ctx.fillStyle="rgba(34,197,94,.5)";ctx.fillText("30",W-pad.r+2,py(30)+3);
        ctx.setLineDash([]);
      }
      // Grid
      ctx.strokeStyle="rgba(24,24,26,.04)";ctx.lineWidth=1;ctx.setLineDash([]);
      for(let i=0;i<=3;i++){const y=pad.t+i/3*cH;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();}
      // Area
      const grad=ctx.createLinearGradient(0,pad.t,0,H-pad.b);
      grad.addColorStop(0,`${color}20`);grad.addColorStop(1,`${color}03`);
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.moveTo(px(0),py(data[0]));
      data.forEach((_,i)=>ctx.lineTo(px(i),py(data[i])));
      ctx.lineTo(px(data.length-1),H-pad.b);ctx.lineTo(px(0),H-pad.b);ctx.closePath();ctx.fill();
      // Main line
      ctx.strokeStyle=color;ctx.lineWidth=2;
      ctx.beginPath();data.forEach((v,i)=>i===0?ctx.moveTo(px(i),py(v)):ctx.lineTo(px(i),py(v)));ctx.stroke();

      // Draw divergence line if solution shown or correct
      if((showDiv||showSolution) && peakIdxs.length===2){
        ctx.strokeStyle=C.bear;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.moveTo(px(peakIdxs[0]),py(data[peakIdxs[0]]));ctx.lineTo(px(peakIdxs[1]),py(data[peakIdxs[1]]));ctx.stroke();ctx.setLineDash([]);
      }

      // Peak circles (clickable)
      peakIdxs.forEach((i,pi)=>{
        const isSelected = selPoints.some(s=>s.idx===i);
        const cx=px(i), cy=py(data[i]);
        // Glow
        if(isSelected){ctx.fillStyle=C.bear+"40";ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();}
        ctx.fillStyle=isSelected?C.bear:"#fff";
        ctx.strokeStyle=C.bear;ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fill();ctx.stroke();
        // Label
        ctx.fillStyle=C.bear;ctx.font="bold 9px monospace";ctx.textAlign="center";
        ctx.fillText(pi===0?"P1":"P2",cx,cy-10);
      });

      // Y labels
      ctx.fillStyle=C.inkSoft;ctx.font="9px monospace";ctx.textAlign="right";
      [mn,mn+rng/2,mx].forEach(v=>ctx.fillText(Math.round(v),pad.l-4,py(v)+3));
      // Label
      ctx.fillStyle=C.inkFaint;ctx.font="bold 10px monospace";ctx.textAlign="left";ctx.fillText(label,pad.l+4,pad.t+12);
    };

    const W = pRef.current?.parentElement?.clientWidth || 600;
    if(pRef.current){pRef.current.width=W;}
    if(rRef.current){rRef.current.width=W;}

    const pSel = sel.filter(s=>s.chart==='p');
    const rSel = sel.filter(s=>s.chart==='r');
    const showDiv = result==='correct';
    drawLine(pRef, pPrices, "PRICE", C.gold, pPeaks, pSel, 160, showDiv);
    drawLine(rRef, rsiData, "RSI(14)", "#3b82f6", rPeaks, rSel, 120, showDiv);
  },[sel, result, showSolution]);

  useEffect(()=>{
    drawCharts();
    window.addEventListener('resize',drawCharts);
    return ()=>window.removeEventListener('resize',drawCharts);
  },[drawCharts]);

  const getPeakPos = (ref, data, idx) => {
    if(!ref.current) return null;
    const canvas=ref.current;
    const W=canvas.width, H=canvas.height;
    const pad={l:36,r:16,t:12,b:20};
    const cW=W-pad.l-pad.r, cH=H-pad.t-pad.b;
    const mn=Math.min(...data)-3, mx=Math.max(...data)+3, rng=mx-mn;
    return {x:pad.l+idx/(data.length-1)*cW, y:pad.t+cH-(data[idx]-mn)/rng*cH};
  };

  const handleCanvasClick = (e, chart) => {
    if(result) return;
    const canvas = chart==='p'?pRef.current:rRef.current;
    if(!canvas) return;
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(canvas.width/rect.width);
    const y=(e.clientY-rect.top)*(canvas.height/rect.height);
    const peaks = chart==='p'?pPeaks:rPeaks;
    const data  = chart==='p'?pPrices:rsiData;
    // Check if click is near a peak
    const W=canvas.width, H=canvas.height;
    const pad={l:36,r:16,t:12,b:20};
    const cW=W-pad.l-pad.r, cH=H-pad.t-pad.b;
    const mn=Math.min(...data)-3, mx=Math.max(...data)+3, rng=mx-mn;
    const px=i=>pad.l+i/(data.length-1)*cW;
    const py=v=>pad.t+cH-(v-mn)/rng*cH;
    for(const idx of peaks){
      const dx=x-px(idx), dy=y-py(data[idx]);
      if(Math.sqrt(dx*dx+dy*dy)<18){
        // Check it's the right step
        const needP=(step===0||step===1), needR=(step===2||step===3);
        if((chart==='p'&&needP)||(chart==='r'&&needR)){
          // Don't allow same index twice
          if(!sel.some(s=>s.chart===chart&&s.idx===idx)){
            handleClick(chart,idx);
          }
        }
        return;
      }
    }
  };

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"24px 24px 20px"}}>
      {/* Progress */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        <Chip>{t.huntTag}</Chip>
        {[0,1,2,3].map(i=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:i<step?C.gold:i===step?C.black:"transparent",border:`2px solid ${i<step?C.gold:i===step?C.black:C.border}`,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <Mono size={9} color={i<step||i===step?"#fff":C.inkFaint} spacing={0}>{i<step?"✓":i+1}</Mono>
            </div>
            {i<3&&<div style={{width:20,height:1,background:i<step?C.gold:C.border}}></div>}
          </div>
        ))}
      </div>
      {/* Instruction */}
      {!result && step<4 && (
        <div style={{background:"rgba(201,151,58,.08)",border:`1px solid ${C.borderGold}`,padding:"10px 14px",marginBottom:14,fontSize:13,color:C.inkMid}}>
          <strong style={{color:C.gold}}>→</strong> {instructions[step]}
        </div>
      )}
      {/* Charts */}
      <div style={{cursor:step<2?"crosshair":"default",marginBottom:2}}>
        <canvas ref={pRef} onClick={e=>handleCanvasClick(e,'p')} style={{display:"block",width:"100%"}}/>
      </div>
      <div style={{cursor:step>=2&&step<4?"crosshair":"default"}}>
        <canvas ref={rRef} onClick={e=>handleCanvasClick(e,'r')} style={{display:"block",width:"100%"}}/>
      </div>
      {/* Result */}
      {result && (
        <div style={{marginTop:14,padding:"14px 18px",background:result==='correct'?"rgba(34,197,94,.08)":"rgba(239,68,68,.08)",border:`1px solid ${result==='correct'?C.bull:C.bear}`}}>
          <div style={{fontSize:15,fontWeight:700,color:result==='correct'?C.bull:C.bear,marginBottom:6}}>
            {result==='correct' ? t.huntCorrect : t.huntWrong}
          </div>
        </div>
      )}
      {/* Controls */}
      <div style={{display:"flex",gap:10,marginTop:14,flexWrap:"wrap"}}>
        <button onClick={reset} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.inkSoft,padding:"8px 18px",cursor:"pointer",fontFamily:"monospace",fontSize:11,letterSpacing:2,transition:"all .2s"}}>{t.huntReset}</button>
        <button onClick={()=>{setShowSolution(true);drawCharts();}} style={{background:"transparent",border:`1px solid ${C.gold}`,color:C.gold,padding:"8px 18px",cursor:"pointer",fontFamily:"monospace",fontSize:11,letterSpacing:2,transition:"all .2s"}}>{t.huntReveal}</button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// COMBO SIGNAL VISUAL
// ─────────────────────────────────────────────
function ComboSignalChart() {
  const ref = useRef(null);
  const prices=[120,118,116,114,112,110,108,107,106,105,104,103,105,108,112,116,120,124,128,132,136,140,144,148,152];
  const rsiVals=[68,64,60,55,50,44,38,33,29,28,27,26,30,35,42,50,58,64,68,71,73,74,75,76,77];
  const macdH=[0.5,0.3,0.1,-0.2,-0.5,-0.8,-1.1,-1.3,-1.4,-1.2,-0.9,-0.6,-0.2,0.3,0.8,1.2,1.6,1.9,2.1,2.2,2.1,1.9,1.7,1.5,1.3];
  const crossoverIdx=12; // index where MACD crosses up + RSI in oversold

  useEffect(()=>{
    const draw = () => {
      const canvas=ref.current;
      if(!canvas) return;
      const W=canvas.width=canvas.parentElement.clientWidth||600;
      const H=canvas.height=220;
      const ctx=canvas.getContext('2d');
      ctx.clearRect(0,0,W,H);
      const pH=120, rH=50, mH=40;
      const pad={l:40,r:16,t:10,b:10};
      const cW=W-pad.l-pad.r;
      const N=prices.length;
      const px=i=>pad.l+i/(N-1)*cW;

      // PRICE
      const pmn=Math.min(...prices)-3,pmx=Math.max(...prices)+3,prng=pmx-pmn;
      const ppy=v=>pad.t+pH-(v-pmn)/prng*pH;
      const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+pH);
      grad.addColorStop(0,"rgba(201,151,58,.12)");grad.addColorStop(1,"rgba(201,151,58,.01)");
      ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(px(0),ppy(prices[0]));
      prices.forEach((_,i)=>ctx.lineTo(px(i),ppy(prices[i])));
      ctx.lineTo(px(N-1),pad.t+pH);ctx.lineTo(px(0),pad.t+pH);ctx.closePath();ctx.fill();
      ctx.strokeStyle=C.gold;ctx.lineWidth=2;ctx.setLineDash([]);
      ctx.beginPath();prices.forEach((v,i)=>i===0?ctx.moveTo(px(i),ppy(v)):ctx.lineTo(px(i),ppy(v)));ctx.stroke();

      // RSI zone
      const rBase=pad.t+pH+6;
      const rpy=v=>rBase+rH-(v/100)*rH;
      ctx.fillStyle="rgba(34,197,94,.07)";ctx.fillRect(pad.l,rpy(35),cW,rH-rpy(35)+rBase);
      ctx.strokeStyle="rgba(34,197,94,.3)";ctx.lineWidth=1;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(pad.l,rpy(30));ctx.lineTo(W-pad.r,rpy(30));ctx.stroke();ctx.setLineDash([]);
      ctx.strokeStyle="#3b82f6";ctx.lineWidth=1.5;
      ctx.beginPath();rsiVals.forEach((v,i)=>i===0?ctx.moveTo(px(i),rpy(v)):ctx.lineTo(px(i),rpy(v)));ctx.stroke();
      ctx.fillStyle=C.inkFaint;ctx.font="8px monospace";ctx.textAlign="right";ctx.fillText("RSI",pad.l-4,rBase+8);

      // MACD zone
      const mBase=rBase+rH+6;
      const mmn=Math.min(...macdH)-0.2,mmx=Math.max(...macdH)+0.2,mrng=mmx-mmn;
      const mpy=v=>mBase+mH-(v-mmn)/mrng*mH;
      const mzero=mpy(0);
      macdH.forEach((v,i)=>{
        const bh=Math.abs(mzero-mpy(v));
        ctx.fillStyle=v>=0?"rgba(34,197,94,.6)":"rgba(239,68,68,.6)";
        ctx.fillRect(px(i)-2,Math.min(mzero,mpy(v)),4,bh||1);
      });
      ctx.fillStyle=C.inkFaint;ctx.font="8px monospace";ctx.textAlign="right";ctx.fillText("MACD",pad.l-4,mBase+8);

      // CROSSOVER SIGNAL at crossoverIdx
      const cx=px(crossoverIdx);
      // Vertical line
      ctx.strokeStyle="rgba(34,197,94,.4)";ctx.lineWidth=1;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(cx,pad.t);ctx.lineTo(cx,H-pad.b);ctx.stroke();ctx.setLineDash([]);
      // Arrow on price
      ctx.fillStyle=C.bull;ctx.font="bold 16px sans-serif";ctx.textAlign="center";
      ctx.fillText("▲",cx,ppy(prices[crossoverIdx])-8);
      // BUY label
      ctx.fillStyle=C.bull;ctx.font="bold 9px monospace";ctx.textAlign="center";
      ctx.fillRect(cx-16,pad.t+pH+1,32,14);
      ctx.fillStyle="#fff";ctx.fillText("BUY",cx,pad.t+pH+11);
    };
    draw();window.addEventListener('resize',draw);return()=>window.removeEventListener('resize',draw);
  },[]);

  return <div style={{background:"#fff",border:`1px solid ${C.border}`,overflow:"hidden"}}><canvas ref={ref} style={{display:"block",width:"100%"}}/></div>;
}

// ─────────────────────────────────────────────
// QUIZ
// ─────────────────────────────────────────────
function Quiz({t}) {
  const [started, setStarted] = useState(false);
  const [qidx, setQidx] = useState(0);
  const [score, setScore] = useState(0);
  const [sel, setSel] = useState(null);
  const [done, setDone] = useState(false);
  const qq = t.quiz;

  const choose = (i) => {
    if(sel!==null) return;
    setSel(i);
    if(i===qq[qidx].c) setScore(s=>s+1);
    setTimeout(()=>{
      setSel(null);
      if(qidx+1>=qq.length) setDone(true);
      else setQidx(x=>x+1);
    }, 900);
  };

  if(!started) return (
    <div style={{textAlign:"center"}}>
      <button onClick={()=>setStarted(true)}
        style={{background:"transparent",border:`1px solid ${C.black}`,color:C.black,padding:"13px 36px",cursor:"pointer",fontFamily:"monospace",fontSize:11,letterSpacing:3,transition:"all .2s"}}
        onMouseEnter={e=>{e.currentTarget.style.background=C.black;e.currentTarget.style.color="#fff";}}
        onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color=C.black;}}
      >{t.quizStartBtn}</button>
    </div>
  );

  if(done) return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"36px 28px",textAlign:"center"}}>
      <div style={{fontSize:48,marginBottom:14}}>🏅</div>
      <div style={{fontFamily:"monospace",fontSize:28,color:C.gold,fontWeight:700,marginBottom:8}}>{score} / {qq.length}</div>
      <p style={{fontSize:14,color:C.inkSoft,marginBottom:24}}>{score>=4?t.passmsg:t.failmsg}</p>
      {score>=4&&<div style={{background:"#fff",border:`1px solid rgba(201,151,58,.25)`,display:"inline-block",padding:"14px 28px"}}>
        <span style={{fontFamily:"monospace",fontSize:11,letterSpacing:3,color:C.gold,display:"block",marginBottom:4}}>{t.medalTitle}</span>
        <span style={{fontFamily:"monospace",fontSize:12,color:C.inkSoft}}>{t.medalDesc}</span>
      </div>}
    </div>
  );

  const q=qq[qidx];
  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"26px 28px"}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:18,alignItems:"center"}}>
        <Chip>{t.qof(qidx+1,qq.length)}</Chip>
        <Mono size={12} color={C.inkSoft} spacing={1}>{t.qcor(score)}</Mono>
      </div>
      <p style={{fontSize:16,color:C.black,marginBottom:18,lineHeight:1.55,fontWeight:500}}>{q.q}</p>
      <div style={{display:"grid",gap:10}}>
        {q.o.map((opt,i)=>{
          let bg="#fff", bc=C.border;
          if(sel!==null){if(i===q.c){bg="rgba(34,197,94,.08)";bc="#86efac";}else if(i===sel){bg="rgba(239,68,68,.08)";bc="#fca5a5";}}
          return (
            <button key={i} onClick={()=>choose(i)}
              style={{background:bg,border:`1px solid ${bc}`,color:C.ink,padding:"11px 15px",cursor:"pointer",textAlign:"left",fontFamily:"'DM Sans',sans-serif",fontSize:14,transition:"all .2s"}}
            >{opt}</button>
          );
        })}
      </div>
    </div>
  );
}

        </div>

        {/* MACD */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"24px 24px 20px",marginBottom:20}}>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,fontWeight:700,color:C.black,marginBottom:8}}>{t.macdTitle}</div>
          <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,maxWidth:580,marginBottom:14}}>{mode==="beg"?t.macdBeg:t.macdPro}</p>
          <div style={{background:"rgba(201,151,58,.06)",border:`1px solid ${C.borderGold}`,padding:"12px 16px",marginBottom:16,display:"inline-block"}}>
            <div style={{fontFamily:"monospace",fontSize:14,color:C.gold,fontWeight:700,marginBottom:4}}>{t.macdFormula}</div>
            <div style={{fontFamily:"monospace",fontSize:11,color:C.inkSoft}}>{t.macdFormulaDetail}</div>
          </div>
          <MACDFigure/>
          <MACDChart/>
        </div>

        {/* DIVERGENCE theory cards */}
        <div style={{marginBottom:24}}>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,fontWeight:700,color:C.black,marginBottom:8}}>{t.divTitle}</div>
          <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:16}}>{mode==="beg"?t.divBeg:t.divPro}</p>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:12}}>
            {t.divTypes.map((d,i)=>(
              <div key={i} style={{border:`1px solid ${d.color}20`,background:`${d.color}08`,padding:"18px 20px"}}>
                <div style={{fontSize:28,marginBottom:8}}>{d.icon}</div>
                <div style={{fontSize:15,fontWeight:700,color:d.color,marginBottom:6,fontFamily:"'DM Serif Display',serif"}}>{d.type}</div>
                <div style={{fontSize:13,color:C.inkMid,lineHeight:1.7}}>{d.desc}</div>
              </div>
            ))}
          </div>
        </div>

        {/* DIVERGENCE HUNT */}
        <div style={{marginBottom:28}}>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,fontWeight:700,color:C.black,marginBottom:6}}>{t.huntTitle}</div>
          <div style={{fontSize:13,color:C.inkSoft,marginBottom:16}}>{t.huntSub}</div>
          <DivergenceHunt t={t}/>
        </div>

        <Rule/>

        {/* COMBO SIGNAL */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,padding:"24px 24px 20px",marginBottom:48}}>
          <Chip>{t.comboTag}</Chip>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,fontWeight:700,color:C.black,margin:"12px 0 10px"}}>{t.comboTitle}</div>
          <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:18}}>{mode==="beg"?t.comboBeg:t.comboPro}</p>
          <ComboSignalChart/>
          <div style={{marginTop:14,background:"rgba(34,197,94,.06)",border:`1px solid rgba(34,197,94,.25)`,padding:"12px 16px"}}>
            <Mono size={12} color={C.bull} spacing={1} style={{display:"block",marginBottom:4}}>✓ DOUBLE CONFIRMATION SIGNAL</Mono>
            <div style={{fontSize:13,color:C.inkMid,lineHeight:1.6}}>
              {INITIAL_LANG==="ru"?"RSI в зоне перепроданности (<30) + MACD crossover вверх. Стрелка ▲ показывает точку входа. Цена выросла на +27% после сигнала.":
               INITIAL_LANG==="ro"?"RSI în zona supravândut (<30) + MACD crossover în sus. Săgeata ▲ indică punctul de intrare. Prețul a crescut cu +27% după semnal.":
               "RSI in oversold zone (<30) + MACD crossover up. Arrow ▲ shows entry point. Price rose +27% after the signal."}
            </div>
          </div>
        </div>

        {/* ── CHECKLIST ── */}
        <div style={{marginBottom:12}}>
          <div style={{fontFamily:"monospace",fontSize:11,letterSpacing:3,color:C.gold,border:`1px solid ${C.gold}`,padding:"3px 9px",display:"inline-block",marginBottom:10}}>{t.checkTag}</div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,fontWeight:700,color:C.black,marginBottom:16}}>{t.checkTitle}</div>
        </div>
        <Checklist t={t}/>

        <div style={{marginBottom:40}}/>

        {/* ── QUIZ ── */}
        <div style={{marginBottom:12}}>
          <Chip>{t.quizTag}</Chip>
          <div style={{height:16}}/>
        </div>
        <Quiz t={t}/>

        <div style={{height:40}}/>

        {/* ── FOOTER ── */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:32,borderTop:`1px solid ${C.border}`,flexWrap:"wrap",gap:12}}>
          <button onClick={()=>window.location.href=getChUrl(8)}
            style={{background:"transparent",border:`1px solid ${C.border}`,color:C.inkSoft,padding:"11px 20px",cursor:"pointer",fontFamily:"monospace",fontSize:11,letterSpacing:2,textDecoration:"none",transition:"all .2s"}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor=C.gold;e.currentTarget.style.color=C.gold;}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.inkSoft;}}
          >{t.prevCh}</button>
          <span onClick={()=>setAskOpen(true)} style={{fontSize:14,color:C.inkSoft,fontFamily:"monospace",borderBottom:`1px solid ${C.border}`,cursor:"pointer",letterSpacing:1}}>{t.askLink}</span>
          <button onClick={()=>window.location.href=getChUrl(10)}
            style={{background:C.black,color:C.white,border:"none",padding:"16px 28px",cursor:"pointer",fontFamily:"monospace",fontSize:13,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.currentTarget.style.background=C.gold}
            onMouseLeave={e=>e.currentTarget.style.background=C.black}
          >{t.nextCh}</button>
        </div>

      </div>

      {askOpen && <AskAnalystPopup chapterNum={9} lang={INITIAL_LANG} onClose={()=>setAskOpen(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter9/>);
{% endraw %}
</script>
</body>
</html>
