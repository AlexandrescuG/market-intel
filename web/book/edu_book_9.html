function fillTemplate(str, vars) {
  if (!str) return str;
  return str.replace(/\{\{(\w+)\}\}/g, (m, key) => {
    const v = vars ? vars[key] : undefined;
    if (v === undefined || v === null || (typeof v === "number" && isNaN(v))) {
      console.error("[ch9] отсутствует значение для {{" + key + "}}");
      return "—";
    }
    return String(v);
  });
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Загрузка данных главы: oscillator_reality.json + earnings_cases.json.
function useCh9Data() {
  const { useState, useEffect } = React;
  const [state, setState] = useState({ loading: true, error: null, osc: null, cases: null, scene: null });
  useEffect(() => {
    let cancelled = false;
    Promise.all([
      fetch("/data/edu_stats/oscillator_reality.json").then(r => { if (!r.ok) throw new Error("oscillator_reality.json HTTP " + r.status); return r.json(); }),
      fetch("/data/edu_stats/earnings_cases.json").then(r => { if (!r.ok) throw new Error("earnings_cases.json HTTP " + r.status); return r.json(); }),
      fetch("/data/edu/rsi_divergence.json").then(r => { if (!r.ok) throw new Error("rsi_divergence.json HTTP " + r.status); return r.json(); }),
    ]).then(([osc, cases, scene]) => {
      if (!cancelled) setState({ loading: false, error: null, osc, cases: cases.cases, scene });
    }).catch(err => {
      console.error("[ch9] load failed:", err);
      if (!cancelled) setState({ loading: false, error: err, osc: null, cases: null, scene: null });
    });
    return () => { cancelled = true; };
  }, []);
  return state;
}

function buildVars(osc, lang) {
  if (!osc) return null;
  const T9 = window.Ch9Content[lang] || window.Ch9Content.ru;
  const sum = osc.summary || {};
  const rsi = sum.rsi_high_k10_pooled || {};
  const div = sum.divergence_k10_pooled || {};
  const verdictText = (key) => key === "no_edge" ? T9.coreMeasure.verdictNoEdge : key === "weak_edge" ? T9.coreMeasure.verdictWeakEdge : T9.coreMeasure.verdictEdge;
  return {
    rsi_share: rsi.share_reversal, rsi_base: rsi.base_share, rsi_n: rsi.n, rsi_edge: rsi.edge_pp,
    rsi_verdict: verdictText(rsi.verdict_key),
    div_share: div.share_reversal, div_base: div.base_share, div_n: div.n, div_edge: div.edge_pp,
    div_verdict: verdictText(div.verdict_key),
    rsi_duration: sum.rsi_high_duration_median_bars,
  };
}

// ─── Cold start: "Перекуплен — значит упадёт?" (SPEC_coldstart_interactives_
// ch6_15.md §5). Заменяет ColdOpen9. Первый настоящий график во всей главе:
// реальные дневные свечи GOLD + RSI (rsi_divergence.json), правая часть
// скрыта до первого пересечения RSI>70 (idx=35), три кнопки, раскрытие --
// и конкретный случай, и агрегат по всем случаям (oscillator_reality.json,
// уже посчитан в vars через buildVars).
function ColdStart9Entry({ scene, vars }) {
  const { useRef, useEffect } = React;
  const T9 = window.Ch9Content[INITIAL_LANG] || window.Ch9Content.ru;
  const cs = T9.coldStart;
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const s = React.useState(false), committed = s[0], setCommitted = s[1];

  if (!scene || !vars) return <div style={{background:C.black,padding:"60px 5vw",textAlign:"center"}}><Mono size={11} color={C.goldText} spacing={4}>{cs.tag}</Mono></div>;

  const HIDE_FROM = 36; // idx 35 -- первое RSI>70 пересечение, оно же последний видимый бар
  const candles = scene.ohlc.map((c, i) => ({ time: Math.floor(Date.parse(c.time) / 1000), open: +c.open, high: +c.high, low: +c.low, close: +c.close, rsi: scene.rsi[i] }));
  const caseIdx = HIDE_FROM - 1, targetIdx = Math.min(caseIdx + 10, candles.length - 1);
  const dirUp = candles[targetIdx].close > candles[caseIdx].close;

  useEffect(() => {
    if (!containerRef.current || chartRef.current || typeof LightweightCharts === "undefined") return undefined;
    const chart = LightweightCharts.createChart(containerRef.current, {
      width: containerRef.current.clientWidth, height: 340,
      layout: { background: { color: C.chartBg }, textColor: "rgba(255,255,255,0.55)" },
      grid: { vertLines: { color: "rgba(255,255,255,0.05)" }, horzLines: { color: "rgba(255,255,255,0.05)" } },
      rightPriceScale: { borderColor: "rgba(255,255,255,0.15)" },
      timeScale: { borderColor: "rgba(255,255,255,0.15)", timeVisible: false },
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: C.chartGreen, downColor: C.chartRed, borderUpColor: C.chartGreen, borderDownColor: C.chartRed,
      wickUpColor: C.chartGreen, wickDownColor: C.chartRed,
    });
    const rsiSeries = chart.addLineSeries({ color: "#6ea8fe", lineWidth: 2, priceScaleId: "rsi", priceLineVisible: false, lastValueVisible: false });
    rsiSeries.priceScale().applyOptions({ scaleMargins: { top: 0.78, bottom: 0 } });
    rsiSeries.createPriceLine({ price: 70, color: "rgba(255,255,255,0.3)", lineWidth: 1, lineStyle: 2, axisLabelVisible: false });
    chartRef.current = { chart, candleSeries, rsiSeries };
    const ro = new ResizeObserver(entries => { if (entries[0]) chart.applyOptions({ width: entries[0].contentRect.width }); });
    ro.observe(containerRef.current);
    return () => { ro.disconnect(); chart.remove(); chartRef.current = null; };
  }, []);

  useEffect(() => {
    if (!chartRef.current) return;
    const n = committed ? candles.length : HIDE_FROM;
    const visible = candles.slice(0, n);
    chartRef.current.candleSeries.setData(visible.map(c => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close })));
    chartRef.current.rsiSeries.setData(visible.map(c => c.rsi != null ? { time: c.time, value: c.rsi } : null).filter(Boolean));
    chartRef.current.chart.timeScale().fitContent();
  }, [committed]);

  const commit = () => setCommitted(true);

  return (
    <ColdStart
      tag={cs.tag}
      ask={cs.ask}
      action={{ type: "custom", render: (csCommit) => (
        <div>
          <div style={{position:"relative", borderRadius:6, overflow:"hidden"}}>
            <div ref={containerRef} data-source="/data/edu/rsi_divergence.json"/>
          </div>
          <div style={{display:"flex", gap:10, justifyContent:"center", flexWrap:"wrap", marginTop:16}}>
            {[["down",cs.optDown],["up",cs.optUp],["dontknow",cs.optDontKnow]].map(([val,label]) => (
              <button key={val} disabled={committed} onClick={() => { commit(); csCommit(val); }} style={{
                fontFamily:"monospace", fontSize:14, fontWeight:700, padding:"14px 22px", borderRadius:4,
                cursor: committed ? "default" : "pointer", background:"rgba(255,255,255,0.06)", color:"#fff",
                border:"1px solid rgba(255,255,255,0.22)", opacity: committed ? 0.6 : 1,
              }}>{label}</button>
            ))}
          </div>
        </div>
      )}}
      reveal={() => fillTemplate(cs.revealTemplate, {
        caseDate: scene.ohlc[caseIdx].time, caseRsi: scene.rsi[caseIdx],
        caseDirWord: dirUp ? cs.dirUpPast : cs.dirDownPast,
        caseFrom: candles[caseIdx].close, caseTo: candles[targetIdx].close,
        n: vars.rsi_n, share: vars.rsi_share, base: vars.rsi_base,
      })}
      bridge={cs.bridge}
    />
  );
}

// ─── Ретроспективное искажение — ключевой интерактив ───────────────────────
function HindsightTest({ cases }) {
  const { useState, useMemo } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const T9 = window.Ch9Content[INITIAL_LANG] || window.Ch9Content.ru;
  const h = T9.hindsight;
  const nameKey = "company_" + INITIAL_LANG;

  const [pool] = useState(() => cases ? shuffled(cases).slice(0, 4) : []);
  const [step, setStep] = useState(0); // 0=intro, 1-3=hidden cases, 4=revealed case, 5=result
  const [answers, setAnswers] = useState([]); // {dir, confidence}
  const [dirPick, setDirPick] = useState(null);
  const [confidence, setConfidence] = useState(50);
  const [hindsightConfidence, setHindsightConfidence] = useState(50);

  if (!cases || pool.length < 4) return <p style={{color:C.inkFaint}}>—</p>;

  const hiddenCases = pool.slice(0, 3);
  const revealedCase = pool[3];

  const submitHidden = () => {
    setAnswers(a => [...a, { dir: dirPick, confidence }]);
    setDirPick(null); setConfidence(50);
    setStep(s => s + 1);
  };

  const finish = () => setStep(5);

  const accuracy = useMemo(() => {
    if (answers.length < 3) return null;
    let hits = 0;
    hiddenCases.forEach((c, i) => {
      const guessed = answers[i].dir; // "up" | "down" | "flat"
      if (guessed === c.direction_outcome) hits++;
    });
    return Math.round(100 * hits / 3);
  }, [answers]);

  const avgConfidence = useMemo(() => {
    if (answers.length < 3) return null;
    return Math.round(answers.reduce((s, a) => s + a.confidence, 0) / 3);
  }, [answers]);

  return (
    <div>
      {step === 0 && (
        <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:8,padding:"26px 30px"}}>
          <StepTag n="1" label={S.stepExplain}/>
          <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:20}}>{h.step1Legend}</p>
          <button onClick={()=>setStep(1)} style={{padding:"12px 28px",background:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:1}}>{h.startBtn}</button>
        </div>
      )}

      {step >= 1 && step <= 3 && (() => {
        const c = hiddenCases[step - 1];
        return (
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"26px 30px"}}>

// ─── Таблица §3.6 — инструмент × ТФ × условие, с базовой линией и сортировкой ──
const CHART_SYMBOLS = new Set(["GOLD","SILVER","BTC","ETH","SOL","SPX","NASDAQ","DJI","VIX","WTI","NG","EURUSD","GBPUSD","USDJPY","DXY"]);

function OscillatorRealityTable({ cells }) {
  const { useState, useMemo } = React;
  const T9 = window.Ch9Content[INITIAL_LANG] || window.Ch9Content.ru;
  const ot = T9.oscTable;
  if (!cells || !cells.length) return null;

  const [condition, setCondition] = useState("rsi_high");
  const [checkpoint, setCheckpoint] = useState("k10");
  const [sortKey, setSortKey] = useState("symbol");
  const [sortDir, setSortDir] = useState(1);

  const verdictShort = (key) => key === "no_edge" ? ot.verdictNoEdgeShort : key === "weak_edge" ? ot.verdictWeakEdgeShort : ot.verdictEdgeShort;

  const cols = [
    { key: "symbol", label: ot.colSymbol, align: "left" },
    { key: "tf", label: ot.colTf, align: "center" },
    { key: "n", label: ot.colN, align: "center" },
    { key: "share_reversal", label: ot.colShare, align: "center" },
    { key: "base_share", label: ot.colBase, align: "center" },
    { key: "edge_pp", label: ot.colEdge, align: "center" },
    { key: "verdict_key", label: ot.colVerdict, align: "center" },
  ];

  const rows = useMemo(() => {
    const out = [];
    cells.forEach(cell => {
      const v = cell.conditions && cell.conditions[condition] && cell.conditions[condition][checkpoint];
      if (v && v.shown) out.push({ symbol: cell.symbol, tf: cell.tf, ...v });
    });
    const isNum = typeof out[0]?.[sortKey] === "number";
    out.sort((a,b) => {
      const d = isNum ? (a[sortKey]-b[sortKey]) : String(a[sortKey]).localeCompare(String(b[sortKey]));
      return d*sortDir || a.symbol.localeCompare(b.symbol);
    });
    return out;
  }, [cells, condition, checkpoint, sortKey, sortDir]);

  const onSort = (key) => {
    if (key === sortKey) setSortDir(d => -d);
    else { setSortKey(key); setSortDir(1); }
  };

  return (
    <div style={{marginBottom:24}}>
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
        {[["rsi_high",ot.tabConditionRsi],["divergence",ot.tabConditionDiv]].map(([k,label]) => (
          <button key={k} onClick={()=>setCondition(k)} style={{fontFamily:"monospace",fontSize:11,padding:"6px 14px",cursor:"pointer",background:k===condition?C.gold:"#fff",color:k===condition?"#18181a":C.inkMid,border:`1px solid ${k===condition?C.gold:C.border}`,borderRadius:3,fontWeight:600}}>{label}</button>
        ))}
        <span style={{width:1,height:18,background:C.border,margin:"0 4px"}}/>
        {["k5","k10","k20"].map(k => (
          <button key={k} onClick={()=>setCheckpoint(k)} style={{fontFamily:"monospace",fontSize:11,padding:"6px 12px",cursor:"pointer",background:k===checkpoint?C.black:"#fff",color:k===checkpoint?"#fff":C.inkMid,border:`1px solid ${k===checkpoint?C.black:C.border}`,borderRadius:3}}>{ot.checkpointPrefix} {k.slice(1)} {ot.checkpointSuffix}</button>
        ))}
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:620}}>
          <thead>
            <tr>
              {/* 🔴 Сортировка объявлена как сортировка. Раньше это был
                  <th onClick>: мышью работает, с клавиатуры недостижимо,
                  экранный диктор читает как обычный заголовок столбца.
                  aria-sort сообщает текущее направление, кнопка внутри даёт
                  фокус и Enter/Space без своей обработки клавиш. */}
              {cols.map(col => (
                <th key={col.key} scope="col"
                    aria-sort={sortKey===col.key ? (sortDir>0?"descending":"ascending") : "none"}
                    style={{textAlign:col.align,padding:0,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>
                  <button type="button" onClick={()=>onSort(col.key)}
                    style={{width:"100%",textAlign:col.align,padding:"7px 9px",fontSize:10,fontFamily:"monospace",color:sortKey===col.key?C.goldText:C.inkFaint,textTransform:"uppercase",cursor:"pointer",userSelect:"none",background:"none",border:"none",fontWeight:600,letterSpacing:0.5}}>
                    {col.label}{sortKey===col.key ? (sortDir>0?" ▾":" ▴") : ""}
                  </button>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((r,i) => (
              <tr key={i}>
                <td style={{padding:"6px 9px",fontSize:11.5,color:C.black,fontWeight:600,borderBottom:`1px solid ${C.border}`}}>
                  {CHART_SYMBOLS.has(r.symbol)
                    ? <a href={"/chart?s="+r.symbol} target="_blank" rel="noopener" style={{color:C.black,textDecoration:"none",borderBottom:`1px dotted ${C.gold}`,display:"inline-block",padding:"8px 0"}}>{window.SBFSymbols ? window.SBFSymbols.symbolName(r.symbol, {lang: INITIAL_LANG, mode:"name+ticker"}) : r.symbol}</a>
                    : (window.SBFSymbols ? window.SBFSymbols.symbolName(r.symbol, {lang: INITIAL_LANG, mode:"name+ticker"}) : r.symbol)}
                </td>
                <td style={{padding:"6px 9px",textAlign:"center",fontSize:10.5,fontFamily:"monospace",color:C.inkSoft,borderBottom:`1px solid ${C.border}`}}>{r.tf}</td>
                <td style={{padding:"6px 9px",textAlign:"center",fontSize:10.5,fontFamily:"monospace",color:C.inkSoft,borderBottom:`1px solid ${C.border}`}}>{r.n}</td>
                <td style={{padding:"6px 9px",textAlign:"center",fontSize:11,fontFamily:"monospace",color:C.inkMid,borderBottom:`1px solid ${C.border}`}}>{r.share_reversal}%</td>
                <td style={{padding:"6px 9px",textAlign:"center",fontSize:11,fontFamily:"monospace",color:C.inkSoft,borderBottom:`1px solid ${C.border}`}}>{r.base_share}%</td>
                <td style={{padding:"6px 9px",textAlign:"center",fontSize:11,fontFamily:"monospace",fontWeight:600,color:C.inkMid,borderBottom:`1px solid ${C.border}`}}>{r.edge_pp>0?"+":""}{r.edge_pp}</td>
                <td style={{padding:"6px 9px",textAlign:"center",fontSize:10,fontFamily:"monospace",color:C.inkSoft,borderBottom:`1px solid ${C.border}`}}>{verdictShort(r.verdict_key)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

      </div>

      <div style={{background:C.black,padding:"80px 5vw 70px",textAlign:"center",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% 100%, rgba(201,151,58,0.1) 0%, transparent 60%)"}}/>
        <div style={{position:"relative"}}>
          <Mono size={11} color={C.goldText} spacing={4} style={{display:"block",marginBottom:20}}>{S.heroEyebrow}</Mono>
          <h1 style={{fontFamily:"'DM Serif Display',serif",fontSize:"clamp(36px,6vw,66px)",fontWeight:400,color:C.white,lineHeight:1.05,marginBottom:20}}>
            {S.heroTitleLine1}<br/><span style={{color:C.goldText}}>{S.heroTitleLine2}</span>
          </h1>
          <p style={{fontSize:"clamp(16px,2vw,20px)",color:"rgba(255,255,255,0.55)",maxWidth:640,margin:"0 auto 32px",lineHeight:1.65}}>{S.heroSubtitle}</p>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <Chip color={C.goldText}>{S.fundamentalChip}</Chip>
            <Chip color="rgba(255,255,255,0.55)">{S.technicalChip}</Chip>
            <Chip color="rgba(255,255,255,0.55)">{S.interactiveChip}</Chip>
          </div>
        </div>
      </div>

      {loading && <div style={{textAlign:"center",padding:"60px 0",fontFamily:"monospace",fontSize:13,color:C.inkFaint}}>{S.loadingLabel}</div>}
      {error && <div style={{textAlign:"center",padding:"40px 0",fontFamily:"monospace",fontSize:13,color:"#c0392b",background:C.redPale}}>{S.loadErrorLabel}</div>}

      {!loading && (
      <div style={{maxWidth:1060,margin:"0 auto",padding:"0 0 120px"}}>

        <div style={{margin:"0 -5vw 56px"}}><ColdStart9Entry scene={scene} vars={vars}/></div>

        <div style={{padding:"0 5vw"}}>

        <IntroBlock/>

        <SectionTitle sub={S.anatomySub}>{T9.earningsAnatomy.tag}</SectionTitle>
        <EarningsAnatomy/>

        <SectionTitle id="secWhyFalls" sub={S.whyFallsSub}>{T9.whyFalls.tag}</SectionTitle>
        <WhyFalls/>

        <SectionTitle sub={S.hindsightSub}>{T9.hindsight.tag}</SectionTitle>
        <div style={{marginBottom:56}}><HindsightTest cases={cases}/></div>

        <SectionTitle id="secOscillatorMath" sub={S.oscillatorSub}>{T9.oscillatorMath.tag}</SectionTitle>
        <OscillatorMath/>

        <SectionTitle id="secCoreMeasure" sub={S.coreMeasureSub}>{T9.coreMeasure.tag}</SectionTitle>
        <CoreMeasureBlock vars={vars} cells={osc && osc.cells}/>

        <SectionTitle sub={S.threeCasesSub}>{T9.threeCases.tag}</SectionTitle>
        <ThreeCases cases={cases}/>

        <Rule/>

        <LadderLimitBlock/>

        <QuizBlock questions={T9.quiz} levelId="level_9" lang={lang} copy={{
          kicker: S.quizKicker, title: S.quizTitle, next: S.quizNext,
          stuckAll: S.quizStuckAll, stuckSome: S.quizStuckSome, backToSection: S.quizBackToSection,
        }} />

        <PredictDiv vars={vars}/>

        <div style={{border:`1px dashed ${C.borderGold}`,borderRadius:8,padding:"20px 24px",marginBottom:32,background:C.surface}}>
          <Mono size={11} color={C.goldText} spacing={3} style={{display:"block",marginBottom:10}}>{T9.cliffhanger.tag}</Mono>
          {T9.cliffhanger.body.split("\n\n").map((p,i) => <p key={i} style={{fontSize:14,color:C.inkMid,lineHeight:1.7,marginBottom:10}}>{p}</p>)}
        </div>

        <div style={{marginBottom:32}}>
          <Mono size={10} color={C.inkFaint} spacing={2} style={{display:"block",marginBottom:10,textTransform:"uppercase"}}>{T9.sources.tag}</Mono>
          <ol style={{fontSize:11.5,color:C.inkFaint,lineHeight:1.8,paddingLeft:18,marginBottom:8}}>
            {T9.sources.list.map((s,i) => <li key={i}>{s}</li>)}
            {osc && osc._meta && (() => {
              const m = osc._meta;
              const text = T9.sources.ownTemplate
                .replace("{{n_cells}}", m.n_cells).replace("{{rsi_period}}", m.rsi_period)
                .replace("{{div_window}}", m.div_window).replace("{{built}}", "27.07.2026");
              return (
                <li>
                  {text}{" "}
                  <a href="/data/edu_stats/oscillator_reality.csv" download style={{color:C.goldText}}>{T9.sources.csvLabel}</a>
                </li>
              );
            })()}
          </ol>
          <p style={{fontSize:11,color:C.inkFaint,fontStyle:"italic"}}>{T9.sources.checked}</p>
        </div>

        <ComplianceFootnote lang={lang} />

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:20,paddingTop:48,marginTop:16,borderTop:`1px solid ${C.border}`}}>
          <AskAnalystBtn tr={{askAnalyst:S.askQuestionLabel}} chapterNum={9} lang={lang} />
          <button
            onClick={() => window.location.href = getChUrl(10, lang)}
            style={{background:C.black,color:C.white,border:"none",padding:"18px 35px",cursor:"pointer",fontFamily:"monospace",fontSize:14,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.target.style.background=C.gold}
            onMouseLeave={e=>e.target.style.background=C.black}>
            {S.nextChapterBtn}
          </button>
        </div>

        </div>
      </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter9 />);
{% endraw %}
</script>
</body>
</html>
