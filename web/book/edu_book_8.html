function fillTemplate(str, vars) {
  if (!str) return str;
  return str.replace(/\{\{(\w+)\}\}/g, (m, key) => {
    const v = vars ? vars[key] : undefined;
    if (v === undefined || v === null || (typeof v === "number" && isNaN(v))) {
      console.error("[ch8] отсутствует значение для {{" + key + "}}");
      return "—";
    }
    return String(v);
  });
}

const FAST_PERIODS = [5, 8, 10, 12, 15, 20, 25, 30, 40, 50];
const SLOW_PERIODS = [20, 30, 50, 80, 100, 150, 200];

function ema(closes, period) {
  const out = new Array(closes.length).fill(null);
  if (closes.length < period) return out;
  const k = 2 / (period + 1);
  let seed = 0;
  for (let i = 0; i < period; i++) seed += closes[i];
  seed /= period;
  out[period - 1] = seed;
  for (let i = period; i < closes.length; i++) out[i] = closes[i] * k + out[i - 1] * (1 - k);
  return out;
}

function useCh8Data() {
  const { useState, useEffect } = React;
  const [state, setState] = useState({ loading: true, error: null, ema: null, candles: null });
  useEffect(() => {
    let cancelled = false;
    Promise.all([
      fetch("/data/edu_stats/ema_reality.json").then(r => { if (!r.ok) throw new Error("ema_reality.json HTTP " + r.status); return r.json(); }),
      fetch("/data/ohlc_GOLD_D1.json").then(r => { if (!r.ok) throw new Error("ohlc_GOLD_D1.json HTTP " + r.status); return r.json(); }),
    ]).then(([ema_, ohlc]) => {
      if (!cancelled) setState({ loading: false, error: null, ema: ema_, candles: (ohlc.candles || []).slice(-260) });
    }).catch(err => {
      console.error("[ch8] load failed:", err);
      if (!cancelled) setState({ loading: false, error: err, ema: null, candles: null });
    });
    return () => { cancelled = true; };
  }, []);
  return state;
}

function medianOf(nums) {
  const s = nums.slice().sort((a,b)=>a-b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid-1] + s[mid]) / 2;
}

function buildVars(ema_, lang) {
  if (!ema_) return null;
  const T8 = window.Ch8Content[lang] || window.Ch8Content.ru;
  const sum = ema_.summary || {};
  const verdictText = sum.verdict_key === "no_persistence" ? T8.coreMeasure.verdictNoPersistence
    : sum.verdict_key === "weak_persistence" ? T8.coreMeasure.verdictWeakPersistence : T8.coreMeasure.verdictSomePersistence;
  const spread = sum.oos_percentile_spread || {};
  const lvs = sum.long_vs_short || {};

  // Per-timeframe median OOS rank, real numbers from the same cells the
  // overall summary is built from -- used by PredictTf so its reveal can
  // genuinely depend on which timeframe the reader picked (SPEC_charts_
  // and_interactivity_standard.md: a reveal that doesn't vary by choice is
  // class C dressed as class B, not a real "choice with consequence").
  const cells = ema_.cells || [];
  const byTf = {};
  cells.forEach(c => { if (c.tf && c.oos) (byTf[c.tf] = byTf[c.tf] || []).push(c.oos.rank); });
  const tfRank = {};
  Object.keys(byTf).forEach(tf => { tfRank[tf] = Math.round(medianOf(byTf[tf])); });
  const tfOf = cells[0] && cells[0].oos ? cells[0].oos.of : sum.of;
  const worstTf = Object.keys(tfRank).reduce((a,b) => tfRank[b] > tfRank[a] ? b : a, Object.keys(tfRank)[0]);

  return {
    grid_size: ema_._meta.grid_size, n_cells: ema_._meta.n_cells, cost_per_trade_atr: ema_._meta.cost_per_trade_atr,
    median_oos_rank: sum.median_oos_rank, median_percentile: spread.median,
    verdict_line: verdictText,
    pct_min: spread.min, pct_median: spread.median, pct_max: spread.max, pct_p25: spread.p25, pct_p75: spread.p75,
    net_positive_long: lvs.net_positive_share_long != null ? Math.round(lvs.net_positive_share_long * 1000) / 10 : null,
    net_positive_short: lvs.net_positive_share_short != null ? Math.round(lvs.net_positive_share_short * 1000) / 10 : null,

    cost_per_trade: 0.29, crosses_per_month: 30, monthly_cost: 8.7,
    tf_rank_h1: tfRank.H1, tf_rank_h4: tfRank.H4, tf_rank_d1: tfRank.D1, tf_of: tfOf, tf_worst: worstTf,
  };
}

// ─── Cold open: два трейдера, две настройки ────────────────────────────────
// ─── Cold start: "Какая скользящая лучше" (SPEC_coldstart_interactives_ch6_15.
// md §4). Заменяет прежний ColdOpen8. Считает реальную OOS-статистику прямо
// из ema_.lab (тот же массив, на котором стоит OverfitLab чуть ниже) --
// для каждого фиксированного slow-периода (20/50/200), по ВСЕМ инструментам/
// tf/fast-парам, доля случаев с положительным oos.sum_move_net.
function ColdStart8Entry({ ema_ }) {
  const T8 = window.Ch8Content[INITIAL_LANG] || window.Ch8Content.ru;
  const cs = T8.coldStart;
  if (!ema_ || !ema_.lab) return <div style={{background:C.black,padding:"60px 5vw",textAlign:"center"}}><Mono size={11} color={C.gold} spacing={4}>{cs.tag}</Mono></div>;

  const stat = React.useMemo(() => {
    const buckets = { 20: [], 50: [], 200: [] };
    Object.values(ema_.lab).forEach(tfs => Object.values(tfs).forEach(obj => {
      obj.grid.forEach(g => { if (buckets[g.slow]) buckets[g.slow].push(g.oos.sum_move_net); });
    }));
    const out = {};
    let nTotal = 0;
    Object.keys(buckets).forEach(k => {
      const arr = buckets[k];
      out[k] = { n: arr.length, pct: Math.round(arr.filter(x => x > 0).length / arr.length * 1000) / 10 };
      nTotal += arr.length;
    });
    out.n_total = nTotal;
    return out;
  }, [ema_]);

  return (
    <ColdStart
      tag={cs.tag}
      ask={cs.ask}
      action={{ type: "choice", options: [
        { label: cs.opt20, value: 20 }, { label: cs.opt50, value: 50 }, { label: cs.opt200, value: 200 },
      ]}}
      reveal={() => fillTemplate(cs.revealTemplate, {
        n_total: stat.n_total, p20: stat[20].pct, n20: stat[20].n, p50: stat[50].pct, n50: stat[50].n, p200: stat[200].pct, n200: stat[200].n,
      })}
      bridge={cs.bridge}
    />
  );
}

// ─── Ползунок запаздывания (реальные данные, клиент) ───────────────────────
function LagSlider({ candles }) {
  const { useState, useMemo } = React;
  const T8 = window.Ch8Content[INITIAL_LANG] || window.Ch8Content.ru;
  const lg = T8.lag;
  const [period, setPeriod] = useState(20);

  const closes = useMemo(() => candles ? candles.map(c => +c.close) : [], [candles]);

  const { crossings, avgLag } = useMemo(() => {
    if (closes.length < period + 10) return { crossings: null, avgLag: null };
    const e = ema(closes, period);
    let crossCount = 0;
    for (let i = period + 1; i < closes.length; i++) {
      if (e[i - 1] == null || e[i] == null) continue;
      const prevSign = Math.sign(closes[i - 1] - e[i - 1]);
      const sign = Math.sign(closes[i] - e[i]);
      if (prevSign !== 0 && sign !== 0 && prevSign !== sign) crossCount++;
    }
    // локальные экстремумы цены (окно 3) и ближайший последующий экстремум EMA того же знака
    const W = 3;
    const priceExtrema = [];
    for (let i = W; i < closes.length - W; i++) {
      const win = closes.slice(i - W, i + W + 1);
      if (closes[i] === Math.max(...win)) priceExtrema.push({ i, kind: "high" });
      else if (closes[i] === Math.min(...win)) priceExtrema.push({ i, kind: "low" });
    }
    const emaExtrema = [];
    for (let i = period + W; i < closes.length - W; i++) {
      if (e[i - W] == null || e[i + W] == null) continue;
      const win = e.slice(i - W, i + W + 1);
      if (win.some(v => v == null)) continue;
      if (e[i] === Math.max(...win)) emaExtrema.push({ i, kind: "high" });
      else if (e[i] === Math.min(...win)) emaExtrema.push({ i, kind: "low" });
    }
    const lags = [];
    for (const pe of priceExtrema) {
      const match = emaExtrema.find(ee => ee.kind === pe.kind && ee.i >= pe.i && ee.i - pe.i < period * 2);
      if (match) lags.push(match.i - pe.i);
    }
    const avg = lags.length ? lags.reduce((a,b)=>a+b,0) / lags.length : null;
    return { crossings: crossCount, avgLag: avg };
  }, [closes, period]);

  return (
    <div style={{marginBottom:48}}>
      <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:24,maxWidth:820}}>{lg.preamble}</p>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"26px 30px"}}>
        <Mono size={11} color={C.inkFaint} spacing={1} style={{display:"block",marginBottom:10,textTransform:"uppercase"}}>{lg.sliderLabel}: {period}</Mono>
        <input type="range" min="5" max="200" step="1" value={period} onChange={e=>setPeriod(+e.target.value)} style={{width:"100%",marginBottom:24}}/>
        <div style={{display:"flex",gap:32,flexWrap:"wrap",justifyContent:"center"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:34,color:C.gold}}>{crossings != null ? crossings : "—"}</div>
            <Mono size={10.5} color={C.inkFaint} spacing={0.5}>{lg.crossingsLabel}</Mono>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:34,color:C.black}}>{avgLag != null ? avgLag.toFixed(1) : "—"}</div>
            <Mono size={10.5} color={C.inkFaint} spacing={0.5}>{lg.lagLabel}</Mono>
          </div>
        </div>
        <p style={{fontSize:11.5,color:C.inkFaint,fontStyle:"italic",textAlign:"center",marginTop:20,marginBottom:0}}>{lg.footer}</p>
      </div>
    </div>
  );
}

// ─── Лаборатория переобучения — ядро главы ─────────────────────────────────
function OverfitLab({ ema_ }) {
  const { useState, useMemo } = React;
  const T8 = window.Ch8Content[INITIAL_LANG] || window.Ch8Content.ru;
  const lb = T8.lab;
  const symbols = useMemo(() => ema_ ? Object.keys(ema_.lab).sort() : [], [ema_]);
  const [symbol, setSymbol] = useState("GOLD");
  const tfs = useMemo(() => (ema_ && ema_.lab[symbol]) ? Object.keys(ema_.lab[symbol]) : [], [ema_, symbol]);
  const [tf, setTf] = useState("D1");
  const [fastIdx, setFastIdx] = useState(2);
  const [slowIdx, setSlowIdx] = useState(2);
  const [screen, setScreen] = useState(1);

  const grid = (ema_ && ema_.lab[symbol] && ema_.lab[symbol][tf]) ? ema_.lab[symbol][tf].grid : [];
  const fast = FAST_PERIODS[fastIdx], slow = SLOW_PERIODS[slowIdx];
  const cell = grid.find(g => g.fast === fast && g.slow === slow);

  const pick = (sym, t) => {
    setSymbol(sym); setTf(t); setScreen(1);
    setFastIdx(2); setSlowIdx(2);
  };

  const autofit = () => {
    if (!grid.length) return;
    const best = grid.reduce((a,b) => (b.is.sum_move_net > a.is.sum_move_net ? b : a));
    setFastIdx(FAST_PERIODS.indexOf(best.fast));
    setSlowIdx(SLOW_PERIODS.indexOf(best.slow));
  };

  const lockIn = () => setScreen(2);

            <p style={{color:C.red,fontSize:12.5}}>—</p>
          ) : !cell ? (

              <div style={{textAlign:"center"}}><div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.gold}}>{cell.is.sum_move_net.toFixed(2)}</div><Mono size={9.5} color={C.inkFaint} spacing={0.5}>{lb.metricNet}</Mono></div>

            <button onClick={lockIn} disabled={!cell || slow<=fast} style={{padding:"11px 26px",background:(!cell||slow<=fast)?C.border:C.black,color:"#fff",border:"none",borderRadius:4,cursor:(!cell||slow<=fast)?"default":"pointer",fontFamily:"monospace",fontSize:11.5,letterSpacing:1,fontWeight:700}}>{lb.fixBtn}</button>

          <div style={{display:"flex",gap:24,flexWrap:"wrap",marginBottom:22,justifyContent:"center"}}>

              <Mono size={10} color="rgba(255,255,255,0.5)" spacing={0}>#{rank} / {oosSorted.length}</Mono>
            </div>

          <div style={{background:"rgba(255,255,255,0.04)",borderRadius:6,padding:"20px 24px",marginBottom:18}}>
            <div style={{fontWeight:600,fontSize:14,color:C.gold,marginBottom:10}}>{lb.revealTitle}</div>
            {fillTemplate(lb.revealBody, {
              is_result: cell.is.sum_move_net.toFixed(2), oos_rank: rank, grid_size: oosSorted.length, oos_result: cell.oos.sum_move_net.toFixed(2),

  );

// ─── Таблица out-of-sample (§3.5) ──────────────────────────────────────────
// SPEC_ch8_debug.md §2.4: раньше -- плоская таблица без сортировки и без
// переключателя таймфрейма, хотя обе оси уже есть в данных (3 tf × 15
// символов). Добавлены: вкладки таймфрейма и клик по заголовку колонки
// (тот же столбец повторно -- разворот направления).
function OosTable({ ema_ }) {
  const { useState, useMemo } = React;
  const T8 = window.Ch8Content[INITIAL_LANG] || window.Ch8Content.ru;
  const cm = T8.coreMeasure;
  const allCells = (ema_ && ema_.cells) || [];
  const tfs = useMemo(() => Array.from(new Set(allCells.map(c=>c.tf))).sort(), [allCells]);
  const [tfFilter, setTfFilter] = useState("all");
  const [sortKey, setSortKey] = useState("rank");
  const [sortDir, setSortDir] = useState(1);

  const cols = [
    { key: "symbol", label: cm.colSymbol, get: c => c.symbol, align: "left" },
    { key: "tf", label: "TF", get: c => c.tf, align: "center" },
    { key: "best_is", label: cm.colBestIs, get: c => c.best_is.fast*1000+c.best_is.slow, align: "center" },
    { key: "rank", label: cm.colOosRank, get: c => c.oos.rank, align: "center" },
  ];

  const rows = useMemo(() => {
    const filtered = tfFilter === "all" ? allCells : allCells.filter(c => c.tf === tfFilter);
    const col = cols.find(c => c.key === sortKey);
    return filtered.slice().sort((a,b) => (col.get(a) - col.get(b)) * sortDir || a.symbol.localeCompare(b.symbol));
  }, [allCells, tfFilter, sortKey, sortDir]);

  const onSort = (key) => {
    if (key === sortKey) setSortDir(d => -d);
    else { setSortKey(key); setSortDir(1); }
  };

  return (
    <div style={{marginBottom:16}}>
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {["all", ...tfs].map(t => (
          <button key={t} onClick={()=>setTfFilter(t)} style={{fontFamily:"monospace",fontSize:10.5,padding:"5px 10px",cursor:"pointer",background:t===tfFilter?C.gold:"#fff",color:t===tfFilter?"#18181a":C.inkMid,border:`1px solid ${t===tfFilter?C.gold:C.border}`,borderRadius:3}}>{t==="all"?cm.tfAll:t}</button>
        ))}
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:560}}>
          <thead>
            <tr>
              {cols.map(col => (
                <th key={col.key} onClick={()=>onSort(col.key)} style={{textAlign:col.align,padding:"8px 10px",fontSize:10.5,fontFamily:"monospace",color:sortKey===col.key?C.gold:C.inkFaint,textTransform:"uppercase",borderBottom:`1px solid ${C.border}`,cursor:"pointer",userSelect:"none",whiteSpace:"nowrap"}}>
                  {col.label}{sortKey===col.key ? (sortDir>0?" ▾":" ▴") : ""}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((c,i) => (
              <tr key={i}>
                <td style={{padding:"7px 10px",fontSize:12,color:C.black,fontWeight:600,borderBottom:`1px solid ${C.border}`}}>{window.SBFSymbols ? window.SBFSymbols.symbolName(c.symbol, {lang: INITIAL_LANG, mode:"name+ticker"}) : c.symbol}</td>
                <td style={{padding:"7px 10px",textAlign:"center",fontSize:11,fontFamily:"monospace",color:C.inkSoft,borderBottom:`1px solid ${C.border}`}}>{c.tf}</td>
                <td style={{padding:"7px 10px",textAlign:"center",fontSize:11,fontFamily:"monospace",color:C.inkSoft,borderBottom:`1px solid ${C.border}`}}>{c.best_is.fast}/{c.best_is.slow}</td>
                <td style={{padding:"7px 10px",textAlign:"center",fontSize:12,fontFamily:"monospace",fontWeight:600,color: c.oos.percentile<=25?C.green:c.oos.percentile>=75?C.red:C.inkMid,borderBottom:`1px solid ${C.border}`}}>{c.oos.rank} / {c.oos.of}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── Для чего EMA годится — один график, три режима ────────────────────────
function EmaUsageModes({ candles }) {
  const { useState, useMemo, useEffect, useRef } = React;
  const T8 = window.Ch8Content[INITIAL_LANG] || window.Ch8Content.ru;
  const w = T8.whatMaIsFor;
  const [mode, setMode] = useState("definition");
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const seriesRef = useRef({});

  const closes = useMemo(() => candles ? candles.map(c => +c.close) : [], [candles]);
  const e20 = useMemo(() => closes.length ? ema(closes, 20) : [], [closes]);
  const e50 = useMemo(() => closes.length ? ema(closes, 50) : [], [closes]);
  const e200 = useMemo(() => closes.length ? ema(closes, 200) : [], [closes]);

  const lastClose = closes[closes.length - 1];
  const lastE20 = e20[e20.length - 1];
  const above = lastClose >= lastE20;
  const distPct = lastE20 ? ((lastClose - lastE20) / lastE20 * 100) : null;
  const e20_10ago = e20[e20.length - 11];
  const slopePct = (e20_10ago != null && lastE20 != null) ? ((lastE20 - e20_10ago) / e20_10ago * 100) : null;

  const modes = [["definition", w.modeDefinition], ["regime", w.modeRegime], ["language", w.modeLanguage]];

  // Create the chart once.
  useEffect(() => {
    if (!containerRef.current || chartRef.current || typeof LightweightCharts === "undefined") return;
    const chart = LightweightCharts.createChart(containerRef.current, {
      width: containerRef.current.clientWidth, height: 260,
      layout: { background: { color: C.black }, textColor: "rgba(255,255,255,0.55)" },
      grid: { vertLines: { color: "rgba(255,255,255,0.05)" }, horzLines: { color: "rgba(255,255,255,0.05)" } },
      rightPriceScale: { borderColor: "rgba(255,255,255,0.15)" },
      timeScale: { borderColor: "rgba(255,255,255,0.15)" },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });
    const closeSeries = chart.addLineSeries({ color: "rgba(255,255,255,0.4)", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    const emaASeries = chart.addLineSeries({ color: C.gold, lineWidth: 2, priceLineVisible: false, lastValueVisible: false, title: "EMA" });
    const emaBSeries = chart.addLineSeries({ color: "#6ea8fe", lineWidth: 2, priceLineVisible: false, lastValueVisible: false, title: "EMA" });
    chartRef.current = chart;
    seriesRef.current = { closeSeries, emaASeries, emaBSeries };
    const ro = new ResizeObserver(entries => { if (entries[0]) chart.applyOptions({ width: entries[0].contentRect.width }); });
    ro.observe(containerRef.current);
    return () => { ro.disconnect(); chart.remove(); chartRef.current = null; };
  }, []);

  // Push real data whenever mode/candles change.
  useEffect(() => {
    const s = seriesRef.current;
    if (!s.closeSeries || !candles || closes.length < 210) return;
    const n = mode === "language" ? 260 : 200;
    const start = Math.max(0, candles.length - n);
    const toSeries = (arr) => arr.slice(start).map((v,i) => v != null ? { time: candles[start+i].time, value: v } : null).filter(Boolean);
    s.closeSeries.setData(toSeries(closes));
    if (mode !== "language") {
      s.emaASeries.setData(toSeries(e20));
      s.emaBSeries.setData([]);
    } else {
      s.emaASeries.setData(toSeries(e50));
      s.emaBSeries.setData(toSeries(e200));
    }
    if (mode === "definition") {
      chartRef.current.applyOptions({ layout: { background: { color: above ? "#0a1f16" : "#210b0b" } } });
    } else {
      chartRef.current.applyOptions({ layout: { background: { color: C.black } } });
    }
    chartRef.current.timeScale().fitContent();
  }, [mode, candles, closes, e20, e50, e200, above]);

  if (closes.length < 210) {
    return <div style={{background:C.surface,borderRadius:6,minHeight:260,marginBottom:48}}/>;
  }

  return (
    <div style={{marginBottom:48}}>
      <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
        {modes.map(([k, label]) => (
          <button key={k} onClick={()=>setMode(k)} style={{fontFamily:"monospace",fontSize:11,padding:"7px 14px",cursor:"pointer",background:k===mode?C.gold:"#fff",color:k===mode?"#18181a":C.inkMid,border:`1px solid ${k===mode?C.gold:C.border}`,borderRadius:4,fontWeight:600}}>{label}</button>
        ))}
      </div>

      <div style={{background:C.black,borderRadius:8,padding:"22px 5vw 26px",marginBottom:16}}>
        <div ref={containerRef} data-source="/data/ohlc_GOLD_D1.json"/>

        {mode === "definition" && (
          <p style={{fontSize:13,color:above?"#4ade80":"#f87171",fontFamily:"monospace",textAlign:"center",marginTop:14,marginBottom:0}}>
            {above ? w.aboveLabel : w.belowLabel}
          </p>
        )}
        {mode === "regime" && (
          <div style={{display:"flex",gap:32,justifyContent:"center",marginTop:14}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.gold}}>{distPct!=null?(distPct>0?"+":"")+distPct.toFixed(2)+"%":"—"}</div>
              <Mono size={9} color="rgba(255,255,255,0.5)" spacing={0.5}>{w.distLabel}</Mono>
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:"#fff"}}>{slopePct!=null?(slopePct>0?"+":"")+slopePct.toFixed(2)+"%":"—"}</div>
              <Mono size={9} color="rgba(255,255,255,0.5)" spacing={0.5}>{w.slopeLabel}</Mono>
            </div>
          </div>
        )}
        {mode === "language" && (
          <div style={{display:"flex",gap:20,justifyContent:"center",marginTop:14}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:10,height:10,borderRadius:2,background:C.gold,display:"inline-block"}}/><Mono size={9.5} color="rgba(255,255,255,0.6)" spacing={0}>EMA 50</Mono></div>
            <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:10,height:10,borderRadius:2,background:"#6ea8fe",display:"inline-block"}}/><Mono size={9.5} color="rgba(255,255,255,0.6)" spacing={0}>EMA 200</Mono></div>
          </div>
        )}
      </div>

      <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.65,marginBottom:20,maxWidth:800}}>
        {mode === "definition" ? w.c1Text : mode === "regime" ? w.c2Text : w.c3Text}
      </p>

      <div style={{background:C.redPale,border:"1px solid rgba(192,57,43,.25)",borderRadius:6,padding:"18px 22px"}}>
        <div style={{fontWeight:600,fontSize:12.5,color:"#7a2418",marginBottom:10}}>{w.notTitle}</div>
        {w.notList.map((t,i) => <p key={i} style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6,marginBottom:6}}>· {t}</p>)}
      </div>
    </div>
  );
}

// ─── Предикт недели ─────────────────────────────────────────────────────────
function PredictTf({ vars }) {
  const { useState } = React;
  const T8 = window.Ch8Content[INITIAL_LANG] || window.Ch8Content.ru;
  const p = T8.predict;
  const [picked, setPicked] = useState(null);
  // options are ["H1","H4","D1"] in that fixed order (content file) -- map
  // the picked index to the real per-timeframe rank so the reveal actually
  // depends on the choice, not just on whether *a* choice was made.
  const TF_BY_INDEX = ["H1", "H4", "D1"];
  const pickedTf = picked !== null ? TF_BY_INDEX[picked] : null;
  const pickedRank = pickedTf && vars ? vars["tf_rank_" + pickedTf.toLowerCase()] : null;
  const correct = pickedTf && vars && pickedTf === vars.tf_worst;
  return (
    <div style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px",marginTop:8,marginBottom:24}}>
      <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{p.tag}</Mono>
      <p style={{fontSize:14.5,color:C.black,lineHeight:1.65,marginBottom:14}}>{p.question}</p>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        {p.options.map((o,i) => (
          <button key={i} onClick={()=>setPicked(i)} style={{fontFamily:"monospace",fontSize:12,padding:"9px 20px",cursor:"pointer",background:picked===i?C.gold:"#fff",color:picked===i?"#18181a":C.inkMid,border:`1px solid ${picked===i?C.gold:C.border}`,borderRadius:4}}>{o}</button>
        ))}
      </div>
      {picked !== null && vars && (
        <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.7,marginBottom:10,background:C.goldPale,padding:"12px 16px",borderRadius:4}}>
          {fillTemplate(correct ? p.afterPickCorrect : p.afterPickWrong, {
            ...vars, picked_tf: pickedTf, picked_rank: pickedRank, worst_tf: vars.tf_worst, worst_rank: vars["tf_rank_" + String(vars.tf_worst).toLowerCase()],
          })}
        </p>
      )}
      <p style={{fontSize:11,color:C.inkFaint}}>{p.xpNote}</p>
    </div>
  );
}
