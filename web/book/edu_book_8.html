// ─── Interactive 1: Asset Rotation Drag & Drop ───────────────────────────────
function AssetRotation() {
  const { useState } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  const phases = [
    { id:"recovery", label:S.rotPhRecoveryLabel, sub:S.rotPhRecoverySub, color:"#2563eb", bg:"rgba(37,99,235,0.08)", icon:"🌱",
      correct:["tech","crypto","smallcap"], hint:S.rotPhRecoveryHint },
    { id:"expansion", label:S.rotPhExpansionLabel, sub:S.rotPhExpansionSub, color:"#d97706", bg:"rgba(217,119,6,0.08)", icon:"🔥",
      correct:["oil","commodities","realestate"], hint:S.rotPhExpansionHint },
    { id:"slowdown", label:S.rotPhSlowdownLabel, sub:S.rotPhSlowdownSub, color:"#7c3aed", bg:"rgba(124,58,237,0.08)", icon:"🍂",
      correct:["bonds","utilities","healthcare"], hint:S.rotPhSlowdownHint },
    { id:"recession", label:S.rotPhRecessionLabel, sub:S.rotPhRecessionSub, color:"#c0392b", bg:"rgba(192,57,43,0.08)", icon:"❄️",
      correct:["gold","cash","bonds"], hint:S.rotPhRecessionHint },
  ];

  const allAssets = [
    { id:"tech",       label:S.rotAssetTech,        emoji:"💻", phase:"recovery"  },
    { id:"crypto",     label:S.rotAssetCrypto,      emoji:"₿",  phase:"recovery"  },
    { id:"smallcap",   label:S.rotAssetSmallcap,    emoji:"🚀", phase:"recovery"  },
    { id:"oil",        label:S.rotAssetOil,         emoji:"🛢️", phase:"expansion" },
    { id:"commodities",label:S.rotAssetCommodities, emoji:"⚙️", phase:"expansion" },
    { id:"realestate", label:S.rotAssetRealestate,  emoji:"🏠", phase:"expansion" },
    { id:"bonds",      label:S.rotAssetBonds,       emoji:"🏛️", phase:"slowdown"  },
    { id:"utilities",  label:S.rotAssetUtilities,   emoji:"💡", phase:"slowdown"  },
    { id:"healthcare", label:S.rotAssetHealthcare,  emoji:"🏥", phase:"slowdown"  },
    { id:"gold",       label:S.rotAssetGold,        emoji:"🥇", phase:"recession" },
    { id:"cash",       label:S.rotAssetCash,        emoji:"💵", phase:"recession" },
  ];

  const [placed, setPlaced] = useState({}); // assetId -> phaseId
  const [dragging, setDragging] = useState(null);
  const [checked, setChecked] = useState(false);
  const [score, setScore] = useState(0);
  const [dragOver, setDragOver] = useState(null);

  const unplaced = allAssets.filter(a => !placed[a.id]);

  const handleDrop = (phaseId) => {
    if (!dragging) return;
    setPlaced(prev => ({...prev, [dragging]: phaseId}));
    setDragging(null);
    setDragOver(null);
    setChecked(false);
  };

  const removeFromPhase = (assetId) => {
    if (checked) return;
    setPlaced(prev => { const n={...prev}; delete n[assetId]; return n; });
    setChecked(false);
  };

  const checkAnswers = () => {
    let s = 0;
    Object.entries(placed).forEach(([assetId, phaseId]) => {
      const asset = allAssets.find(a=>a.id===assetId);
      if (asset && asset.phase === phaseId) s++;
    });
    setScore(s);
    setChecked(true);
  };

  const reset = () => { setPlaced({}); setChecked(false); setScore(0); };

  const totalPlaced = Object.keys(placed).length;
  const pct = checked ? Math.round(score/allAssets.length*100) : null;

  return (
    <div style={{background:C.black,borderRadius:8,padding:"36px 40px",color:C.white}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:28,flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:28}}>🔁</span>
          <div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.gold}}>{S.rotTitle}</div>
            <Mono size={11} color="rgba(255,255,255,0.4)" spacing={2}>{S.rotBadge}</Mono>
          </div>
        </div>
        <div style={{display:"flex",gap:10}}>
          {checked && <button onClick={reset} style={{padding:"9px 18px",background:"transparent",border:"1px solid rgba(255,255,255,0.2)",color:"rgba(255,255,255,0.6)",cursor:"pointer",fontFamily:"monospace",fontSize:12,borderRadius:3}}>{S.rotReset}</button>}
          <button
            onClick={checked ? reset : checkAnswers}
            disabled={totalPlaced < 3}
            style={{padding:"10px 20px",background:totalPlaced<3?"rgba(255,255,255,0.08)":checked?C.gold:C.greenD,color:totalPlaced<3?"rgba(255,255,255,0.3)":C.black,border:"none",cursor:totalPlaced<3?"not-allowed":"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:1,fontWeight:700,borderRadius:3}}>
            {checked?S.rotRetry:S.rotCheck}
          </button>
        </div>
      </div>

      {/* Score */}
      {checked && (
        <div style={{background:pct>=70?"rgba(45,122,79,0.2)":pct>=40?"rgba(201,151,58,0.2)":"rgba(192,57,43,0.2)",border:`1px solid ${pct>=70?C.greenD:pct>=40?C.gold:C.redD}`,borderRadius:4,padding:"14px 20px",marginBottom:24,display:"flex",gap:14,alignItems:"center"}}>
          <span style={{fontSize:28}}>{pct>=70?"🏆":pct>=40?"📚":"🎯"}</span>
          <div>
            <div style={{fontWeight:700,fontSize:16,color:pct>=70?"#2ecc71":pct>=40?C.gold:"#e74c3c"}}>{pct}% — {S.rotScoreLine.replace("{s}",score).replace("{t}",allAssets.length)}</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginTop:3}}>{S.rotScoreNote}</div>
          </div>
        </div>
      )}

      {/* Unplaced assets pool */}
      <div style={{marginBottom:20}}>
        <Mono size={10} color="rgba(255,255,255,0.3)" spacing={1} style={{display:"block",marginBottom:10}}>{S.rotPoolLabel}</Mono>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,minHeight:46,padding:"10px",background:"rgba(255,255,255,0.04)",borderRadius:4,border:"1px solid rgba(255,255,255,0.08)"}}>
          {unplaced.length === 0
            ? <span style={{fontSize:12,color:"rgba(255,255,255,0.2)",alignSelf:"center"}}>{S.rotAllPlaced}</span>
            : unplaced.map(a => (
              <div key={a.id}
                draggable
                onDragStart={()=>setDragging(a.id)}
                onDragEnd={()=>setDragging(null)}
                style={{padding:"6px 12px",background:"rgba(255,255,255,0.09)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:3,cursor:"grab",fontSize:12,display:"flex",gap:6,alignItems:"center",userSelect:"none",opacity:dragging===a.id?0.4:1,transition:"opacity .15s"}}>
                <span>{a.emoji}</span><span style={{color:"rgba(255,255,255,0.8)"}}>{a.label}</span>
              </div>
            ))
          }
        </div>
      </div>

      {/* Phase drop zones */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}} className="g2">
        {phases.map(ph => {
          const phAssets = allAssets.filter(a=>placed[a.id]===ph.id);
          const isOver = dragOver===ph.id;
          return (
            <div key={ph.id}

                )}
                {phAssets.map(a => {
                  const correct = a.phase===ph.id;
                  const borderCol = checked ? (correct?"#2ecc71":"#e74c3c") : "rgba(255,255,255,0.2)";
                  const bgCol = checked ? (correct?"rgba(46,204,113,0.15)":"rgba(231,76,60,0.15)") : "rgba(255,255,255,0.07)";
                  return (
                    <div key={a.id}
                      onClick={()=>removeFromPhase(a.id)}
                      style={{padding:"5px 10px",background:bgCol,border:`1px solid ${borderCol}`,borderRadius:3,fontSize:11,cursor:checked?"default":"pointer",display:"flex",gap:5,alignItems:"center",transition:"all .2s"}}>
                      <span>{a.emoji}</span>
                      <span style={{color:"rgba(255,255,255,0.8)"}}>{a.label}</span>
                      {checked && <span style={{color:correct?"#2ecc71":"#e74c3c",fontSize:13}}>{correct?"✓":"✗"}</span>}
                    </div>
                  );
                })}
              </div>
              {checked && (
                <div style={{marginTop:8,fontSize:11,color:"rgba(255,255,255,0.4)",lineHeight:1.5,borderTop:"1px solid rgba(255,255,255,0.06)",paddingTop:8}}>
                  <img class='mi-icon' style='vertical-align:middle' src='/assets/icons/icon-idea.png' alt='' width='20' height='20' /> {ph.hint}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <p style={{fontSize:11,color:"rgba(255,255,255,0.2)",marginTop:14,textAlign:"center"}}>{S.rotFooterHint}</p>
    </div>
  );
}

// ─── Interactive 2: EMA Configurator ─────────────────────────────────────────
function EMAConfigurator() {
  const { useState, useMemo } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  const W = 720, H = 280;
  const PAD = {l:44,r:16,t:16,b:28};
  const CW = W - PAD.l - PAD.r;
  const CH = H - PAD.t - PAD.b;

  // Fixed price series (120 bars, realistic uptrend with noise)
  const prices = useMemo(() => {
    const seed = [
      100,102,99,104,101,107,105,110,108,106,112,115,111,109,116,
      114,118,120,117,122,119,125,123,128,126,130,127,132,135,131,
      129,134,138,136,140,137,143,141,145,148,144,142,147,150,146,
      152,155,151,149,154,158,156,160,157,162,159,165,163,168,164,
      161,166,170,167,172,169,174,171,176,173,178,175,180,177,183,
      179,182,185,181,186,184,188,185,190,187,193,189,192,195,191,
      194,198,196,200,197,203,199,202,205,201,206,203,208,204,207,
      210,206,211,208,213,209,215,211,217,213,219,214,221,216,218
    ];
    return seed;
  }, []);

  const [ema1Period, setEma1Period] = useState(20);
  const [ema2Period, setEma2Period] = useState(50);
  const [showEma2, setShowEma2] = useState(true);
  const [showGoldenCross, setShowGoldenCross] = useState(true);

  const calcEMA = (data, period) => {
    const k = 2 / (period + 1);
    const result = new Array(data.length).fill(null);
    let sum = 0;
    for (let i = 0; i < Math.min(period, data.length); i++) sum += data[i];
    result[period - 1] = sum / period;
    for (let i = period; i < data.length; i++) {
      result[i] = data[i] * k + result[i-1] * (1 - k);
    }
    return result;
  };

  const ema1 = useMemo(() => calcEMA(prices, ema1Period), [prices, ema1Period]);
  const ema2 = useMemo(() => calcEMA(prices, ema2Period), [prices, ema2Period]);

  const allVals = [...prices, ...ema1.filter(Boolean), ...ema2.filter(Boolean)];
  const vMin = Math.min(...allVals) * 0.99;
  const vMax = Math.max(...allVals) * 1.01;

  const toX = i => PAD.l + (i / (prices.length - 1)) * CW;
  const toY = v => PAD.t + CH - ((v - vMin) / (vMax - vMin)) * CH;

  // Price path
  const pricePath = prices.map((p,i) => `${i===0?'M':'L'}${toX(i)},${toY(p)}`).join(' ');

  // EMA paths
  const emaPath = (arr) => {
    let d = '';
    arr.forEach((v,i) => { if(v!==null) d += `${d===''||arr[i-1]===null?'M':'L'}${toX(i)},${toY(v)}`; });
    return d;
  };

  // Golden cross / death cross detection
  const crosses = useMemo(() => {
    const result = [];
    if (!showEma2 || !showGoldenCross) return result;
    for (let i = 1; i < prices.length; i++) {
      if (ema1[i]===null||ema2[i]===null||ema1[i-1]===null||ema2[i-1]===null) continue;
      const wasBelowNowAbove = ema1[i-1] <= ema2[i-1] && ema1[i] > ema2[i];
      const wasAboveNowBelow = ema1[i-1] >= ema2[i-1] && ema1[i] < ema2[i];
      if (wasBelowNowAbove) result.push({i, type:'golden'});
      if (wasAboveNowBelow) result.push({i, type:'death'});
    }
    return result;
  }, [ema1, ema2, showEma2, showGoldenCross]);

  // Lag metric: distance between last price and last EMA1
  const lastEma1 = ema1[ema1.length-1];
  const lastPrice = prices[prices.length-1];
  const lagPct = lastEma1 ? Math.abs((lastPrice - lastEma1) / lastPrice * 100).toFixed(1) : '-';

  // Noise filter score: how many price bars stay above/below EMA consistently
  const noiseScore = useMemo(() => {
    let crosses_count = 0;
    for (let i = 1; i < prices.length; i++) {
      if (ema1[i]===null||ema1[i-1]===null) continue;
      const prev = prices[i-1] > ema1[i-1];
      const curr = prices[i] > ema1[i];
      if (prev !== curr) crosses_count++;
    }
    return crosses_count;
  }, [ema1]);

  const noiseRating = noiseScore < 8 ? {label:S.emaNoiseSlow, color:C.orange}
    : noiseScore < 18 ? {label:S.emaNoiseOptimal, color:C.greenD}
    : {label:S.emaNoiseNoisy, color:C.red};

  // Grid prices
  const gridPrices = [110,130,150,170,190,210].filter(p => p > vMin && p < vMax);

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"36px 40px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
        <span style={{fontSize:28}}>🎛️</span>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black}}>{S.emaTitle}</div>
          <Mono size={11} color={C.inkSoft} spacing={2}>{S.emaBadge}</Mono>
        </div>
      </div>

      {/* Controls */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:28,marginBottom:20}} className="g2">
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <span style={{fontSize:13,color:C.inkMid,fontWeight:500}}>
              <span style={{color:"#f59e0b",marginRight:6}}>━</span>EMA {ema1Period}
            </span>
            <div style={{display:"flex",gap:12,alignItems:"center"}}>
              <span style={{fontSize:12,color:noiseRating.color,fontWeight:600}}>{noiseRating.label}</span>
              <span style={{fontFamily:"monospace",fontSize:13,fontWeight:700,color:"#f59e0b"}}>EMA {ema1Period}</span>
            </div>
          </div>
          <input type="range" min="5" max="100" value={ema1Period}
            onChange={e=>setEma1Period(+e.target.value)}
            style={{width:"100%",accentColor:"#f59e0b",cursor:"pointer"}}/>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.inkFaint,marginTop:4}}>
            <span>{S.emaSliderFastNote}</span><span>{S.emaSliderSlowNote}</span>
          </div>
        </div>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <label style={{fontSize:13,color:C.inkMid,fontWeight:500,display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
              <input type="checkbox" checked={showEma2} onChange={e=>setShowEma2(e.target.checked)} style={{accentColor:"#7c3aed"}}/>
              <span style={{color:"#7c3aed",marginRight:4}}>━</span>EMA {ema2Period}
            </label>
            <span style={{fontFamily:"monospace",fontSize:13,fontWeight:700,color:"#7c3aed"}}>EMA {ema2Period}</span>
          </div>
          <input type="range" min="10" max="200" value={ema2Period}
            onChange={e=>setEma2Period(+e.target.value)}
            disabled={!showEma2}
            style={{width:"100%",accentColor:"#7c3aed",cursor:showEma2?"pointer":"not-allowed",opacity:showEma2?1:0.4}}/>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.inkFaint,marginTop:4}}>
            <span>10</span><span>{S.emaSlider2LongNote}</span>
          </div>
        </div>
      </div>

      <div style={{display:"flex",gap:16,marginBottom:16,flexWrap:"wrap"}}>
        <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:13,color:C.inkMid}}>
          <input type="checkbox" checked={showGoldenCross} onChange={e=>setShowGoldenCross(e.target.checked)} style={{accentColor:C.gold}}/>
          {S.emaShowCrossLabel}
        </label>
        {crosses.map((c,i) => (
          <span key={i} style={{fontSize:12,padding:"3px 10px",background:c.type==='golden'?'rgba(45,122,79,0.1)':'rgba(192,57,43,0.1)',border:`1px solid ${c.type==='golden'?C.greenD:C.redD}`,borderRadius:3,color:c.type==='golden'?C.greenD:C.redD,fontFamily:"monospace"}}>
            {c.type==='golden'?"⭐ Golden Cross":'💀 Death Cross'} @ bar {c.i}
          </span>
        ))}
      </div>

      {/* SVG Chart */}
      <div style={{borderRadius:4,overflow:"hidden",border:`1px solid ${C.border}`,marginBottom:20}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block",background:"#131722"}}>
          {/* Grid */}
          {gridPrices.map(p => (
            <g key={p}>
              <line x1={PAD.l} y1={toY(p)} x2={W-PAD.r} y2={toY(p)} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>
              <text x={PAD.l-4} y={toY(p)+4} fontSize="9" fill="rgba(255,255,255,0.25)" textAnchor="end" fontFamily="monospace">{p}</text>
            </g>
          ))}

          {/* Area under price */}
          <defs>
            <linearGradient id="priceArea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#c9973a" stopOpacity="0.15"/>
              <stop offset="100%" stopColor="#c9973a" stopOpacity="0.01"/>
            </linearGradient>
          </defs>
          <path d={`${pricePath} L${toX(prices.length-1)},${H} L${toX(0)},${H} Z`} fill="url(#priceArea)"/>

          {/* Price line */}
          <path d={pricePath} fill="none" stroke={C.gold} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>

          {/* EMA 2 (slower, below) */}
          {showEma2 && <path d={emaPath(ema2)} fill="none" stroke="#7c3aed" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" opacity="0.8"/>}

          {/* EMA 1 (faster) */}
          <path d={emaPath(ema1)} fill="none" stroke="#f59e0b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>

          {/* Cross markers */}
          {crosses.map((c,idx) => (
            <g key={idx}>
              <line x1={toX(c.i)} y1={PAD.t} x2={toX(c.i)} y2={H-PAD.b}
                stroke={c.type==='golden'?"#2ecc71":"#e74c3c"} strokeWidth="1" strokeDasharray="4 3" opacity="0.6"/>
              <rect x={toX(c.i)-18} y={PAD.t+2} width={36} height={14} fill={c.type==='golden'?"#2d7a4f":"#c0392b"} rx="2" opacity="0.85"/>
              <text x={toX(c.i)} y={PAD.t+12} fontSize="8" fill="#fff" textAnchor="middle" fontFamily="monospace">
                {c.type==='golden'?"⭐ GC":"💀 DC"}
              </text>
            </g>
          ))}

          {/* Legend */}
          <rect x={PAD.l} y={PAD.t+2} width={200} height={showEma2?46:32} fill="rgba(0,0,0,0.5)" rx="3"/>
          <line x1={PAD.l+8} y1={PAD.t+12} x2={PAD.l+22} y2={PAD.t+12} stroke={C.gold} strokeWidth="1.5"/>
          <text x={PAD.l+26} y={PAD.t+16} fontSize="10" fill="rgba(255,255,255,0.7)" fontFamily="monospace">{S.emaLegendPrice}</text>
          <line x1={PAD.l+8} y1={PAD.t+24} x2={PAD.l+22} y2={PAD.t+24} stroke="#f59e0b" strokeWidth="2"/>
          <text x={PAD.l+26} y={PAD.t+28} fontSize="10" fill="rgba(255,255,255,0.7)" fontFamily="monospace">EMA {ema1Period}</text>
          {showEma2 && <>
            <line x1={PAD.l+8} y1={PAD.t+36} x2={PAD.l+22} y2={PAD.t+36} stroke="#7c3aed" strokeWidth="2"/>
            <text x={PAD.l+26} y={PAD.t+40} fontSize="10" fill="rgba(255,255,255,0.7)" fontFamily="monospace">EMA {ema2Period}</text>
          </>}
        </svg>
      </div>

      {/* Metrics */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}} className="g4">
        {[
          {label:S.emaMetricFast,  val:`EMA ${ema1Period}`, color:"#f59e0b"},
          {label:S.emaMetricSlow,val:showEma2?`EMA ${ema2Period}`:S.emaMetricOff, color:"#7c3aed"},
          {label:S.emaMetricLag,   val:`${lagPct}%`, color:+lagPct>3?C.orange:C.greenD},
          {label:S.emaMetricCrosses,val:`${noiseScore} ${S.emaTimesSuffix}`, color:noiseRating.color},
        ].map((m,i) => (
          <div key={i} style={{background:C.surfaceMid,borderRadius:4,padding:"12px 14px",textAlign:"center"}}>
            <div style={{fontSize:10,color:C.inkSoft,marginBottom:4,letterSpacing:0.5}}>{m.label}</div>
            <div style={{fontSize:16,fontWeight:700,color:m.color,fontFamily:"monospace"}}>{m.val}</div>
          </div>
        ))}
      </div>

      <div style={{marginTop:16,padding:"14px 18px",background:"rgba(201,151,58,0.06)",border:`1px solid ${C.borderGold}`,borderRadius:4}}>
        <div style={{fontSize:12,color:C.inkMid,lineHeight:1.75}}>
          <strong style={{color:C.gold}}>{S.emaHintLabel}</strong>{" "}
          {noiseScore >= 18
            ? S.emaHintNoisy.replace("{p}",ema1Period).replace("{n}",noiseScore)
            : noiseScore < 8
            ? S.emaHintSlow.replace("{p}",ema1Period)
            : S.emaHintBalanced.replace("{p}",ema1Period).replace("{p2}",ema2Period)
          }
        </div>
      </div>
    </div>
  );
}

                return (
                  <g key={i}>
                    <path d={`M${x4},${y4} L${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2} L${x3},${y3} A${r2},${r2} 0 0,0 ${x4},${y4} Z`}
                      fill={s.color} opacity="0.2"/>
                    <path d={`M${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2}`}
                      fill="none" stroke={s.color} strokeWidth="3" opacity="0.8"/>
                    <text x={s.cx} y={s.cy-6} fontSize="18" textAnchor="middle">{s.icon}</text>
                    <text x={s.cx} y={s.cy+10} fontSize="9" fill={s.color} textAnchor="middle" fontFamily="monospace" fontWeight="bold">{s.label}</text>
                  </g>
                );
              })}

              {/* Center text */}
              <circle cx="260" cy="150" r="55" fill="rgba(201,151,58,0.1)" stroke="rgba(201,151,58,0.3)" strokeWidth="1"/>
              <text x="260" y="145" fontSize="12" fill={C.gold} textAnchor="middle" fontFamily="serif">7–11</text>
              <text x="260" y="160" fontSize="10" fill="rgba(255,255,255,0.4)" textAnchor="middle" fontFamily="monospace">{S.cycClockCenterSub}</text>

              {/* Arrow (clockwise) */}
              <path d="M 350 100 A 110 110 0 0 1 370 150" fill="none" stroke={C.gold} strokeWidth="1.5" markerEnd="url(#arr)"/>
              <defs>
                <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                  <path d="M0,0 L6,3 L0,6 Z" fill={C.gold}/>
                </marker>
              </defs>
            </svg>
          </div>
        </div>

        {/* Phases detail grid */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:56}} className="g2">
          {cyclePhasesDetail.map((ph,i) => (
            <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"24px",borderTop:`3px solid ${ph.color}`}}>
              <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:14}}>
                <span style={{fontSize:22}}>{ph.icon}</span>
                <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18,color:C.black}}>{ph.phase}</div>
              </div>
              {[
                {k:S.cycRowGdp,k2:ph.gdp},{k:S.cycRowInflation,k2:ph.inflation},{k:S.cycRowRates,k2:ph.rates},
                {k:S.cycRowBest,k2:ph.best,bold:true,color:C.greenD},
                {k:S.cycRowWorst,k2:ph.worst,color:C.redD},
              ].map((row,j) => (
                <div key={j} style={{display:"flex",gap:8,marginBottom:7,fontSize:13}}>
                  <span style={{color:C.inkSoft,minWidth:110,flexShrink:0}}>{row.k}:</span>
                  <span style={{color:row.color||C.inkMid,fontWeight:row.bold?600:400,lineHeight:1.4}}>{row.k2}</span>
                </div>
              ))}
              <div style={{marginTop:12,fontSize:12,color:C.inkSoft,lineHeight:1.65,padding:"10px 12px",background:C.surfaceMid,borderRadius:3}}>
                <img class='mi-icon' style='vertical-align:middle' src='/assets/icons/icon-idea.png' alt='' width='20' height='20' /> {ph.why}
              </div>
            </div>
          ))}
        </div>

        {/* ── INTERACTIVE 1: Asset Rotation ── */}
        <div style={{marginBottom:64}}>
          <AssetRotation/>
        </div>

        <Rule/>

        {/* ── BLOCK 2: EMA theory ── */}
        <SectionTitle sub={S.emaSectionSub}>
          {S.emaSectionTitle}
        </SectionTitle>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24,marginBottom:48}} className="g2">
          <div>
            <p style={{fontSize:15,color:C.inkMid,lineHeight:1.75,marginBottom:20}}>
              {S.emaTheoryPara}
            </p>
            <div style={{background:C.black,borderRadius:6,padding:"20px 24px",marginBottom:16}}>
              <Mono size={10} color={C.gold} spacing={2} style={{display:"block",marginBottom:10}}>{S.emaFormulaLabel}</Mono>
              <div style={{fontFamily:"monospace",fontSize:13,color:"rgba(255,255,255,0.8)",lineHeight:2}}>
                <span style={{color:"#f59e0b"}}>k</span> = 2 ÷ ({S.emaFormulaPeriod} + 1)<br/>
                <span style={{color:"#f59e0b"}}>EMA</span> = {S.emaFormulaPrice} × k + {S.emaFormulaPrev} × (1 − k)
              </div>
              <div style={{marginTop:10,fontSize:12,color:"rgba(255,255,255,0.4)"}}>
                {S.emaFormulaNote}
              </div>
            </div>
            <InfoCard icon="📏" title={S.emaInfoCardTitle}
              text={S.emaInfoCardText}
              accent={C.gold}/>
          </div>
          <div>
            <div style={{fontWeight:600,fontSize:14,color:C.black,marginBottom:14}}>{S.emaPeriodsHeading}</div>
            {emaTypes.map((e,i) => (
              <div key={i} style={{display:"flex",gap:12,alignItems:"flex-start",padding:"12px 14px",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
                <span style={{fontFamily:"monospace",fontWeight:700,color:e.color,minWidth:68,flexShrink:0}}>{e.period}</span>
                <div>
                  <div style={{fontWeight:500,color:C.black,marginBottom:3}}>{e.use}</div>
                  <div style={{fontSize:11,color:C.inkSoft}}>{S.emaRowNoiseLabel}: {e.noise} · {S.emaRowLagLabel}: {e.lag}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Golden Cross explanation */}
        <div style={{background:C.black,borderRadius:6,padding:"28px 32px",marginBottom:56}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:32,alignItems:"start"}} className="g2">
            <div>
              <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:16}}>{S.gcSectionLabel}</Mono>
              <div style={{marginBottom:20}}>
                <div style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:16,padding:"14px",background:"rgba(45,122,79,0.12)",borderRadius:4,border:"1px solid rgba(45,122,79,0.3)"}}>
                  <span style={{fontSize:22}}><img class='mi-icon' style='vertical-align:middle' src='/assets/icons/icon-star.png' alt='' width='20' height='20' /></span>
                  <div>
                    <div style={{fontWeight:700,fontSize:14,color:"#2ecc71",marginBottom:5}}>{S.gcGoldenTitle}</div>
                    <div style={{fontSize:13,color:"rgba(255,255,255,0.6)",lineHeight:1.6}}>
                      {S.gcGoldenPre} <strong style={{color:"#2ecc71"}}>{S.gcGoldenBold}</strong>.
                      {S.gcGoldenPost}
                    </div>
                    <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:6}}>{S.gcGoldenExample}</div>
                  </div>
                </div>
                <div style={{display:"flex",gap:12,alignItems:"flex-start",padding:"14px",background:"rgba(192,57,43,0.12)",borderRadius:4,border:"1px solid rgba(192,57,43,0.3)"}}>
                  <span style={{fontSize:22}}>💀</span>
                  <div>
                    <div style={{fontWeight:700,fontSize:14,color:"#e74c3c",marginBottom:5}}>{S.gcDeathTitle}</div>
                    <div style={{fontSize:13,color:"rgba(255,255,255,0.6)",lineHeight:1.6}}>
                      {S.gcDeathPre} <strong style={{color:"#e74c3c"}}>{S.gcDeathBold}</strong>.
                      {S.gcDeathPost}
                    </div>
                    <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:6}}>{S.gcDeathExample}</div>
                  </div>
                </div>
              </div>
            </div>
            <div>
              <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:16}}>{S.gcRulesLabel}</Mono>
              {[
                {n:"01", rule:S.gcRule1, color:"#2ecc71"},
                {n:"02", rule:S.gcRule2, color:"#e74c3c"},
                {n:"03", rule:S.gcRule3, color:"#f59e0b"},
                {n:"04", rule:S.gcRule4, color:"#2ecc71"},
                {n:"05", rule:S.gcRule5, color:"rgba(255,255,255,0.5)"},
              ].map((r,i) => (
                <div key={i} style={{display:"flex",gap:12,alignItems:"flex-start",padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                  <Mono size={11} color={C.gold} spacing={0} style={{flexShrink:0,marginTop:2}}>{r.n}</Mono>
                  <span style={{fontSize:13,color:r.color,lineHeight:1.6}}>{r.rule}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* ── INTERACTIVE 2: EMA Configurator ── */}
        <div style={{marginBottom:64}}>
          <EMAConfigurator/>
        </div>

        <Rule/>

        {/* ── CONCLUSIONS ── */}
        <div style={{background:C.black,borderRadius:8,padding:"44px 48px"}}>
          <div style={{textAlign:"center",marginBottom:32}}>
            <Mono size={11} color={C.gold} spacing={4} style={{display:"block",marginBottom:12}}>{S.concLabel}</Mono>
            <h3 style={{fontFamily:"'DM Serif Display',serif",fontSize:28,color:C.white,fontWeight:400}}>{S.concHeading}</h3>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            {conclusions.map((c,i) => (
              <div key={i} style={{display:"flex",gap:14,alignItems:"flex-start",padding:"14px 16px",background:"rgba(255,255,255,0.04)",borderRadius:4,border:"1px solid rgba(255,255,255,0.06)"}}>
                <span style={{color:C.gold,fontFamily:"monospace",fontSize:11,marginTop:2,flexShrink:0}}>0{i+1}</span>
                <span style={{fontSize:13,color:"rgba(255,255,255,0.7)",lineHeight:1.65}}>{c}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Footer navigation */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:48,marginTop:48,borderTop:`1px solid ${C.border}`}}>
          <span onClick={()=>setAskOpen(true)} style={{fontSize:14,color:C.inkSoft,fontFamily:"monospace",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}>
            {S.footerAsk}
          </span>
          <button
            onClick={()=>window.location.href=getChUrl(9)}
            style={{background:C.black,color:C.white,border:"none",padding:"18px 35px",cursor:"pointer",fontFamily:"monospace",fontSize:14,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.target.style.background=C.gold}
            onMouseLeave={e=>e.target.style.background=C.black}>
            {S.footerNext}
          </button>
        </div>

      </div>

      {askOpen && <AskAnalystPopup onClose={()=>setAskOpen(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter8/>);
{% endraw %}
</script>
</body>
</html>
