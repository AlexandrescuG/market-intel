  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{max-width:100vw;overflow-x:hidden;scroll-behavior:smooth}
    body{background:#ffffff;font-family:'DM Sans',system-ui,sans-serif;color:#18181a}
    #sbf-book-root{min-height:100vh}
    .back-to-edu{
      position:fixed;bottom:20px;right:20px;z-index:500;
      background:#18181a;color:rgba(255,255,255,0.6);
      font-family:'DM Sans',sans-serif;font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;
      padding:7px 13px;text-decoration:none;transition:all .2s;
      border:1px solid rgba(255,255,255,0.08);
    }
    .back-to-edu:hover{background:#c9973a;color:#fff}
    .messenger-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
    @media(max-width:768px){.messenger-grid{grid-template-columns:1fr}.hide-mobile{display:none!important}.grid-2{grid-template-columns:1fr!important}.grid-3{grid-template-columns:1fr!important}.grid-4{grid-template-columns:1fr 1fr!important}}
  </style>
</head>

// ─── Interactive 1: Portfolio Crash Test ─────────────────────────────────────
function CrashTest() {
  const { useState, useMemo } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  // Исторические данные просадок по кризисам (приблизительные max drawdown %)
  const crisisData = {
    "2008": {
      label: S.crisis2008Label,
      emoji: "🏦",
      desc: S.crisis2008Desc,
      assets: { sp500: -56, bonds: +8, gold: +25, oil: -77, btc: 0, cash: 0 },
      months: 17,
      recovery: { sp500: 49, bonds: 6, gold: 0, oil: 24, btc: 0, cash: 0 }
    },
    "covid": {
      label: S.crisisCovidLabel,
      emoji: "🦠",
      desc: S.crisisCovidDesc,
      assets: { sp500: -34, bonds: +8, gold: +6, oil: -65, btc: -63, cash: 0 },
      months: 2,
      recovery: { sp500: 5, bonds: 2, gold: 0, oil: 12, btc: 3, cash: 0 }
    },
    "dot": {
      label: S.crisisDotLabel,
      emoji: "💻",
      desc: S.crisisDotDesc,
      assets: { sp500: -49, bonds: +20, gold: +15, oil: +10, btc: 0, cash: 0 },
      months: 30,
      recovery: { sp500: 84, bonds: 0, gold: 0, oil: 0, btc: 0, cash: 0 }
    },
  };

  const assetLabels = {
    sp500:  { label:S.assetSp500Label, color:"#2563eb",  emoji:"📈" },
    bonds:  { label:S.assetBondsLabel, color:"#7c3aed", emoji:"🏛️" },
    gold:   { label:S.assetGoldLabel,         color:"#c9973a", emoji:"🥇" },
    oil:    { label:S.assetOilLabel,            color:"#92400e", emoji:"🛢️" },
    btc:    { label:S.assetBtcLabel,       color:"#f59e0b", emoji:"₿" },
    cash:   { label:S.assetCashLabel,        color:"#6b7280", emoji:"💵" },
  };

  const [alloc, setAlloc] = useState({ sp500:60, bonds:20, gold:10, oil:5, btc:0, cash:5 });
  const [selectedCrisis, setSelectedCrisis] = useState("2008");
  const [tested, setTested] = useState(false);
  const [deposit, setDeposit] = useState(10000);

  const total = Object.values(alloc).reduce((a,b) => a+b, 0);

  const setAsset = (key, val) => {
    const newAlloc = { ...alloc, [key]: val };
    setAlloc(newAlloc);
    setTested(false);
  };

  const crisis = crisisData[selectedCrisis];

  const portfolioDrawdown = useMemo(() => {
    if (total === 0) return 0;
    let dd = 0;
    Object.entries(alloc).forEach(([k, pct]) => {
      dd += (pct / 100) * (crisis.assets[k] || 0);
    });
    return +dd.toFixed(1);
  }, [alloc, selectedCrisis, total]);

  const portfolioLoss = Math.round(deposit * Math.abs(portfolioDrawdown) / 100);
  const portfolioAfter = deposit - portfolioLoss;

  // Recovery months estimate
  const recoveryMonths = useMemo(() => {
    let rm = 0;
    Object.entries(alloc).forEach(([k, pct]) => {
      rm += (pct / 100) * (crisis.recovery[k] || 0);
    });
    return Math.round(rm + crisis.months);
  }, [alloc, selectedCrisis]);

  const rating = portfolioDrawdown > -15 ? { label:S.ratingProtected, color:C.green }
    : portfolioDrawdown > -30 ? { label:S.ratingModerate, color:C.orange }
    : { label:S.ratingHigh, color:C.red };

  // Mini chart: portfolio value during crisis
  const chartPoints = useMemo(() => {
    const months = crisis.months + 6;
    return Array.from({ length: months }, (_, i) => {
      if (i < crisis.months) {
        const progress = i / crisis.months;
        return deposit + (portfolioLoss * progress * -1);
      } else {
        const recovery = (i - crisis.months) / 12;
        const recovPct = Math.min(1, recovery * (12 / recoveryMonths));
        return portfolioAfter + portfolioLoss * recovPct;
      }
    });
  }, [deposit, portfolioDrawdown, selectedCrisis]);

  const chartMin = Math.min(...chartPoints) * 0.97;
  const chartMax = deposit * 1.02;
  const W = 560, H = 120;
  const toY = v => H - 10 - ((v - chartMin) / (chartMax - chartMin)) * (H - 20);
  const pts = chartPoints.map((v,i) => `${(i/(chartPoints.length-1))*(W-20)+10},${toY(v)}`).join(" ");

  return (
    <div style={{background:C.black,borderRadius:8,padding:"36px 40px",color:C.white}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
        <span style={{fontSize:28}}>💥</span>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.gold}}>{S.crashTitle}</div>
          <Mono size={11} color="rgba(255,255,255,0.4)" spacing={2}>{S.crashTag}</Mono>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:36,marginBottom:28}} className="grid-2">
        {/* Left: Allocation sliders */}
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}>
            <span style={{fontSize:13,color:"rgba(255,255,255,0.6)"}}>{S.crashCompLabel}</span>
            <span style={{fontSize:12,color:total===100?C.green:C.red,fontFamily:"monospace"}}>{total}% / 100%</span>
          </div>
          {Object.entries(assetLabels).map(([key, a]) => (
            <div key={key} style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                <span style={{fontSize:12,color:"rgba(255,255,255,0.65)"}}>{a.emoji} {a.label}</span>
                <span style={{fontSize:13,fontWeight:600,color:a.color,fontFamily:"monospace"}}>{alloc[key]}%</span>
              </div>
              <input type="range" min="0" max="100" value={alloc[key]}
                onChange={e => setAsset(key, +e.target.value)}
                style={{width:"100%",accentColor:a.color,cursor:"pointer",height:4}}/>
            </div>
          ))}
          <div style={{marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontSize:12,color:"rgba(255,255,255,0.6)"}}>{S.crashDepositLabel}</span>
              <span style={{fontSize:13,fontWeight:600,color:C.gold,fontFamily:"monospace"}}>${deposit.toLocaleString()}</span>
            </div>
            <input type="range" min="1000" max="100000" step="1000" value={deposit}
              onChange={e => setDeposit(+e.target.value)}
              style={{width:"100%",accentColor:C.gold,cursor:"pointer"}}/>
          </div>
        </div>

        {/* Right: Crisis selector + results */}
        <div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.6)",marginBottom:12}}>{S.crashChooseCrisis}</div>
          {Object.entries(crisisData).map(([key, c]) => (
            <button key={key} onClick={() => { setSelectedCrisis(key); setTested(false); }}
              style={{width:"100%",marginBottom:8,padding:"12px 16px",borderRadius:4,cursor:"pointer",textAlign:"left",
                background:selectedCrisis===key?"rgba(201,151,58,0.15)":"rgba(255,255,255,0.04)",
                border:selectedCrisis===key?`1px solid ${C.gold}`:"1px solid rgba(255,255,255,0.08)",
                color:"#fff",fontFamily:"'DM Sans',sans-serif"}}>
              <div style={{fontWeight:600,fontSize:13}}>{c.emoji} {c.label}</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginTop:3}}>{c.desc.substring(0,60)}…</div>
            </button>
          ))}

          <button onClick={() => setTested(true)}
            disabled={total !== 100}
            style={{width:"100%",marginTop:8,padding:"14px",background:total===100?C.gold:"rgba(255,255,255,0.1)",color:total===100?C.black:"rgba(255,255,255,0.3)",border:"none",borderRadius:4,cursor:total===100?"pointer":"not-allowed",fontFamily:"monospace",fontSize:13,letterSpacing:1,fontWeight:700}}>
            {total===100 ? S.crashTestBtn : S.crashAllocateBtn(total)}
          </button>
        </div>
      </div>

      {/* Results */}
      {tested && (
        <div style={{borderTop:"1px solid rgba(255,255,255,0.1)",paddingTop:24}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}} className="grid-4">
            {[
              {label:S.crashMetricDrawdown, val:`${portfolioDrawdown}%`, color:portfolioDrawdown<-20?C.red:portfolioDrawdown<-10?C.orange:C.green},
              {label:S.crashMetricLoss,        val:`-$${portfolioLoss.toLocaleString()}`, color:C.red},
              {label:S.crashMetricRemaining,          val:`$${portfolioAfter.toLocaleString()}`, color:"#fff"},
              {label:S.crashMetricRecovery,    val:S.crashRecoverySuffix(recoveryMonths), color:C.gold},
            ].map((m,i) => (
              <div key={i} style={{background:"rgba(255,255,255,0.05)",borderRadius:4,padding:"14px",textAlign:"center"}}>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginBottom:5,letterSpacing:0.5}}>{m.label}</div>
                <div style={{fontSize:17,fontWeight:700,color:m.color,fontFamily:"monospace"}}>{m.val}</div>
              </div>
            ))}
          </div>

          <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:20,padding:"12px 16px",background:"rgba(255,255,255,0.05)",borderRadius:4}}>
            <span style={{fontSize:20}}>{rating.label.split(" ")[0]}</span>
            <div>
              <div style={{fontWeight:600,fontSize:14,color:rating.color}}>{rating.label}</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginTop:2}}>{crisis.label} · {crisis.desc}</div>
            </div>
          </div>

          {/* Chart */}
          <div style={{background:"rgba(255,255,255,0.04)",borderRadius:4,padding:"12px",overflow:"hidden"}}>
            <Mono size={10} color="rgba(255,255,255,0.3)" spacing={1} style={{display:"block",marginBottom:8}}>{S.crashChartTag}</Mono>
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block"}}>
              <defs>
                <linearGradient id="crashGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#c0392b" stopOpacity="0.3"/>
                  <stop offset="100%" stopColor="#c0392b" stopOpacity="0.02"/>
                </linearGradient>
              </defs>
              <line x1="10" y1={toY(deposit)} x2={W-10} y2={toY(deposit)} stroke="rgba(255,255,255,0.1)" strokeWidth="1" strokeDasharray="4 4"/>
              <text x="12" y={toY(deposit)-4} fontSize="9" fill="rgba(255,255,255,0.3)" fontFamily="monospace">${deposit.toLocaleString()}</text>
              <polygon points={`10,${H} ${pts} ${W-10},${H}`} fill="url(#crashGrad)"/>
              <polyline points={pts} fill="none" stroke="#c0392b" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              <line x1={10+((crisis.months)/(chartPoints.length-1))*(W-20)} y1="0"
                    x2={10+((crisis.months)/(chartPoints.length-1))*(W-20)} y2={H}
                    stroke="rgba(201,151,58,0.4)" strokeWidth="1" strokeDasharray="3 3"/>
              <text x={10+((crisis.months)/(chartPoints.length-1))*(W-20)+4} y="14" fontSize="9" fill="rgba(201,151,58,0.7)" fontFamily="monospace">{S.crashChartBottomLabel}</text>
            </svg>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Interactive 2: Position Size Calculator ─────────────────────────────────
function PositionCalculator() {
  const { useState, useMemo, useRef, useCallback } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  const [deposit, setDeposit] = useState(10000);
  const [riskPct, setRiskPct] = useState(1);
  const [entryPrice, setEntryPrice] = useState(2500);
  const [stopPct, setStopPct] = useState(2);
  const [rrRatio, setRrRatio] = useState(3);
  const [instrument, setInstrument] = useState("gold");

  const instruments = {
    gold:  { label:"XAU/USD (Gold)",  unit:S.instGoldUnit,  lotSize:100,  pipValue:1   },
    eurusd:{ label:"EUR/USD",         unit:S.instEurUsdUnit,  lotSize:100000,pipValue:10  },
    btc:   { label:"Bitcoin",         unit:"BTC",  lotSize:1,    pipValue:1   },
    sp500: { label:"S&P 500 CFD",     unit:S.instSp500Unit, lotSize:1,    pipValue:1   },
  };

  const inst = instruments[instrument];
  const riskAmount = deposit * riskPct / 100;
  const stopDistance = entryPrice * stopPct / 100;
  const stopPrice = entryPrice - stopDistance;
  const tpPrice = entryPrice + stopDistance * rrRatio;
  const positionSize = +(riskAmount / stopDistance).toFixed(4);
  const maxUnits = instrument === "btc" ? positionSize : +positionSize.toFixed(2);
  const potentialProfit = Math.round(riskAmount * rrRatio);
  const positionValue = Math.round(entryPrice * positionSize);

  // RR simulation: winrate needed to break even
  const breakEvenWR = Math.round(100 / (1 + rrRatio));

  // SVG price chart
  const W = 340, H = 220;
  const prices = {
    min: stopPrice * 0.996,
    max: tpPrice * 1.004,
  };
  const toY = p => H - 20 - ((p - prices.min) / (prices.max - prices.min)) * (H - 40);
  const entryY = toY(entryPrice);
  const stopY = toY(stopPrice);
  const tpY = toY(tpPrice);

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"36px 40px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
        <span style={{fontSize:28}}>🧮</span>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black}}>{S.calcTitle}</div>
          <Mono size={11} color={C.inkSoft} spacing={2}>{S.calcTag}</Mono>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:40,alignItems:"start"}} className="grid-2">
        {/* Controls */}
        <div>
          {/* Instrument */}
          <div style={{marginBottom:22}}>
            <div style={{fontSize:12,color:C.inkSoft,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>{S.calcInstrumentLabel}</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {Object.entries(instruments).map(([key, i]) => (
                <button key={key} onClick={() => setInstrument(key)}
                  style={{padding:"7px 14px",border:`1px solid ${instrument===key?C.gold:C.border}`,background:instrument===key?C.goldPale:"transparent",color:instrument===key?C.black:C.inkMid,cursor:"pointer",fontSize:12,borderRadius:3,fontFamily:"'DM Sans',sans-serif"}}>
                  {i.label}
                </button>
              ))}
            </div>
          </div>

          {[
            {label:S.calcDepositLabel, val:`$${deposit.toLocaleString()}`, min:1000, max:100000, step:1000, state:deposit, set:setDeposit, color:C.gold},
            {label:S.calcRiskLabel, val:`${riskPct}%  =  $${Math.round(riskAmount)}`, min:0.5, max:5, step:0.5, state:riskPct, set:setRiskPct, color:C.red},
            {label:S.calcEntryLabel, val:entryPrice, min:100, max:5000, step:10, state:entryPrice, set:setEntryPrice, color:C.inkMid},
            {label:S.calcStopLabel, val:`${stopPct}%  =  ${Math.round(stopDistance)} ${S.calcStopPointsSuffix}`, min:0.5, max:10, step:0.5, state:stopPct, set:setStopPct, color:"#c0392b"},
            {label:S.calcRRLabel, val:`1 : ${rrRatio}`, min:1, max:5, step:0.5, state:rrRatio, set:setRrRatio, color:C.green},
          ].map((s,i) => (
            <div key={i} style={{marginBottom:18}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{fontSize:12,color:C.inkMid,fontWeight:500}}>{s.label}</span>
                <span style={{fontSize:13,fontWeight:700,color:s.color,fontFamily:"monospace"}}>{s.val}</span>
              </div>
              <input type="range" min={s.min} max={s.max} step={s.step} value={s.state}
                onChange={e => s.set(+e.target.value)}
                style={{width:"100%",accentColor:s.color,cursor:"pointer"}}/>
            </div>
          ))}

          {/* Result panel */}
          <div style={{background:C.black,borderRadius:6,padding:"20px 24px",marginTop:8}}>
            <Mono size={10} color={C.gold} spacing={2} style={{display:"block",marginBottom:14}}>{S.calcResultTag}</Mono>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              {[
                {label:S.calcMetricMaxVolume, val:`${maxUnits} ${inst.unit}`, big:true, color:C.gold},
                {label:S.calcMetricPosValue,   val:`~$${positionValue.toLocaleString()}`, color:"#fff"},
                {label:S.calcMetricSLPrice,      val:Math.round(stopPrice), color:"#e74c3c"},
                {label:S.calcMetricTPPrice,      val:Math.round(tpPrice), color:"#2ecc71"},
                {label:S.calcMetricMaxLoss,        val:`-$${Math.round(riskAmount)}`, color:"#e74c3c"},
                {label:S.calcMetricPotentialProfit,val:`+$${potentialProfit}`, color:"#2ecc71"},
              ].map((m,i) => (
                <div key={i} style={{background:"rgba(255,255,255,0.05)",borderRadius:3,padding:"10px 12px"}}>
                  <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginBottom:4}}>{m.label}</div>
                  <div style={{fontSize:m.big?18:15,fontWeight:700,color:m.color,fontFamily:"monospace"}}>{m.val}</div>
                </div>
              ))}
            </div>
            <div style={{marginTop:14,padding:"10px 12px",background:"rgba(201,151,58,0.1)",borderRadius:3,border:`1px solid rgba(201,151,58,0.2)`}}>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.6)",lineHeight:1.7}}>
                {S.calcExplainerLead} <strong style={{color:C.gold}}>1:{rrRatio}</strong> {S.calcExplainerAfterRatio}
                <strong style={{color:C.gold}}> {breakEvenWR+1}%</strong> {S.calcExplainerAfterPct}
                {S.calcExplainerEvenAt} {100-breakEvenWR-1}% {S.calcExplainerLossSuffix}
              </div>
            </div>
          </div>
        </div>

        {/* SVG Trade Chart */}
        <div>
          <Mono size={10} color={C.inkSoft} spacing={1} style={{display:"block",marginBottom:10,textAlign:"center"}}>{S.calcChartTag}</Mono>
          <div style={{background:C.black,borderRadius:6,overflow:"hidden"}}>
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block"}}>
              {/* TP zone */}
              <rect x="0" y={tpY-1} width={W} height={entryY-tpY} fill="rgba(45,122,79,0.12)"/>
              {/* SL zone */}
              <rect x="0" y={entryY} width={W} height={stopY-entryY} fill="rgba(192,57,43,0.12)"/>

              {/* TP line */}
              <line x1="0" y1={tpY} x2={W} y2={tpY} stroke="#2ecc71" strokeWidth="1.5" strokeDasharray="6 3"/>
              <rect x={W-90} y={tpY-12} width={88} height={18} fill="#2d7a4f" opacity="0.9" rx="2"/>
              <text x={W-46} y={tpY+4} fontSize="10" fill="#fff" textAnchor="middle" fontFamily="monospace">TP {Math.round(tpPrice)}</text>

              {/* Entry line */}
              <line x1="0" y1={entryY} x2={W} y2={entryY} stroke={C.gold} strokeWidth="2"/>
              <rect x={W-90} y={entryY-10} width={88} height={18} fill={C.gold} rx="2"/>
              <text x={W-46} y={entryY+4} fontSize="10" fill={C.black} textAnchor="middle" fontFamily="monospace">ENTRY {entryPrice}</text>

              {/* SL line */}
              <line x1="0" y1={stopY} x2={W} y2={stopY} stroke="#e74c3c" strokeWidth="1.5" strokeDasharray="6 3"/>
              <rect x={W-90} y={stopY-6} width={88} height={18} fill="#c0392b" opacity="0.9" rx="2"/>
              <text x={W-46} y={stopY+8} fontSize="10" fill="#fff" textAnchor="middle" fontFamily="monospace">SL {Math.round(stopPrice)}</text>

              {/* RR labels */}
              <text x="12" y={(tpY + entryY)/2 + 4} fontSize="11" fill="#2ecc71" fontFamily="monospace" fontWeight="bold">+{rrRatio}R</text>
              <text x="12" y={(entryY + stopY)/2 + 4} fontSize="11" fill="#e74c3c" fontFamily="monospace" fontWeight="bold">-1R</text>

              {/* Arrow up */}
              <line x1="32" y1={entryY-4} x2="32" y2={tpY+4} stroke="#2ecc71" strokeWidth="1" markerEnd="url(#arrow)"/>
            </svg>
          </div>

          {/* RR math explainer */}
          <div style={{marginTop:16,padding:"16px",background:"rgba(201,151,58,0.06)",border:`1px solid ${C.borderGold}`,borderRadius:4}}>
            <div style={{fontSize:12,color:C.inkMid,lineHeight:1.75}}>
              <strong style={{color:C.gold}}>{S.calcFormulaTitle}</strong><br/>
              <code style={{fontSize:11,background:C.surfaceMid,padding:"2px 6px",borderRadius:2,display:"block",marginTop:4}}>
                {S.calcFormulaLine1}
              </code>
              <code style={{fontSize:11,background:C.surfaceMid,padding:"2px 6px",borderRadius:2,display:"block",marginTop:4}}>
                = (${deposit.toLocaleString()} × {riskPct}%) ÷ {Math.round(stopDistance)} = <strong>{maxUnits}</strong>
              </code>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
