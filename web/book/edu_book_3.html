  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{max-width:100vw;overflow-x:hidden;scroll-behavior:smooth}
    body{background:#ffffff;font-family:'DM Sans',system-ui,sans-serif;color:#18181a}
    #sbf-book-root{min-height:100vh}
    .messenger-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
    @media(max-width:768px){.messenger-grid{grid-template-columns:1fr}.hide-mobile{display:none!important}.grid-2{grid-template-columns:1fr!important}.grid-3{grid-template-columns:1fr!important}.grid-4{grid-template-columns:1fr 1fr!important}}
    .ch3-char-overlay{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px;animation:ch3FadeIn .15s ease-out}
    .ch3-char-dialog{position:relative;background:#fff;border-radius:10px;padding:32px 36px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);outline:none;animation:ch3PopIn .18s ease-out;-webkit-overflow-scrolling:touch}
    .ch3-char-handle{display:none}
    .ch3-char-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border:none;background:transparent;color:#8A8275;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .ch3-char-close:hover{background:rgba(0,0,0,.06)}
    .ch3-char-nav-btn{background:transparent;border:1px solid #e4ddd0;border-radius:4px;padding:8px 14px;font-size:12px;cursor:pointer;color:#18181a;font-family:'DM Sans',sans-serif}
    .ch3-char-nav-btn:hover{border-color:#c9973a}
    @keyframes ch3FadeIn{from{opacity:0}to{opacity:1}}
    @keyframes ch3PopIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
    @media(max-width:768px){
      .ch3-char-overlay{align-items:flex-end;padding:0}
      .ch3-char-dialog{max-width:100%;width:100%;max-height:85vh;border-radius:16px 16px 0 0;padding:28px 22px 26px;animation:ch3SlideUp .22s ease-out}
      .ch3-char-handle{display:block;width:40px;height:4px;background:#d8d2c4;border-radius:2px;margin:0 auto 16px}
      @keyframes ch3SlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    }
  </style>
</head>

// ─── Scene mounting helper (SceneEngine, vanilla JS, ref-callback pattern,
// same convention as chapter 1/2's era renderers) ────────────────────────────
function SceneMount({ url, mode, symbol, copy }) {
  const { useRef, useEffect } = React;
  const ref = useRef(null);
  useEffect(() => {
    let cancelled = false;
    fetch(url).then(r => r.json()).then(data => {
      if (!cancelled && ref.current) window.SceneEngine.mount(ref.current, { mode, data, symbol, copy });
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [url]);
  // SPEC_charts_and_interactivity_standard.md §2: technical acceptance
  // marker for "this is a real chart" -- the scene JSON's own basename
  // (e.g. "ch3_2022_multi"), set on the mount root without touching
  // scene-engine.js itself (locked by the chapter-2 agent).
  const sceneName = (url.split("/").pop() || "").replace(/\.json$/, "");
  return <div ref={ref} data-scene={sceneName}/>;
}

// ─── Arsenal: six characters (tap-to-expand cards) ───────────────────────────
function ArsenalCards() {
  const { useState, useEffect, useRef } = React;
  const T = window.Ch3Content[INITIAL_LANG] || window.Ch3Content.ru;
  const a = T.arsenal;
  const nav = INITIAL_LANG==="ru" ? {prev:"← Пред.", next:"След. →", of:"из", close:"Закрыть"}
    : INITIAL_LANG==="ro" ? {prev:"← Anterior", next:"Următorul →", of:"din", close:"Închide"}
    : {prev:"← Prev", next:"Next →", of:"of", close:"Close"};

  const [openIndex, setOpenIndex] = useState(null);
  const [seen, setSeen] = useState({});
  const [dragY, setDragY] = useState(0);
  const dragRef = useRef(null);
  const dialogRef = useRef(null);
  const triggerRefs = useRef({});
  const lastTriggerKey = useRef(null);

  const isOpen = openIndex !== null;
  const card = isOpen ? a.cards[openIndex] : null;
  const allSeen = a.cards.every(c => seen[c.key]);

  const markSeen = (key) => setSeen(prev => (prev[key] ? prev : { ...prev, [key]: true }));

  const openAt = (idx) => {
    lastTriggerKey.current = a.cards[idx].key;
    setDragY(0);
    setOpenIndex(idx);
    markSeen(a.cards[idx].key);
  };
  const close = () => setOpenIndex(null);
  const step = (dir) => {
    setDragY(0);
    setOpenIndex(i => {
      const next = (i + dir + a.cards.length) % a.cards.length;
      markSeen(a.cards[next].key);
      return next;
    });
  };

  // Фокус в диалог при открытии, обратно на карточку при закрытии.
  useEffect(() => {
    if (isOpen && dialogRef.current) dialogRef.current.focus();
    else if (!isOpen && lastTriggerKey.current && triggerRefs.current[lastTriggerKey.current]) {
      triggerRefs.current[lastTriggerKey.current].focus();
    }
  }, [isOpen]);

  // Esc + стрелки, блокировка скролла страницы без прыжка вёрстки.
  useEffect(() => {
    if (!isOpen) return;
    const onKey = (e) => {
      if (e.key === "Escape") close();
      else if (e.key === "ArrowRight") step(1);
      else if (e.key === "ArrowLeft") step(-1);
    };
    document.addEventListener("keydown", onKey);
    const scrollbarW = window.innerWidth - document.documentElement.clientWidth;
    const prevOverflow = document.body.style.overflow;
    const prevPad = document.body.style.paddingRight;
    document.body.style.overflow = "hidden";
    if (scrollbarW > 0) document.body.style.paddingRight = scrollbarW + "px";
    return () => {
      document.removeEventListener("keydown", onKey);
      document.body.style.overflow = prevOverflow;
      document.body.style.paddingRight = prevPad;
    };
  }, [isOpen, openIndex]);

  // dragRef.current.lastDy -- а не state dragY -- потому что touchend может
  // сработать раньше, чем React перерисует компонент после setDragY() из
  // последнего touchmove: обработчик, читающий dragY из замыкания, увидит
  // устаревшее (нулевое) значение и свайп-закрытие не сработает.
  const onTouchStart = (e) => { dragRef.current = { startY: e.touches[0].clientY, lastDy: 0 }; };
  const onTouchMove = (e) => {
    if (!dragRef.current) return;
    const dy = e.touches[0].clientY - dragRef.current.startY;
    if (dy > 0) { dragRef.current.lastDy = dy; setDragY(dy); }
  };
  const onTouchEnd = () => {
    if (!dragRef.current) return;
    const dy = dragRef.current.lastDy;
    dragRef.current = null;
    if (dy > 90) close(); else setDragY(0);
  };

  return (
    <div style={{marginBottom:48}}>
      <SectionTitle id="secArsenal" sub={a.sub}>{a.title}</SectionTitle>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:16,marginBottom:20}}>
        {a.cards.map((c, idx) => (
          <div key={c.key} ref={el => { triggerRefs.current[c.key] = el; }}
            role="button" tabIndex={0}
            onClick={() => openAt(idx)}
            onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openAt(idx); } }}
            style={{position:"relative",background:C.surface,border:`1px solid ${seen[c.key]?C.borderGold:C.border}`,borderRadius:6,padding:"18px 20px",cursor:"pointer",transition:"border-color .15s"}}>
            {seen[c.key] && <span aria-hidden="true" style={{position:"absolute",top:10,right:12}}><Icon name="check" size={14} color={C.gold}/></span>}
            <div style={{display:"flex",alignItems:"center",gap:10,fontFamily:"'DM Serif Display',serif",fontSize:18,color:C.black}}>
              <Icon name={c.icon} size={24} color={C.gold}/><span>{c.title}</span>
            </div>
          </div>
        ))}
      </div>
      <p style={{
        fontSize:13.5,fontStyle:"italic",maxWidth:760,borderRadius:6,transition:"all .2s",
        color: allSeen ? C.black : C.inkSoft,
        fontWeight: allSeen ? 600 : 400,
        background: allSeen ? C.goldPale : "transparent",
        border: allSeen ? `1px solid ${C.borderGold}` : "1px solid transparent",
        padding: allSeen ? "10px 14px" : 0,
      }}>{a.afterNote}</p>

      {isOpen && (
        <div className="ch3-char-overlay" onClick={close}>
          <div ref={dialogRef} className="ch3-char-dialog" role="dialog" aria-modal="true" aria-label={card.title} tabIndex={-1}
            onClick={e => e.stopPropagation()}
            onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
            style={dragY ? {transform:`translateY(${dragY}px)`,transition:"none"} : undefined}>
            <div className="ch3-char-handle" aria-hidden="true"/>
            <button onClick={close} aria-label={nav.close} className="ch3-char-close"><Icon name="close" size={16}/></button>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18}}>
              <Icon name={card.icon} size={32} color={C.gold}/>
              <div style={{fontFamily:"'DM Serif Display',serif",fontSize:24,color:C.black}}>{card.title}</div>
            </div>
            <div style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7}}>
              <p style={{marginBottom:12}}><strong style={{color:C.black}}>{a.labels.character}:</strong> {card.character}</p>
              <p style={{marginBottom:12}}><strong style={{color:C.black}}>{a.labels.managedBy}:</strong> {card.managedBy}</p>
              <p style={{marginBottom:12}}><strong style={{color:C.green}}>{a.labels.protects}:</strong> {card.protects}</p>
              <p style={{marginBottom:0}}><strong style={{color:C.red}}>{a.labels.betrays}:</strong> {card.betrays}</p>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:22,paddingTop:16,borderTop:`1px solid ${C.border}`}}>
              <button onClick={() => step(-1)} className="ch3-char-nav-btn">{nav.prev}</button>
              <span style={{fontSize:11,color:C.inkFaint}}>{openIndex+1} {nav.of} {a.cards.length}</span>
              <button onClick={() => step(1)} className="ch3-char-nav-btn">{nav.next}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Crash-lab v2 helpers: real day-by-day portfolio equity from real data ───
function alignedCloses(series, masterDates) {
  const byDate = {};
  series.forEach(p => { byDate[p.time] = p.close; });
  let last = series[0].close;
  return masterDates.map(d => {
    if (byDate.hasOwnProperty(d)) last = byDate[d];
    return last;
  });
}

function buildEquityCurve(preset, alloc) {
  const master = preset.series.sp500.map(p => p.time);
  const closes = {};
  ["sp500","bonds","gold","oil"].forEach(k => { closes[k] = alignedCloses(preset.series[k], master); });
  closes.btc = preset.series.btc ? alignedCloses(preset.series.btc, master) : null;
  const equity = [];
  let peak = -Infinity, maxDD = 0;
  master.forEach((date, i) => {
    let v = 0;
    ["sp500","bonds","gold","oil"].forEach(k => { v += (alloc[k]/100) * (closes[k][i]/closes[k][0]); });
    if (closes.btc) v += (alloc.btc/100) * (closes.btc[i]/closes.btc[0]);
    v += (alloc.cash/100) * 1;
    equity.push({ time: date, value: v });
    if (v > peak) peak = v;
    const dd = (v - peak) / peak * 100;
    if (dd < maxDD) maxDD = dd;
  });
  return { equity, maxDrawdownPct: maxDD, finalPct: (equity[equity.length-1].value - 1) * 100 };
}

function saveSetup(payload) {
  const doFetch = (window.sbfAuth && window.sbfAuth.isLoggedIn && window.sbfAuth.isLoggedIn()) ? window.sbfAuth.fetch : fetch;
  return doFetch('/api/journal/setups', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) }).catch(() => {});
}

const CRASH_ASSET_COLOR = { sp500:"#2563eb", bonds:"#7c3aed", gold:"#c9973a", oil:"#92400e", btc:"#f59e0b", cash:"#6b7280" };

function EquitySpark({ equity, height }) {
  if (!equity || !equity.length) return null;
  const W=560, H=height||140;
  const vals = equity.map(e => e.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max-min)*0.08 || 0.02;
  const toY = v => H-14 - ((v-(min-pad))/((max+pad)-(min-pad)))*(H-28);
  const toX = i => (i/(vals.length-1))*(W-20)+10;
  const pts = vals.map((v,i) => `${toX(i)},${toY(v)}`).join(" ");
  const finalPct = (vals[vals.length-1]-1)*100;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block"}}>
      <line x1="10" y1={toY(1)} x2={W-10} y2={toY(1)} stroke="rgba(255,255,255,0.15)" strokeDasharray="4 4"/>
      <polyline points={pts} fill="none" stroke={finalPct>=0?"#2ecc71":"#e74c3c"} strokeWidth="2"/>
    </svg>
  );
}

// ─── Math of survival: "Survive the streak" emotional trainer ───────────────
// Fixed seed, RR 1:2, 9W/11L (45% winrate, positive expectancy). Proportional
// position sizing can't hit literal $0 within 20 trades even at 10% risk
// (verified by simulation: 20 straight losses at 10% only reaches ~-88% DD),
// so "busted" here means a realistic margin-call/stop-out: once a path's
// drawdown from its own peak crosses -50%, it's frozen -- the same threshold
// the asymmetry widget above just taught as "practically unrecoverable".
const SURVIVE_SEQUENCE = ["L","L","L","L","L","L","L","W","L","W","W","L","W","W","L","W","W","L","W","W"];
const SURVIVE_BUST_DD = 0.50;
const SURVIVE_RR = 2;

function surviveStepSide(side, riskPct, outcome, stepNo) {
  if (side.busted) return { ...side, path: [...side.path, side.path[side.path.length-1]] };
  const r = side.eq * riskPct / 100;
  const eq = outcome === "W" ? side.eq + r*SURVIVE_RR : side.eq - r;
  const peak = Math.max(side.peak, eq);
  const dd = (peak - eq) / peak;
  return { eq, peak, busted: dd >= SURVIVE_BUST_DD, path: [...side.path, {time: stepNo, value: eq/10000}] };
}

function surviveMakeInitial() {
  return {
    step: 0, lossStreak: 0, frozen: false,
    user: { eq:10000, peak:10000, busted:false, path:[{time:0,value:1}] },
    disc: { eq:10000, peak:10000, busted:false, path:[{time:0,value:1}] },
  };
}

// Дисциплинированная линия vs линия пользователя на одном графике -- обычный
// EquitySpark рисует одну кривую (используется краш-лабораторией), здесь
// нужны две поверх друг друга для прямого сравнения (SPEC_ch3_debug.md §2).
function SurviveTwoLineChart({ user, disc, height }) {
  const W = 560, H = height || 160;
  const allVals = [...user.map(p=>p.value), ...disc.map(p=>p.value)];
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const pad = (max-min)*0.08 || 0.02;
  const toY = v => H-16 - ((v-(min-pad))/((max+pad)-(min-pad)))*(H-32);
  const toX = (i,len) => (i/Math.max(len-1,1))*(W-20)+10;
  const line = (arr,color,width) => (
    <polyline points={arr.map((p,i) => `${toX(i,arr.length)},${toY(p.value)}`).join(" ")} fill="none" stroke={color} strokeWidth={width}/>
  );
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block"}}>
      <line x1="10" y1={toY(1)} x2={W-10} y2={toY(1)} stroke="rgba(255,255,255,0.15)" strokeDasharray="4 4"/>
      {line(disc, "#8A8275", "2")}
      {line(user, C.gold, "2.5")}
    </svg>
  );
}

function SurviveStreak() {
  const { useState } = React;
  const T = window.Ch3Content[INITIAL_LANG] || window.Ch3Content.ru;
  const s = T.survival.surviveGame;

  const [setupRisk, setSetupRisk] = useState(2);
  const [phase, setPhase] = useState("setup"); // setup | playing | paused | done
  const [baseRisk, setBaseRisk] = useState(2);
  const [userRisk, setUserRisk] = useState(2);
  const [game, setGame] = useState(surviveMakeInitial);

  const ddPct = (riskPct, n) => (1 - Math.pow(1 - riskPct/100, n)) * 100;
  const recPct = (riskPct, n) => (1 / Math.pow(1 - riskPct/100, n) - 1) * 100;
  const previewDd = ddPct(setupRisk, 5);
  const previewRec = recPct(setupRisk, 5);

  const start = () => {
    setBaseRisk(setupRisk);
    setUserRisk(setupRisk);
    setGame(surviveMakeInitial());
    setPhase("playing");
  };
  const reset = () => setPhase("setup");

  const advance = () => {
    setGame(prev => {
      if (prev.step >= SURVIVE_SEQUENCE.length) return prev;
      const outcome = SURVIVE_SEQUENCE[prev.step];
      const stepNo = prev.step + 1;
      const disc = surviveStepSide(prev.disc, baseRisk, outcome, stepNo);
      const user = prev.frozen
        ? { ...prev.user, path:[...prev.user.path, {time:stepNo, value:prev.user.path[prev.user.path.length-1].value}] }
        : surviveStepSide(prev.user, userRisk, outcome, stepNo);
      const lossStreak = outcome === "L" ? prev.lossStreak + 1 : 0;
      const next = { step: stepNo, lossStreak, frozen: prev.frozen, user, disc };

      if (stepNo >= SURVIVE_SEQUENCE.length) setPhase("done");
      else if (!prev.frozen && lossStreak > 0 && lossStreak % 3 === 0) setPhase("paused");
      return next;
    });
  };

  const choose = (action) => {
    if (action === "stopToday") {
      setGame(prev => {
        let cur = { ...prev, frozen: true };
        while (cur.step < SURVIVE_SEQUENCE.length) {
          const outcome = SURVIVE_SEQUENCE[cur.step];
          const stepNo = cur.step + 1;
          const disc = surviveStepSide(cur.disc, baseRisk, outcome, stepNo);
          const lastVal = cur.user.path[cur.user.path.length-1].value;
          const user = { ...cur.user, path:[...cur.user.path, {time:stepNo, value:lastVal}] };
          cur = { step: stepNo, lossStreak: 0, frozen: true, user, disc };
        }
        return cur;
      });
      setPhase("done");
      return;
    }
    setUserRisk(r => action === "increase" ? r*2 : action === "decrease" ? r*0.5 : r);
    setPhase("playing");
  };

  const done = phase === "done";
  const fmt = (side) => `$${Math.round(side.eq).toLocaleString()}`;

  return (
    <div style={{marginBottom:32}}>
      <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:8}}>{s.tag}</Mono>
      <div style={{fontFamily:"'DM Serif Display',serif",fontSize:20,color:C.black,marginBottom:8}}>{s.title}</div>
      <p style={{fontSize:13,color:C.inkMid,lineHeight:1.65,marginBottom:18,maxWidth:700}}>{s.legend}</p>

      {phase === "setup" ? (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:20,maxWidth:520}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
            <span style={{fontSize:12,color:C.inkMid,fontWeight:500}}>{s.riskSliderLabel}</span>
            <span style={{fontSize:13,fontWeight:700,color:C.inkMid,fontFamily:"monospace"}}>{setupRisk}%</span>
          </div>
          <input type="range" min={0.5} max={10} step={0.5} value={setupRisk}
            onChange={e => setSetupRisk(+e.target.value)}
            style={{width:"100%",accentColor:C.inkMid,cursor:"pointer",marginBottom:14}}/>
          <p style={{fontSize:12.5,color:C.inkSoft,lineHeight:1.6,marginBottom:16}}>
            {s.drawdownPreview.replace("{{dd}}", previewDd.toFixed(1)).replace("{{rec}}", previewRec.toFixed(1))}
          </p>
          <button onClick={start}
            style={{padding:"10px 18px",background:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12.5,fontWeight:700}}>{s.startBtn}</button>
        </div>
      ) : (
        <React.Fragment>
          <div style={{background:C.black,borderRadius:6,padding:14,marginBottom:14}}>
            <SurviveTwoLineChart user={game.user.path} disc={game.disc.path} height={160}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}} className="grid-2">
            <div style={{background:C.surface,border:`1px solid ${C.borderGold}`,borderRadius:6,padding:18}}>
              <Mono size={10} color={C.gold} spacing={1}>{s.yourLineLabel} · {userRisk}%</Mono>
              <div style={{display:"flex",alignItems:"center",gap:6,fontFamily:"monospace",fontSize:22,marginTop:6,color:game.user.busted?C.red:C.black}}>{fmt(game.user)}{game.user.busted && <Icon name="warning" size={18} color={C.red}/>}</div>
            </div>
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:18}}>
              <Mono size={10} color={C.inkFaint} spacing={1}>{s.disciplinedLineLabel} · {baseRisk}%</Mono>
              <div style={{display:"flex",alignItems:"center",gap:6,fontFamily:"monospace",fontSize:22,marginTop:6,color:game.disc.busted?C.red:C.black}}>{fmt(game.disc)}{game.disc.busted && <Icon name="warning" size={18} color={C.red}/>}</div>
            </div>
          </div>

          {phase === "paused" && (
            <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:6,padding:18,marginBottom:16}}>
              <p style={{fontSize:13.5,fontWeight:600,color:C.black,marginBottom:12}}>{s.interventionQuestion}</p>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {[["increase",s.choiceIncrease],["keep",s.choiceKeep],["decrease",s.choiceDecrease],["stopToday",s.choiceStopToday]].map(([action,label]) => (
                  <button key={action} onClick={() => choose(action)}
                    style={{padding:"9px 14px",background:"#fff",border:`1px solid ${C.borderGold}`,borderRadius:4,cursor:"pointer",fontSize:12,color:C.black,fontFamily:"'DM Sans',sans-serif"}}>{label}</button>
                ))}
              </div>
            </div>
          )}

          {phase === "playing" && (
            <div style={{display:"flex",gap:10,marginBottom:14}}>
              <button onClick={advance}
                style={{padding:"10px 18px",background:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12.5,fontWeight:700}}>{s.nextTradeLabel}</button>
            </div>
          )}

          {game.frozen && (
            <p style={{fontSize:12,color:C.inkSoft,fontStyle:"italic",marginBottom:14}}>{s.frozenNote}</p>
          )}

          {done && (
            <p style={{fontSize:13.5,fontStyle:"italic",color:C.black,marginBottom:8,maxWidth:700}}>
              {s.finalTemplate.replace("{{base}}", fmt(game.disc)).replace("{{user}}", fmt(game.user))}
            </p>
          )}

          <div style={{marginBottom:14}}>
            <button onClick={reset}
              style={{padding:"10px 18px",background:"transparent",border:`1px solid ${C.border}`,borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12.5,color:C.inkMid}}>↺ {s.resetLabel}</button>
          </div>
        </React.Fragment>
      )}

      <p style={{fontSize:11,color:C.inkFaint}}>{s.modelNote}</p>
    </div>
  );
}

// ─── Interactive 2: Position Size Calculator ─────────────────────────────────
function PositionCalculator() {
  const { useState, useMemo, useRef, useCallback, useEffect } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const T = window.Ch3Content[INITIAL_LANG] || window.Ch3Content.ru;

  const [deposit, setDeposit] = useState(10000);
  const [riskPct, setRiskPct] = useState(1);
  const [entryPrice, setEntryPrice] = useState(2500);
  const [stopPct, setStopPct] = useState(2);
  const [rrRatio, setRrRatio] = useState(3);
  const [instrument, setInstrument] = useState("gold");
  const [liveGold, setLiveGold] = useState(null);
  const [nearestLevel, setNearestLevel] = useState(null);
  const [ritualSaved, setRitualSaved] = useState(false);

  // Live GOLD price + nearest real S/R level from the terminal (§3.6 "цена
  // подтягивается live, стоп — за ближайшим уровнем из терминала").
  useEffect(() => {
    fetch("/api/quotes").then(r => r.json()).then(data => {
      const rows = data && Array.isArray(data.quotes) ? data.quotes : [];
      const gold = rows.find(r => r.ticker === "GC=F");
      const p = gold && gold.price;
      if (p) {
        setLiveGold(p);
        setEntryPrice(prev => (prev === 2500 ? Math.round(p * 100) / 100 : prev));
      }
    }).catch(() => {});
    fetch("/api/chart/levels?symbol=GOLD").then(r => r.json()).then(levels => {
      if (Array.isArray(levels) && levels.length) setNearestLevel(levels);
    }).catch(() => {});
  }, []);

  const nearestBelow = useMemo(() => {
    if (!nearestLevel || !entryPrice) return null;
    const below = nearestLevel.filter(l => l.price < entryPrice);
    if (!below.length) return null;
    return below.reduce((a,b) => (entryPrice - a.price < entryPrice - b.price ? a : b));
  }, [nearestLevel, entryPrice]);

  const instruments = {
    gold:  { label:"XAU/USD (Gold)",  unit:S.instGoldUnit,  lotSize:100,  pipValue:1   },
    eurusd:{ label:"EUR/USD",         unit:S.instEurUsdUnit,  lotSize:100000,pipValue:10  },
    btc:   { label:"Bitcoin",         unit:"BTC",  lotSize:1,    pipValue:1   },
    sp500: { label:"S&P 500 CFD",     unit:S.instSp500Unit, lotSize:1,    pipValue:1   },
  };

  const inst = instruments[instrument];
  const riskAmount = deposit * riskPct / 100;
  const stopDistance = entryPrice * stopPct / 100;
  const stopPrice = entryPrice - stopDistance;
  const tpPrice = entryPrice + stopDistance * rrRatio;
  const positionSize = +(riskAmount / stopDistance).toFixed(4);
  const maxUnits = instrument === "btc" ? positionSize : +positionSize.toFixed(2);
  const potentialProfit = Math.round(riskAmount * rrRatio);
  const positionValue = Math.round(entryPrice * positionSize);

  // RR simulation: winrate needed to break even
  const breakEvenWR = Math.round(100 / (1 + rrRatio));

  // SVG price chart
  const W = 340, H = 220;
  const prices = {
    min: stopPrice * 0.996,
    max: tpPrice * 1.004,
  };
  const toY = p => H - 20 - ((p - prices.min) / (prices.max - prices.min)) * (H - 40);
  const entryY = toY(entryPrice);
  const stopY = toY(stopPrice);
  const tpY = toY(tpPrice);

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"36px 40px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <Icon name="calculator" size={28} color={C.gold}/>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black}}>{S.calcTitle}</div>
          <Mono size={11} color={C.inkSoft} spacing={2}>{S.calcTag}</Mono>
        </div>
      </div>

      <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:6,padding:"14px 18px",marginBottom:24}}>
        <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.6,margin:0}}>{T.calc.legend}</p>
      </div>

      {liveGold && (
        <p style={{fontSize:11.5,color:C.inkFaint,marginBottom:16}}>
          <Mono size={11} color={C.green} spacing={0}>● LIVE</Mono> GOLD {liveGold.toFixed(2)}
          {nearestBelow && ` · ${T.calc.liveNote} (${nearestBelow.price.toFixed(2)})`}
        </p>
      )}

      <div style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:40,alignItems:"start"}} className="grid-2">
        {/* Controls */}
        <div>
          {/* Instrument */}
          <div style={{marginBottom:22}}>
            <div style={{fontSize:12,color:C.inkSoft,marginBottom:8,textTransform:"uppercase",letterSpacing:1}}>{S.calcInstrumentLabel}</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {Object.entries(instruments).map(([key, i]) => (
                <button key={key} onClick={() => setInstrument(key)}
                  style={{padding:"7px 14px",border:`1px solid ${instrument===key?C.gold:C.border}`,background:instrument===key?C.goldPale:"transparent",color:instrument===key?C.black:C.inkMid,cursor:"pointer",fontSize:12,borderRadius:3,fontFamily:"'DM Sans',sans-serif"}}>
                  {i.label}
                </button>
              ))}
            </div>
          </div>

          {[
            {label:S.calcDepositLabel, val:`$${deposit.toLocaleString()}`, min:1000, max:100000, step:1000, state:deposit, set:setDeposit, color:C.gold},
            {label:S.calcRiskLabel, val:`${riskPct}%  =  $${Math.round(riskAmount)}`, min:0.5, max:5, step:0.5, state:riskPct, set:setRiskPct, color:C.red},
            {label:S.calcEntryLabel, val:entryPrice, min:100, max:5000, step:10, state:entryPrice, set:setEntryPrice, color:C.inkMid},
            {label:S.calcStopLabel, val:`${stopPct}%  =  ${Math.round(stopDistance)} ${S.calcStopPointsSuffix}`, min:0.5, max:10, step:0.5, state:stopPct, set:setStopPct, color:"#c0392b"},
            {label:S.calcRRLabel, val:`1 : ${rrRatio}`, min:1, max:5, step:0.5, state:rrRatio, set:setRrRatio, color:C.green},
          ].map((s,i) => (
            <div key={i} style={{marginBottom:18}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{fontSize:12,color:C.inkMid,fontWeight:500}}>{s.label}</span>
                <span style={{fontSize:13,fontWeight:700,color:s.color,fontFamily:"monospace"}}>{s.val}</span>
              </div>
              <input type="range" min={s.min} max={s.max} step={s.step} value={s.state}
                onChange={e => s.set(+e.target.value)}
                style={{width:"100%",accentColor:s.color,cursor:"pointer"}}/>
            </div>
          ))}

          {/* Result panel */}
          <div style={{background:C.black,borderRadius:6,padding:"20px 24px",marginTop:8}}>
            <Mono size={10} color={C.gold} spacing={2} style={{display:"block",marginBottom:14}}>{S.calcResultTag}</Mono>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              {[
                {label:S.calcMetricMaxVolume, val:`${maxUnits} ${inst.unit}`, big:true, color:C.gold},
                {label:S.calcMetricPosValue,   val:`~$${positionValue.toLocaleString()}`, color:"#fff"},
                {label:S.calcMetricSLPrice,      val:Math.round(stopPrice), color:"#e74c3c"},
                {label:S.calcMetricTPPrice,      val:Math.round(tpPrice), color:"#2ecc71"},
                {label:S.calcMetricMaxLoss,        val:`-$${Math.round(riskAmount)}`, color:"#e74c3c"},
                {label:S.calcMetricPotentialProfit,val:`+$${potentialProfit}`, color:"#2ecc71"},
              ].map((m,i) => (
                <div key={i} style={{background:"rgba(255,255,255,0.05)",borderRadius:3,padding:"10px 12px"}}>
                  <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginBottom:4}}>{m.label}</div>
                  <div style={{fontSize:m.big?18:15,fontWeight:700,color:m.color,fontFamily:"monospace"}}>{m.val}</div>
                </div>
              ))}
            </div>
            <div style={{marginTop:14,padding:"10px 12px",background:"rgba(201,151,58,0.1)",borderRadius:3,border:`1px solid rgba(201,151,58,0.2)`}}>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.6)",lineHeight:1.7}}>
                {S.calcExplainerLead} <strong style={{color:C.gold}}>1:{rrRatio}</strong> {S.calcExplainerAfterRatio}
                <strong style={{color:C.gold}}> {breakEvenWR+1}%</strong> {S.calcExplainerAfterPct}
                {S.calcExplainerEvenAt} {100-breakEvenWR-1}% {S.calcExplainerLossSuffix}
              </div>
            </div>
          </div>
        </div>

        {/* SVG Trade Chart */}
        <div>
          <Mono size={10} color={C.inkSoft} spacing={1} style={{display:"block",marginBottom:10,textAlign:"center"}}>{S.calcChartTag}</Mono>
          <div style={{background:C.black,borderRadius:6,overflow:"hidden"}}>
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block"}}>
              {/* TP zone */}
              <rect x="0" y={tpY-1} width={W} height={entryY-tpY} fill="rgba(45,122,79,0.12)"/>
              {/* SL zone */}
              <rect x="0" y={entryY} width={W} height={stopY-entryY} fill="rgba(192,57,43,0.12)"/>

              {/* TP line */}
              <line x1="0" y1={tpY} x2={W} y2={tpY} stroke="#2ecc71" strokeWidth="1.5" strokeDasharray="6 3"/>
              <rect x={W-90} y={tpY-12} width={88} height={18} fill="#2d7a4f" opacity="0.9" rx="2"/>
              <text x={W-46} y={tpY+4} fontSize="10" fill="#fff" textAnchor="middle" fontFamily="monospace">TP {Math.round(tpPrice)}</text>

              {/* Entry line */}
              <line x1="0" y1={entryY} x2={W} y2={entryY} stroke={C.gold} strokeWidth="2"/>
              <rect x={W-90} y={entryY-10} width={88} height={18} fill={C.gold} rx="2"/>
              <text x={W-46} y={entryY+4} fontSize="10" fill={C.black} textAnchor="middle" fontFamily="monospace">ENTRY {entryPrice}</text>

              {/* SL line */}
              <line x1="0" y1={stopY} x2={W} y2={stopY} stroke="#e74c3c" strokeWidth="1.5" strokeDasharray="6 3"/>
              <rect x={W-90} y={stopY-6} width={88} height={18} fill="#c0392b" opacity="0.9" rx="2"/>
              <text x={W-46} y={stopY+8} fontSize="10" fill="#fff" textAnchor="middle" fontFamily="monospace">SL {Math.round(stopPrice)}</text>

              {/* RR labels */}
              <text x="12" y={(tpY + entryY)/2 + 4} fontSize="11" fill="#2ecc71" fontFamily="monospace" fontWeight="bold">+{rrRatio}R</text>
              <text x="12" y={(entryY + stopY)/2 + 4} fontSize="11" fill="#e74c3c" fontFamily="monospace" fontWeight="bold">-1R</text>

              {/* Arrow up */}
              <line x1="32" y1={entryY-4} x2="32" y2={tpY+4} stroke="#2ecc71" strokeWidth="1" markerEnd="url(#arrow)"/>
            </svg>
          </div>

          {/* RR math explainer */}
          <div style={{marginTop:16,padding:"16px",background:"rgba(201,151,58,0.06)",border:`1px solid ${C.borderGold}`,borderRadius:4}}>
            <div style={{fontSize:12,color:C.inkMid,lineHeight:1.75}}>
              <strong style={{color:C.gold}}>{S.calcFormulaTitle}</strong><br/>
              <code style={{fontSize:11,background:C.surfaceMid,padding:"2px 6px",borderRadius:2,display:"block",marginTop:4}}>
                {S.calcFormulaLine1}
              </code>
              <code style={{fontSize:11,background:C.surfaceMid,padding:"2px 6px",borderRadius:2,display:"block",marginTop:4}}>
                = (${deposit.toLocaleString()} × {riskPct}%) ÷ {Math.round(stopDistance)} = <strong>{maxUnits}</strong>
              </code>
            </div>
          </div>

          <button
            onClick={() => {
              setRitualSaved(true);
              const doFetch = (window.sbfAuth && window.sbfAuth.isLoggedIn && window.sbfAuth.isLoggedIn()) ? window.sbfAuth.fetch : fetch;
              doFetch('/api/journal/checklist/items', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ text: `${inst.label}: entry ${entryPrice}, SL ${Math.round(stopPrice)}, risk ${riskPct}% ($${Math.round(riskAmount)}), size ${maxUnits} ${inst.unit}, RR 1:${rrRatio}` }),
              }).catch(() => {});
            }}
            style={{width:"100%",marginTop:14,padding:"12px",background:"transparent",border:`1px solid ${C.gold}`,color:C.gold,borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:11.5,fontWeight:700,letterSpacing:0.5}}>
            {ritualSaved ? T.calc.savedRitualMsg : T.calc.saveRitualBtn}
          </button>
        </div>
      </div>
    </div>
  );
}

              <div key={i} style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:13}}>
                  <span style={{fontFamily:"monospace",color:r.color,fontWeight:700}}>RR {r.rr}</span>
                  <span style={{color:"rgba(255,255,255,0.5)"}}>{S.rrNeededWR} {r.wr}%</span>
                  <span style={{fontFamily:"monospace",color:r.color}}>+${r.monthly}</span>
                </div>
                <div style={{background:"rgba(255,255,255,0.06)",borderRadius:2,height:5,overflow:"hidden"}}>
                  <div style={{height:"100%",background:r.color,width:`${100-r.wr}%`,borderRadius:2}}/>
                </div>
              </div>
            ))}
            <p style={{fontSize:11,color:"rgba(255,255,255,0.2)",marginTop:14}}>{S.rrTableFootnote}</p>
          </div>
        </div>

        <SurviveStreak/>

        <Rule/>

        {/* ── Инструменты очереди: SL/TP/Trailing/RR ── */}
        <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:16}}>{T.tools.tag}</Mono>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}} className="grid-2">
          <InfoCard icon="stop-sign" title="Stop-Loss (SL)" accent={C.red}
            text={T.tools.slFormula}/>
          <InfoCard icon="target" title="Take-Profit (TP)" accent={C.green}
            text={S.infoTPText}/>
          <InfoCard icon="bar-chart" title="Trailing Stop" accent={C.blue}
            text={S.infoTrailingText}/>
          <InfoCard icon="scales" title={S.infoRRTitle} accent={C.gold}
            text={S.infoRRText}/>
        </div>
        <p style={{fontSize:12.5,color:C.inkSoft,lineHeight:1.7,maxWidth:780,marginBottom:56,fontStyle:"italic"}}>{T.tools.bridgeFootnote}</p>

        {/* ── Калькулятор объёма ── */}
        <div style={{marginBottom:64}}>
          <PositionCalculator/>
        </div>

        <Rule/>

        {/* ── Контекст локали ── */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px",marginBottom:48}}>
          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{T.localeContext.tag}</Mono>
          <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,margin:0,maxWidth:780}}>{T.localeContext.body}</p>
        </div>

        {/* ── CONCLUSIONS ── */}
        <div style={{background:C.black,borderRadius:8,padding:"44px 48px"}}>
          <div style={{textAlign:"center",marginBottom:32}}>
            <Mono size={11} color={C.gold} spacing={4} style={{display:"block",marginBottom:12}}>{S.conclTag}</Mono>
            <h3 style={{fontFamily:"'DM Serif Display',serif",fontSize:28,color:C.white,fontWeight:400}}>{S.conclTitle}</h3>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            {conclusions.map((c,i) => (
              <div key={i} style={{display:"flex",gap:14,alignItems:"flex-start",padding:"14px 16px",background:"rgba(255,255,255,0.04)",borderRadius:4,border:"1px solid rgba(255,255,255,0.06)"}}>
                <span style={{color:C.gold,fontFamily:"monospace",fontSize:11,marginTop:2,flexShrink:0}}>0{i+1}</span>
                <span style={{fontSize:13,color:"rgba(255,255,255,0.7)",lineHeight:1.65}}>{c}</span>
              </div>
            ))}
          </div>
        </div>

        <QuizBlock questions={T.quiz} levelId="level_3" lang={lang} copy={{
          kicker: S.quizKicker, title: S.quizTitle, next: S.quizNext,
          stuckAll: S.quizStuckAll, stuckSome: S.quizStuckSome, backToSection: S.quizBackToSection,
        }} />

        {/* ── Предикт недели → клиффхэнгер гл.4 ── */}
        <div style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px",marginTop:32,marginBottom:24}}>
          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>
            {lang==="ru"?"ПРЕДИКТ НЕДЕЛИ":lang==="ro"?"PREDICȚIA SĂPTĂMÂNII":"PREDICTION OF THE WEEK"}
          </Mono>
          <p style={{fontSize:14.5,color:C.black,lineHeight:1.65,marginBottom:8}}>{T.predict.question}</p>
          <p style={{fontSize:11,color:C.inkFaint}}>{T.predict.xpNote}</p>
        </div>

        <div style={{border:`1px dashed ${C.borderGold}`,borderRadius:8,padding:"20px 24px",marginBottom:32,background:C.surface}}>
          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>
            {lang==="ru"?"КЛИФФХЭНГЕР → ГЛАВА 4":lang==="ro"?"CLIFFHANGER → CAPITOLUL 4":"CLIFFHANGER → CHAPTER 4"}
          </Mono>
          <p style={{fontSize:14,color:C.inkMid,lineHeight:1.7,margin:0}}>{T.cliffhanger.body}</p>
        </div>

        <ComplianceFootnote lang={lang} />

        {/* Footer navigation */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:20,paddingTop:48,marginTop:48,borderTop:`1px solid ${C.border}`}}>
          <AskAnalystBtn tr={{askAnalyst:S.footerAskLink}} chapterNum={3} lang={lang} />
          <button
            onClick={() => window.location.href = getChUrl(4, lang)}
            style={{background:C.black,color:C.white,border:"none",padding:"18px 35px",cursor:"pointer",fontFamily:"monospace",fontSize:14,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.target.style.background=C.gold}
            onMouseLeave={e=>e.target.style.background=C.black}>
            {S.footerNextBtn}
          </button>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter3 />);
{% endraw %}
</script>
</body>
</html>
