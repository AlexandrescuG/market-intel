// SceneEngine mounting helper -- same ref-callback convention as chapters 1-4.
function SceneMount({ url, mode, symbol, copy }) {
  const { useRef, useEffect } = React;
  const ref = useRef(null);
  useEffect(() => {
    let cancelled = false;
    fetch(url).then(r => r.json()).then(data => {
      if (!cancelled && ref.current) window.SceneEngine.mount(ref.current, { mode, data, symbol, copy });
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [url]);
  return <div ref={ref}/>;
}

// n случаев/случая/случай -- RU numeral agreement (1/2-4/5+ с исключением
// 11-14), RO/EN не имеют этой проблемы для наших n (1..12), но обрабатываем
// единообразно, чтобы "1 cases"/"1 case" тоже было верно.
function pluralCases(n, cm) {
  if (INITIAL_LANG === "ru") {
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return cm.casesLabelOne;
    if (mod10 >= 2 && mod10 <= 4 && !(mod100 >= 12 && mod100 <= 14)) return cm.casesLabelFew;
    return cm.casesLabel;
  }
  return n === 1 ? cm.casesLabelOne : cm.casesLabel;
}

// ─── Calendar impact matrix (§3.5, деферред при закрытии главы 27.07.2026) ───
// Данные: tools/edu_build/build_ch2_calendar_matrix.py → calendar_matrix.json
// (XAU/USD из живого движка Layer1 event_reaction_stats, DXY/S&P/BTC — свежий
// расчёт по MT5-бэкфиллу). Ни одно число не написано руками -- см. cm.noDataCell
// для честного "-" там, где случаев 0.
function CalendarMatrixTable() {
  const { useState, useEffect } = React;
  const cm = (window.Chrono2Content[INITIAL_LANG] || window.Chrono2Content.ru).calendarMatrix;
  const [data, setData] = useState(null);
  const [showMethod, setShowMethod] = useState(false);
  useEffect(() => {
    let cancelled = false;
    fetch("/data/edu_stats/calendar_matrix.json").then(r => r.json()).then(d => {
      if (!cancelled) setData(d);
    }).catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const cols = [
    { key: "GOLD", label: cm.colGold },
    { key: "DXY", label: cm.colDxy },
    { key: "SPX", label: cm.colSpx },
    { key: "BTC", label: cm.colBtc },
  ];

  if (!data) return <div style={{padding:"20px 0",color:C.inkFaint,fontFamily:"monospace",fontSize:12}}>—</div>;

  // SPEC_ch2_debug_and_chart_engine.md §2.2 -- ImpactMatrix ждёт уже
  // ATR/дневной-диапазон-нормированные cell.norm (см. build_ch2_calendar_
  // matrix.py), здесь только перекладка формы + перевод tooltip/copy.
  const rows = data.rows.map(row => ({
    key: row.event_type,
    label: row.label,
    cells: Object.fromEntries(cols.map(c => {
      const cell = row.cells[c.key];
      if (!cell) return [c.key, null];
      return [c.key, {
        norm: cell.norm != null ? cell.norm : null,
        n: cell.n,
        raw: cell.avg_move_60m != null ? Math.round(cell.avg_move_60m * 10) / 10 : null,
        rawUnit: cm.rawUnit,
        tooltip: cell.n === 0 ? cm.noDataCell : `${cell.n} ${pluralCases(cell.n, cm)}${cell.coverage_first ? " · " + cell.coverage_first + "–" + cell.coverage_last : ""}`,
      }];
    })),
  }));

  return (
    <div>
      <ImpactMatrix rows={rows} columns={cols} minCases={data.meta.min_cases} copy={{
        rowHead: cm.colEvent, naLabel: cm.naLabel, lowSampleLegend: cm.lowSampleLegend,
      }}/>
      <button onClick={() => setShowMethod(v => !v)} style={{background:"none",border:"none",padding:0,fontFamily:"monospace",fontSize:11,color:C.gold,cursor:"pointer",textDecoration:"underline",marginTop:6}}>
        {cm.methodologyTitle} {showMethod ? "▲" : "▼"}
      </button>
      {showMethod && <p style={{fontSize:11.5,color:C.inkFaint,lineHeight:1.65,marginTop:10,maxWidth:760}}>{cm.methodologyBody}</p>}
    </div>
  );
}

// ─── Live "next high-impact release" countdown — /api/calendar/events (live) ──
function NextReleaseWidget() {
  const { useState, useEffect } = React;
  const cm = (window.Chrono2Content[INITIAL_LANG] || window.Chrono2Content.ru).calendarMatrix;
  const [state, setState] = useState({ status: "loading", event: null });
  const [now, setNow] = useState(() => Date.now());

  useEffect(() => {
    let cancelled = false;
    const today = new Date().toISOString().slice(0, 10);
    const to = new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10);
    fetch(`/api/calendar/events?from=${today}&to=${to}&impact=high&country=US`)
      .then(r => r.json())
      .then(rows => {
        if (cancelled) return;
        const nowSec = Date.now() / 1000;
        const upcoming = (Array.isArray(rows) ? rows : [])
          .filter(r => r.scheduled_ts && r.scheduled_ts > nowSec)
          .sort((a, b) => a.scheduled_ts - b.scheduled_ts);
        setState(upcoming.length ? { status: "ok", event: upcoming[0] } : { status: "empty", event: null });
      })
      .catch(() => { if (!cancelled) setState({ status: "error", event: null }); });
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  if (state.status === "loading") return <div style={{fontFamily:"monospace",fontSize:12,color:C.inkFaint}}>{cm.nextReleaseLoading}</div>;
  if (state.status === "error") return <div style={{fontFamily:"monospace",fontSize:12,color:C.inkFaint}}>{cm.nextReleaseError}</div>;
  if (state.status === "empty") return <div style={{fontFamily:"monospace",fontSize:12,color:C.inkFaint}}>{cm.nextReleaseNone}</div>;

  const ev = state.event;
  const diffMs = Math.max(0, ev.scheduled_ts * 1000 - now);
  const d = Math.floor(diffMs / 86400000);
  const h = Math.floor((diffMs % 86400000) / 3600000);
  const m = Math.floor((diffMs % 3600000) / 60000);
  const dt = new Date(ev.scheduled_ts * 1000);
  const dateStr = dt.toISOString().slice(0, 16).replace("T", " ") + " UTC";

  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:14}}>
      <div>
        <div style={{fontWeight:700,fontSize:14,color:C.black}}>{window.translatedEventName ? window.translatedEventName(ev) : ev.title}</div>
        <div style={{fontSize:11,color:C.inkFaint,fontFamily:"monospace",marginTop:2}}>{dateStr}</div>
      </div>
      <Mono size={18} color={C.gold} spacing={1}>
        {d > 0 ? `${d}${cm.countdownDay} ` : ""}{String(h).padStart(2,"0")}{cm.countdownHour} {String(m).padStart(2,"0")}{cm.countdownMin}
      </Mono>
    </div>
  );
}

// ─── Interactive 1: FED Simulator ─────────────────────────────────────────────
// Real snapshots for the 3 preset buttons -- actual fetched values, not the
// simulator's own linear formula (build notes: 2020-04-15 from
// edu_scenes/ch2_fed_2020.json [SPX/GOLD, real Yahoo] + Yahoo DXY/BTC-USD
// fetched the same way; 2023-08-01 [real cycle peak, Fed 5.33%, not "2022"
// as the round-number folk memory has it] and "today" from local MT5
// backfill / live /api/quotes).
const FED_PRESETS = {
  "2020": { rate: 0.05, date: "2020-04-15", spx: 2783.36, gold: 1727.20, dxy: 99.46, btc: 6642 },
  "2023": { rate: 5.33, date: "2023-08-01", spx: 4576.73, gold: 1940.70, dxy: 102.30, btc: 29676 },
};

function FedSimulator() {
  const { useState, useMemo, useEffect } = React;
  const [rate, setRate] = useState(5.5);
  const [preset, setPreset] = useState(null); // null | "2020" | "2023" | "today"
  const [todayLive, setTodayLive] = useState(null);

  useEffect(() => {
    fetch("/api/quotes").then(r => r.json()).then(data => {
      const rows = data && Array.isArray(data.quotes) ? data.quotes : [];
      const byTicker = {};
      rows.forEach(r => { byTicker[r.ticker] = r.price; });
      if (byTicker["^GSPC"]) {
        setTodayLive({ spx: byTicker["^GSPC"], gold: byTicker["GC=F"], dxy: byTicker["DX-Y.NYB"], btc: byTicker["BTC-USD"] });
      }
    }).catch(() => {});
  }, []);

  const selectPreset = (key) => {
    setPreset(key);
    if (key === "2020") setRate(FED_PRESETS["2020"].rate);
    else if (key === "2023") setRate(FED_PRESETS["2023"].rate);
    else if (key === "today") setRate(3.63);
  };
  const clearPreset = (val) => { setPreset(null); setRate(val); };

  const snapshot = preset === "2020" ? FED_PRESETS["2020"]
    : preset === "2023" ? FED_PRESETS["2023"]
    : preset === "today" && todayLive ? { rate: 3.63, date: S.fedPresetToday, ...todayLive }
    : null;

  // Correlations (simplified model)
  // Rate ↑ → DXY ↑, S&P ↓, Gold ↓, BTC ↓, Bonds ↑
  const dxy   = useMemo(() => +(96 + rate * 1.55).toFixed(1), [rate]);
  const sp500 = useMemo(() => Math.round(5800 - rate * 160), [rate]);
  const gold  = useMemo(() => Math.round(2450 - rate * 28), [rate]);
  const btc   = useMemo(() => Math.round(68000 - rate * 4200), [rate]);
  const bonds = useMemo(() => +(3.5 + rate * 0.45).toFixed(2), [rate]);

  const riskMode = rate < 3.5;
  const neutral  = rate >= 3.5 && rate <= 5.5;
  const tightMode = rate > 5.5;

  const modeLabel = riskMode ? S.fedModeRiskOn : tightMode ? S.fedModeRiskOff : S.fedModeNeutral;
  const modeDesc  = riskMode
    ? S.fedDescRiskOn
    : tightMode
    ? S.fedDescRiskOff
    : S.fedDescNeutral;

  const assets = [
    { label:S.fedAssetDXYLabel,  val:`${dxy}`, dir: rate>5.5 ? "↑" : rate<3.5 ? "↓" : "→", color: rate>5.5 ? C.green : rate<3.5 ? C.red : C.inkMid, desc:S.fedAssetDXYDesc },
    { label:S.fedAssetSPXLabel,  val:`${sp500.toLocaleString()}`, dir: rate>5.5 ? "↓" : rate<3.5 ? "↑" : "→", color: rate>5.5 ? C.red : rate<3.5 ? C.green : C.inkMid, desc:S.fedAssetSPXDesc },
    { label:S.fedAssetGoldLabel, val:`$${gold.toLocaleString()}`, dir: rate>5.5 ? "↓" : rate<3.5 ? "↑" : "→", color: rate>5.5 ? C.red : rate<3.5 ? C.green : C.inkMid, desc:S.fedAssetGoldDesc },
    { label:S.fedAssetBTCLabel,  val:`$${btc.toLocaleString()}`, dir: rate>5.5 ? "↓" : rate<3.5 ? "↑" : "→", color: rate>5.5 ? C.red : rate<3.5 ? C.green : C.inkMid, desc:S.fedAssetBTCDesc },
    { label:S.fedAssetBondLabel, val:`${bonds}%`, dir: rate>5.5 ? "↑" : "↓", color: rate>5.5 ? C.green : C.red, desc:S.fedAssetBondDesc },
  ];

  // Visual scale: rate 0..10 maps to position
  const pct = rate / 10 * 100;

  return (
    <div style={{background:C.black,borderRadius:8,padding:"36px 40px",color:C.white}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
        <span style={{fontSize:28}}>🎛️</span>
        <div>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.gold}}>{S.fedTitle}</div>
          <Mono size={11} color="rgba(255,255,255,0.4)" spacing={2}>{S.fedKicker}</Mono>
        </div>
      </div>

      {/* Real-episode presets */}
      <div style={{marginBottom:24}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:10,letterSpacing:0.5}}>{S.fedPresetsLabel}</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {[
            {key:null, label:S.fedPresetModel},
            {key:"2020", label:S.fedPreset2020},
            {key:"2023", label:S.fedPreset2023},
            {key:"today", label:S.fedPresetToday},
          ].map(p => (
            <button key={p.key||"model"} onClick={() => p.key ? selectPreset(p.key) : clearPreset(5.5)}
              style={{padding:"8px 14px",borderRadius:16,cursor:"pointer",fontSize:11.5,fontFamily:"monospace",
                background:preset===p.key?"rgba(201,151,58,0.18)":"rgba(255,255,255,0.04)",
                border:preset===p.key?`1px solid ${C.gold}`:"1px solid rgba(255,255,255,0.1)",
                color:preset===p.key?C.gold:"rgba(255,255,255,0.6)"}}>
              {p.label}
            </button>
          ))}
        </div>
      </div>

      {/* Rate slider */}
      <div style={{marginBottom:32}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:10}}>
          <span style={{fontSize:14,color:"rgba(255,255,255,0.6)"}}>{S.fedRateLabel}</span>
          <span style={{fontFamily:"'DM Serif Display',serif",fontSize:40,color:C.gold,lineHeight:1}}>{rate.toFixed(2)}<span style={{fontSize:22}}>%</span></span>
        </div>
        <div style={{position:"relative",marginBottom:8}}>
          {/* Colored track */}
          <div style={{height:8,borderRadius:4,background:`linear-gradient(90deg, #2d7a4f 0%, #c9973a 40%, #c0392b 100%)`,position:"relative",overflow:"visible"}}>
            <div style={{position:"absolute",top:"50%",left:`${pct}%`,transform:"translate(-50%,-50%)",width:20,height:20,borderRadius:"50%",background:"#fff",boxShadow:"0 2px 8px rgba(0,0,0,0.5)",pointerEvents:"none"}}/>
          </div>
          <input type="range" min="0" max="10" step="0.25" value={rate}
            onChange={e => clearPreset(+e.target.value)}
            style={{position:"absolute",top:0,left:0,width:"100%",height:"100%",opacity:0,cursor:"pointer",margin:0}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"rgba(255,255,255,0.3)"}}>
          <span>{S.fedRangeSoft}</span>
          <span>{S.fedRangeNeutral}</span>

      </div>

      {snapshot ? (
        <React.Fragment>
          <div style={{background:"rgba(201,151,58,0.08)",border:`1px solid ${C.gold}`,borderRadius:6,padding:"16px 20px",marginBottom:24}}>

            <div style={{fontSize:12,color:"rgba(255,255,255,0.6)"}}>{S.fedSnapshotNote}</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}} className="grid-2">
            {[
              {label:S.fedAssetSPXLabel, val:snapshot.spx.toLocaleString(undefined,{maximumFractionDigits:0})},
              {label:S.fedAssetGoldLabel, val:"$"+snapshot.gold.toLocaleString(undefined,{maximumFractionDigits:0})},
              {label:S.fedAssetDXYLabel, val:snapshot.dxy.toFixed(1)},
              {label:S.fedAssetBTCLabel, val:"$"+Math.round(snapshot.btc).toLocaleString()},
            ].map((m,i) => (
              <div key={i} style={{background:"rgba(255,255,255,0.05)",borderRadius:4,padding:"14px 12px",textAlign:"center",border:`1px solid rgba(255,255,255,0.07)`}}>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginBottom:6,letterSpacing:0.5}}>{m.label}</div>
                <div style={{fontSize:16,fontWeight:700,color:C.gold,fontFamily:"monospace"}}>{m.val}</div>
              </div>

        </React.Fragment>
      ) : (
        <React.Fragment>
          {/* Mode badge */}
          <div style={{background:"rgba(255,255,255,0.06)",border:`1px solid rgba(255,255,255,0.1)`,borderRadius:6,padding:"16px 20px",marginBottom:24,display:"flex",gap:12,alignItems:"flex-start"}}>
            <span style={{fontSize:22}}>{riskMode?"🟢":tightMode?"🔴":"🟡"}</span>
            <div>
              <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>{modeLabel}</div>
              <div style={{fontSize:13,color:"rgba(255,255,255,0.55)",lineHeight:1.6}}>{modeDesc}</div>

          </div>

          {/* Assets grid */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
            {assets.map((a,i) => (
              <div key={i} style={{background:"rgba(255,255,255,0.05)",borderRadius:4,padding:"14px 12px",textAlign:"center",border:`1px solid rgba(255,255,255,0.07)`}}>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginBottom:6,letterSpacing:0.5}}>{a.label}</div>

// ─── Interactive 2: Support & Resistance Trainer ──────────────────────────────
function SRTrainer() {
  const { useState, useRef, useCallback, useEffect, useMemo } = React;

  const W = 700, H = 320;
  const PAD = { l:40, r:20, t:20, b:30 };

  const [srData, setSrData] = useState(null);
  useEffect(() => {
    fetch("/data/edu_capsules/sr_trainer_gold.json").then(r => r.json()).then(setSrData).catch(() => {});
  }, []);

  // Real GOLD H4 candles + real fractal-detected S/R zones (see
  // tools/edu_build/build_sr_trainer_gold.py) -- not the fake 20-bar array
  // this trainer used to run on. Falls back to an empty shell while loading.
  const candles = useMemo(() => (srData ? srData.candles.map(c => ({o:c.open,h:c.high,l:c.low,c:c.close})) : []), [srData]);
  const correctZones = useMemo(() => (srData ? srData.zones.map(z => ({
    price: z.price,
    label: z.type === "support" ? S.srZoneSupport : S.srZoneResistance,
    type: z.type,
    tolerance: Math.max(z.tolerance, 10),
  })) : []), [srData]);

  const priceMin = useMemo(() => (candles.length ? Math.min(...candles.map(c=>c.l)) * 0.998 : 2410), [candles]);
  const priceMax = useMemo(() => (candles.length ? Math.max(...candles.map(c=>c.h)) * 1.002 : 2600), [candles]);
  const priceRange = priceMax - priceMin;
  const chartW = W - PAD.l - PAD.r;
  const chartH = H - PAD.t - PAD.b;
  const candleW = candles.length ? Math.floor(chartW / candles.length) - 3 : 10;

  const toX = (i) => PAD.l + i * (chartW / candles.length) + candleW / 2;
  const toY = (p) => PAD.t + chartH - ((p - priceMin) / priceRange) * chartH;

  const [lines, setLines] = useState([]);
  const [dragging, setDragging] = useState(false);
  const [dragY, setDragY] = useState(null);
  const [checked, setChecked] = useState(false);
  const [score, setScore] = useState(null);
  const [saved, setSaved] = useState(false);
  const svgRef = useRef(null);

  const getSVGY = useCallback((e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return (clientY - rect.top) * (H / rect.height);
  }, []);

  const yToPrice = (y) => priceMin + ((chartH - (y - PAD.t)) / chartH) * priceRange;

  const onMouseDown = (e) => {
    if (checked || !candles.length) return;
    setDragging(true);
    setDragY(getSVGY(e));
  };
  const onMouseMove = (e) => {
    if (!dragging) return;
    setDragY(getSVGY(e));
  };
  const onMouseUp = (e) => {
    if (!dragging) return;
    setDragging(false);
    const y = getSVGY(e);
    if (y > PAD.t && y < H - PAD.b && lines.length < 3) {
      setLines(prev => [...prev, { y, price: Math.round(yToPrice(y)), id: Date.now() }]);
    }
    setDragY(null);
  };

  const checkAnswers = () => {
    let hits = 0;
    const results = lines.map(line => {
      const match = correctZones.find(z => Math.abs(z.price - line.price) <= z.tolerance);
      if (match) hits++;
      return { ...line, correct: !!match, matchLabel: match?.label };
    });
    setLines(results);
    setScore(Math.round((hits / correctZones.length) * 100));
    setChecked(true);
  };

  const reset = () => { setLines([]); setChecked(false); setScore(null); setSaved(false); };

  const saveToJournal = () => {
    setSaved(true);
    const doFetch = (window.sbfAuth && window.sbfAuth.isLoggedIn && window.sbfAuth.isLoggedIn()) ? window.sbfAuth.fetch : fetch;
    doFetch('/api/journal/setups', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        symbol: "GOLD", timeframe: "H4", pattern_key: "sr_trainer",
        levels: lines.map(l => ({ price: l.price, correct: !!l.correct })),
        render_params: { window: srData && srData.meta ? srData.meta.range : null },
        thesis: `SR trainer: ${lines.length} lines drawn, score ${score}%`,
        status: "active",
      }),
    }).catch(() => {});
  };

  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"36px 40px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:28}}><img class='mi-icon' style={{verticalAlign:'middle'}} src='/assets/icons/icon-trend-up.png' alt='' width='20' height='20' /></span>
          <div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:22,color:C.black}}>{S.srTitle}</div>
            <Mono size={11} color={C.inkSoft} spacing={2}>{S.srKicker}</Mono>
          </div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          {!checked && lines.length > 0 &&
            <button onClick={reset} style={{background:"transparent",border:`1px solid ${C.border}`,padding:"8px 16px",cursor:"pointer",fontSize:12,fontFamily:"monospace",color:C.inkMid,borderRadius:3}}>{S.srReset}</button>
          }
          {!checked
            ? <button onClick={checkAnswers} disabled={lines.length===0} style={{background:lines.length===0?C.surfaceMid:C.black,color:C.white,border:"none",padding:"10px 20px",cursor:lines.length===0?"not-allowed":"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:1,borderRadius:3}}>{S.srCheck}</button>
            : <React.Fragment>
                <button onClick={saveToJournal} disabled={saved} style={{background:"transparent",border:`1px solid ${C.gold}`,color:C.gold,padding:"10px 16px",cursor:saved?"default":"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:0.5,borderRadius:3,opacity:saved?0.6:1}}>{saved?S.srSavedMsg:S.srSaveBtn}</button>
                <button onClick={reset} style={{background:C.gold,color:C.black,border:"none",padding:"10px 20px",cursor:"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:1,fontWeight:700,borderRadius:3}}>{S.srRetry}</button>
              </React.Fragment>
          }
        </div>
      </div>

      {/* Instructions */}
      {!checked && (
        <div style={{background:"rgba(201,151,58,0.08)",border:`1px solid ${C.borderGold}`,borderRadius:4,padding:"12px 16px",marginBottom:16,fontSize:13,color:C.inkMid}}>
          <img class='mi-icon' style={{verticalAlign:'middle'}} src='/assets/icons/icon-pin.png' alt='' width='20' height='20' /> <strong>{S.srInstrTask}</strong> {S.srInstrBody1}{correctZones.length}{S.srInstrBody2}{lines.length}/3
        </div>
      )}

      {/* Score */}
      {checked && score !== null && (
        <div style={{background: score>=67?C.greenPale:score>=33?"#fff8e1":C.redPale, border:`1px solid ${score>=67?"#2d7a4f":score>=33?C.gold:C.red}`, borderRadius:4,padding:"14px 20px",marginBottom:16,display:"flex",gap:12,alignItems:"center"}}>
          <img className="mi-icon" width="28" height="28" alt="" src={`/assets/icons/icon-${score>=67?"trophy":score>=33?"target":"books"}.png`}/>
          <div>
            <div style={{fontWeight:700,fontSize:16,color:score>=67?C.green:score>=33?C.gold:C.red}}>
              {score}% {S.srAccuracyLabel} {score>=67?S.srScoreGreat:score>=33?S.srScoreOk:S.srScoreLow}
            </div>
            <div style={{fontSize:13,color:C.inkMid,marginTop:3}}>
              {checked && `${S.srCorrectLevelsPrefix}${lines.filter(l=>l.correct).length}${S.srCorrectLevelsMid}${correctZones.length}${S.srCorrectLevelsSuffix}`}
            </div>
          </div>
        </div>
      )}

      {/* SVG Chart */}
      <div style={{borderRadius:4,overflow:"hidden",border:`1px solid ${C.border}`,cursor: checked?"default":"crosshair"}}>
        <svg
          ref={svgRef}
          viewBox={`0 0 ${W} ${H}`}
          style={{width:"100%",display:"block",background:C.black,userSelect:"none",touchAction:"none"}}
          onMouseDown={onMouseDown}
          onMouseMove={onMouseMove}
          onMouseUp={onMouseUp}
          onMouseLeave={() => { if(dragging){setDragging(false);setDragY(null);} }}>

          {/* Grid lines */}
          {[0,0.25,0.5,0.75,1].map(f => Math.round(priceMin + f*priceRange)).map(p => (
            <g key={p}>
              <line x1={PAD.l} y1={toY(p)} x2={W-PAD.r} y2={toY(p)} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>
              <text x={PAD.l-4} y={toY(p)+4} fontSize="9" fill="rgba(255,255,255,0.25)" textAnchor="end">{p}</text>
            </g>
          ))}

          {/* Candles */}
          {candles.map((c,i) => {
            const x = toX(i);
            const bull = c.c >= c.o;
            const col = bull ? "#2d7a4f" : "#c0392b";
            const bodyT = toY(Math.max(c.o,c.c));
            const bodyB = toY(Math.min(c.o,c.c));
            return (
              <g key={i}>
                <line x1={x} y1={toY(c.h)} x2={x} y2={toY(c.l)} stroke={col} strokeWidth="1.5"/>
                <rect x={x-candleW/2} y={bodyT} width={candleW} height={Math.max(bodyB-bodyT,1)} fill={col} rx="1"/>
              </g>
            );
          })}

          {/* User lines */}
          {lines.map(line => {
            const col = checked ? (line.correct ? "#2d7a4f" : "#c0392b") : C.gold;
            return (
              <g key={line.id}>
                <line x1={PAD.l} y1={line.y} x2={W-PAD.r} y2={line.y}
                  stroke={col} strokeWidth="1.5" strokeDasharray="6 3"/>
                <rect x={W-PAD.r-52} y={line.y-10} width={52} height={18} fill={col} opacity="0.9" rx="2"/>
                <text x={W-PAD.r-26} y={line.y+4} fontSize="9" fill="#fff" textAnchor="middle" fontFamily="monospace">
                  {line.price} {checked && line.correct && "✓"}
                </text>
              </g>
            );
          })}

          {/* Drag preview */}
          {dragging && dragY && (
            <line x1={PAD.l} y1={dragY} x2={W-PAD.r} y2={dragY}
              stroke={C.gold} strokeWidth="1" strokeDasharray="4 4" opacity="0.5"/>
          )}

          {/* Show correct zones after check */}
          {checked && correctZones.map((z,i) => (
            <g key={i}>
              <rect x={PAD.l} y={toY(z.price)-12} width={chartW} height={24}
                fill={z.type==="support"?"rgba(45,122,79,0.12)":"rgba(192,57,43,0.12)"}/>
              <text x={PAD.l+6} y={toY(z.price)+4} fontSize="10" fill={z.type==="support"?"#2d7a4f":"#c0392b"} fontFamily="monospace">
                {z.label} {z.price}
              </text>
            </g>
          ))}
        </svg>
      </div>

      <p style={{fontSize:11,color:C.inkFaint,marginTop:10,textAlign:"center"}}>
        {S.srFooter}
      </p>
    </div>
  );
}

  useEffect(() => {
    if (!window.SbfSimpleLang) return undefined;
    return window.SbfSimpleLang.subscribe(() => setSimpleTick(t => t + 1));
  }, []);
  // Якорь из адресной строки (SPEC_ch2_debug_and_chart_engine.md §5.2) --
  // slug = station.illustration (уже уникален и смысловой, напр. "2015_snb"),
  // не station.id (тот часто просто год, может повториться при добавлении
  // станций в будущем).
  const initialIdx = () => {
    const h = (typeof location !== "undefined" ? location.hash : "").replace("#", "");
    const i = h ? stations.findIndex(s => s.illustration === h) : -1;
    return i >= 0 ? i : 0;
  };
  const [idx, setIdx] = useState(initialIdx);
  const [done, setDone] = useState(() => stations.map((_,i) => i===initialIdx()));
  const station = stations[idx];
  const doneCount = done.filter(Boolean).length;

  const go = (i) => {
    setIdx(i);
    setDone(prev => { const n=[...prev]; n[i]=true; return n; });
    if (window.SbfAnchorReturn && stations[i]) window.SbfAnchorReturn.setStationAnchor(stations[i].illustration);
  };

  // Проброс "перейти к станции по slug" для несоседних блоков этой же
  // страницы (напр. упоминание "станция 11" в ПРАВИЛЕ БЕЗОПАСНОСТИ ниже --
  // SPEC_ch2_debug_and_chart_engine.md §5.1, ровно пример из спеки).
  useEffect(() => {
    window.SbfChrono2GoTo = (slug) => {
      const i = stations.findIndex(s => s.illustration === slug);
      if (i < 0) return;
      go(i);
      const el = document.getElementById("secChrono");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    return () => { delete window.SbfChrono2GoTo; };
  }, [stations, idx]);

  const sceneMeta = station && station.scene ? CH2_SCENE_META[station.scene] : null;
  const sceneCopy = station && station.scene && window.Chrono2SceneCopy[station.scene]
    ? (window.Chrono2SceneCopy[station.scene][lang] || window.Chrono2SceneCopy[station.scene].ru)
    : null;

  return (
    <div className="history-ep">
      <SectionTitle id="secChrono" sub={S.chronoSub}>{S.chronoTitle}</SectionTitle>
      <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:16,marginTop:-24}}>{S.chronoTag}</Mono>
      <div className="h-chrono">
        {stations.map((s,i) => (
          <React.Fragment key={s.id}>
            {i>0 && <span className="h-sep">—</span>}
            <button className={"h-node"+(i===idx?" active":done[i]?" done":"")} onClick={()=>go(i)}>
              {s.id === "today" ? S.chronoToday : s.id}
            </button>
          </React.Fragment>
        ))}
      </div>
      <p className="h-progress" style={{marginBottom:30}}>{S.chronoChronicle}: <b>{doneCount}/{stations.length}</b> · {S.chronoXpNote}</p>

      {station && (
        <div className="h-station" style={{marginBottom:40}}>
          <div className="h-passepartout">
            <div className="h-artwork" dangerouslySetInnerHTML={{__html: window.Chrono2StationArtHTML(station.illustration)}}/>
            <div className="h-caption"><span>{station.year} · {station.place}</span><span className="h-src">{station.source}</span></div>
          </div>
          <div>
            <div className="h-station-head"><span className="h-station-year">{station.year}</span><span className="h-station-place">{station.place}</span></div>
            <h3 className="h-station-title">{station.title}</h3>
            <p className="h-station-body">{window.SbfSimpleLang && station ? window.SbfSimpleLang.pick(station, "body") : (station && station.body)}</p>
            {station.fact && <div className="h-callout h-callout-fact">{station.fact}</div>}
            {station.legend && <div className="h-callout h-callout-legend">{station.legend}</div>}
            {idx < stations.length-1 && (
              <div style={{marginTop:14}}><button className="h-btn" onClick={()=>go(idx+1)}>{S.chronoNext}</button></div>
            )}
          </div>
        </div>
      )}

      {sceneMeta && sceneCopy && (
        <div style={{marginTop:24,marginBottom:40}}>
          <Mono size={10} color={C.inkFaint} spacing={1} style={{display:"block",marginBottom:10}}>{S.sceneKicker}</Mono>
          <SceneMount url={`/data/edu_scenes/${station.scene}.json`} mode={sceneMeta.mode} symbol={sceneMeta.symbol} copy={sceneCopy}/>
        </div>
      )}
    </div>
  );
}

          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{S.predictTag}</Mono>
          <p style={{fontSize:14.5,color:C.black,lineHeight:1.65,marginBottom:14}}>{predict.fallbackQ}</p>
          <div style={{display:"flex",gap:10}}>
            <button className="h-btn">{predict.yes}</button>
            <button className="h-btn ghost">{predict.no}</button>
          </div>
        </div>

        <div style={{border:`1px dashed ${C.borderGold}`,borderRadius:8,padding:"20px 24px",marginBottom:32,background:C.surface}}>
          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{S.cliffTag}</Mono>
          <p style={{fontSize:14,color:C.inkMid,lineHeight:1.7,margin:0}}>{cliffhanger.body}</p>
        </div>

        <ComplianceFootnote lang={lang} />

        {/* Footer navigation */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:20,paddingTop:48,marginTop:48,borderTop:`1px solid ${C.border}`}}>
          <span
            onClick={() => window.location.href = getChUrl(1, lang)}
            style={{fontSize:14,color:C.inkSoft,fontFamily:"monospace",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}>
            {S.navPrev}
          </span>
          <AskAnalystBtn tr={{askAnalyst:S.askAnalyst}} chapterNum={2} lang={lang} />
          <button
            onClick={() => window.location.href = getChUrl(3, lang)}
            style={{background:C.black,color:C.white,border:"none",padding:"18px 35px",cursor:"pointer",fontFamily:"monospace",fontSize:14,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.target.style.background=C.gold}
            onMouseLeave={e=>e.target.style.background=C.black}>
            {S.navNext}
          </button>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter2 />);
{% endraw %}
</script>
