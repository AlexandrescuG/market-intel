// ─── Interactive 1: Hedge Fund Position Builder (Liquidity Sweep) ─────────────
function HedgeFundSim() {
  const { useState, useEffect, useRef } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;

  // State
  const [phase, setPhase] = useState("idle"); // idle | accumulating | sweeping | buying | done
  const [fundFilled, setFundFilled] = useState(0);   // 0..100000 — fund's target
  const [retailStops, setRetailStops] = useState(true); // stops still in the book
  const [sweepActive, setSweepActive] = useState(false);
  const [price, setPrice] = useState(2510.00);
  const [priceHistory, setPriceHistory] = useState(Array.from({length:30},(_,i)=>2510 + Math.sin(i*0.4)*1.5));
  const [bookAsks, setBookAsks] = useState([
    {p:2510.20,v:8000},{p:2510.50,v:5000},{p:2511.00,v:3000},
    {p:2511.50,v:2000},{p:2512.00,v:1500},{p:2513.00,v:1000},
  ]);
  const [message, setMessage] = useState(S.hedgeMsgInitial);
  const [msgColor, setMsgColor] = useState(C.gold);
  const [stopBought, setStopBought] = useState(0);
  const [animFlash, setAnimFlash] = useState(null); // 'up'|'down'
  const timerRef = useRef(null);

  const FUND_TARGET = 100000;
  const RETAIL_STOP_VOLUME = 72000; // volume freed when stops hit
  const STOP_LEVEL = 2503.50;

  const totalAsk = bookAsks.reduce((a,b)=>a+b.v,0);

  // Phase: try buy from book — insufficient
  const tryBuyMarket = () => {
    if (phase !== "idle") return;
    setPhase("accumulating");
    setMessage(S.hedgeMsgTryBuy);
    setMsgColor(C.red);
    // animate price up slightly as buying pushes market
    let t = 0;
    timerRef.current = setInterval(() => {
      t++;
      setPrice(p => +(p + 0.15).toFixed(2));
      setPriceHistory(h => [...h.slice(1), price + t*0.15]);
      if (t >= 5) {
        clearInterval(timerRef.current);
        setPhase("need_sweep");
        setMessage(S.hedgeMsgInsufficient);
        setMsgColor(C.red);
        setFundFilled(20500);
      }
    }, 300);
  };

  // Phase: initiate sweep — fake sell pressure
  const initiateSweep = () => {
    if (phase !== "need_sweep") return;
    setPhase("sweeping");
    setSweepActive(true);
    setMessage(S.hedgeMsgSweepStart);
    setMsgColor("#f59e0b");
    let t = 0;
    timerRef.current = setInterval(() => {
      t++;
      const drop = t <= 8 ? -0.6 : 0.0;
      setPrice(p => +(p + drop).toFixed(2));
      setPriceHistory(h => {
        const last = h[h.length-1];
        return [...h.slice(1), +(last + drop).toFixed(2)];
      });
      if (t === 6) {
        setMessage(S.hedgeMsgPanic);
        setRetailStops(false);
      }
      if (t >= 8) {
        clearInterval(timerRef.current);
        setPhase("buying");
        setMessage(S.hedgeMsgStopsHit);
        setMsgColor(C.green);
        setSweepActive(false);
        startBuying();
      }
    }, 280);
  };

  const startBuying = () => {
    let bought = 20500;
    let t = 0;
    timerRef.current = setInterval(() => {
      t++;
      const chunk = Math.floor(Math.random() * 6000 + 3000);
      bought = Math.min(FUND_TARGET, bought + chunk);
      setFundFilled(bought);
      setStopBought(b => b + chunk);
      // price recovering
      setPrice(p => +(p + 0.4 + Math.random()*0.2).toFixed(2));
      setPriceHistory(h => {
        const last = h[h.length-1];
        return [...h.slice(1), +(last + 0.4 + Math.random()*0.2).toFixed(2)];
      });
      if (bought >= FUND_TARGET) {
        clearInterval(timerRef.current);
        setPhase("done");
        setMessage(S.hedgeMsgDone);
        setMsgColor(C.green);
        setAnimFlash("up");
        setTimeout(() => setAnimFlash(null), 800);
      }
    }, 350);
  };

  const reset = () => {
    clearInterval(timerRef.current);
    setPhase("idle");
    setFundFilled(0);
    setRetailStops(true);
    setSweepActive(false);
    setPrice(2510.00);
    setPriceHistory(Array.from({length:30},(_,i)=>2510 + Math.sin(i*0.4)*1.5));
    setBookAsks([{p:2510.20,v:8000},{p:2510.50,v:5000},{p:2511.00,v:3000},{p:2511.50,v:2000},{p:2512.00,v:1500},{p:2513.00,v:1000}]);
    setMessage(S.hedgeMsgInitial);
    setMsgColor(C.gold);
    setStopBought(0);
    setAnimFlash(null);
  };

  const W = 680, H = 120;
  const minP = Math.min(...priceHistory) - 1;
  const maxP = Math.max(...priceHistory) + 1;
  const toY = p => H - ((p - minP) / (maxP - minP)) * H;
  const pts = priceHistory.map((p,i) => `${i*(W/(priceHistory.length-1))},${toY(p)}`).join(" ");
  const stopY = toY(STOP_LEVEL);

  const fillPct = Math.round((fundFilled / FUND_TARGET) * 100);

  return (

        </div>
        {phase !== "idle" && (
          <button onClick={reset} style={{marginLeft:"auto",padding:"7px 14px",background:"rgba(255,255,255,0.07)",color:"rgba(255,255,255,0.5)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:3,cursor:"pointer",fontFamily:"monospace",fontSize:11}}>{S.hedgeReset}</button>
        )}
      </div>

      {/* Mission bar */}
      <div style={{background:"rgba(255,255,255,0.04)",borderRadius:4,padding:"14px 18px",marginBottom:24,display:"flex",gap:20,alignItems:"center",flexWrap:"wrap"}}>

          <div style={{fontWeight:700,fontSize:16,color:C.gold,fontFamily:"monospace"}}>{S.hedgeTaskValue}</div>
        </div>
        <div style={{marginLeft:"auto",textAlign:"right"}}>
          <div style={{fontSize:10,fontFamily:"monospace",color:"rgba(255,255,255,0.35)",letterSpacing:1,marginBottom:4}}>{S.hedgeFilledLabel}</div>
          <div style={{fontWeight:700,fontSize:22,color: fillPct>=100?C.green:fillPct>20?C.gold:C.red,fontFamily:"monospace"}}>{fillPct}%</div>

      </div>

      {/* Progress bar */}
      <div style={{background:"rgba(255,255,255,0.06)",borderRadius:3,height:8,marginBottom:28,overflow:"hidden"}}>

      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 220px",gap:24,alignItems:"start",marginBottom:24}} className="g2">

        {/* Chart */}

          <div style={{borderRadius:4,overflow:"hidden",border:"1px solid rgba(255,255,255,0.08)"}}>
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block",background:C.chart}}>
              {/* Stop level zone */}
              <rect x="0" y={stopY-20} width={W} height={20} fill="rgba(242,54,69,0.08)"/>
              <line x1="0" y1={stopY} x2={W} y2={stopY} stroke={C.red} strokeWidth="1" strokeDasharray="5 3" opacity="0.6"/>

      {/* Action buttons */}
      <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>

            color: phase==="idle"?"#fff":"rgba(255,255,255,0.2)",

          disabled={phase !== "need_sweep"}
          style={{padding:"12px 22px",
            background: phase==="need_sweep"?C.red:"rgba(255,255,255,0.03)",
            color: phase==="need_sweep"?"#fff":"rgba(255,255,255,0.2)",
            border:"none",borderRadius:4,
            cursor: phase==="need_sweep"?"pointer":"not-allowed",
            fontFamily:"monospace",fontSize:12,letterSpacing:1,fontWeight:700}}>
          {S.hedgeBtn2}
        </button>
        {phase === "done" && (
          <button onClick={reset} style={{padding:"12px 22px",background:C.greenD,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:1,fontWeight:700}}>
            {S.hedgeBtnRepeat}
          </button>
        )}
      </div>

      {phase === "done" && (
        <div style={{marginTop:20,background:"rgba(8,153,129,0.1)",border:`1px solid ${C.green}44`,borderRadius:4,padding:"16px 20px"}}>

          <p style={{fontSize:13,color:"rgba(255,255,255,0.6)",lineHeight:1.65}}>
            {S.hedgeResultBody}
          </p>
        </div>
      )}
    </div>
  );
}

          {phase === "result" && S.xrayHintResult}
        </div>
      </div>
    </div>
  );
}

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:48,marginTop:48,borderTop:`1px solid ${C.border}`}}>
          <span onClick={() => setAskOpen(true)} style={{fontSize:14,color:C.inkSoft,fontFamily:"monospace",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}>
            {S.askQuestionFooter}
          </span>
          <button
            onClick={() => window.location.href = getChUrl(8)}
            style={{background:C.black,color:C.white,border:"none",padding:"18px 35px",cursor:"pointer",fontFamily:"monospace",fontSize:14,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.target.style.background=C.gold}
            onMouseLeave={e=>e.target.style.background=C.black}>
            {S.nextChapterBtn}
          </button>
        </div>

      </div>

      {askOpen && <AskAnalystPopup onClose={() => setAskOpen(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter7 />);
{% endraw %}
</script>
