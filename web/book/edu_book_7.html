function fillTemplate(str, vars) {
  if (!str) return str;
  return str.replace(/\{\{(\w+)\}\}/g, (m, key) => {
    const v = vars ? vars[key] : undefined;
    if (v === undefined || v === null || (typeof v === "number" && isNaN(v))) {
      console.error("[ch7] отсутствует значение для {{" + key + "}}");
      return "—";
    }
    return String(v);
  });
}

// ── Загрузка данных главы: pattern_reality.json (ядро) + xray_days.json (рентген).
function useCh7Data() {
  const { useState, useEffect } = React;
  const [state, setState] = useState({ loading: true, error: null, patterns: null, xray: null });
  useEffect(() => {
    let cancelled = false;
    Promise.all([
      fetch("/data/edu_stats/pattern_reality.json").then(r => { if (!r.ok) throw new Error("pattern_reality.json HTTP " + r.status); return r.json(); }),
      fetch("/data/edu_scenes/ch7_xray.json").then(r => { if (!r.ok) throw new Error("ch7_xray.json HTTP " + r.status); return r.json(); }),
    ]).then(([patterns, xray]) => {
      if (!cancelled) setState({ loading: false, error: null, patterns, xray });
    }).catch(err => {
      console.error("[ch7] load failed:", err);
      if (!cancelled) setState({ loading: false, error: err, patterns: null, xray: null });
    });
    return () => { cancelled = true; };
  }, []);
  return state;
}

function buildVars(patterns, xray, lang) {
  if (!patterns || !xray) return null;
  const T7 = window.Ch7Content[lang] || window.Ch7Content.ru;
  const sum = patterns.summary || {};
  const verdictText = sum.verdict_key === "coin_flip" ? T7.coreMeasure.verdictCoinFlip
    : sum.verdict_key === "weak_tilt" ? T7.coreMeasure.verdictWeakTilt : T7.coreMeasure.verdictMixed;
  return {
    agree_min: sum.agree_min, agree_max: sum.agree_max, n_total: sum.n_total,
    verdict_line: verdictText,
    break_retest_agree: sum.highlight ? sum.highlight.agree_5 : null,
    break_retest_n: sum.highlight ? sum.highlight.n : null,
    adverse_ratio: sum.adverse_move_ratio,
    n_days: xray.meta.n_days, xray_hit: xray.meta.xray_hit,
  };
}

// ─── Cold start: "Цена спешки" (SPEC_coldstart_interactives_ch6_15.md §3) ──────
// Заменяет прежний ColdOpen7. BIG_ORDER_BOOK -- тот же стакан, что чуть ниже
// использует BigOrderBridge (реальный "мост со стаканом главы 4"), просто
// читается раньше по счёту функций -- порядок объявлений не важен, это
// module-level const, вычисляется один раз при загрузке скрипта.
function ColdStart7Entry() {
  const T7 = window.Ch7Content[INITIAL_LANG] || window.Ch7Content.ru;
  const cs = T7.coldStart;
  const SIZE = 500;
  const { asks } = BIG_ORDER_BOOK;
  const walk = (size) => {
    let remaining = size, cost = 0, filledQty = 0;
    for (const a of asks) {
      const take = Math.min(remaining, a.v);
      cost += take * a.p; filledQty += take; remaining -= take;
      if (remaining <= 0) break;
    }
    return filledQty ? cost / filledQty : asks[0].p;
  };
  const avgNow = walk(SIZE);
  const avgSlow = asks[0].p; // патиентное исполнение -- без давления на стакан, лучшая котировка
  return (
    <ColdStart
      tag={cs.tag}
      ask={cs.ask}
      action={{ type: "choice", options: [
        { label: cs.optNow, value: "now" }, { label: cs.optSlow, value: "slow" },
      ]}}
      reveal={() => fillTemplate(cs.revealTemplate, {
        avgNow: avgNow.toFixed(2), slipNow: (avgNow - asks[0].p).toFixed(2),
        avgSlow: avgSlow.toFixed(2), diffPts: (avgNow - avgSlow).toFixed(2), size: SIZE,
      })}
      bridge={cs.bridge}
    />
  );
}

// ─── Cold start, середина: "Где была активность" (§3 середина) ────────────────
// Реальный последний полный торговый день из /data/ohlc_GOLD_M30.json (тот же
// файл, что использует остальной сайт) -- volume уже лежит в каждом ohlc_*.json
// параллельным массивом и раньше нигде в курсе не показывался.
function ColdStart7Middle() {
  const { useState, useEffect, useMemo, useRef } = React;
  const T7 = window.Ch7Content[INITIAL_LANG] || window.Ch7Content.ru;
  const cm = T7.coldStartMiddle;
  const [day, setDay] = useState(null);
  const [picked, setPicked] = useState(null);
  const containerRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    fetch("/data/ohlc_GOLD_M30.json").then(r => r.json()).then(d => {
      if (cancelled) return;
      const byDay = {};
      d.candles.forEach((c, i) => {
        const key = new Date(c.time * 1000).toISOString().slice(0, 10);
        (byDay[key] = byDay[key] || []).push({ ...c, vol: d.volume[i] });
      });
      const fullDays = Object.keys(byDay).filter(k => byDay[k].length >= 45).sort();
      const lastDay = byDay[fullDays[fullDays.length - 1]];
      setDay(lastDay);
    }).catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const zones = useMemo(() => {
    if (!day) return null;
    const third = Math.floor(day.length / 3);
    const segs = [day.slice(0, third), day.slice(third, 2 * third), day.slice(2 * third)];
    const hm = (t) => new Date(t * 1000).toISOString().slice(11, 16);
    return segs.map((seg, i) => ({
      idx: i, from: hm(seg[0].time), to: hm(seg[seg.length - 1].time),
      vol: seg.reduce((s, c) => s + c.vol.value, 0),
    }));
  }, [day]);

  useEffect(() => {
    if (!containerRef.current || chartRef.current || typeof LightweightCharts === "undefined" || !day) return undefined;
    const chart = LightweightCharts.createChart(containerRef.current, {
      width: containerRef.current.clientWidth, height: 300,
      layout: { background: { color: C.chartBg }, textColor: "rgba(255,255,255,0.55)" },
      grid: { vertLines: { color: "rgba(255,255,255,0.05)" }, horzLines: { color: "rgba(255,255,255,0.05)" } },
      rightPriceScale: { borderColor: "rgba(255,255,255,0.15)" },
      timeScale: { borderColor: "rgba(255,255,255,0.15)", timeVisible: true, secondsVisible: false },
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: C.chartGreen, downColor: C.chartRed, borderUpColor: C.chartGreen, borderDownColor: C.chartRed,
      wickUpColor: C.chartGreen, wickDownColor: C.chartRed,
    });
    const volumeSeries = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol" });
    volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
    candleSeries.setData(day.map(c => ({ time: c.time, open: +c.open, high: +c.high, low: +c.low, close: +c.close })));
    chart.timeScale().fitContent();
    chartRef.current = { chart, candleSeries, volumeSeries };
    const ro = new ResizeObserver(entries => { if (entries[0]) chart.applyOptions({ width: entries[0].contentRect.width }); });
    ro.observe(containerRef.current);
    return () => { ro.disconnect(); chart.remove(); chartRef.current = null; };
  }, [day]);

  useEffect(() => {
    if (!chartRef.current) return;
    chartRef.current.volumeSeries.setData(picked == null ? [] : day.map(c => ({ time: c.time, value: c.vol.value, color: c.vol.color })));
  }, [picked, day]);

  if (!day || !zones) return <div style={{background:C.black,padding:"60px 5vw",textAlign:"center"}}><Mono size={11} color={C.gold} spacing={4}>{cm.tag}</Mono></div>;

  const topZone = zones.reduce((a, b) => (b.vol > a.vol ? b : a));

  return (
    <ColdStart
      tag={cm.tag}
      ask={cm.ask}
      action={{ type: "custom", render: (csCommit) => (
        <div>
          <div style={{position:"relative", borderRadius:6, overflow:"hidden"}}>
            <div ref={containerRef} data-source="/data/ohlc_GOLD_M30.json"/>
          </div>
          <div style={{display:"flex", gap:10, justifyContent:"center", flexWrap:"wrap", marginTop:16}}>
            {zones.map(z => {
              const isPicked = picked === z.idx;
              return (
                <button key={z.idx} disabled={picked != null} onClick={() => { setPicked(z.idx); csCommit(z.idx); }} style={{
                  fontFamily:"monospace", fontSize:13, fontWeight:700, padding:"12px 18px", borderRadius:4,
                  cursor: picked != null ? "default" : "pointer",
                  background: isPicked ? C.gold : "rgba(255,255,255,0.06)", color: isPicked ? C.black : "#fff",
                  border:`1px solid ${isPicked ? C.gold : "rgba(255,255,255,0.22)"}`,
                  opacity: picked != null && !isPicked ? 0.45 : 1,
                }}>{z.from}–{z.to}</button>
              );
            })}
          </div>
          {picked != null && <p style={{textAlign:"center", fontSize:11, color:"rgba(255,255,255,0.4)", fontStyle:"italic", marginTop:14}}>{cm.noteTicks}</p>}
        </div>
      )}}
      reveal={() => picked == null ? null : fillTemplate(cm.revealTemplate, {
        topLabel: `${topZone.from}–${topZone.to}`, topVol: topZone.vol.toLocaleString(),
        matchText: picked === topZone.idx ? cm.matchYes : cm.matchNo,
      })}
      bridge={cm.bridge}
    />
  );
}

// ─── Задача крупного участника — мост со стаканом главы 4 ─────────────────────
const BIG_ORDER_BOOK = (() => {
  const mid = 4079.4;
  const asks = [], bids = [];
  // 16 уровней с полом объёма 35 (мин. суммарная глубина 16*35=560) --
  // гарантирует, что заявка на 500 лотов реально проходит сквозь НЕСКОЛЬКО
  // уровней и никогда не закрывается одним верхним уровнем целиком (баг,
  // пойманный на скриншоте: с *10-масштабом и 12 уровнями топ оф бук иногда
  // в одиночку перекрывал весь объём, и slippage выходил 0.00).
  for (let i = 0; i < 16; i++) {
    asks.push({ p: mid + 0.10 + i * 0.10, v: Math.round(35 + Math.random() * 45) });
    bids.push({ p: mid - 0.10 - i * 0.10, v: Math.round(35 + Math.random() * 45) });
  }
  return { asks, bids, mid };
})();

function BigOrderBridge() {
  const { useState, useMemo } = React;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const T7 = window.Ch7Content[INITIAL_LANG] || window.Ch7Content.ru;
  const bo = T7.bigOrderTask;
  const [touched, setTouched] = useState(false);
  const [size, setSize] = useState(100);

  const { asks, bids, mid } = BIG_ORDER_BOOK;
  const maxVol = Math.max(...asks.map(a=>a.v), ...bids.map(b=>b.v));
  const totalDepth = asks.reduce((s,a) => s+a.v, 0);

  // SPEC_ch7_debug.md §6: раньше кнопка исполняла ровно 500 лотов и ничего
  // больше -- дешёвое добавление, о котором просит спека, это сделать размер
  // заявки ползунком, чтобы среднюю цену/проскальзывание было видно живьём,
  // а не одной зафиксированной точкой.
  const filled = useMemo(() => {
    let remaining = size, cost = 0, filledQty = 0;
    for (const a of asks) {
      const take = Math.min(remaining, a.v);
      cost += take * a.p; filledQty += take; remaining -= take;
      if (remaining <= 0) break;
    }
    const avg = filledQty ? cost / filledQty : asks[0].p;
    return { avg, remaining, topOfBook: asks[0].p, slippage: avg - asks[0].p, filledQty };
  }, [size]);

  return (
    <div style={{marginBottom:48}}>
      <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:10,maxWidth:820}}>{bo.preamble}</p>
      <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,marginBottom:24,maxWidth:820}}>{bo.keyPoint}</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:28}} className="g3">
        {[[bo.c1Title,bo.c1Text],[bo.c2Title,bo.c2Text],[bo.c3Title,bo.c3Text]].map(([t,x],i) => (
          <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:"18px 20px",borderTop:`3px solid ${C.gold}`}}>
            <div style={{fontWeight:600,fontSize:13,color:C.black,marginBottom:8}}>{t}</div>
            <p style={{fontSize:12,color:C.inkMid,lineHeight:1.65,margin:0}}>{x}</p>
          </div>
        ))}

// ─── Таблица паттернов (§3.5) ──────────────────────────────────────────────────
function PatternRealityTable({ patterns }) {
  const T7 = window.Ch7Content[INITIAL_LANG] || window.Ch7Content.ru;
  const cm = T7.coreMeasure;
  const { useState, useMemo } = React;
  const [instrument, setInstrument] = useState("GOLD");
  const cells = (patterns && patterns.cells) || [];
  const symbols = useMemo(() => Array.from(new Set(cells.map(c=>c.symbol))).sort(), [cells]);
  const nameKey = "display_name_" + INITIAL_LANG;
  const naData = INITIAL_LANG==="ru"?"мало данных":INITIAL_LANG==="ro"?"date insuficiente":"not enough data";
  // 🔴 Таблица отвечала на один вопрос — «у какого паттерна больше
  // наблюдений». А читатель приходит сюда с другим: «какой дальше всех от
  // опорных 50%». Сортировка по колонке превращает выкладку в инструмент, а
  // не в картинку: 2685 знаков подряд читались как абзац.
  //
  // Шапка сделана так же, как в главах 8 и 9: aria-sort сообщает направление,
  // кнопка внутри даёт фокус и Enter/Space без своей обработки клавиш.
  const [sortKey, setSortKey] = useState("n");
  const [sortDir, setSortDir] = useState(1);          // 1 = по убыванию
  const onSort = (k) => {
    if (k === sortKey) { setSortDir(-sortDir); return; }
    setSortKey(k); setSortDir(1);
  };
  const rows = useMemo(() => {
    const взять = (c) => {
      if (sortKey === "pattern") return (c[nameKey] || c.pattern_key || "").toLowerCase();
      if (sortKey === "tf") return c.tf || "";
      // Отклонение от случайности, а не сам процент: 42% и 58% одинаково
      // далеки от опорной линии, и в таблице про «есть ли сигнал» важно
      // именно расстояние.
      if (sortKey === "agree") return c.shown ? Math.abs(c.agree_5 * 100 - 50) : -1;
      return c.n || 0;
    };
    const свои = cells.filter(c => c.symbol === instrument);
    return свои.slice().sort((a, b) => {
      const x = взять(a), y = взять(b);
      if (typeof x === "string") return sortDir * y.localeCompare(x);
      return sortDir * (y - x);
    });
  }, [cells, instrument, sortKey, sortDir, nameKey]);
  const колонки = [
    {key:"pattern", label: cm.patternLabel, align:"left"},
    {key:"tf", label:"TF", align:"center"},
    {key:"agree", label:"agree_5", align:"center"},
    {key:"n", label:"n", align:"center"},
  ];

  return (
    <div>
      <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
        {symbols.map(s => (
          <button key={s} onClick={()=>setInstrument(s)} style={{fontFamily:"monospace",fontSize:10.5,padding:"5px 10px",cursor:"pointer",background:s===instrument?C.gold:"#fff",color:s===instrument?"#18181a":C.inkMid,border:`1px solid ${s===instrument?C.gold:C.border}`,borderRadius:3}}>{window.SBFSymbols ? window.SBFSymbols.symbolName(s, {lang: INITIAL_LANG, mode:"name+ticker"}) : s}</button>
        ))}
      </div>
      <div style={{overflowX:"auto",marginBottom:8}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:560}}>
          <thead>
            <tr>
              {колонки.slice(0,3).map(col => (
                <th key={col.key} scope="col"
                    aria-sort={sortKey===col.key ? (sortDir>0?"descending":"ascending") : "none"}
                    style={{textAlign:col.align,padding:0,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>
                  <button type="button" onClick={()=>onSort(col.key)}
                    style={{width:"100%",textAlign:col.align,padding:"8px 10px",fontSize:10.5,fontFamily:"monospace",color:sortKey===col.key?C.gold:C.inkFaint,textTransform:"uppercase",cursor:"pointer",userSelect:"none",background:"none",border:"none",fontWeight:600}}>
                    {col.label}{sortKey===col.key ? (sortDir>0?" ▾":" ▴") : ""}
                  </button>
                </th>
              ))}
              <th scope="col" style={{textAlign:"center",padding:"8px 10px",fontSize:10.5,fontFamily:"monospace",color:C.inkFaint,borderBottom:`1px solid ${C.border}`}}>CI95</th>
              <th scope="col"
                  aria-sort={sortKey==="n" ? (sortDir>0?"descending":"ascending") : "none"}
                  style={{textAlign:"center",padding:0,borderBottom:`1px solid ${C.border}`}}>
                <button type="button" onClick={()=>onSort("n")}
                  style={{width:"100%",textAlign:"center",padding:"8px 10px",fontSize:10.5,fontFamily:"monospace",color:sortKey==="n"?C.gold:C.inkFaint,cursor:"pointer",userSelect:"none",background:"none",border:"none",fontWeight:600}}>
                  n{sortKey==="n" ? (sortDir>0?" ▾":" ▴") : ""}
                </button>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr><td colSpan="5" style={{padding:"6px 10px",fontSize:10.5,fontFamily:"monospace",color:C.inkFaint,fontStyle:"italic",borderBottom:`1px solid ${C.border}`}}>{INITIAL_LANG==="ru"?"опорная линия случайности":INITIAL_LANG==="ro"?"linia de referință a întâmplării":"random baseline"}: 50%</td></tr>
            {rows.map((c,i) => (
              <tr key={i}>
                <td style={{padding:"7px 10px",fontSize:12,color:C.black,fontWeight:600,borderBottom:`1px solid ${C.border}`}}>{c[nameKey] || c.pattern_key}</td>
                <td style={{padding:"7px 10px",textAlign:"center",fontSize:11,fontFamily:"monospace",color:C.inkSoft,borderBottom:`1px solid ${C.border}`}}>{c.tf}</td>
                <td style={{padding:"7px 10px",textAlign:"center",fontSize:12,fontFamily:"monospace",fontWeight:600,color: c.shown ? (Math.abs(c.agree_5*100-50)>10?C.gold:C.black) : C.inkFaint,borderBottom:`1px solid ${C.border}`}}>{c.shown ? (c.agree_5*100).toFixed(1)+"%" : naData}</td>
                <td style={{padding:"7px 10px",textAlign:"center",fontSize:11,fontFamily:"monospace",color:C.inkFaint,borderBottom:`1px solid ${C.border}`}}>{c.shown && c.ci95[0]!=null ? `${c.ci95[0]}–${c.ci95[1]}` : "—"}</td>
                <td style={{padding:"7px 10px",textAlign:"center",fontSize:11,fontFamily:"monospace",color:C.inkSoft,borderBottom:`1px solid ${C.border}`}}>{c.n}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─── "Рентген", перевёрнутый (3 шага) ──────────────────────────────────────────
function XrayReversed({ xray }) {
  const { useState, useEffect, useRef } = React;
  const T7 = window.Ch7Content[INITIAL_LANG] || window.Ch7Content.ru;
  const xr = T7.xray;
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const [step, setStep] = useState(1);
  const [dayIdx, setDayIdx] = useState(0);
  const [dayGuesses, setDayGuesses] = useState({});
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const seriesRef = useRef({});
  const priceLinesRef = useRef([]);

  const days = (xray && xray.days) || [];
  const day = days[dayIdx];

  const zoneLabel = (kind) => kind === "round_number" ? xr.zoneRound : kind === "prev_session_high" ? xr.zonePrevHigh : xr.zonePrevLow;
  const outcomeLabel = (o) => o === "reversed" ? xr.outcomeReversed : o === "broke_through" ? xr.outcomeBroke : xr.outcomeInconclusive;

  // Create the chart once step>=2 makes the container mount.
  useEffect(() => {
    if (step < 2 || !containerRef.current || chartRef.current || typeof LightweightCharts === "undefined") return;
    const chart = LightweightCharts.createChart(containerRef.current, {
      width: containerRef.current.clientWidth, height: 260,
      layout: { background: { color: C.black }, textColor: "rgba(255,255,255,0.5)" },
      grid: { vertLines: { color: "rgba(255,255,255,0.05)" }, horzLines: { color: "rgba(255,255,255,0.05)" } },
      rightPriceScale: { borderColor: "rgba(255,255,255,0.15)" },
      timeScale: { borderColor: "rgba(255,255,255,0.15)", timeVisible: true, secondsVisible: false },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: "rgba(46,204,113,0.8)", downColor: "rgba(231,76,60,0.8)",
      borderUpColor: "rgba(46,204,113,0.8)", borderDownColor: "rgba(231,76,60,0.8)",
      wickUpColor: "rgba(46,204,113,0.8)", wickDownColor: "rgba(231,76,60,0.8)",
    });
    const volumeSeries = chart.addHistogramSeries({ color: "rgba(255,255,255,0.16)", priceFormat: { type: "volume" }, priceScaleId: "vol" });
    chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
    chartRef.current = chart;
    seriesRef.current = { candleSeries, volumeSeries };
    const ro = new ResizeObserver(entries => { if (entries[0]) chart.applyOptions({ width: entries[0].contentRect.width }); });
    ro.observe(containerRef.current);
    return () => { ro.disconnect(); chart.remove(); chartRef.current = null; };
  }, [step >= 2]);

  // Push the real day's candles/volume/zones/touch marker.
  useEffect(() => {
    const s = seriesRef.current;
    if (!s.candleSeries || !day) return;
    const candles = day.candles || [];
    s.candleSeries.setData(candles.map(c => ({ time: c.time, open: +c.open, high: +c.high, low: +c.low, close: +c.close })));
    s.volumeSeries.setData(candles.map(c => ({ time: c.time, value: c.volume || 0, color: (day.touch && c.time === day.touch.touch_time) ? "rgba(201,151,58,0.55)" : "rgba(255,255,255,0.16)" })));

    priceLinesRef.current.forEach(pl => s.candleSeries.removePriceLine(pl));
    priceLinesRef.current = (day.zones || []).map(z => s.candleSeries.createPriceLine({
      price: z.price, color: z.kind === "round_number" ? "rgba(201,151,58,0.6)" : "rgba(139,92,246,0.75)",
      lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: zoneLabel(z.kind),
    }));

    if (day.touch) {
      s.candleSeries.setMarkers([{ time: day.touch.touch_time, position: "aboveBar", color: C.gold, shape: "circle", text: day.touch.zone_price.toFixed(0) }]);
    } else {
      s.candleSeries.setMarkers([]);
    }
    chartRef.current.timeScale().fitContent();
  }, [day, step >= 2]);

  if (!day) return <p style={{color:C.inkFaint}}>—</p>;

  return (
    <div>
      {step === 1 && (
        <div style={{background:C.goldPale,border:`1px solid ${C.borderGold}`,borderRadius:8,padding:"22px 26px",marginBottom:20}}>
          <StepTag n="1" label={S.stepExplain}/>
          <p style={{fontSize:13.5,color:C.inkMid,lineHeight:1.7,marginBottom:16}}>{xr.step1Legend}</p>
          <button onClick={()=>setStep(2)} style={{padding:"12px 26px",background:C.black,color:"#fff",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:1}}>→</button>
        </div>
      )}

      {step >= 2 && (
        <div style={{background:C.black,borderRadius:8,padding:"24px 28px",color:"#fff",marginBottom:20}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <StepTag n="2-3" label={S.stepShow+" → "+S.stepDo}/>
            <Mono size={11} color="rgba(255,255,255,0.5)" spacing={1}>{day.date} · {dayIdx+1}/{days.length}</Mono>
          </div>
          <p style={{fontSize:12.5,color:"rgba(255,255,255,0.6)",marginBottom:14}}>{xr.step2Legend}</p>

          {/* SPEC_ch7_debug.md §1 originally replaced a bare high-low bar
              chart with hand-rolled SVG candles -- 29.07 re-audit: real
              data, still not a compliant chart (no axes, no engine, no
              marker). Now real lightweight-charts candles + a real volume
              pane, real price+time axes, zones as real price lines. */}
          <div style={{position:"relative",marginBottom:6}}>
            <div ref={containerRef} data-scene="ch7_xray"/>
            {/* SPEC_charts_and_interactivity_standard.md (29.07): real
                class-B element -- the day's real outcome (day.touch.outcome)
                used to be visible together with the candles (chart shows
                whether price reversed or broke through at a glance). Now
                the chart is covered until the reader commits a prediction
                for THIS day, so seeing the candles is a real consequence
                of a real choice, not simultaneous with it. The chart
                underneath still renders/updates normally -- only the
                overlay is new. */}
            {day.touch && dayGuesses[dayIdx] === undefined && (
              <div style={{position:"absolute",inset:0,zIndex:5,background:"rgba(10,10,12,0.96)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:"0 24px",textAlign:"center"}}>
                <p style={{fontSize:13,color:"rgba(255,255,255,0.75)",lineHeight:1.6,maxWidth:400,margin:0}}>{xr.predictDayQuestion}</p>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>setDayGuesses(g=>({...g,[dayIdx]:"reversed"}))} style={{padding:"10px 20px",background:"transparent",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12}}>{xr.predictReversedBtn}</button>
                  <button onClick={()=>setDayGuesses(g=>({...g,[dayIdx]:"broke_through"}))} style={{padding:"10px 20px",background:"transparent",color:"#fff",border:"1px solid rgba(255,255,255,0.3)",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12}}>{xr.predictBrokeBtn}</button>
                </div>
              </div>
            )}
          </div>
          {day.touch && dayGuesses[dayIdx] !== undefined && (
            <p style={{fontSize:11.5,color:C.gold,fontFamily:"monospace",marginBottom:10}}>
              {day.touch.outcome === "inconclusive" ? xr.predictInconclusive : (dayGuesses[dayIdx] === day.touch.outcome ? xr.predictCorrect : xr.predictWrong)}{" "}{outcomeLabel(day.touch.outcome)}
            </p>
          )}
          <p style={{fontSize:9.5,color:"rgba(255,255,255,0.32)",fontFamily:"monospace",lineHeight:1.5,marginBottom:10}}>{xr.volumeCaption}</p>

          {step === 2 && (
            <div style={{textAlign:"center"}}>
              <button onClick={()=>setStep(3)} style={{padding:"12px 26px",background:C.gold,color:"#18181a",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:12,letterSpacing:1,fontWeight:700}}>{xr.moreDaysBtn}</button>
            </div>
          )}
          {step === 3 && dayIdx < days.length - 1 && (!day.touch || dayGuesses[dayIdx] !== undefined) && (
            <div style={{textAlign:"center"}}>
              <button onClick={()=>setDayIdx(i=>i+1)} style={{padding:"10px 22px",background:"rgba(255,255,255,0.08)",color:"#fff",border:"1px solid rgba(255,255,255,0.2)",borderRadius:4,cursor:"pointer",fontFamily:"monospace",fontSize:11,letterSpacing:1}}>{xr.moreDaysBtn} →</button>
            </div>
          )}
        </div>
      )}

      {step === 3 && dayIdx >= days.length - 1 && (!day.touch || dayGuesses[dayIdx] !== undefined) && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"24px 28px"}}>
          <div style={{fontWeight:600,fontSize:14.5,color:C.black,marginBottom:10}}>{xr.revealTitle}</div>
          {xr.revealBody.split("\n\n").map((p,i) => (
            <p key={i} style={{fontSize:13,color:C.inkMid,lineHeight:1.7,marginBottom:10}}>{fillTemplate(p, {n_days: days.length, xray_hit: xray.meta.xray_hit})}</p>
          ))}
          <p style={{fontSize:11,color:C.inkFaint,fontStyle:"italic",marginTop:10,marginBottom:0}}>{xr.xpNote}</p>
        </div>
      )}
    </div>
  );
}

// ─── Ступень 2: предел макета (ladder pending) ─────────────────────────────────
function LadderLimitBlock() {
  const T7 = window.Ch7Content[INITIAL_LANG] || window.Ch7Content.ru;
  const ll = T7.ladderLimit;
  return (
    <div style={{marginBottom:48}}>
      {ll.body.split("\n\n").map((p,i) => <p key={i} style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:14,maxWidth:800}}>{p}</p>)}
      <div style={{border:`1px dashed ${C.borderGold}`,borderRadius:8,padding:"18px 22px",background:C.surface}}>
        <p style={{fontSize:12,color:C.inkFaint,fontStyle:"italic",margin:0}}>{ll.pendingNote}</p>
      </div>
    </div>
  );
}

// ─── Предикт недели ─────────────────────────────────────────────────────────
function PredictTf({ vars }) {
  const { useState } = React;
  const T7 = window.Ch7Content[INITIAL_LANG] || window.Ch7Content.ru;
  const p = T7.predict;
  const [picked, setPicked] = useState(null);
  return (
    <div style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"22px 26px",marginTop:8,marginBottom:24}}>
      <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{p.tag}</Mono>
      <p style={{fontSize:14.5,color:C.black,lineHeight:1.65,marginBottom:14}}>{p.question}</p>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        {p.options.map((o,i) => (
          <button key={i} onClick={()=>setPicked(i)} style={{fontFamily:"monospace",fontSize:12,padding:"9px 20px",cursor:"pointer",background:picked===i?C.gold:"#fff",color:picked===i?"#18181a":C.inkMid,border:`1px solid ${picked===i?C.gold:C.border}`,borderRadius:4}}>{o}</button>
        ))}
      </div>
      {picked !== null && vars && <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.7,marginBottom:10,background:C.goldPale,padding:"12px 16px",borderRadius:4}}>{fillTemplate(p.afterPick, vars)}</p>}
      <p style={{fontSize:11,color:C.inkFaint}}>{p.xpNote}</p>
    </div>
  );
}

// ─── Main Chapter 7 ────────────────────────────────────────────────────────────
function Chapter7() {
  const S = STRINGS[INITIAL_LANG] || STRINGS.ru;
  const lang = INITIAL_LANG;
  const T7 = window.Ch7Content[lang] || window.Ch7Content.ru;
  const { loading, error, patterns, xray } = useCh7Data();
  const vars = React.useMemo(() => buildVars(patterns, xray, lang), [patterns, xray, lang]);

  // SPEC_chart_fixes_and_staged_signup.md §5: отметка прочтения главы —
  // см. web/assets/sbf-anon.js (аноним) + sbf-auth.js (залогинен).
  React.useEffect(() => {
    if (window.SBFAnon) window.SBFAnon.markChapterRead(7);
  }, []);

  return (
    <div style={{minHeight:"100vh",background:C.white,color:C.ink,fontFamily:"'DM Sans',sans-serif"}}>

      <div style={{position:"sticky",top:106,background:"rgba(255,255,255,0.96)",backdropFilter:"blur(10px)",borderBottom:`1px solid ${C.border}`,padding:"15px 5vw",display:"flex",alignItems:"center",justifyContent:"space-between",zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:20}}>
          <a href={getChUrl(6, lang)} aria-label={lang==="ru"?"Предыдущая глава":lang==="ro"?"Capitolul anterior":"Previous chapter"} style={{color:C.gold,cursor:"pointer",textDecoration:"none",fontFamily:"monospace",fontSize:14,letterSpacing:2}}>←</a>
          <Chip>{S.levelChip}</Chip>
          <Mono size={14} color={C.inkSoft} spacing={0} className="hide-mobile">{S.chapterNameShort}</Mono>
        </div>
        <div style={{display:"flex",gap:8}}>
          <Chip color={C.inkFaint}>{S.faTag}</Chip>
          <Chip color={C.inkFaint}>{S.taTag}</Chip>
        </div>
      </div>

      <div style={{background:C.black,padding:"80px 5vw 70px",textAlign:"center",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% 100%, rgba(201,151,58,0.1) 0%, transparent 60%)"}}/>
        <div style={{position:"relative"}}>
          <Mono size={11} color={C.gold} spacing={4} style={{display:"block",marginBottom:20}}>{S.heroEyebrow}</Mono>
          <h1 style={{fontFamily:"'DM Serif Display',serif",fontSize:"clamp(36px,6vw,66px)",fontWeight:400,color:C.white,lineHeight:1.05,marginBottom:20}}>
            {S.heroTitleLine1}<br/><span style={{color:C.gold}}>{S.heroTitleLine2}</span>
          </h1>
          <p style={{fontSize:"clamp(16px,2vw,20px)",color:"rgba(255,255,255,0.55)",maxWidth:640,margin:"0 auto 32px",lineHeight:1.65}}>{S.heroSubtitle}</p>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <Chip color={C.gold}>{S.fundamentalChip}</Chip>
            <Chip color="rgba(255,255,255,0.3)">{S.technicalChip}</Chip>
            <Chip color="rgba(255,255,255,0.3)">{S.interactiveChip}</Chip>
          </div>
        </div>
      </div>

      {loading && <div style={{textAlign:"center",padding:"60px 0",fontFamily:"monospace",fontSize:13,color:C.inkFaint}}>{S.loadingLabel}</div>}
      {error && <div style={{textAlign:"center",padding:"40px 0",fontFamily:"monospace",fontSize:13,color:"#c0392b",background:C.redPale}}>{S.loadErrorLabel}</div>}

      {!loading && (
      <div style={{maxWidth:1060,margin:"0 auto",padding:"0 0 120px"}}>

        <div style={{margin:"0 -5vw 56px"}}><ColdStart7Entry/></div>

        <div style={{padding:"0 5vw"}}>

        <IntroBlock/>

        <SectionTitle id="secBigOrder" sub={S.bigOrderSub}>{T7.bigOrderTask.tag}</SectionTitle>
        <BigOrderBridge/>

        <SectionTitle sub={S.executionSub}>{T7.execution.tag}</SectionTitle>
        <ExecutionCards/>

        <SectionTitle sub={S.placesSub}>{T7.footprintPlaces.tag}</SectionTitle>
        <FootprintPlaces/>

        <div style={{margin:"0 -5vw 56px"}}><ColdStart7Middle/></div>

        <SectionTitle id="secCoreMeasure" sub={S.coreMeasureSub}>{T7.coreMeasure.tag}</SectionTitle>
        <CoreMeasureBlock patterns={patterns} vars={vars}/>

        <SectionTitle sub={S.narrativeSub}>{T7.narrativeVsMeasured.tag}</SectionTitle>
        <NarrativeVsMeasured/>

        <SectionTitle id="secXray" sub={S.xraySub}>{T7.xray.tag}</SectionTitle>
        <div style={{marginBottom:56}}><XrayReversed xray={xray}/></div>

        <Rule/>

        <LadderLimitBlock/>

        <QuizBlock questions={T7.quiz} levelId="level_7" lang={lang} copy={{
          kicker: S.quizKicker, title: S.quizTitle, next: S.quizNext,
          stuckAll: S.quizStuckAll, stuckSome: S.quizStuckSome, backToSection: S.quizBackToSection,
        }} />

        <PredictTf vars={vars}/>

        <div style={{border:`1px dashed ${C.borderGold}`,borderRadius:8,padding:"20px 24px",marginBottom:32,background:C.surface}}>
          <Mono size={11} color={C.gold} spacing={3} style={{display:"block",marginBottom:10}}>{T7.cliffhanger.tag}</Mono>
          {T7.cliffhanger.body.split("\n\n").map((p,i) => <p key={i} style={{fontSize:14,color:C.inkMid,lineHeight:1.7,marginBottom:10}}>{p}</p>)}
        </div>

        <div style={{marginBottom:32}}>
          <Mono size={10} color={C.inkFaint} spacing={2} style={{display:"block",marginBottom:10,textTransform:"uppercase"}}>{T7.sources.tag}</Mono>

              путь к джобе/скриптам вместо реквизитов; inkFaint→inkMid — тот

          <ol style={{fontSize:11.5,color:C.inkMid,lineHeight:1.8,paddingLeft:18,marginBottom:8}}>

              const ddmmyyyy = iso => { const [y,mo,d] = iso.split("-"); return `${d}.${mo}.${y}`; };
              const text = T7.sources.ownTemplate
                .replace("{{n}}", m.n_total.toLocaleString()).replace("{{built}}", ddmmyyyy(m.built));
              return (
                <li>
                  {text}{" "}
                  <a href="/data/edu_stats/pattern_reality.csv" download style={{color:C.gold}}>{T7.sources.csvLabel}</a>

              );
            })()}
          </ol>
          <p style={{fontSize:11,color:C.inkFaint,fontStyle:"italic"}}>{T7.sources.checked}</p>
        </div>

        <ComplianceFootnote lang={lang} />

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:20,paddingTop:48,marginTop:16,borderTop:`1px solid ${C.border}`}}>
          <AskAnalystBtn tr={{askAnalyst:S.askQuestionLabel}} chapterNum={7} lang={lang} />
          <button
            onClick={() => window.location.href = getChUrl(8, lang)}
            style={{background:C.black,color:C.white,border:"none",padding:"18px 35px",cursor:"pointer",fontFamily:"monospace",fontSize:14,letterSpacing:2,fontWeight:700,transition:"background .2s"}}
            onMouseEnter={e=>e.target.style.background=C.gold}
            onMouseLeave={e=>e.target.style.background=C.black}>
            {S.nextChapterBtn}
          </button>
        </div>

        </div>
      </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('sbf-book-root')).render(<Chapter7 />);
