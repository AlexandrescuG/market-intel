function fillTemplate(str, vars) {
  if (!str) return str;
  return str.replace(/\{\{(\w+)\}\}/g, (m, key) => {
    const v = vars ? vars[key] : undefined;
    if (v === undefined || v === null || (typeof v === "number" && isNaN(v))) {
      console.error("[ch10] отсутствует значение для {{" + key + "}}");
      return "—";
    }
    return String(v);
  });
}

// ── Загрузка данных главы: pattern_reality.json (переиспользуется из главы 7)
// + ch10_patterns.json (по одному реальному примеру на паттерн, tools/edu_build/pattern_examples.py).
function useCh10Data() {
  const { useState, useEffect } = React;
  const [state, setState] = useState({ loading: true, error: null, patterns: null, examples: null });
  useEffect(() => {
    let cancelled = false;
    Promise.all([
      fetch("/data/edu_stats/pattern_reality.json").then(r => { if (!r.ok) throw new Error("pattern_reality.json HTTP " + r.status); return r.json(); }),
      fetch("/data/edu_scenes/ch10_patterns.json").then(r => { if (!r.ok) throw new Error("ch10_patterns.json HTTP " + r.status); return r.json(); }),
    ]).then(([patterns, examples]) => { if (!cancelled) setState({ loading: false, error: null, patterns, examples }); })
      .catch(err => {
        console.error("[ch10] load failed:", err);
        if (!cancelled) setState({ loading: false, error: err, patterns: null, examples: null });
      });
    return () => { cancelled = true; };
  }, []);
  return state;
}

function SelfStats() {

      fetch("/api/journal/self-stats").then(r => r.ok ? r.json() : null).catch(() => null),
      fetch("/api/journal/aggregate-stats").then(r => r.ok ? r.json() : null).catch(() => null),

// One real occurrence per pattern key (tools/edu_build/pattern_examples.py,
// via core.patterns.detect() -- the platform's own detector, not a new one)
// rendered on lightweight-charts. SPEC_charts_and_interactivity_standard.md
// 29.07 re-audit: this chapter's own debug spec (SPEC_ch10_debug.md §2/§6)
// always required a real chart with the marked pattern per screen; it was
// never built (text cards only) despite being marked ✅ in the debug queue.
function PatternMiniChart({ example, patternKey }) {
  const { useEffect, useRef, useState, useMemo } = React;
  const T10 = window.Ch10Content[INITIAL_LANG] || window.Ch10Content.ru;
  const ps = T10.patternScreens;
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const seriesRef = useRef({});
  const [holdN, setHoldN] = useState(5);

  useEffect(() => {
    if (!containerRef.current || chartRef.current || typeof LightweightCharts === "undefined") return;
    const chart = LightweightCharts.createChart(containerRef.current, {
      width: containerRef.current.clientWidth, height: 180,
      layout: { background: { color: C.black }, textColor: "rgba(255,255,255,0.5)" },
      grid: { vertLines: { color: "rgba(255,255,255,0.05)" }, horzLines: { color: "rgba(255,255,255,0.05)" } },
      rightPriceScale: { borderColor: "rgba(255,255,255,0.15)" },
      timeScale: { borderColor: "rgba(255,255,255,0.15)", timeVisible: true, secondsVisible: false },
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: "rgba(46,204,113,0.8)", downColor: "rgba(231,76,60,0.8)",
      borderUpColor: "rgba(46,204,113,0.8)", borderDownColor: "rgba(231,76,60,0.8)",
      wickUpColor: "rgba(46,204,113,0.8)", wickDownColor: "rgba(231,76,60,0.8)",
    });
    chartRef.current = chart;
    seriesRef.current = { candleSeries };
    const ro = new ResizeObserver(entries => { if (entries[0]) chart.applyOptions({ width: entries[0].contentRect.width }); });
    ro.observe(containerRef.current);
    return () => { ro.disconnect(); chart.remove(); chartRef.current = null; };
  }, []);

  useEffect(() => {
    const s = seriesRef.current;
    if (!s.candleSeries || !example) return;
    s.candleSeries.setData(example.candles.map(c => ({ time: c.time, open: +c.open, high: +c.high, low: +c.low, close: +c.close })));
    s.candleSeries.setMarkers([{ time: example.marker_time, position: example.direction === "bearish" ? "aboveBar" : "belowBar", color: C.gold, shape: example.direction === "bearish" ? "arrowDown" : "arrowUp" }]);
    chartRef.current.timeScale().fitContent();
  }, [example]);

  // SPEC_charts_and_interactivity_standard.md (29.07): real class-A element --
  // example.candles already carries 16 real H1 candles after marker_time
  // (pattern_examples.py's AFTER window), unused until now. The slider
  // recomputes a real forward return from the real marker close to the
  // real close N hours later, on the actual detected occurrence.
  const maxHold = useMemo(() => {
    if (!example) return 0;
    const idx = example.candles.findIndex(c => c.time === example.marker_time);
    return idx >= 0 ? example.candles.length - 1 - idx : 0;
  }, [example]);
  const holdPct = useMemo(() => {
    if (!example || maxHold === 0) return null;
    const idx = example.candles.findIndex(c => c.time === example.marker_time);
    const n = Math.min(holdN, maxHold);
    const base = example.candles[idx].close, after = example.candles[idx + n].close;
    return (after - base) / base * 100;
  }, [example, holdN, maxHold]);

  return (
    <div style={{marginBottom:8}}>
      <div ref={containerRef} data-scene={"ch10_patterns:" + patternKey} style={{background:"rgba(255,255,255,0.03)",borderRadius:6,overflow:"hidden",marginBottom:8,minHeight:180}}/>
      {maxHold > 0 && (
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",padding:"0 2px"}}>
          <Mono size={9.5} color={C.inkFaint} spacing={0.5}>{ps.holdLabel}</Mono>
          <input type="range" min={1} max={maxHold} value={Math.min(holdN,maxHold)} onChange={e=>setHoldN(+e.target.value)} style={{flex:1,minWidth:100}}/>
          {holdPct !== null && <Mono size={11} color={holdPct >= 0 ? "#1c8a4a" : "#c0392b"} spacing={0}>{ps.holdResult(Math.min(holdN,maxHold), holdPct)}</Mono>}
        </div>
      )}
    </div>
  );
}

function PatternBehaviorScreens({ patterns, examples }) {
  const T10 = window.Ch10Content[INITIAL_LANG] || window.Ch10Content.ru;
  const ps = T10.patternScreens;
  const cm = T10.coreMeasure;

                <div style={{fontWeight:600,fontSize:14.5,color:C.black}}>{it.label}</div>

                  {stats.map((s,j) => (

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>

        <p style={{fontSize:12.5,color:C.inkMid,lineHeight:1.7,margin:0}}>{cm.honestLine}</p>
      </div>
    </div>
  );
}

function CoreMeasureBlock({ patterns }) {
  const { useState, useMemo } = React;
  const T10 = window.Ch10Content[INITIAL_LANG] || window.Ch10Content.ru;
  const cm = T10.coreMeasure;
  const [instrument, setInstrument] = useState("GOLD");
  const cells = (patterns && patterns.cells) || [];
  const symbols = useMemo(() => Array.from(new Set(cells.map(c=>c.symbol))).filter(s=>MATRIX_SYMBOLS_10.includes(s)).sort(), [cells]);
  const rows = useMemo(() => cells.filter(c => c.symbol === instrument && CORE_PATTERN_TYPES.includes(c.pattern_key)).sort((a,b) => b.n - a.n), [cells, instrument]);
  const nameKey = "display_name_" + INITIAL_LANG;
  const naData = INITIAL_LANG==="ru"?"мало данных":INITIAL_LANG==="ro"?"date insuficiente":"not enough data";

  return (
    <div style={{marginBottom:48}}>
      <p style={{fontSize:14,color:C.inkMid,lineHeight:1.75,marginBottom:20,maxWidth:820}}>{cm.preamble}</p>
      <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        {symbols.map(s => (
          <button key={s} onClick={()=>setInstrument(s)} style={{fontFamily:"monospace",fontSize:10.5,padding:"5px 10px",cursor:"pointer",background:s===instrument?C.gold:"#fff",color:s===instrument?"#18181a":C.inkMid,border:`1px solid ${s===instrument?C.gold:C.border}`,borderRadius:3}}>{s}</button>
        ))}
        {MATRIX_SYMBOLS_10.includes(instrument) && (
          <a href={"/chart.html?s="+instrument} target="_blank" rel="noopener" style={{marginLeft:6,fontFamily:"monospace",fontSize:10.5,color:C.gold,textDecoration:"none",borderBottom:`1px dotted ${C.gold}`}}>{cm.instrumentLabel} →</a>
        )}
      </div>
      <div style={{overflowX:"auto",marginBottom:20}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:520}}>
          <thead>
            <tr>
              <th style={{textAlign:"left",padding:"8px 10px",fontSize:10.5,fontFamily:"monospace",color:C.inkFaint,textTransform:"uppercase",borderBottom:`1px solid ${C.border}`}}>{cm.patternLabel}</th>
              <th style={{textAlign:"center",padding:"8px 10px",fontSize:10.5,fontFamily:"monospace",color:C.inkFaint,borderBottom:`1px solid ${C.border}`}}>TF</th>
              <th style={{textAlign:"center",padding:"8px 10px",fontSize:10.5,fontFamily:"monospace",color:C.inkFaint,borderBottom:`1px solid ${C.border}`}}>agree_5</th>
              <th style={{textAlign:"center",padding:"8px 10px",fontSize:10.5,fontFamily:"monospace",color:C.inkFaint,borderBottom:`1px solid ${C.border}`}}>n</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((c,i) => (
              <tr key={i}>
                <td style={{padding:"7px 10px",fontSize:12,color:C.black,fontWeight:600,borderBottom:`1px solid ${C.border}`}}>{c[nameKey] || c.pattern_key}</td>
                <td style={{padding:"7px 10px",textAlign:"center",fontSize:11,fontFamily:"monospace",color:C.inkSoft,borderBottom:`1px solid ${C.border}`}}>{c.tf}</td>
                <td style={{padding:"7px 10px",textAlign:"center",fontSize:12,fontFamily:"monospace",fontWeight:600,color:c.shown?C.black:C.inkFaint,borderBottom:`1px solid ${C.border}`}}>{c.shown ? (c.agree_5*100).toFixed(1)+"%" : naData}</td>
                <td style={{padding:"7px 10px",textAlign:"center",fontSize:11,fontFamily:"monospace",color:C.inkSoft,borderBottom:`1px solid ${C.border}`}}>{c.n}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <a href="/data/edu_stats/pattern_reality.csv" download style={{fontFamily:"monospace",fontSize:12,color:C.gold,textDecoration:"none",border:`1px solid ${C.gold}`,padding:"9px 16px",borderRadius:4,display:"inline-block"}}>{cm.downloadCsv}</a>
    </div>
  );
}
