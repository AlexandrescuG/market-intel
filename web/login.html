<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<title>{{ t('login.title', lang) }}</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="SBF Intelligence">
<meta property="og:image" content="https://lp.sbfconsult.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://lp.sbfconsult.com/assets/og-image.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
:root{
  --bg:#f5f4f0;--paper:#fff;--text:#1a1a1a;--muted:#6b7280;
  --line:#e5e2db;--accent:#2563eb;--gold:#c9a227;--up:#16a34a;
  --dn:#dc2626;--radius:12px;--cream:#faf9f5;--soft:#f0ede4;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0f0e0c;--paper:#1a1917;--text:#f0ede4;--muted:#9ca3af;
    --line:#2c2a26;--cream:#1e1c18;--soft:#252320}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);
  color:var(--text);min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;padding:24px 16px 60px}
.logo{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:32px;
  color:var(--gold);text-decoration:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px 28px 24px;width:100%;max-width:420px}
.step-title{font-size:18px;font-weight:700;margin-bottom:4px}
.step-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;
  color:var(--text);letter-spacing:.02em}
.field input{width:100%;padding:10px 12px;font-size:14px;
  background:var(--cream);border:1px solid var(--line);border-radius:8px;
  color:var(--text);outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--gold)}
.nav-row{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .15s;border:none}
.btn-primary{background:var(--gold);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.err{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;
  padding:10px 12px;font-size:13px;color:var(--dn);margin-bottom:14px;display:none}
.login-note{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
.login-note a{color:var(--gold)}
.divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.providers{display:flex;flex-direction:column;align-items:center;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:420px;margin-bottom:32px}
.top-row .logo{margin-bottom:0}
</style>
<script>window.SBF_LANG_SWITCH_ONLY = true;</script>
<script src="/assets/i18n.js?v=2" defer></script>
<script src="/assets/sbf-header.js?v=23" defer></script>
</head>
<body>

<div class="top-row">
  <a class="logo" href="/">SBF Journal</a>
  <div class="sbf-lang-sw" id="sbfLangSw"></div>
</div>

<div class="card">
  <div class="step-title">{{ t('login.page_title', lang) }}</div>
  <div class="step-sub">{{ t('login.subtitle', lang) }}</div>

  <div class="err" id="errBox"></div>

  <form onsubmit="return doLogin(event)">
    <div class="field">
      <label for="email">{{ t('register.email_label', lang) }}</label>
      <input type="email" id="email" placeholder="{{ t('register.email_placeholder', lang) }}" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">{{ t('login.password_label', lang) }}</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <div class="nav-row">
      <button type="submit" class="btn btn-primary" id="loginBtn">{{ t('login.submit_button', lang) }}</button>
    </div>
  </form>

  <div class="divider">{{ t('login.divider_or', lang) }}</div>
  <div class="providers">
    <div id="tg-login-btn"></div>
    <div id="google-login-btn"></div>
  </div>

  <p class="login-note">{{ t('login.no_account', lang) }} <a href="{{ ('/' + lang + '/register.html') if lang != 'ru' else '/register.html' }}">{{ t('register.register_button', lang) }}</a></p>
</div>

<script src="https://telegram.org/js/telegram-widget.js?22" async></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/assets/sbf-auth.js?v=1"></script>
<script>
'use strict';

// Тот же бот/клиент, что у Telegram Mini App (SBFAcademy_bot/webapp/app.js) —
// один аккаунт должен резолвиться в одно и то же место что там, что тут.
var TELEGRAM_BOT_USERNAME = "SBFAcademy_bot";
var GOOGLE_CLIENT_ID = "334099177351-19nnlv6jkp4biuf3og105377kpuikk01.apps.googleusercontent.com";
var SBF_API = "https://web.sbfconsult.com";

function $(id) { return document.getElementById(id); }
function showErr(msg) {
  var b = $('errBox'); b.textContent = msg; b.style.display = msg ? 'block' : 'none';
}

function _next() {
  var p = new URLSearchParams(location.search).get('next');
  return p || '/journal.html';
}

function _onAuthSuccess(d) {
  sbfAuth.setTokens(d.access_token || d.token, d.refresh_token);
  window.location.href = _next();
}

function doLogin(e) {
  e.preventDefault();
  var email = $('email').value.trim().toLowerCase();
  var password = $('password').value;
  var btn = $('loginBtn');
  btn.disabled = true; btn.textContent = {{ t('login.logging_in', lang) | tojson }};
  showErr('');
  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: password }),
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    btn.disabled = false; btn.textContent = {{ t('login.submit_button', lang) | tojson }};
    if (d.error) { showErr(d.error === 'rate_limit' ? {{ t('login.err_rate_limit', lang) | tojson }} : d.error); return; }
    _onAuthSuccess(d);
  })
  .catch(function(err) {
    btn.disabled = false; btn.textContent = {{ t('login.submit_button', lang) | tojson }};
    showErr({{ t('register.err_network_prefix', lang) | tojson }} + err.message);
  });
  return false;
}

// ── Telegram Login Widget / Google Sign-In ──────────────────────────────────
// Дублируют _renderTelegramWidget/_renderGoogleButton из SBFAcademy_bot/webapp/app.js —
// намеренно, у lp свой собственный небольшой JS без общего бандла с Mini App.
function _renderTelegramWidget(host, callbackName, tries) {
  if (!host) return;
  if (typeof window.Telegram === 'undefined' && (tries || 0) < 25) {
    setTimeout(function() { _renderTelegramWidget(host, callbackName, (tries || 0) + 1); }, 200);
    return;
  }
  host.innerHTML = '';
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://telegram.org/js/telegram-widget.js?22';
  s.setAttribute('data-telegram-login', TELEGRAM_BOT_USERNAME);
  s.setAttribute('data-size', 'large');
  s.setAttribute('data-radius', '8');
  s.setAttribute('data-onauth', callbackName + '(user)');
  s.setAttribute('data-request-access', 'write');
  host.appendChild(s);
}

function _renderGoogleButton(host, callbackName, tries) {
  if (!host || !GOOGLE_CLIENT_ID) return;
  if (window.google && window.google.accounts && window.google.accounts.id) {
    host.innerHTML = '';
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: window[callbackName] });
    google.accounts.id.renderButton(host, { theme: 'outline', size: 'large', width: 272 });
  } else if ((tries || 0) < 25) {
    setTimeout(function() { _renderGoogleButton(host, callbackName, (tries || 0) + 1); }, 200);
  }
}

function onTelegramAuth(user) {
  showErr('');
  fetch(SBF_API + '/api/auth/telegram', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(user),
  })
  .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, d: d }; }); })
  .then(function(res) {
    if (!res.ok) { showErr(res.d.detail || {{ t('login.err_telegram_failed', lang) | tojson }}); return; }
    _onAuthSuccess(res.d);
  })
  .catch(function(e) { showErr({{ t('register.err_network_prefix', lang) | tojson }} + e.message); });
}
window.onTelegramAuth = onTelegramAuth;

function onGoogleCredential(response) {
  showErr('');
  fetch(SBF_API + '/api/auth/google', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ credential: response.credential }),
  })
  .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, d: d }; }); })
  .then(function(res) {
    if (!res.ok) { showErr(res.d.detail || {{ t('login.err_google_failed', lang) | tojson }}); return; }
    _onAuthSuccess(res.d);
  })
  .catch(function(e) { showErr({{ t('register.err_network_prefix', lang) | tojson }} + e.message); });
}
window.onGoogleCredential = onGoogleCredential;

_renderTelegramWidget($('tg-login-btn'), 'onTelegramAuth');
_renderGoogleButton($('google-login-btn'), 'onGoogleCredential');

// Уже авторизован — сразу дальше
(function() {
  if (!sbfAuth.isLoggedIn()) return;
  sbfAuth.fetch('/api/auth/me')
    .then(function(r) { return r.json(); })
    .then(function(d) { if (d && d.id) window.location.href = _next(); })
    .catch(function() {});
})();
</script>
</body>
</html>
